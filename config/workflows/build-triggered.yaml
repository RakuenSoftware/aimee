# Triggered build. `trigger.watch-dir` is the graph entry node.
#
# Set `params.workspace` to arm it. The Go scanner reads committed Markdown files
# under `params.dir` at the refreshed `params.ref`, then applies the same identity,
# spend, and admission rules as a `trigger_rules` entry. A blank workspace leaves
# the saved workflow disarmed.
#
# The scanner materializes the watched file as the proposal artifact before the
# trigger node advances. Its data edge feeds `author.proposal`.
name: build-triggered
intent_tags:
  - proposal
  - full-lifecycle
  - triggered
start: watch
nodes:
  # Watch a repo-relative directory. `workspace` must name a server-visible clone.
  - id: watch
    block: trigger.watch-dir
    params:
      dir: docs/proposals/pending
      # workspace: /abs/path/to/the/repo/to/watch   # REQUIRED to arm
      # ref: origin/main                             # default: auto-detected origin HEAD
      # mode: autonomous                             # recorded; scheduling is currently identical
      # max_spend_usd: 2
    next: draft
  - id: draft
    block: author.proposal
    in:
      proposal: watch.out
    params:
      with_user: true
    next: feature
    on_fail: draft
  - id: feature
    block: branch.open
    params:
      base: trunk
    next: plan
  - id: plan
    block: author.plan
    in:
      proposal: draft.out
    params:
      max_rounds: 60
    next: plan_gate
    on_fail: plan
  - id: plan_gate
    block: gate.roundtable
    in:
      src: plan.out
    params:
      roundtable: default
      panel:
        required:
          - security
          - architect
          - qa
          - reviewer
        eligible:
          - contrarian
      quorum: 4
      # Bound the gate -> plan -> gate refinement loop.
      max_rounds: 6
      focus: does this implementation plan fully satisfy the proposal/request?
    on_pass: split
    on_fail: plan
  - id: split
    block: split
    in:
      plan: plan.out
    next: slices
    # Regenerate packets when split requests another pass.
    on_fail: split
  - id: slices
    block: foreach.workflow
    in:
      packets: split.out
      feature: feature.out
    params:
      workflow: slice
      # Bound whole-generation retries after a child fails.
      max_rounds: 3
    next: accept_freeze
    on_fail: split
  - id: accept_freeze
    block: freeze
    in:
      branch: slices.out
    next: accept_gate
  - id: accept_gate
    block: gate.roundtable
    in:
      src: accept_freeze.out
    params:
      roundtable: default
      panel:
        required:
          - security
          - architect
          - qa
          - reviewer
      quorum: 4
      max_rounds: 6
      focus: was the proposal completed? assess code quality and any missing tests.
    on_pass: document
    on_fail: split
  - id: document
    block: document
    in:
      branch: slices.out
    next: doc_freeze
    on_fail: document
  - id: doc_freeze
    block: freeze
    in:
      branch: document.out
    next: doc_gate
  - id: doc_gate
    block: gate.roundtable
    in:
      src: doc_freeze.out
    params:
      roundtable: default
      panel:
        required:
          - architect
          - qa
          - reviewer
        eligible:
          - technical-writer
      quorum: 3
      max_rounds: 6
      focus: is the documentation complete, accurate, and clear for this feature?
    on_pass: archive
    on_fail: document
  # Retire the triggering file: pending -> done on the feature branch, so the
  # final PR removes it from the watched dir (the trigger never re-fires).
  - id: archive
    block: source.archive
    in:
      branch: document.out
    next: final_pr
  # Open a draft PR into the branch checked out at admission, then stop. The
  # workflow never marks the PR ready or merges it.
  - id: final_pr
    block: pr.open
    in:
      src: doc_freeze.out
    params:
      base: trunk
