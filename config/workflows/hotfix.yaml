# Short workflow for a small, contained change.
#
# It keeps the managed-change review panel but removes `split` and limits review
# loops to two rounds. `enforced` is metadata in the current Go definition; the
# explicit pass edge into `gate.deliver` is the operative delivery boundary.
name: hotfix
intent_tags:
  - one-liner
  - trivial-fix
enforced: true
start: understand
nodes:
  - id: understand
    block: understand
    params:
      with_user: true
    next: implement
  # Implement consumes the intent directly; this graph has no split step.
  - id: implement
    block: implement
    in:
      plan: understand.out
    params:
      admitted_regressions: observe
    next: freeze
  - id: freeze
    block: freeze
    in:
      branch: implement.out
    next: review
  - id: review
    block: review
    in:
      src: freeze.out
    params:
      reviewer: contrarian
      max_rounds: 2
      blocker_convergence: observe
    on_pass: rt_gate
    on_fail: implement
  - id: rt_gate
    block: gate.roundtable
    in:
      src: freeze.out
    params:
      roundtable: default
      panel:
        required:
          - security
          - architect
          - qa
          - reviewer
      quorum: 4
      max_rounds: 2
      blocker_convergence: observe
    on_pass: deliver
    on_fail: implement
  - id: deliver
    block: gate.deliver
    in:
      verdict: rt_gate.out
