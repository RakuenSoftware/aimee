# Manager-led change workflow.
#
# understand -> split -> implement -> review -> roundtable -> deliver
#
# `enforced` is preserved as definition metadata. The current Go validator does
# not infer delivery policy from it, so the explicit control edges below are the
# operative boundary. Edit this file as YAML because the visual editor does not
# preserve top-level `enforced` or `intent_tags`.
name: managed-change
intent_tags:
  - feature
  - multi-file-change
  - refactor
enforced: true
start: understand
nodes:
  - id: understand
    block: understand
    params:
      with_user: true
    next: split
  - id: split
    block: split
    in:
      intent: understand.out
    next: implement
  - id: implement
    block: implement
    in:
      plan: split.out
    params:
      fanout: max
      # Shadow-select admitted learned regressions; activation remains an
      # explicit operator decision after selector calibration.
      admitted_regressions: observe
    next: freeze
  - id: freeze
    block: freeze
    in:
      branch: implement.out
    next: review
  # Review the frozen diff. Requested changes return to split for new work.
  - id: review
    block: review
    in:
      src: freeze.out
    params:
      # Use a named reviewer and bound the review -> split loop.
      reviewer: contrarian
      max_rounds: 3
      blocker_convergence: observe
    on_pass: rt_gate
    on_fail: split
  # Require the configured roundtable and quorum before delivery.
  - id: rt_gate
    block: gate.roundtable
    in:
      src: freeze.out
    params:
      roundtable: default
      panel:
        required:
          - security
          - architect
          - qa
          - reviewer
      quorum: 4
      max_rounds: 6
      blocker_convergence: observe
    on_pass: deliver
    on_fail: split
  # Deliver only from the roundtable pass edge.
  - id: deliver
    block: gate.deliver
    in:
      verdict: rt_gate.out
