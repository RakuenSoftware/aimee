# Child `slice` workflow for one packet of a parent `build` run.
#
# `foreach.workflow` starts one child per packet. Each child implements its packet,
# freezes and reviews the diff, opens a slice PR, waits for green CI, then merges
# into the parent feature branch. The child completes only after merge.
name: slice
intent_tags:
  - slice
start: scope
nodes:
  # Turn the parent packet into an actionable intent without user input.
  - id: scope
    block: understand
    params:
      with_user: false
    next: impl
    on_fail: scope
  # Implement the packet on the slice branch.
  - id: impl
    block: implement
    in:
      plan: scope.out
    params:
      # Give implementation a small corrective window before operator repair.
      max_rounds: 3
      admitted_regressions: observe
    next: freeze
    # Requested changes return to implementation.
    on_fail: impl
  - id: freeze
    block: freeze
    in:
      branch: impl.out
    next: rt_gate
  # Standard roundtable review of the slice diff; changes loop back to implement.
  - id: rt_gate
    block: gate.roundtable
    in:
      src: freeze.out
    params:
      roundtable: default
      panel:
        required:
          - security
          - architect
          - qa
          - reviewer
      quorum: 4
      max_rounds: 6
      blocker_convergence: observe
    on_pass: pr
    on_fail: impl
  # Open the slice sub-PR (targets the parent feature branch).
  - id: pr
    block: pr.open
    in:
      src: freeze.out
    params:
      # A slice PR must target the parent's `aimee/feat/<parent>` branch. The forge
      # boundary rejects a slice merge into the admitted integration branch.
      base: feature
    next: ci
    # Retry a requested forge correction within the node budget.
    on_fail: pr
  # CI must be fully green before the slice may merge; red loops back to implement.
  - id: ci
    block: gate.ci
    in:
      pr: pr.out
    on_pass: merge
    on_fail: impl
  # Merge the green, approved slice into the feature branch. Terminal: slice done.
  - id: merge
    block: merge
    in:
      pr: pr.out
