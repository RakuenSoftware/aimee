# Human review for untrusted, machine-proposed input.
#
# This graph normalizes the proposal and stops at `gate.human`. Approval ends the
# run; it does not start `build`. Submit the approved proposal to `build` as a
# separate action. A test keeps implementation and merge blocks out of this file.
name: manual-review
start: draft
nodes:
  - id: draft
    block: author.proposal
    params:
      with_user: false
    next: review
    # Retry a requested proposal correction within the node budget.
    on_fail: draft
  - id: review
    block: gate.human
    in:
      src: draft.out
    params:
      policy: pr_review
