# Default full-lifecycle "build" workflow (sliced-lifecycle + documentation).
#
# input (proposal | user request)
#   -> author.proposal
#   -> branch.open (durable feature branch, based on the repo's DEFAULT branch)   [before the plan]
#   -> author.plan -> roundtable {plan reviewed WITH the proposal}  (loop until convergence)
#   -> split (plan -> per-slice packets)
#   -> foreach.workflow (each packet runs the child "slice" workflow: implement ->
#      freeze -> roundtable -> sub-PR -> GREEN CI -> merge into the feature branch)
#   -> freeze + roundtable {acceptance: proposal completed? quality? missing tests?}  (loop)
#   -> document + freeze + roundtable {documentation quality}  (loop) -> pushed to the feature branch
#   -> PR (feature branch -> the repo's DEFAULT branch).  Opened, NOT merged: the workflow ends
#      at the human-reviewed PR (review + merge happen out-of-band on the forge).
#
# The roundtable always sees the originating proposal alongside the artifact under
# review (the engine supplies it from the run's proposal), so the plan gate, the
# acceptance gate, and the documentation gate all judge the work AGAINST what was
# asked. No engine privilege over a user-authored workflow; clone and edit freely
# (`aimee workflow new`).
#
# "default branch" = the target repo's REAL trunk (git origin/HEAD, e.g. `main`),
# resolved at runtime -- NOT the aimee integration branch. branch.open bases the
# feature branch on it (clean final diff); the final pr.open targets it open-only
# (pr.open never merges, so a PR against a protected trunk is the safe terminal).
name: build
intent_tags:
  - proposal
  - full-lifecycle
start: draft
nodes:
  # Ingest: normalize the input (a proposal, or a bare user request) into a proposal
  # artifact. author.proposal loops on delegate failure; self-loop so it retries.
  - id: draft
    block: author.proposal
    params:
      with_user: true
    next: feature
    on_fail: draft
  # Open the durable feature branch BEFORE the plan, based on the repo's default
  # branch, so slice sub-PRs merge into it and the eventual feature->default PR is a
  # clean diff. No `in` binding (branch.open needs none); base:trunk selects the base.
  - id: feature
    block: branch.open
    params:
      base: trunk
    next: plan
  # The primary authors the implementation/action plan from the proposal.
  # max_iters gives the plan<->plan_gate refinement loop enough re-author rounds
  # to converge: each rejection persists the panel's blockers, which the next
  # author.plan pass folds into its prompt (see wfe_blocks exec_author). The
  # roundtable's own debate is separately bounded by plan_gate.max_rounds.
  - id: plan
    block: author.plan
    in:
      proposal: draft.out
    params:
      max_iters: 60
    next: plan_gate
    on_fail: plan
  # Roundtable approves the plan AGAINST the proposal (focus lens). Standard
  # resubmit-until-convergence: a non-approval loops back to re-author the plan.
  - id: plan_gate
    block: gate.roundtable
    in:
      src: plan.out
    params:
      panel:
        required:
          - security
          - architect
          - qa
          - reviewer
        eligible:
          - contrarian
      quorum: 4
      max_rounds: 6
      # The gate's own loop budget (panel convenes -> request_changes -> the plan
      # is re-authored -> gate again). The engine's default cap parked runs after
      # a handful of rounds; honest refinement loops need more headroom before
      # escalating to a human.
      max_iters: 24
      focus: does this implementation plan fully satisfy the proposal/request?
    on_pass: split
    on_fail: plan
  # Decompose the approved plan into independent per-slice packets.
  - id: split
    block: split
    in:
      plan: plan.out
    next: slices
    # A transient split failure (the packet-authoring delegate flubbing its
    # output) must retry, not dead-end the run: a looped node with no on_fail
    # edge parks 'stuck' permanently.
    on_fail: split
  # Fan every packet out to the child "slice" workflow; park until all have merged
  # into the feature branch. A failed/blocked slice parks the run for a human.
  - id: slices
    block: foreach.workflow
    in:
      packets: split.out
      feature: feature.out
    params:
      workflow: slice
    next: accept_freeze
  # Freeze the assembled feature branch for the acceptance review.
  - id: accept_freeze
    block: freeze
    in:
      branch: slices.out
    next: accept_gate
  # Acceptance roundtable: given the proposal, was it completed? code quality?
  # missing tests? Findings loop back to re-split/fix until the panel converges.
  - id: accept_gate
    block: gate.roundtable
    in:
      src: accept_freeze.out
    params:
      panel:
        required:
          - security
          - architect
          - qa
          - reviewer
      quorum: 4
      max_rounds: 6
      focus: was the proposal completed? assess code quality and any missing tests.
    on_pass: document
    on_fail: split
  # Author the feature's documentation onto the feature branch (README/CHANGELOG/
  # docs + inline comments). Self-loop on delegate failure.
  - id: document
    block: document
    in:
      branch: slices.out
    next: doc_freeze
    on_fail: document
  # Freeze the documentation diff for review.
  - id: doc_freeze
    block: freeze
    in:
      branch: document.out
    next: doc_gate
  # Documentation roundtable: is the documentation complete, accurate, and clear?
  # Findings loop back to re-document until the panel converges; on pass the docs are
  # already committed on the feature branch.
  - id: doc_gate
    block: gate.roundtable
    in:
      src: doc_freeze.out
    params:
      panel:
        required:
          - architect
          - qa
          - reviewer
        eligible:
          - technical-writer # the documentation domain expert joins when seatable
      quorum: 3
      max_rounds: 6
      focus: is the documentation complete, accurate, and clear for this feature?
    on_pass: archive
    on_fail: document
  # Retire the triggering proposal on the run branch: move it from the watch dir
  # (docs/proposals/pending) to docs/proposals/done, committed on the feature
  # branch so the final PR retires the trigger input atomically with the work.
  # A run without a trigger artifact (interactive intake) advances as a no-op.
  - id: archive
    block: source.archive
    in:
      branch: document.out
    next: final_pr
  # Open the final PR: feature branch -> the repo's DEFAULT branch. Terminal: the
  # workflow ends here. pr.open only OPENS the PR (base:trunk, never merged); a human
  # reviews and merges it on the forge.
  - id: final_pr
    block: pr.open
    in:
      src: doc_freeze.out
    params:
      base: trunk
