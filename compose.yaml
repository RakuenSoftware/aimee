# Start with scripts/compose-local.sh so first-boot SQL credentials enter Vault.
# Standard single-user deployment. KB is an optional remote connection.
# One application image contains both immutable role compositions; this stack
# establishes Server identity on first boot. See compose.kb.yaml to host a KB.
services:
  aimee-store-db:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: ${AIMEE_POSTGRES_IMAGE:-ghcr.io/rakuensoftware/aimee-postgres:${AIMEE_IMAGE_TAG:-latest}}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${AIMEE_STORE_ADMIN_PASSWORD:?AIMEE_STORE_ADMIN_PASSWORD is required}
      POSTGRES_DB: aimee_store
      AIMEE_STORE_MIGRATOR_PASSWORD: ${AIMEE_STORE_MIGRATOR_PASSWORD:?AIMEE_STORE_MIGRATOR_PASSWORD is required}
      AIMEE_STORE_RUNTIME_PASSWORD: ${AIMEE_STORE_RUNTIME_PASSWORD:?AIMEE_STORE_RUNTIME_PASSWORD is required}
    networks: [store]
    volumes:
      - aimee-postgres-encrypted:/var/lib/aimee-postgres
      - aimee-store-tls:/run/aimee-store-tls
    healthcheck:
      test: [CMD-SHELL, 'PGSSLMODE=require PGPASSWORD="$${AIMEE_STORE_RUNTIME_PASSWORD}" psql -h 127.0.0.1 -U aimee_store_runtime -d aimee_store -Atqc "SELECT 1" | grep -qx 1']
      interval: 5s
      timeout: 3s
      start_period: 120s
      retries: 20
    stop_grace_period: 60s

  aimee-server:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.server
    image: ${AIMEE_APPLICATION_IMAGE:-ghcr.io/rakuensoftware/aimee:${AIMEE_IMAGE_TAG:-latest}}
    # service_started also permits the optional Vault-backed LUKS startup.
    depends_on:
      aimee-store-db:
        condition: service_started
    ulimits:
      stack: 67108864
      memlock: 1073741824
      core: 0
    environment:
      AIMEE_HOME: /var/lib/aimee
      AIMEE_INSTANCE_ROLE: server
      AIMEE_MODEL_SERVICES_ENABLED: '1'
      AIMEE_MODULE_ROUNDTABLE: ${AIMEE_MODULE_ROUNDTABLE:-1}
      AIMEE_RUNTIME_WEB_ENABLED: ${AIMEE_RUNTIME_WEB_ENABLED:-1}
      AIMEE_WORKSPACES_DIR: /var/lib/aimee-workspaces
      EMBEDDER_MODEL: ${EMBEDDER_MODEL:-bekko-a25m}
      EMBEDDER_URL: ${EMBEDDER_URL:-https://aimee-embedder:8762}
      EMBEDDER_DIMS: ${EMBEDDER_DIMS:-384}
      SYNTHESIS_MODEL: ${SYNTHESIS_MODEL:-}
      SYNTHESIS_ENDPOINT: ${SYNTHESIS_ENDPOINT:-}
    ports:
      - '${AIMEE_API_PORT:-8743}:8743'
      - '${AIMEE_WEB_PORT:-8443}:8443'
    networks: [default, store, models]
    volumes:
      - aimee-server-home:/var/lib/aimee
      - aimee-server-workspaces:/var/lib/aimee-workspaces
      - aimee-store-tls:/run/aimee-store-tls:ro
      - aimee-model-tls:/run/aimee-model-tls
      - aimee-embedding-tls:/run/aimee-model-tls/embedding/server
      - aimee-synthesis-tls:/run/aimee-model-tls/synthesis/server
    healthcheck:
      test: [CMD-SHELL, 'body=$$(curl -sS --max-time 4 --unix-socket /var/lib/aimee/aimee-http.sock http://localhost/v1/ready) && printf "%s" "$$body" | grep -q ''"ready":true''']
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 10

  aimee-embedder:
    restart: unless-stopped
    image: ${AIMEE_EMBEDDER_IMAGE:-ghcr.io/rakuensoftware/aimee-embedder-${AIMEE_EMBEDDER_VARIANT:-a25m}:${AIMEE_IMAGE_TAG:-latest}}
    user: '1000:1000'
    depends_on:
      aimee-server:
        condition: service_started
    environment:
      AIMEE_EMBEDDER_IDENTITY_DIR: /run/aimee-model-tls/embedding/server
      EMBEDDER_THREADS: ${EMBEDDER_THREADS:-2}
    networks: [models]
    volumes:
      - aimee-embedding-tls:/run/aimee-model-tls/embedding/server:ro

  aimee-llm:
    profiles: [synthesis]
    restart: unless-stopped
    image: ${AIMEE_LLM_IMAGE:-ghcr.io/rakuensoftware/aimee-llm-${AIMEE_LLM_VARIANT:-e2b}:${AIMEE_IMAGE_TAG:-latest}}
    user: '1000:1000'
    depends_on:
      aimee-server:
        condition: service_started
    environment:
      AIMEE_LLM_IDENTITY_DIR: /run/aimee-model-tls/synthesis/server
    networks: [models]
    volumes:
      - aimee-synthesis-tls:/run/aimee-model-tls/synthesis/server:ro

volumes:
  # Retain the historical name so existing encrypted stores cannot be hidden.
  aimee-postgres-encrypted:
  aimee-store-tls:
  aimee-server-home:
  aimee-server-workspaces:
  aimee-model-tls:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1048576,uid=1000,gid=1000,mode=0700
  aimee-embedding-tls:
    driver_opts: {type: tmpfs, device: tmpfs, o: 'size=1048576,uid=1000,gid=1000,mode=0700'}
  aimee-synthesis-tls:
    driver_opts: {type: tmpfs, device: tmpfs, o: 'size=1048576,uid=1000,gid=1000,mode=0700'}

networks:
  default:
  store:
    internal: true
  models:
    internal: true
