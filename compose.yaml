services:
  postgres:
    restart: unless-stopped
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: aimee_shared
      POSTGRES_USER: aimee
      POSTGRES_PASSWORD: aimee
    volumes:
      - aimee-kb-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aimee -d aimee_shared"]
      interval: 10s
      timeout: 5s
      retries: 5

  # LEGACY torch embedder. Retired from the default topology by the unified-llm
  # cutover — the kb now embeds/reranks/synthesizes against the `aimee-llm`
  # container (below) via AIMEE_LLM_URL. Kept behind a profile for rollback /
  # comparison: `docker compose --profile legacy-embedder up` (and point the kb
  # back with AIMEE_EMBEDDER_URL=http://embedder:8080).
  embedder:
    restart: unless-stopped
    profiles: ["legacy-embedder"]
    # Published image (pushed to ghcr on every merge to main); override
    # AIMEE_EMBEDDER_IMAGE to pin a version or use a fork/registry.
    image: ${AIMEE_EMBEDDER_IMAGE:-ghcr.io/rakuensoftware/aimee-embedder:latest}
    build:
      context: .
      dockerfile: Dockerfile.embedder
      args:
        EMBEDDER_MODEL: ${EMBEDDER_MODEL:-perplexity-ai/pplx-embed-v1-0.6b}
        RERANKER_MODEL: ${RERANKER_MODEL:-cross-encoder/ettin-reranker-400m-v1}
    # Tier is a RUNTIME choice now: the models are fetched at startup into the
    # volume (not baked), so EMBEDDER_MODEL / RERANKER_MODEL select the tier with
    # no rebuild. Light tier: EMBEDDER_MODEL=...-0.6b, RERANKER_MODEL=...-400m-v1,
    # AIMEE_EMBEDDING_DIM=1024 on the kb (the 4b is 2560).
    environment:
      EMBEDDER_MODEL: ${EMBEDDER_MODEL:-perplexity-ai/pplx-embed-v1-0.6b}
      RERANKER_MODEL: ${RERANKER_MODEL:-cross-encoder/ettin-reranker-400m-v1}
      # CI stub embedder (off in prod): e2e sets these to serve fixed-dim
      # vectors with no model download. EMBEDDER_STUB_DIM matches the schema dim.
      EMBEDDER_STUB: ${EMBEDDER_STUB:-}
      EMBEDDER_STUB_DIM: ${EMBEDDER_STUB_DIM:-}
    volumes:
      - aimee-embedder-models:/opt/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Long: a cold first boot downloads the model (minutes for the 4b) before
      # /health returns 200; the volume makes every later boot fast.
      start_period: 900s

  aimee-kb:
    restart: unless-stopped
    # Published image (pushed to ghcr on every merge to main); override
    # AIMEE_KB_IMAGE to pin a version or use a fork/registry.
    image: ${AIMEE_KB_IMAGE:-ghcr.io/rakuensoftware/aimee-kb:latest}
    build:
      context: .
      dockerfile: Dockerfile
    # The kb's drain/ingest/watch/query worker threads need a 64 MB stack; the
    # 8 MB container default overflows and SIGSEGVs (exit 139) on real memory/kb
    # queries. Matches systemd's LimitSTACK=67108864 and the cli fork-exec ulimit.
    ulimits:
      stack: 67108864
    environment:
      AIMEE_HOME: /var/lib/aimee
      AIMEE_DB2_URL: postgresql://aimee:aimee@postgres:5432/aimee_shared
      # One knob: embed (/embed) + rerank (/rerank) + synth (curator Tier-A & B,
      # at {url}/v1) all via the unified aimee-llm container. The kb runs no model.
      # Override AIMEE_EMBEDDER_URL / AIMEE_RERANKER_URL to pin a service elsewhere.
      AIMEE_LLM_URL: ${AIMEE_LLM_URL:-http://aimee-llm:8080}
      # Embedding dim — empty = config default 1024 (CPU tier); set 2560 for the
      # GPU 4B tier (changing it against a populated kb forces a re-embed).
      AIMEE_EMBEDDING_DIM: ${AIMEE_EMBEDDING_DIM:-}
    # aimee-kb serves /v1 over HTTP only; the legacy --socket transport was retired (#2747).
    command: ["--http-port=8741"]
    ports:
      - "8741:8741"
    depends_on:
      postgres:
        condition: service_healthy
      aimee-llm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8741/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - aimee-kb-home:/var/lib/aimee

  # Bundled local LLM for the synthesis / curator passes — llama.cpp's
  # llama-server (OpenAI-compatible API at /v1). On by default; Gemma 3n E4B
  # (GGUF Q4) is fetched once from HuggingFace at first boot and cached in the
  # volume (the multi-GB download is why start_period is long). The curator calls
  # it only from the background drain, so a warming model never blocks ingest.
  # BYO: point LLM_ENDPOINT at your own endpoint and skip this service
  # (`docker compose up --scale llm=0`). Override LLAMA_ARG_HF_REPO for a
  # different/smaller GGUF.
  llm:
    restart: unless-stopped
    image: ghcr.io/ggml-org/llama.cpp:server
    profiles: ["curator-llm"]
    environment:
      LLAMA_ARG_HF_REPO: ${CURATOR_LLM_HF_REPO:-ggml-org/gemma-4-E4B-it-GGUF:Q4_K_M}
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: "8080"
      LLAMA_ARG_ENDPOINT_HEALTH: "1"
    volumes:
      - aimee-llm-models:/root/.cache/llama.cpp
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      # Long: the cold first boot downloads the multi-GB GGUF before /health is OK.
      start_period: 1200s

  # Unified llama.cpp+Vulkan container: one image serving embed + rerank + synth
  # from baked-in GGUFs behind the gateway (the /embed,/embed_batch,/rerank,
  # /v1/chat/completions contract). The kb's single LLM backend (DEFAULT now —
  # the unified-llm cutover; the legacy embedder/llm services moved behind
  # profiles). CPU tier by default; GPU = AIMEE_LLM_IMAGE=...-gpu + AIMEE_LLM_NGL=99
  # + a /dev/dri device (see deploy/compose/aimee.gpu.yaml). Internal only — the
  # kb reaches it at aimee-llm:8080. Auth-off (the kb sends no bearer).
  # CI/dev: AIMEE_LLM_DOCKERFILE=Dockerfile.aimee-llm-stub + AIMEE_LLM_STUB=1
  # builds a tiny python-only stub (no llama.cpp / GGUFs) — see e2e-matrix.sh.
  aimee-llm:
    restart: unless-stopped
    image: ${AIMEE_LLM_IMAGE:-ghcr.io/rakuensoftware/aimee-kb-cpu:latest}
    build:
      context: .
      dockerfile: ${AIMEE_LLM_DOCKERFILE:-Dockerfile.aimee-llm}
    environment:
      AIMEE_LLM_PORT: "8080"
      AIMEE_LLM_NGL: ${AIMEE_LLM_NGL:-0}
      AIMEE_LLM_AUTH_TOKEN: ${AIMEE_LLM_AUTH_TOKEN:-}
      # CI/dev stub (off in prod): deterministic embed/rerank/synth, no models.
      AIMEE_LLM_STUB: ${AIMEE_LLM_STUB:-}
      AIMEE_LLM_STUB_DIM: ${AIMEE_LLM_STUB_DIM:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Baked GGUFs load into RAM/VRAM (no download); generous for the GPU tier.
      start_period: 300s

volumes:
  aimee-kb-home:
  aimee-kb-postgres:
  aimee-embedder-models:
  aimee-llm-models:
