services:
  # LEGACY torch embedder, retired from the default topology: the kb now embeds
  # IN-CONTAINER from baked weights, so no embedding service is deployed at all.
  # Kept behind a profile for rollback / comparison:
  # `docker compose --profile legacy-embedder up` (and point the kb back with
  # AIMEE_EMBEDDER_URL=http://embedder:8080).
  embedder:
    restart: unless-stopped
    profiles: ["legacy-embedder"]
    # Published image (pushed to ghcr on every merge to main); override
    # AIMEE_EMBEDDER_IMAGE to pin a version or use a fork/registry.
    image: ${AIMEE_EMBEDDER_IMAGE:-ghcr.io/rakuensoftware/aimee-embedder:${AIMEE_IMAGE_TAG:-latest}}
    build:
      context: .
      dockerfile: Dockerfile.embedder
      args:
        EMBEDDER_MODEL: ${EMBEDDER_MODEL:-perplexity-ai/pplx-embed-v1-0.6b}
    # Tier is a RUNTIME choice now: the model is fetched at startup into the
    # volume (not baked), so EMBEDDER_MODEL selects the tier with no rebuild.
    # Light tier: EMBEDDER_MODEL=...-0.6b, AIMEE_EMBEDDING_DIM=1024 on the kb
    # (the 4b is 2560).
    environment:
      EMBEDDER_MODEL: ${EMBEDDER_MODEL:-perplexity-ai/pplx-embed-v1-0.6b}
      # CI stub embedder (off in prod): e2e sets these to serve fixed-dim
      # vectors with no model download. EMBEDDER_STUB_DIM matches the schema dim.
      EMBEDDER_STUB: ${EMBEDDER_STUB:-}
      EMBEDDER_STUB_DIM: ${EMBEDDER_STUB_DIM:-}
    volumes:
      - aimee-embedder-models:/opt/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Long: a cold first boot downloads the model (minutes for the 4b) before
      # /health returns 200; the volume makes every later boot fast.
      start_period: 900s

  aimee-kb:
    restart: unless-stopped
    # Published image (pushed to ghcr on every merge to main); override
    # AIMEE_KB_IMAGE to pin a version or use a fork/registry.
    image: ${AIMEE_KB_IMAGE:-ghcr.io/rakuensoftware/aimee-kb:${AIMEE_IMAGE_TAG:-latest}}
    build:
      context: .
      dockerfile: Dockerfile
    # The kb's drain/ingest/watch/query worker threads need a 64 MB stack; the
    # 8 MB container default overflows and SIGSEGVs (exit 139) on real memory/kb
    # queries. Matches systemd's LimitSTACK=67108864 and the cli fork-exec ulimit.
    ulimits:
      stack: 67108864
    environment:
      AIMEE_HOME: /var/lib/aimee
      # Empty by default: the KB image owns PostgreSQL + pgvector for a new
      # install. Set AIMEE_DB2_URL explicitly only to keep/use an external DB2.
      AIMEE_DB2_URL: ${AIMEE_DB2_URL:-}
      # EMBEDDING IS IN-CONTAINER: the kb serves its own embedder on loopback from
      # weights baked into the image, so nothing needs configuring for retrieval to
      # work. Set AIMEE_EMBEDDER_URL only to use an external embedder instead.
      #
      # AIMEE_LLM_URL is now SYNTH ONLY (curator Tier-A & B at {url}/v1) and has no
      # default: the bundled aimee-llm container is gone, so point this at whatever
      # OpenAI-compatible endpoint should do synthesis. LLM-dependent passes fail
      # closed until it is set; retrieval does not depend on it.
      AIMEE_LLM_URL: ${AIMEE_LLM_URL:-}
      # Embedding dim — leave EMPTY. The kb derives it from the selected embedder
      # (pinned > recorded > probed); pinning it here only adds a second place to be
      # wrong, and a change against a populated kb forces a re-embed.
      AIMEE_EMBEDDING_DIM: ${AIMEE_EMBEDDING_DIM:-}
    # aimee-kb serves /v1 over HTTP only; the legacy --socket transport was retired (#2747).
    command: ["--http-port=8741"]
    ports:
      - "127.0.0.1:8741:8741"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8741/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - aimee-kb-home:/var/lib/aimee
      - aimee-server-workspaces:/var/lib/aimee-workspaces:ro

  # aimee-control-web: the Control Plane web console (dashboard / accounts / governance).
  # Optional module `control-web` — ships ENABLED. Turn it off for a fully scripted
  # deployment with AIMEE_CONTROL_WEB_ENABLED=0 (the container then idles without a
  # listener). Bound to localhost on the host. It fronts the kb /v1 with a scoped
  # console-admin credential the operator provisions (see docs/KB_CONSOLE.md):
  #   1. mint a scope:console-admin enrollment on the kb, write it to ./console.cred
  #      (chmod 600), and 2. optionally configure OIDC via the console UI. Without the
  #   cred the container idles healthy with a clear log rather than crash-looping.
  aimee-control-web:
    restart: unless-stopped
    image: ${AIMEE_CONTROL_WEB_IMAGE:-ghcr.io/rakuensoftware/aimee-control-web:${AIMEE_IMAGE_TAG:-latest}}
    build:
      context: .
      dockerfile: Dockerfile.control-web
    command: ["-addr", "0.0.0.0:8744", "-kb", "http://aimee-kb:8741"]
    environment:
      # Ships on; set to 0 for a fully scripted / headless deployment.
      AIMEE_CONTROL_WEB_ENABLED: "1"
      CONTROL_WEB_CRED_FILE: /run/control-web/console.cred
      CONTROL_WEB_HOME: /var/lib/control-web
    ports:
      # Localhost-only on the host — the console is a trusted-LAN admin surface.
      - "127.0.0.1:8744:8744"
    depends_on:
      aimee-kb:
        condition: service_healthy
    healthcheck:
      # The console serves its SPA over auto-TLS (self-signed) — probe with -k.
      test: ["CMD", "curl", "-fsSk", "https://127.0.0.1:8744/"]
      interval: 15s
      timeout: 5s
      retries: 5
    volumes:
      - control-web-home:/var/lib/control-web
      # The operator supplies the console-admin credential (mode 0600).
      - ${CONTROL_WEB_CRED_FILE:-./console.cred}:/run/control-web/console.cred:ro

  # Bundled local LLM for the synthesis / curator passes — llama.cpp's
  # llama-server (OpenAI-compatible API at /v1). On by default; Gemma 3n E4B
  # (GGUF Q4) is fetched once from HuggingFace at first boot and cached in the
  # volume (the multi-GB download is why start_period is long). The curator calls
  # it only from the background drain, so a warming model never blocks ingest.
  # BYO: point LLM_ENDPOINT at your own endpoint and skip this service
  # (`docker compose up --scale llm=0`). Override LLAMA_ARG_HF_REPO for a
  # different/smaller GGUF.
  llm:
    restart: unless-stopped
    image: ghcr.io/ggml-org/llama.cpp:server
    profiles: ["curator-llm"]
    environment:
      LLAMA_ARG_HF_REPO: ${CURATOR_LLM_HF_REPO:-ggml-org/gemma-4-E4B-it-GGUF:Q4_K_M}
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: "8080"
      LLAMA_ARG_ENDPOINT_HEALTH: "1"
    volumes:
      - aimee-llm-models:/root/.cache/llama.cpp
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      # Long: the cold first boot downloads the multi-GB GGUF before /health is OK.
      start_period: 1200s

volumes:
  aimee-kb-home:
  aimee-server-workspaces:
  control-web-home:
  aimee-embedder-models:
  aimee-llm-models:
