services:
  aimee-kb:
    restart: unless-stopped
    # Published image (pushed to ghcr on every merge to main); override
    # AIMEE_KB_IMAGE to pin a version or use a fork/registry.
    image: ${AIMEE_KB_IMAGE:-ghcr.io/rakuensoftware/aimee-kb-a25m:${AIMEE_IMAGE_TAG:-latest}}
    build:
      context: .
      dockerfile: Dockerfile
    # The kb's drain/ingest/watch/query worker threads need a 64 MB stack; the
    # 8 MB container default overflows and SIGSEGVs (exit 139) on real memory/kb
    # queries. Matches systemd's LimitSTACK=67108864 and the cli fork-exec ulimit.
    ulimits:
      stack: 67108864
    environment:
      AIMEE_HOME: /var/lib/aimee
      # External DB2 credentials are streamed into the KB Vault by the
      # disposable Compose helper; never persist them in Config.Env.
      # SYNTH ONLY (curator Tier-A & B, at {url}/v1) and deliberately defaulted
      # empty: the aimee-llm container is retired, so any default would point
      # every deploy at a dead host. Embedding does not read this — set
      # EMBEDDER_URL to embed against an external endpoint instead of
      # the bundled in-container model.
      SYNTHESIS_ENDPOINT: ${SYNTHESIS_ENDPOINT:-}
      # The bundled synthesis model, on a *-llm image variant: the entrypoint
      # starts llama-server for it and points SYNTHESIS_ENDPOINT at loopback.
      # Empty on a non-llm image, or when synthesis is remote/off.
      SYNTHESIS_MODEL: ${SYNTHESIS_MODEL:-}
      # The wizard's embedder choice, and the endpoint for an external one. The kb
      # MUST receive both: `aimee config deploy-env` emits them, and without them
      # reaching the container the entrypoint sees no selection, starts nothing, and
      # the builtin serves forever — the wizard's embedder silently never runs.
      EMBEDDER_MODEL: ${EMBEDDER_MODEL:-}
      EMBEDDER_URL: ${EMBEDDER_URL:-}
      # Embedding dim — empty = config default 384 (bundled bekko-a25m). Only set
      # it for an external embedder of a different width; changing it against a
      # populated kb forces a re-embed, and the dim guard will refuse until you do.
      EMBEDDER_DIMS: ${EMBEDDER_DIMS:-}
    # aimee-kb serves /v1 over HTTP only; the legacy --socket transport was retired (#2747).
    command: ["--http-port=8741"]
    ports:
      - "127.0.0.1:8741:8741"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8741/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      # First boot runs postgres initdb and, on the embedder-bearing images, loads
      # the weights before /v1/health answers -- longer than retries*interval, so
      # without this the kb reads as unhealthy while it is still starting normally.
      # See deploy/container/aimee-managed.compose.yaml for what that broke.
      start_period: 300s
    volumes:
      - aimee-kb-home:/var/lib/aimee
      - aimee-server-workspaces:/var/lib/aimee-workspaces:ro

  # aimee-control-web: the Control Plane web console (dashboard / accounts / governance).
  # Optional module `control-web` — ships ENABLED. Turn it off for a fully scripted
  # deployment with AIMEE_CONTROL_WEB_ENABLED=0 (the container then idles without a
  # listener). Bound to localhost on the host. It fronts the kb /v1 with a scoped
  # console-admin credential the operator provisions (see docs/KB_CONSOLE.md):
  #   1. mint a scope:console-admin enrollment on the kb, write it to ./console.cred
  #      (chmod 600), and 2. optionally configure OIDC via the console UI. Without the
  #   cred the container idles healthy with a clear log rather than crash-looping.
  aimee-control-web:
    restart: unless-stopped
    image: ${AIMEE_CONTROL_WEB_IMAGE:-ghcr.io/rakuensoftware/aimee-control-web:${AIMEE_IMAGE_TAG:-latest}}
    build:
      context: .
      dockerfile: Dockerfile.control-web
    command: ["-addr", "0.0.0.0:8744", "-kb", "http://aimee-kb:8741"]
    environment:
      # Ships on; set to 0 for a fully scripted / headless deployment.
      AIMEE_CONTROL_WEB_ENABLED: "1"
      CONTROL_WEB_CRED_FILE: /run/control-web/console.cred
      CONTROL_WEB_HOME: /var/lib/control-web
    ports:
      # Localhost-only on the host — the console is a trusted-LAN admin surface.
      - "127.0.0.1:8744:8744"
    depends_on:
      aimee-kb:
        condition: service_healthy
    healthcheck:
      # The console serves its SPA over auto-TLS (self-signed) — probe with -k.
      test: ["CMD", "curl", "-fsSk", "https://127.0.0.1:8744/"]
      interval: 15s
      timeout: 5s
      retries: 5
    volumes:
      - control-web-home:/var/lib/control-web
      # The operator supplies the console-admin credential (mode 0600).
      - ${CONTROL_WEB_CRED_FILE:-./console.cred}:/run/control-web/console.cred:ro

volumes:
  aimee-kb-home:
  aimee-server-workspaces:
  control-web-home:
