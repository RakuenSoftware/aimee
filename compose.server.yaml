# Full aimee-server + aimee-kb stack.
#
# aimee-server fronts the /v1 HTTP API and owns DB1 (user-scoped store); it
# reaches aimee-kb (DB2 + pgvector) over HTTP via AIMEE_KB_API_URL. This is the
# "services-split" topology from
# docs/proposals/done/aimee-server-http-api-and-openai-compat.md: the server's
# kb_client_v1_* calls route to the kb's /v1 HTTP API when AIMEE_KB_API_URL is
# set (src/server/kb_client.c). The kb owns Postgres + the embedder.
#
#   docker compose -f compose.server.yaml up --build
#
# Server /v1 on :8743 over native TLS (bearer "aimee-local-dev"; self-signed cert
# auto-provisioned — pass curl -k or trust it); kb /v1 on :8741. The aimee-webchat
# browser UI is on https://localhost:8443 (self-signed; log in as
# AIMEE_WEBCHAT_USER / AIMEE_WEBCHAT_PASSWORD, default aimee / aimee-local-dev).
#   curl -k -H "Authorization: Bearer aimee-local-dev" https://localhost:8743/v1/health
services:
  postgres:
    restart: unless-stopped
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: aimee_shared
      POSTGRES_USER: aimee
      POSTGRES_PASSWORD: aimee
    volumes:
      - aimee-server-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aimee -d aimee_shared"]
      interval: 10s
      timeout: 5s
      retries: 5

  # LEGACY torch embedder — retired from the default topology by the unified-llm
  # cutover (the kb now uses the `aimee-llm` container via AIMEE_LLM_URL). Kept
  # behind a profile for rollback: `docker compose --profile legacy-embedder up`.
  embedder:
    restart: unless-stopped
    profiles: ["legacy-embedder"]
    # Published image (pushed to ghcr on every merge to main); override
    # AIMEE_EMBEDDER_IMAGE to pin a version or use a fork/registry.
    image: ${AIMEE_EMBEDDER_IMAGE:-ghcr.io/rakuensoftware/aimee-embedder:latest}
    build:
      context: .
      dockerfile: Dockerfile.embedder
      args:
        EMBEDDER_MODEL: ${EMBEDDER_MODEL:-perplexity-ai/pplx-embed-v1-0.6b}
        RERANKER_MODEL: ${RERANKER_MODEL:-cross-encoder/ettin-reranker-400m-v1}
    # Tier is a RUNTIME choice now: models are fetched at startup into the volume
    # (not baked), so EMBEDDER_MODEL / RERANKER_MODEL select the tier with no
    # rebuild. Light tier: EMBEDDER_MODEL=...-0.6b, RERANKER_MODEL=...-400m-v1,
    # AIMEE_EMBEDDING_DIM=1024 on the kb (the 4b is 2560).
    environment:
      EMBEDDER_MODEL: ${EMBEDDER_MODEL:-perplexity-ai/pplx-embed-v1-0.6b}
      RERANKER_MODEL: ${RERANKER_MODEL:-cross-encoder/ettin-reranker-400m-v1}
      # CI stub embedder (off in prod): e2e sets these to serve fixed-dim
      # vectors with no model download. EMBEDDER_STUB_DIM matches the schema dim.
      EMBEDDER_STUB: ${EMBEDDER_STUB:-}
      EMBEDDER_STUB_DIM: ${EMBEDDER_STUB_DIM:-}
    volumes:
      - aimee-embedder-models:/opt/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Long: a cold first boot downloads the model (minutes for the 4b) before
      # /health returns 200; the volume makes every later boot fast.
      start_period: 900s

  aimee-kb:
    restart: unless-stopped
    # Published image (pushed to ghcr on every merge to main); override
    # AIMEE_KB_IMAGE to pin a version or use a fork/registry.
    image: ${AIMEE_KB_IMAGE:-ghcr.io/rakuensoftware/aimee-kb:latest}
    build:
      context: .
      dockerfile: Dockerfile
    # The kb's drain/ingest/watch/query worker threads need a 64 MB stack; the
    # 8 MB container default overflows and SIGSEGVs (exit 139) on real memory/kb
    # queries. Matches systemd's LimitSTACK=67108864 and the cli fork-exec ulimit.
    ulimits:
      stack: 67108864
    environment:
      AIMEE_HOME: /var/lib/aimee
      AIMEE_DB2_URL: postgresql://aimee:aimee@postgres:5432/aimee_shared
      # One knob: embed + rerank + synth (curator Tier-A & B at {url}/v1) via the
      # unified aimee-llm container. The kb runs no model. Override
      # AIMEE_EMBEDDER_URL / AIMEE_RERANKER_URL to pin a service elsewhere.
      AIMEE_LLM_URL: ${AIMEE_LLM_URL:-http://aimee-llm:8080}
      # Embedding dim — empty = config default 1024 (CPU tier); set 2560 for GPU.
      AIMEE_EMBEDDING_DIM: ${AIMEE_EMBEDDING_DIM:-}
    # aimee-kb serves /v1 over HTTP only; the legacy --socket transport was retired (#2747).
    command: ["--http-port=8741"]
    ports:
      - "8741:8741"
    depends_on:
      postgres:
        condition: service_healthy
      aimee-llm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8741/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - aimee-kb-home:/var/lib/aimee

  aimee-server:
    restart: unless-stopped
    # Published image (pushed to ghcr on every merge to main); override
    # AIMEE_SERVER_IMAGE to pin a version or use a fork/registry.
    image: ${AIMEE_SERVER_IMAGE:-ghcr.io/rakuensoftware/aimee-server:latest}
    build:
      context: .
      dockerfile: Dockerfile.server
      # The browser UI (aimee-webchat) is built and bundled by default. Its npm
      # dependency (@rakuensoftware/smoothgui) is vendored under frontend/vendor/,
      # so the build needs NO credentials. Build --build-arg WITH_WEBCHAT=0 to
      # ship the server-only image.
    # The server's worker threads need a 64 MB stack (the 8 MB container default
    # overflows during startup — matches systemd's LimitSTACK=67108864).
    ulimits:
      stack: 67108864
    environment:
      AIMEE_HOME: /var/lib/aimee
      # DB1: user-scoped store owned by the server (self-contained SQLite file).
      AIMEE_DB1_URL: sqlite:///var/lib/aimee/aimee.db
      # Reach the kb over its /v1 HTTP API. The base URL must NOT include /v1 —
      # kb_client paths already carry the /v1 prefix (kb_client_v1_url).
      AIMEE_KB_API_URL: http://aimee-kb:8741
      AIMEE_SERVER_HTTP_BIND: "1"
      # Browser webchat (HTTPS on :8443). ON by default — it is a first-class
      # surface, built into the image (no credentials needed). Set
      # AIMEE_WEBCHAT_ENABLED=0 to ship server-only. The entrypoint provisions the
      # single login account below via PAM; change it (and use a real password)
      # for anything beyond local dev. Leave USER/PASSWORD unset to serve the UI
      # with no account (login page up, nobody can sign in until one is
      # provisioned).
      AIMEE_WEBCHAT_ENABLED: "1"
      AIMEE_WEBCHAT_USER: aimee
      AIMEE_WEBCHAT_PASSWORD: aimee-local-dev
      # "Sign in with OAuth" (webchat → git host) default client IDs. Device-flow
      # client IDs are public, so a registered OAuth App's ID can be shipped and
      # every deployment signs in with no per-instance setup. Set these to your
      # registered apps' client IDs (or bake them into the build via
      # oauth_defaults.h) and the wizard's Sign-in button works out of the box.
      AIMEE_GITHUB_OAUTH_CLIENT_ID: ${AIMEE_GITHUB_OAUTH_CLIENT_ID:-}
      AIMEE_GITLAB_OAUTH_CLIENT_ID: ${AIMEE_GITLAB_OAUTH_CLIENT_ID:-}
      # Delegate-vault auto-provisioning (optional): seal delegate API keys into
      # the server-principal vault at startup so delegates work with no manual
      # `aimee vault set`. Env form (agent lowercased) or a mounted JSON file;
      # non-destructive unless AIMEE_DELEGATE_SECRETS_OVERWRITE=1.
      # AIMEE_DELEGATE_KEY_MISTRAL: ${AIMEE_DELEGATE_KEY_MISTRAL:-}
      # AIMEE_DELEGATE_SECRETS_FILE: /run/secrets/aimee-delegates.json
    ports:
      # Remote /v1 is served over native TLS on 8743 (the server refuses to expose
      # plaintext /v1 off-loopback). Plaintext 8740 stays bound to 127.0.0.1 inside
      # the container (the healthcheck below still uses it) and is NOT published.
      - "8743:8743"
      # webchat UI — on by default; gated off only by AIMEE_WEBCHAT_ENABLED=0 above.
      - "8443:8443"
    depends_on:
      aimee-kb:
        condition: service_healthy
    # An unauthenticated probe gets 401, which still proves the listener is up;
    # treat 200/401 as healthy so this stays correct if the bearer is overridden.
    healthcheck:
      test: ["CMD-SHELL",
             "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8740/v1/health | grep -qE '^(200|401)$$'"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - aimee-server-home:/var/lib/aimee
      # Durable mirror-tier state (AIMEE_WORKSPACES_DIR): bare mirrors +
      # reconstructed worktrees, persisted across recreations on their own volume.
      - aimee-server-workspaces:/var/lib/aimee-workspaces

  # Bundled local LLM for the kb synthesis / curator passes — llama.cpp's
  # llama-server (OpenAI-compatible /v1). On by default; Gemma 3n E4B (GGUF Q4)
  # is fetched once at first boot into the volume (the multi-GB download is why
  # start_period is long). Called only from the kb's background drain, so a
  # warming model never blocks ingest. BYO: set LLM_ENDPOINT to your own endpoint
  # and skip this service (`docker compose up --scale llm=0`). Override
  # LLAMA_ARG_HF_REPO for a different/smaller GGUF.
  llm:
    restart: unless-stopped
    image: ghcr.io/ggml-org/llama.cpp:server
    profiles: ["curator-llm"]
    environment:
      LLAMA_ARG_HF_REPO: ${CURATOR_LLM_HF_REPO:-ggml-org/gemma-4-E4B-it-GGUF:Q4_K_M}
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: "8080"
      LLAMA_ARG_ENDPOINT_HEALTH: "1"
    volumes:
      - aimee-llm-models:/root/.cache/llama.cpp
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      # Long: the cold first boot downloads the multi-GB GGUF before /health is OK.
      start_period: 1200s

  # Unified llama.cpp+Vulkan container — the kb's single LLM backend (embed +
  # rerank + synth on :8080). DEFAULT (the unified-llm cutover; the legacy
  # embedder/llm services moved behind profiles). One model-less image; the tier is
  # chosen at runtime via AIMEE_LLM_TIER (unset ≡ cpu) and models download to the
  # /models volume on first boot. GPU = AIMEE_LLM_TIER=small|mid|large +
  # AIMEE_LLM_NGL=99 + /dev/dri (deploy/compose/aimee.gpu.yaml). Internal only — kb
  # reaches it at aimee-llm:8080; auth-off (kb sends no bearer).
  # CI/dev: AIMEE_LLM_DOCKERFILE=Dockerfile.aimee-llm-stub + AIMEE_LLM_STUB=1.
  aimee-llm:
    restart: unless-stopped
    image: ${AIMEE_LLM_IMAGE:-ghcr.io/rakuensoftware/aimee-llm:latest}
    build:
      context: .
      dockerfile: ${AIMEE_LLM_DOCKERFILE:-Dockerfile.aimee-llm}
    environment:
      AIMEE_LLM_PORT: "8080"
      AIMEE_LLM_NGL: ${AIMEE_LLM_NGL:-0}
      AIMEE_LLM_TIER: ${AIMEE_LLM_TIER:-cpu}
      AIMEE_LLM_AUTH_TOKEN: ${AIMEE_LLM_AUTH_TOKEN:-}
      AIMEE_LLM_STUB: ${AIMEE_LLM_STUB:-}
      AIMEE_LLM_STUB_DIM: ${AIMEE_LLM_STUB_DIM:-}
    volumes:
      # Persist the downloaded per-tier GGUFs so restarts don't re-fetch.
      - aimee-llm-models:/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Cold first boot downloads the tier's models; STUB mode skips it.
      start_period: 1200s

volumes:
  aimee-kb-home:
  aimee-server-home:
  aimee-server-workspaces:
  aimee-server-postgres:
  aimee-embedder-models:
  aimee-llm-models:
