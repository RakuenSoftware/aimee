# Full aimee-server + aimee-kb stack.
#
# aimee-server fronts the /v1 HTTP API and owns DB1 (user-scoped store); it
# reaches aimee-kb (DB2 + pgvector) over HTTP via AIMEE_KB_API_URL. This is the
# "services-split" topology from
# docs/proposals/done/aimee-server-http-api-and-openai-compat.md: the server's
# kb_client_v1_* calls route to the kb's /v1 HTTP API when AIMEE_KB_API_URL is
# set (src/server/kb_client.c). The kb owns Postgres + the embedder.
#
#   docker compose -f compose.server.yaml up --build
#
# Server /v1 on :8743 over native TLS; its API primary is Vault-only (optionally
# inject AIMEE_API_BEARER_TOKEN on first boot when an operator-known value is needed);
# kb /v1 is on :8741. The aimee-runtime-web
# browser UI is on https://localhost:8443 (self-signed; set both
# AIMEE_WEBCHAT_USER / AIMEE_WEBCHAT_PASSWORD as first-boot Vault inputs).
# Enrollment and verified health commands: docs/QUICKSTART.md section 1.3.
services:
  aimee-kb:
    restart: unless-stopped
    # Published image (pushed to ghcr on every merge to main); override
    # AIMEE_KB_IMAGE to pin a version or use a fork/registry.
    image: ${AIMEE_KB_IMAGE:-ghcr.io/rakuensoftware/aimee-kb-a25m:${AIMEE_IMAGE_TAG:-latest}}
    build:
      context: .
      dockerfile: Dockerfile
    # The kb's drain/ingest/watch/query worker threads need a 64 MB stack; the
    # 8 MB container default overflows and SIGSEGVs (exit 139) on real memory/kb
    # queries. Matches systemd's LimitSTACK=67108864 and the cli fork-exec ulimit.
    ulimits:
      stack: 67108864
    environment:
      AIMEE_HOME: /var/lib/aimee
      # External DB2 credentials are streamed into the KB Vault by the
      # disposable Compose helper; never persist them in Config.Env.
      # Synthesis only, at {url}/v1. The kb embeds in-container and there is no
      # reranking model — see docs/SYNTHESIS_MODELS.md. Override
      # EMBEDDER_URL to point embedding at an external service.
      SYNTHESIS_ENDPOINT: ${SYNTHESIS_ENDPOINT:-}
      # The bundled synthesis model, on a *-llm image variant: the entrypoint
      # starts llama-server for it and points SYNTHESIS_ENDPOINT at loopback.
      # Empty on a non-llm image, or when synthesis is remote/off.
      SYNTHESIS_MODEL: ${SYNTHESIS_MODEL:-}
      # The wizard's embedder choice, and the endpoint for an external one. The kb
      # MUST receive both: `aimee config deploy-env` emits them, and without them
      # reaching the container the entrypoint sees no selection, starts nothing, and
      # the builtin serves forever — the wizard's embedder silently never runs.
      EMBEDDER_MODEL: ${EMBEDDER_MODEL:-}
      EMBEDDER_URL: ${EMBEDDER_URL:-}
      # Embedding dim — empty = config default 1024 (CPU tier); set 2560 for GPU.
      EMBEDDER_DIMS: ${EMBEDDER_DIMS:-}
      # Internal-only enrollment/JWKS lane; never published on the host. The
      # listener always binds all interfaces; this value is the advertised DNS
      # name placed in its server certificate and must match the client endpoint.
      AIMEE_KB_MTLS_HOST: aimee-kb
      AIMEE_KB_MTLS_PORT: "8745"
    # aimee-kb serves /v1 over HTTP only; the legacy --socket transport was retired (#2747).
    command: ["--http-port=8741"]
    ports:
      - "127.0.0.1:8741:8741"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8741/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      # First boot runs postgres initdb and, on the embedder-bearing images, loads
      # the weights before /v1/health answers -- longer than retries*interval, so
      # without this the kb reads as unhealthy while it is still starting normally.
      # See deploy/container/aimee-managed.compose.yaml for what that broke.
      start_period: 300s
    volumes:
      - aimee-kb-home:/var/lib/aimee
      # kb.build/update receive server workspace paths; mount the same durable
      # workspace volume at the same path so those paths are actually readable.
      - aimee-server-workspaces:/var/lib/aimee-workspaces:ro

  aimee-server:
    restart: unless-stopped
    # Published image (pushed to ghcr on every merge to main); override
    # AIMEE_SERVER_IMAGE to pin a version or use a fork/registry.
    image: ${AIMEE_SERVER_IMAGE:-ghcr.io/rakuensoftware/aimee-server:${AIMEE_IMAGE_TAG:-latest}}
    build:
      context: .
      dockerfile: Dockerfile.server
      # The browser UI (aimee-runtime-web) is built and bundled by default. Its npm
      # dependency (@rakuensoftware/smoothgui) is vendored under frontend/vendor/,
      # so the build needs NO credentials. Build --build-arg WITH_RUNTIME_WEB=0 to
      # ship the server-only image.
    # The server's worker threads need a 64 MB stack (the 8 MB container default
    # overflows during startup — matches systemd's LimitSTACK=67108864).
    ulimits:
      stack: 67108864
    environment:
      AIMEE_HOME: /var/lib/aimee
      # DB1: user-scoped store owned by the server (self-contained SQLite file).
      AIMEE_DB1_URL: sqlite:///var/lib/aimee/aimee.db
      # Reach the kb over its /v1 HTTP API. The base URL must NOT include /v1 —
      # kb_client paths already carry the /v1 prefix (kb_client_v1_url).
      AIMEE_KB_API_URL: http://aimee-kb:8741
      # Optional per-user remote-write identity. Empty preserves the default
      # read-only posture; provisioned values pass through without manifest edits.
      AIMEE_SERVER_ID: ${AIMEE_SERVER_ID:-}
      AIMEE_SERVER_TEAM_ID: ${AIMEE_SERVER_TEAM_ID:-}
      AIMEE_SERVER_MGMT_JWKS_TRUST_BUNDLE: ${AIMEE_SERVER_MGMT_JWKS_TRUST_BUNDLE:-/run/aimee/management/jwks-trust-bundle.json}
      # The one-time AIMEE_KB_CONN enrollment credential is streamed into Vault.
      AIMEE_SERVER_HTTP_BIND: "1"
      # Reachable address(es) for the self-signed cert's SANs, for clients that
      # verify by NAME instead of TOFU-pinning the leaf. Empty keeps the default
      # container hostname + loopback set. pki.c reads it from the environment, so
      # without this passthrough the knob cannot reach the binary at all. It also
      # pins the CN, which keeps the cert stable across recreates — set it before
      # first start; a later change does not re-issue an existing cert.
      AIMEE_TLS_EXTRA_SAN: ${AIMEE_TLS_EXTRA_SAN:-}
      # Browser webchat (HTTPS on :8443). ON by default — it is a first-class
      # surface whose binary is built into the image. Set
      # AIMEE_RUNTIME_WEB_ENABLED=0 to ship server-only. Set both variables on
      # first boot through scripts/aimee-compose-vault-bootstrap.sh.
      AIMEE_RUNTIME_WEB_ENABLED: ${AIMEE_RUNTIME_WEB_ENABLED:-1}
      # "Sign in with OAuth" (webchat → git host). Set the GitHub client ID +
      # secret for the seamless web (redirect) sign-in — register the OAuth App's
      # callback URL as <this-origin>/api/git/oauth/github/callback. Omit the secret
      # to fall back to the device-code flow (client ID is public). GitLab uses the
      # device flow (client ID only). AIMEE_OAUTH_REDIRECT_BASE overrides the
      # callback origin behind a reverse proxy.
      AIMEE_GITHUB_OAUTH_CLIENT_ID: ${AIMEE_GITHUB_OAUTH_CLIENT_ID:-}
      AIMEE_GITLAB_OAUTH_CLIENT_ID: ${AIMEE_GITLAB_OAUTH_CLIENT_ID:-}
      AIMEE_OAUTH_REDIRECT_BASE: ${AIMEE_OAUTH_REDIRECT_BASE:-}
      # Optional first-boot delegate-key transport. The short-lived bootstrap
      # seals each value into Vault, scrubs the environment, and re-execs before
      # the long-lived server starts. Mounted plaintext secret files are
      # intentionally unsupported; use Kubernetes/Docker env injection here.
      # AIMEE_DELEGATE_KEY_MISTRAL: ${AIMEE_DELEGATE_KEY_MISTRAL:-}
    ports:
      # Remote /v1 is served over native TLS on 8743 (the server refuses to expose
      # plaintext /v1 off-loopback). Plaintext 8740 stays bound to 127.0.0.1 inside
      # the container (the healthcheck below still uses it) and is NOT published.
      - "8743:8743"
      # webchat UI — on by default; gated off only by AIMEE_RUNTIME_WEB_ENABLED=0 above.
      - "8443:8443"
    depends_on:
      aimee-kb:
        condition: service_healthy
    # An unauthenticated probe gets 401, which still proves the listener is up;
    # treat 200/401 as healthy so this stays correct if the bearer is overridden.
    healthcheck:
      test: ["CMD-SHELL",
             "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8740/v1/health | grep -qE '^(200|401)$$'"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - aimee-server-home:/var/lib/aimee
      # Durable mirror-tier state (AIMEE_WORKSPACES_DIR): bare mirrors +
      # reconstructed worktrees, persisted across recreations on their own volume.
      - aimee-server-workspaces:/var/lib/aimee-workspaces
      - ${AIMEE_SERVER_MANAGEMENT_DIR:-./server-management}:/run/aimee/management:ro

volumes:
  aimee-kb-home:
  aimee-server-home:
  aimee-server-workspaces:
