<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="630" viewBox="0 0 1160 630" role="img" aria-labelledby="title desc"><title id="title">One personal runtime, optional shared knowledge</title><desc id="desc">Enrolled tools use Server. Server owns personal runtime and memory, local PostgreSQL, embedding and optional synthesis. KB is independent. Cognee replaces retrieval through the existing governed path.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#52657a"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#172b40}.title{font-size:23px;font-weight:700}.label{font-size:17px;font-weight:600}.body{font-size:15px}.edge{font-size:14px;fill:#394d62}</style>
<text class="title" x="580.0" y="32" text-anchor="middle">One personal runtime, optional shared knowledge</text>
<rect x="25" y="170" width="230" height="130" rx="10" fill="#edf4fa" stroke="#9ab0c5" stroke-width="1.5"/>
<text class="label" x="140.0" y="198" text-anchor="middle">Your clients</text>
<text class="body" x="140.0" y="224" text-anchor="middle">CLI · MCP · ACP</text>
<text class="body" x="140.0" y="247" text-anchor="middle">Coding tools · browser</text>
<text class="body" x="140.0" y="270" text-anchor="middle">Enrolled / scoped access</text>
<rect x="350" y="110" width="370" height="240" rx="10" fill="#edf4fa" stroke="#9ab0c5" stroke-width="1.5"/>
<text class="label" x="535.0" y="138" text-anchor="middle">Server: one runtime owner</text>
<text class="body" x="535.0" y="164" text-anchor="middle">Sessions · private code · memory</text>
<text class="body" x="535.0" y="187" text-anchor="middle">Tools · delegates · workflows</text>
<text class="body" x="535.0" y="210" text-anchor="middle">C resource host + event bus</text>
<text class="body" x="535.0" y="233" text-anchor="middle">Supervised Go modules</text>
<polyline points="255,230 350,230" fill="none" stroke="#52657a" stroke-width="2" marker-end="url(#arrow)"/>
<text class="edge" x="302" y="205" text-anchor="middle">TLS / local UDS</text>
<rect x="830" y="90" width="300" height="100" rx="10" fill="#edf4fa" stroke="#9ab0c5" stroke-width="1.5"/>
<text class="label" x="980.0" y="118" text-anchor="middle">Server PostgreSQL</text>
<text class="body" x="980.0" y="144" text-anchor="middle">Runtime + canonical personal data</text>
<polyline points="720,155 830,155" fill="none" stroke="#52657a" stroke-width="2" marker-end="url(#arrow)"/>
<text class="edge" x="775" y="140" text-anchor="middle">local bus / SQL</text>
<rect x="830" y="235" width="300" height="105" rx="10" fill="#edf4fa" stroke="#9ab0c5" stroke-width="1.5"/>
<text class="label" x="980.0" y="263" text-anchor="middle">Model services</text>
<text class="body" x="980.0" y="289" text-anchor="middle">Embedding · optional synthesis</text>
<text class="body" x="980.0" y="312" text-anchor="middle">Local or configured remote roles</text>
<polyline points="720,290 830,290" fill="none" stroke="#52657a" stroke-width="2" marker-end="url(#arrow)"/>
<text class="edge" x="775" y="275" text-anchor="middle">governed calls</text>
<rect x="350" y="425" width="370" height="130" rx="10" fill="#edf4fa" stroke="#9ab0c5" stroke-width="1.5" stroke-dasharray="7 5"/>
<text class="label" x="535.0" y="453" text-anchor="middle">Optional independent KB</text>
<text class="body" x="535.0" y="479" text-anchor="middle">Shared corpus · facts · documents</text>
<text class="body" x="535.0" y="502" text-anchor="middle">Own identity, Vault, bus and store</text>
<text class="body" x="535.0" y="525" text-anchor="middle">Explicit shared requests only</text>
<polyline points="535,350 535,425" fill="none" stroke="#52657a" stroke-width="2" marker-end="url(#arrow)"/>
<text class="edge" x="625" y="395" text-anchor="middle">authenticated /v1</text>
<rect x="830" y="425" width="300" height="130" rx="10" fill="#edf4fa" stroke="#9ab0c5" stroke-width="1.5" stroke-dasharray="7 5"/>
<text class="label" x="980.0" y="453" text-anchor="middle">Optional Cognee retrieval</text>
<text class="body" x="980.0" y="479" text-anchor="middle">Selected by memory contract</text>
<text class="body" x="980.0" y="502" text-anchor="middle">Existing egress + Vault transport</text>
<text class="body" x="980.0" y="525" text-anchor="middle">Aimee keeps canonical ownership</text>
<polyline points="690,350 775,385 775,490 830,490" fill="none" stroke="#52657a" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text class="edge" x="868" y="393" text-anchor="middle">selected engine</text>
<text class="body" x="580" y="605" text-anchor="middle">Server and KB remain separate roles. Parent-node federation is separate design work.</text>
</svg>
