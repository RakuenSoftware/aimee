<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 510" role="img" aria-labelledby="title desc">
  <title id="title">Six decisions in the aimee setup wizard</title>
  <desc id="desc">The normal path moves through provider, knowledge base, topology, shared store, git connection, and workspaces. Selecting an existing remote knowledge base skips topology and shared store.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2878d0"/>
    </marker>
    <style>
      .title { font: 700 30px system-ui, sans-serif; fill: #172033; }
      .step { font: 700 18px system-ui, sans-serif; fill: #172033; }
      .num { font: 700 18px system-ui, sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .body { font: 15px system-ui, sans-serif; fill: #526179; }
      .flow { stroke: #2878d0; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .skip { stroke: #7a5bd0; stroke-width: 3; stroke-dasharray: 9 7; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1320" height="510" rx="24" fill="#f6f8fc"/>
  <text x="55" y="62" class="title">The wizard records six deployment decisions</text>

  <path d="M235 188 L252 188 M450 188 L467 188 M665 188 L682 188 M880 188 L897 188 M1095 188 L1112 188" class="flow"/>

  <g transform="translate(35 120)">
    <rect width="200" height="136" rx="16" fill="#ffffff" stroke="#86a7cc" stroke-width="2"/>
    <circle cx="28" cy="28" r="18" fill="#2878d0"/><text x="28" y="28" class="num">1</text>
    <text x="24" y="74" class="step">Primary provider</text>
    <text x="24" y="103" class="body">Agent and credential</text>
  </g>
  <g transform="translate(250 120)">
    <rect width="200" height="136" rx="16" fill="#ffffff" stroke="#86a7cc" stroke-width="2"/>
    <circle cx="28" cy="28" r="18" fill="#2878d0"/><text x="28" y="28" class="num">2</text>
    <text x="24" y="74" class="step">Knowledge base</text>
    <text x="24" y="103" class="body">Local or existing remote</text>
  </g>
  <g transform="translate(465 120)">
    <rect width="200" height="136" rx="16" fill="#ffffff" stroke="#86a7cc" stroke-width="2"/>
    <circle cx="28" cy="28" r="18" fill="#2878d0"/><text x="28" y="28" class="num">3</text>
    <text x="24" y="74" class="step">Deploy topology</text>
    <text x="24" y="103" class="body">Managed or split stack</text>
  </g>
  <g transform="translate(680 120)">
    <rect width="200" height="136" rx="16" fill="#ffffff" stroke="#86a7cc" stroke-width="2"/>
    <circle cx="28" cy="28" r="18" fill="#2878d0"/><text x="28" y="28" class="num">4</text>
    <text x="24" y="74" class="step">Shared store</text>
    <text x="24" y="103" class="body">Database and inference</text>
  </g>
  <g transform="translate(895 120)">
    <rect width="200" height="136" rx="16" fill="#ffffff" stroke="#86a7cc" stroke-width="2"/>
    <circle cx="28" cy="28" r="18" fill="#2878d0"/><text x="28" y="28" class="num">5</text>
    <text x="24" y="74" class="step">Git connection</text>
    <text x="24" y="103" class="body">Forge identity</text>
  </g>
  <g transform="translate(1110 120)">
    <rect width="175" height="136" rx="16" fill="#ffffff" stroke="#86a7cc" stroke-width="2"/>
    <circle cx="28" cy="28" r="18" fill="#2878d0"/><text x="28" y="28" class="num">6</text>
    <text x="24" y="74" class="step">Workspaces</text>
    <text x="24" y="103" class="body">Projects to index</text>
  </g>

  <path d="M350 258 C350 355 760 366 980 258" class="skip"/>
  <rect x="472" y="314" width="385" height="56" rx="12" fill="#f1ecff"/>
  <text x="505" y="338" class="step" style="font-size:16px;fill:#5b43a5">Existing remote KB</text>
  <text x="505" y="360" class="body">Skip local topology and shared store.</text>

  <path d="M1198 258 L1198 405" class="flow"/>
  <rect x="1098" y="406" width="200" height="68" rx="16" fill="#eaf8f0" stroke="#65ad81" stroke-width="2"/>
  <text x="1198" y="442" class="step" text-anchor="middle">Deploy</text>
  <text x="1198" y="465" class="body" text-anchor="middle">Apply the recorded plan</text>
</svg>
