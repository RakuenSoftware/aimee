# Combined aimee-server+kb stack.
#
# One container runs BOTH aimee binaries co-located (server fronts /v1 over TLS on :8743;
# the kb runs on loopback :8741 inside the same container and the server reaches
# it via AIMEE_KB_API_URL=http://127.0.0.1:8741). The combined image is server+kb
# ONLY — the LLM is NOT bundled. embed/rerank/synth run against the separate
# `aimee-llm` service below, which is profile-gated (`llm`): it is brought up only
# when the setup wizard's page-2 config puts a role local (COMPOSE_PROFILES=...,llm,
# emitted by `aimee config deploy-env`). An all-external / remote-kb stack runs no
# LLM at all. The `embedder` + curator `llm` services are legacy alternatives behind
# the `external-llm` profile. Postgres (DB2 + pgvector) is the only always-on dep.
#
# Deploy the published images (built + pushed to ghcr on every merge to main):
#   docker compose -f compose.combined.yaml pull
#   docker compose -f compose.combined.yaml up -d
# Or build from source instead of pulling:
#   docker compose -f compose.combined.yaml up --build
#
# Server /v1 over TLS on :8743 (bearer "aimee-local-dev"; self-signed, use curl -k); the in-container kb /v1 is also
# published on :8741 for direct inspection. The default build needs no credentials
# and ships server+kb only. The optional aimee-webchat browser UI (https://localhost:8443,
# self-signed; log in as AIMEE_WEBCHAT_USER / AIMEE_WEBCHAT_PASSWORD, default
# aimee / aimee-local-dev) is included only when built with --build-arg WITH_WEBCHAT=1
# (needs a GitHub Packages token) or when running a published image.
#   curl -k -H "Authorization: Bearer aimee-local-dev" https://localhost:8743/v1/health
#   curl http://localhost:8741/v1/health?status=1
services:
  postgres:
    restart: unless-stopped
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: aimee_shared
      POSTGRES_USER: aimee
      POSTGRES_PASSWORD: aimee
    volumes:
      - aimee-combined-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aimee -d aimee_shared"]
      interval: 10s
      timeout: 5s
      retries: 5

  # External embedder — OFF by default (the combined image bundles aimee-llm,
  # which serves embeddings in-container). Enable it only with a lean WITH_LLM=0
  # combined image, by selecting the profile and pointing the kb at it:
  #   docker compose -f compose.combined.yaml --profile external-llm up -d
  #   (and set AIMEE_BUNDLED_LLM=off + AIMEE_EMBEDDER_URL=http://embedder:8080).
  embedder:
    restart: unless-stopped
    profiles: ["external-llm"]
    # Published image (built + pushed to ghcr on every merge to main). `docker
    # compose pull` fetches it; `up --build` rebuilds locally and tags it the same.
    # Override AIMEE_EMBEDDER_IMAGE to pin a version or use a fork/registry.
    image: ${AIMEE_EMBEDDER_IMAGE:-ghcr.io/rakuensoftware/aimee-embedder:latest}
    build:
      context: .
      dockerfile: Dockerfile.embedder
      args:
        EMBEDDER_MODEL: ${EMBEDDER_MODEL:-perplexity-ai/pplx-embed-v1-0.6b}
        RERANKER_MODEL: ${RERANKER_MODEL:-cross-encoder/ettin-reranker-400m-v1}
    # Tier is a RUNTIME choice now: models are fetched at startup into the volume
    # (not baked), so EMBEDDER_MODEL / RERANKER_MODEL select the tier with no
    # rebuild. Light tier: EMBEDDER_MODEL=...-0.6b, RERANKER_MODEL=...-400m-v1,
    # AIMEE_EMBEDDING_DIM=1024 on the server/kb (the 4b is 2560).
    environment:
      EMBEDDER_MODEL: ${EMBEDDER_MODEL:-perplexity-ai/pplx-embed-v1-0.6b}
      RERANKER_MODEL: ${RERANKER_MODEL:-cross-encoder/ettin-reranker-400m-v1}
      # CI stub embedder (off in prod): e2e sets these to serve fixed-dim
      # vectors with no model download. EMBEDDER_STUB_DIM matches the schema dim.
      EMBEDDER_STUB: ${EMBEDDER_STUB:-}
      EMBEDDER_STUB_DIM: ${EMBEDDER_STUB_DIM:-}
    volumes:
      - aimee-embedder-models:/opt/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Long: a cold first boot downloads the model (minutes for the 4b) before
      # /health returns 200; the volume makes every later boot fast.
      start_period: 900s

  aimee-server-kb:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.combined
      # The browser UI (aimee-webchat) is built and bundled by default. Its npm
      # dependency (@rakuensoftware/smoothgui) is vendored under frontend/vendor/,
      # so the build needs NO credentials. Build --build-arg WITH_WEBCHAT=0 to
      # ship the server+kb services only. The image is server+kb ONLY — the LLM is
      # no longer bundled (Dockerfile default WITH_LLM=0); the aimee-llm service
      # below serves it, profile-gated on the page-2 config.
    # Published combined image (built + pushed to ghcr on every merge to main).
    # `docker compose pull` fetches it so the standard deploy creates containers
    # from the merge-built image without a local build; `up --build` still
    # rebuilds locally and tags it the same. Override AIMEE_COMBINED_IMAGE to pin
    # a version (e.g. ghcr.io/rakuensoftware/aimee-server-kb:v0.2.41) or a fork.
    image: ${AIMEE_COMBINED_IMAGE:-ghcr.io/rakuensoftware/aimee-server-kb:latest}
    # The server's worker threads need a 64 MB stack (the 8 MB container default
    # overflows during startup — matches systemd's LimitSTACK=67108864).
    ulimits:
      stack: 67108864
    environment:
      AIMEE_HOME: /var/lib/aimee
      AIMEE_DB1_URL: sqlite:///var/lib/aimee/aimee.db
      AIMEE_DB2_URL: postgresql://aimee:aimee@postgres:5432/aimee_shared
      # Embed/rerank + curator synth run against the separate aimee-llm service
      # (profile-gated) — the entrypoint derives AIMEE_EMBEDDER_URL / LLM_ENDPOINT
      # from AIMEE_LLM_URL. The default points at the compose service; override to
      # a GPU/external endpoint (and drop the `llm` profile). No LLM is bundled.
      AIMEE_LLM_URL: ${AIMEE_LLM_URL:-http://aimee-llm:8080}
      # Embedding dim — unset lets the kb derive it from the embedder /health
      # probe; pin it (e.g. 1024/2560) only for an external embedder.
      AIMEE_EMBEDDING_DIM: ${AIMEE_EMBEDDING_DIM:-}
      LLM_MODEL: ${LLM_MODEL:-gemma-3n-e4b}
      LLM_API_KEY: ${LLM_API_KEY:-}
      # --- external-llm topology (WITH_LLM=0) only; uncomment + use the profile ---
      # AIMEE_EMBEDDER_URL: http://embedder:8080
      # LLM_ENDPOINT: ${LLM_ENDPOINT:-http://llm:8080/v1}
      AIMEE_SERVER_HTTP_BIND: "1"
      AIMEE_KB_HTTP_BIND: "1"
      AIMEE_KB_API_URL: http://127.0.0.1:8741
      # Browser webchat (HTTPS on :8443). ON by default — it is a first-class
      # surface, built into the image (no credentials needed). Set
      # AIMEE_WEBCHAT_ENABLED=0 to ship server+kb only. The entrypoint provisions
      # the single login account below via PAM; change it (and use a real
      # password) for anything beyond local dev. Leave USER/PASSWORD unset to
      # serve the UI with no account (login page up, nobody can sign in until
      # provisioned).
      AIMEE_WEBCHAT_ENABLED: "1"
      AIMEE_WEBCHAT_USER: aimee
      AIMEE_WEBCHAT_PASSWORD: aimee-local-dev
      # Delegate-vault auto-provisioning (optional). aimee-server seals these
      # delegate API keys into its server-principal vault at startup, so a fresh
      # deploy's delegates/roundtables work with no manual `aimee vault set`.
      # Non-destructive by default (set AIMEE_DELEGATE_SECRETS_OVERWRITE=1 to
      # replace an existing key); secrets never touch AIMEE_HOME or logs.
      #   Env form (agent name lowercased):
      # AIMEE_DELEGATE_KEY_MISTRAL: ${AIMEE_DELEGATE_KEY_MISTRAL:-}
      #   File form (a JSON object {"<agent>":"<key>", ...}); mount it readable by
      #   the container's "aimee" user and point at it:
      # AIMEE_DELEGATE_SECRETS_FILE: /run/secrets/aimee-delegates.json
    ports:
      # /v1 over native TLS on 8743 (plaintext 8740 is loopback-only, not published).
      - "8743:8743"
      - "8741:8741"
      # webchat UI — on by default; gated off only by AIMEE_WEBCHAT_ENABLED=0 above.
      - "8443:8443"
    # To use the file form above, mount the secrets file read-only, e.g.:
    # secrets:
    #   - aimee_delegates
    # (and a top-level `secrets: { aimee_delegates: { file: ./aimee-delegates.json } }`,
    #  or a bind mount under volumes:). Keep it out of the image and VCS.
    depends_on:
      postgres:
        condition: service_healthy
      # required:false so server+kb still come up when the aimee-llm service is not
      # in the active profile set (all-external / remote-kb); the kb fail-opens on
      # embedding. When the `llm` profile is on, it waits for aimee-llm to be healthy.
      aimee-llm:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL",
             "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8740/v1/health | grep -qE '^(200|401)$$'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    volumes:
      - aimee-combined-home:/var/lib/aimee
      - aimee-combined-workspaces:/var/lib/aimee-workspaces

  # Profile-gated aimee-llm (embed + rerank + synth) — brought up only when the
  # page-2 config puts a role local (COMPOSE_PROFILES=...,llm, emitted by
  # `aimee config deploy-env`). server+kb reach it at aimee-llm:8080. CI builds the
  # stub (AIMEE_LLM_DOCKERFILE=Dockerfile.aimee-llm-stub + AIMEE_LLM_STUB=1). Mirrors
  # the aimee-llm service in compose.yaml.
  aimee-llm:
    restart: unless-stopped
    profiles: ["llm"]
    image: ${AIMEE_LLM_IMAGE:-ghcr.io/rakuensoftware/aimee-llm:latest}
    build:
      context: .
      dockerfile: ${AIMEE_LLM_DOCKERFILE:-Dockerfile.aimee-llm}
    environment:
      AIMEE_LLM_PORT: "8080"
      AIMEE_LLM_NGL: ${AIMEE_LLM_NGL:-0}
      AIMEE_LLM_TIER: ${AIMEE_LLM_TIER:-cpu}
      AIMEE_LLM_AUTH_TOKEN: ${AIMEE_LLM_AUTH_TOKEN:-}
      AIMEE_LLM_STUB: ${AIMEE_LLM_STUB:-}
      AIMEE_LLM_STUB_DIM: ${AIMEE_LLM_STUB_DIM:-}
    volumes:
      - aimee-llm-models:/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 1200s

  # External curator LLM — OFF by default (the aimee-llm gateway already
  # serves synthesis at /v1). This standalone llama.cpp is only for the lean
  # WITH_LLM=0 image or to BYO a different curator GGUF; enable with the
  # `external-llm` profile and set LLM_ENDPOINT=http://llm:8080/v1. Gemma 3n E4B
  # (GGUF Q4), fetched once at first boot (the multi-GB download is why
  # start_period is long). Override LLAMA_ARG_HF_REPO for a different GGUF.
  llm:
    restart: unless-stopped
    image: ghcr.io/ggml-org/llama.cpp:server
    profiles: ["external-llm"]
    environment:
      LLAMA_ARG_HF_REPO: ${CURATOR_LLM_HF_REPO:-ggml-org/gemma-4-E4B-it-GGUF:Q4_K_M}
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: "8080"
      LLAMA_ARG_ENDPOINT_HEALTH: "1"
    volumes:
      - aimee-llm-models:/root/.cache/llama.cpp
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      # Long: the cold first boot downloads the multi-GB GGUF before /health is OK.
      start_period: 1200s

volumes:
  aimee-combined-home:
  aimee-combined-workspaces:
  aimee-combined-postgres:
  aimee-embedder-models:
  aimee-llm-models:
