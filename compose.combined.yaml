# All-in-one aimee appliance.
#
# One combined image runs aimee-server + aimee-kb + the aimee-llm inference gateway
# co-located, all on CPU by default. Paired with a Postgres (DB2 + pgvector), that's
# the whole stack — nothing to place, nothing to size. The setup wizard runs in
# APPLIANCE mode (AIMEE_WIZARD_APPLIANCE=1): it skips the knowledge-base, deploy-
# topology, and shared-store steps and only asks you to add an agent, connect
# GitHub, and pull in your workspaces.
#
#   docker compose -f compose.combined.yaml up -d
#   # then open https://localhost:8443 and run the (short) setup wizard
#
# The /v1 API requires a bearer token (baked default: "aimee-local-dev"):
#   curl -k -H "Authorization: Bearer aimee-local-dev" https://localhost:8743/v1/health
#
# CPU-only by design. The image is multi-arch (amd64 + arm64) and ships its
# cpu-tier models PRE-BAKED; first boot only seeds them into the models volume
# (a local copy), not a multi-GB download.

services:
  postgres:
    restart: unless-stopped
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: aimee_shared
      POSTGRES_USER: aimee
      POSTGRES_PASSWORD: aimee
    volumes:
      - aimee-combined-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aimee -d aimee_shared"]
      interval: 10s
      timeout: 5s
      retries: 5

  aimee:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.combined
    # Published image (pushed to ghcr on every merge to main); override
    # AIMEE_COMBINED_IMAGE to pin a version or use a fork/registry.
    image: ${AIMEE_COMBINED_IMAGE:-ghcr.io/rakuensoftware/aimee-combined:latest}
    # server + kb worker threads need a 64 MB stack (the 8 MB default SIGSEGVs on
    # real queries); the entrypoint raises the soft limit, this is the hard cap.
    ulimits:
      stack: 67108864
    environment:
      # Short "appliance" setup wizard: add an agent + connect GitHub + workspaces.
      AIMEE_WIZARD_APPLIANCE: "1"
      # Everything runs in-container on CPU; the kb reaches the bundled aimee-llm on
      # loopback (the entrypoint sets AIMEE_LLM_URL) and Postgres over the network.
      AIMEE_LLM_TIER: cpu
      AIMEE_DB2_URL: postgresql://aimee:aimee@postgres:5432/aimee_shared
      # "Sign in with OAuth". Set the GitHub client ID + secret for the seamless web
      # (redirect) sign-in (callback URL <origin>/api/git/oauth/github/callback);
      # omit the secret for the device-code flow.
      AIMEE_GITHUB_OAUTH_CLIENT_ID: ${AIMEE_GITHUB_OAUTH_CLIENT_ID:-}
      AIMEE_GITHUB_OAUTH_CLIENT_SECRET: ${AIMEE_GITHUB_OAUTH_CLIENT_SECRET:-}
      AIMEE_OAUTH_REDIRECT_BASE: ${AIMEE_OAUTH_REDIRECT_BASE:-}
      AIMEE_WEBCHAT_USER: aimee
      AIMEE_WEBCHAT_PASSWORD: aimee-local-dev
    ports:
      - "8743:8743" # server /v1 over native TLS (remote thin-client port)
      - "8443:8443" # webchat UI (HTTPS)
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - aimee-combined-home:/var/lib/aimee
      - aimee-combined-workspaces:/var/lib/aimee-workspaces
      # Seeded from the image's pre-baked cpu-tier models on first use; persists
      # any other tier's downloads across recreations.
      - aimee-combined-models:/models
    healthcheck:
      test: ["CMD-SHELL",
             "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8740/v1/health | grep -qE '^(200|401)$$'"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Covers seeding the baked models into a fresh volume + loading them (the
      # first-boot model DOWNLOAD is gone — they ship in the image).
      start_period: 600s

volumes:
  aimee-combined-home:
  aimee-combined-workspaces:
  aimee-combined-models:
  aimee-combined-postgres:
