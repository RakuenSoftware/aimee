# Combined aimee-server+kb stack.
#
# One container runs BOTH aimee binaries co-located (server fronts /v1 on :8740;
# the kb runs on loopback :8741 inside the same container and the server reaches
# it via AIMEE_KB_API_URL=http://127.0.0.1:8741). Postgres (DB2 + pgvector) and
# the embedder remain separate services — the combined image bundles the two
# aimee binaries, not a database.
#
#   docker compose -f compose.combined.yaml up --build
#
# Server /v1 on :8740 (bearer "aimee-local-dev"); the in-container kb /v1 is also
# published on :8741 for direct inspection. The default build needs no credentials
# and ships server+kb only. The optional aimee-webchat browser UI (https://localhost:8443,
# self-signed; log in as AIMEE_WEBCHAT_USER / AIMEE_WEBCHAT_PASSWORD, default
# aimee / aimee-local-dev) is included only when built with --build-arg WITH_WEBCHAT=1
# (needs a GitHub Packages token) or when running a published image.
#   curl -H "Authorization: Bearer aimee-local-dev" http://localhost:8740/v1/health
#   curl http://localhost:8741/v1/health?status=1
services:
  postgres:
    restart: unless-stopped
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: aimee_shared
      POSTGRES_USER: aimee
      POSTGRES_PASSWORD: aimee
    volumes:
      - aimee-combined-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aimee -d aimee_shared"]
      interval: 10s
      timeout: 5s
      retries: 5

  embedder:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.embedder
    volumes:
      - aimee-embedder-models:/opt/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  aimee-server-kb:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.combined
      # The browser UI (aimee-webchat) is built and bundled by default. Its npm
      # dependency (@rakuensoftware/smoothgui) is vendored under frontend/vendor/,
      # so the build needs NO credentials. Build --build-arg WITH_WEBCHAT=0 to
      # ship the server+kb services only.
    image: aimee-server-kb
    # The server's worker threads need a 64 MB stack (the 8 MB container default
    # overflows during startup — matches systemd's LimitSTACK=67108864).
    ulimits:
      stack: 67108864
    environment:
      AIMEE_HOME: /var/lib/aimee
      AIMEE_DB1_URL: sqlite:///var/lib/aimee/aimee.db
      AIMEE_DB2_URL: postgresql://aimee:aimee@postgres:5432/aimee_shared
      AIMEE_EMBEDDER_URL: http://embedder:8080
      AIMEE_SERVER_HTTP_BIND: "1"
      AIMEE_KB_HTTP_BIND: "1"
      AIMEE_KB_API_URL: http://127.0.0.1:8741
      # Browser webchat (HTTPS on :8443). ON by default — it is a first-class
      # surface, built into the image (no credentials needed). Set
      # AIMEE_WEBCHAT_ENABLED=0 to ship server+kb only. The entrypoint provisions
      # the single login account below via PAM; change it (and use a real
      # password) for anything beyond local dev. Leave USER/PASSWORD unset to
      # serve the UI with no account (login page up, nobody can sign in until
      # provisioned).
      AIMEE_WEBCHAT_ENABLED: "1"
      AIMEE_WEBCHAT_USER: aimee
      AIMEE_WEBCHAT_PASSWORD: aimee-local-dev
    ports:
      - "8740:8740"
      - "8741:8741"
      # webchat UI — on by default; gated off only by AIMEE_WEBCHAT_ENABLED=0 above.
      - "8443:8443"
    depends_on:
      postgres:
        condition: service_healthy
      embedder:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL",
             "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8740/v1/health | grep -qE '^(200|401)$$'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - aimee-combined-home:/var/lib/aimee
      - aimee-combined-workspaces:/var/lib/aimee-workspaces

  # Optional local LLM for the kb synthesis / curator passes. Enable with
  #   docker compose -f compose.combined.yaml --profile llm up
  llm:
    restart: unless-stopped
    image: ghcr.io/ggml-org/llama.cpp:server
    profiles: ["llm"]
    environment:
      LLAMA_ARG_HF_REPO: ggml-org/gemma-4-E4B-it-GGUF:Q4_K_M
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: "8080"
      LLAMA_ARG_ENDPOINT_HEALTH: "1"
    volumes:
      - aimee-llm-models:/root/.cache/llama.cpp
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

volumes:
  aimee-combined-home:
  aimee-combined-workspaces:
  aimee-combined-postgres:
  aimee-embedder-models:
  aimee-llm-models:
