# Isolated audit worker. Its dedicated database role reaches the PostgreSQL
# module through a private channel and owns only the claim/ack capability.
services:
  aimee-worm:
    image: ${AIMEE_APPLICATION_IMAGE:-ghcr.io/rakuensoftware/aimee:${AIMEE_IMAGE_TAG:-latest}}
    entrypoint: ["/usr/local/bin/aimee-kb-worm"]
    command: ["--batch=128", "--poll-ms=1000"]
    restart: unless-stopped
    environment:
      AIMEE_WORM_POSTGRES_URL: ${AIMEE_WORM_POSTGRES_URL:?dedicated WORM worker DSN required}
      AIMEE_HOME: /var/lib/aimee-worm
      AIMEE_WORM_PATH: /var/lib/aimee-worm/audit/kb-worm-live.db
    volumes:
      - aimee-worm-data:/var/lib/aimee-worm
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=8m,mode=1777

volumes:
  aimee-worm-data:
