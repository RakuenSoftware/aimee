# aimee split stack via docker-compose (aimee-llm + self-contained aimee-kb +
# aimee-server). Runs on Docker or any Docker-API daemon (e.g. LXC2Docker).
#
#   docker compose -f deploy/compose/aimee.yaml up -d                 # CPU LLM
#   docker compose -f deploy/compose/aimee.yaml -f deploy/compose/aimee.gpu.yaml up -d   # GPU LLM
#
# The kb runs NO model — it calls the aimee-llm container for embedding,
# reranking and synthesis via AIMEE_LLM_URL (the one knob; see
# docs/KB_LLM_BACKENDS.md). aimee-llm is the unified Vulkan llama.cpp container;
# this base uses the CPU tier (1024-dim). Layer aimee.gpu.yaml for the GPU tier
# (2560-dim + /dev/dri passthrough). Server /v1 on :8740, kb /v1 on :8741,
# webchat on :8443.
name: aimee
services:
  aimee-kb:
    restart: unless-stopped
    image: ${AIMEE_KB_IMAGE:-ghcr.io/rakuensoftware/aimee-kb:latest}
    ulimits:
      stack: 67108864
    environment:
      AIMEE_HOME: /var/lib/aimee
      # Must match the read-only workspaces mount below. Without it the
      # webuser-root convention resolves to <AIMEE_HOME>/workspaces, which does
      # not exist in this container, and the background ingest reconciler cannot
      # find GUI-cloned repos.
      AIMEE_WORKSPACES_DIR: /var/lib/aimee-workspaces
      # External DB2 credentials are streamed into the KB Vault by the
      # disposable Compose helper; never persist them in Config.Env.
      # One knob: embed + rerank + synth all via the aimee-llm container.
      AIMEE_LLM_URL: ${AIMEE_LLM_URL:-}
      # The wizard's embedder choice, and the endpoint for an external one. The kb
      # MUST receive both: `aimee config deploy-env` emits them, and without them
      # reaching the container the entrypoint sees no selection, starts nothing, and
      # the builtin serves forever — the wizard's embedder silently never runs.
      EMBEDDER_MODEL: ${EMBEDDER_MODEL:-}
      AIMEE_EMBEDDER_URL: ${AIMEE_EMBEDDER_URL:-}
      # Embedding dim. Leave EMPTY so the kb uses the dimension of the embedder it
      # actually serves (the bundled bekko-a25m is 384). This carried the retired
      # aimee-llm CPU tier's 1024: with the bundled embedder the kb came up healthy,
      # accepted writes, and then refused every vector upsert with
      # "dim mismatch: got 384, expected 1024" — dense retrieval silently dead.
      # Set it ONLY for an external AIMEE_EMBEDDER_URL, whose width the kb cannot
      # know.
      AIMEE_EMBEDDING_DIM: ${AIMEE_EMBEDDING_DIM:-}
      AIMEE_KB_HTTP_BIND: "1"
      # The curator synth sidecar (curator-extract.py) reads LLM_ENDPOINT, NOT
      # AIMEE_LLM_URL. Defaulted empty for the same reason as AIMEE_LLM_URL above:
      # the aimee-llm container is retired, so the old http://aimee-llm:8742/v1
      # default pointed every deploy at a host that can never resolve. Set it to
      # your own synth endpoint (/v1) to drain code-unit synthesis.
      LLM_ENDPOINT: ${LLM_ENDPOINT:-}
      LLM_MODEL: ${LLM_MODEL:-aimee-synth}
    command: ["--http-port=8741"]
    ports:
      - "8741:8741"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8741/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - aimee-kb-home:/var/lib/aimee
      - aimee-server-workspaces:/var/lib/aimee-workspaces:ro

  aimee-server:
    restart: unless-stopped
    image: ${AIMEE_SERVER_IMAGE:-ghcr.io/rakuensoftware/aimee-server:latest}
    ulimits:
      stack: 67108864
    environment:
      AIMEE_HOME: /var/lib/aimee
      AIMEE_DB1_URL: sqlite:///var/lib/aimee/aimee.db
      AIMEE_KB_API_URL: http://aimee-kb:8741
      AIMEE_SERVER_HTTP_BIND: "1"
      AIMEE_RUNTIME_WEB_ENABLED: ${AIMEE_RUNTIME_WEB_ENABLED:-1}
      # First-boot credentials are streamed into Vault before `up`; this
      # long-lived service environment is deliberately credential-free.
    ports:
      # 8740 (plaintext /v1) is loopback-only in the server; do NOT publish it.
      # Remote thin clients use the TLS /v1 on 8743 (https://, self-signed cert
      # auto-provisioned). 8443 is the webchat browser UI.
      - "8743:8743"
      - "8443:8443"
    depends_on:
      aimee-kb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL",
             "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8740/v1/health | grep -qE '^(200|401)$$'"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - aimee-server-home:/var/lib/aimee
      - aimee-server-workspaces:/var/lib/aimee-workspaces

volumes:
  aimee-kb-home:
  aimee-server-home:
  aimee-server-workspaces:
