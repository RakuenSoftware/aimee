# aimee split stack via Docker Compose (self-contained aimee-kb + aimee-server).
# Runs on Docker or any Docker-API daemon (for example, LXC2Docker).
#
#   docker compose -f deploy/compose/aimee.yaml up -d
#
# This single-KB profile declares no standalone inference service. Embedding and
# synthesis are roles of the KB: the image runs them in this container, or the KB
# points at remote endpoints. Server /v1 is on :8740, KB /v1 is on :8741, and the
# browser is on :8443. See docs/KB_LLM_BACKENDS.md and docs/SYNTHESIS_MODELS.md.
name: aimee
services:
  aimee-kb:
    restart: unless-stopped
    image: ${AIMEE_KB_IMAGE:-ghcr.io/rakuensoftware/aimee-kb:latest}
    ulimits:
      stack: 67108864
    environment:
      AIMEE_HOME: /var/lib/aimee
      # Must match the read-only workspaces mount below. Without it the
      # webuser-root convention resolves to <AIMEE_HOME>/workspaces, which does
      # not exist in this container, and the background ingest reconciler cannot
      # find GUI-cloned repos.
      AIMEE_WORKSPACES_DIR: /var/lib/aimee-workspaces
      # External DB2 credentials are streamed into the KB Vault by the
      # disposable Compose helper; never persist them in Config.Env.
      # Remote synthesis endpoint for a deployment that places synthesis externally.
      # Empty leaves synthesis off, which is supported. An INTERNAL placement needs
      # no value here at all: a *-llm image bakes the model and the entrypoint points
      # this at loopback itself.
      SYNTHESIS_ENDPOINT: ${SYNTHESIS_ENDPOINT:-}
      # Which model an internal placement runs. Set by the image, not usually by hand.
      SYNTHESIS_MODEL: ${SYNTHESIS_MODEL:-}
      # The wizard's embedder choice, and the endpoint for an external one. The kb
      # MUST receive both: `aimee config deploy-env` emits them, and without them
      # reaching the container the entrypoint sees no selection, starts nothing, and
      # the builtin serves forever — the wizard's embedder silently never runs.
      EMBEDDER_MODEL: ${EMBEDDER_MODEL:-}
      EMBEDDER_URL: ${EMBEDDER_URL:-}
      # Embedding dim. Leave EMPTY so the kb uses the dimension of the embedder it
      # actually serves (the bundled bekko-a25m is 384). This carried the retired
      # aimee-llm CPU tier's 1024: with the bundled embedder the kb came up healthy,
      # accepted writes, and then refused every vector upsert with
      # "dim mismatch: got 384, expected 1024" — dense retrieval silently dead.
      # Set it ONLY for an external EMBEDDER_URL, whose width the kb cannot
      # know.
      EMBEDDER_DIMS: ${EMBEDDER_DIMS:-}
      AIMEE_KB_HTTP_BIND: "1"
      # The curator adapter reads the same SYNTHESIS_ENDPOINT above. It used to need
      # its own LLM_ENDPOINT, defaulted to a container this file never defined, so a
      # fresh deployment aimed the adapter at a dead host while the KB used
      # AIMEE_LLM_URL. One endpoint, one spelling.
    command: ["--http-port=8741"]
    ports:
      - "8741:8741"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8741/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      # First boot runs postgres initdb and, on the embedder-bearing images, loads
      # the weights before /v1/health answers -- longer than retries*interval, so
      # without this the kb reads as unhealthy while it is still starting normally.
      # See deploy/container/aimee-managed.compose.yaml for what that broke.
      start_period: 300s
    volumes:
      - aimee-kb-home:/var/lib/aimee
      - aimee-server-workspaces:/var/lib/aimee-workspaces:ro

  # The server's store: PostgreSQL, holding every table the daemon keeps.
  #
  # A STOCK upstream image, deliberately. The kb builds its own PostgreSQL
  # because DB2 needs pgvector and pgvectorscale, and no published image carries
  # vectorscale -- which is why pointing DB2 at an external container went badly
  # before. The store has no such requirement: all 22 of its schema files
  # declare no extension at all, so it runs on what upstream ships and anyone
  # can support it without knowing anything about this project.
  #
  # A SEPARATE database from DB2, not a second one in the kb's cluster: the kb's
  # PostgreSQL listens on no TCP port and lives inside that container.
  #
  # UTF8 is pinned rather than inherited. The store bounds text with
  # octet_length, and in a SQL_ASCII database octet_length and char_length are
  # the same function -- so every byte-limit CHECK would pass whether or not it
  # held, and the schema would look enforced while enforcing nothing.
  aimee-store-db:
    restart: unless-stopped
    image: ${AIMEE_STORE_DB_IMAGE:-postgres:18}
    entrypoint: ["/opt/aimee/postgres-secure-entrypoint.sh"]
    environment:
      # Literal, not per-field knobs. AIMEE_STORE_URL below is the ONE override
      # that matters: an operator with their own PostgreSQL points it there and
      # this service goes unused. Per-field variables would have to be kept in
      # agreement with that DSN by hand, and a password that disagrees with the
      # URL fails as "the store is unreachable".
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${AIMEE_STORE_ADMIN_PASSWORD:?AIMEE_STORE_ADMIN_PASSWORD is required}
      AIMEE_STORE_MIGRATOR_PASSWORD: ${AIMEE_STORE_MIGRATOR_PASSWORD:?AIMEE_STORE_MIGRATOR_PASSWORD is required}
      AIMEE_STORE_RUNTIME_PASSWORD: ${AIMEE_STORE_RUNTIME_PASSWORD:?AIMEE_STORE_RUNTIME_PASSWORD is required}
      POSTGRES_DB: aimee_store
      # The LOCALE travels with the encoding. initdb refuses a UTF8 encoding
      # against a locale whose own encoding differs, and aborts before the
      # server ever starts -- which presents as the container exiting half a
      # second after `Started`, with no healthcheck having run and nothing in
      # the compose output to say why. C.UTF-8 is present in the image and
      # pins both halves of the pair.
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
      # PGDATA is stated rather than inherited, and points INSIDE the mount.
      # postgres:18 moved its default data directory out of
      # /var/lib/postgresql/data, so a compose file that mounts that path and
      # says nothing else is version-dependent in a way nothing announces.
      PGDATA: /var/lib/postgresql/data/pgdata
    # No published port: the store is reached only across this compose network,
    # by aimee-server. Publishing it would put the daemon's whole state on the
    # host interface for no deployment that needs it there.
    networks: [store]
    volumes:
      - aimee-store-db:/var/lib/postgresql/data
      - ../../scripts/postgres-secure-entrypoint.sh:/opt/aimee/postgres-secure-entrypoint.sh:ro
      - ../../scripts/postgres-store-init.sh:/docker-entrypoint-initdb.d/10-aimee-store-roles.sh:ro
      - aimee-store-tls:/var/lib/postgresql/secure
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "aimee_store"]
      interval: 2s
      timeout: 2s
      retries: 30
      # First boot runs initdb before the server answers. Without this, that
      # time is spent out of `retries` rather than before the count starts.
      start_period: 30s

  aimee-server:
    restart: unless-stopped
    image: ${AIMEE_SERVER_IMAGE:-ghcr.io/rakuensoftware/aimee-server:latest}
    ulimits:
      stack: 67108864
    environment:
      AIMEE_HOME: /var/lib/aimee
      # The store: a PostgreSQL DSN, read by the postgres module. This replaced
      # AIMEE_DB1_URL, which named a SQLite file for a C module that no longer
      # exists -- nothing had read it since the store became a Go module, so it
      # was telling operators the server kept a database it does not keep.
      AIMEE_STORE_URL: "host=aimee-store-db port=5432 dbname=aimee_store user=aimee_store_runtime password=${AIMEE_STORE_RUNTIME_PASSWORD:?AIMEE_STORE_RUNTIME_PASSWORD is required} sslmode=verify-full sslrootcert=/run/aimee-store-tls/server.crt"
      AIMEE_STORE_MIGRATION_URL: "host=aimee-store-db port=5432 dbname=aimee_store user=aimee_store_migrator password=${AIMEE_STORE_MIGRATOR_PASSWORD:?AIMEE_STORE_MIGRATOR_PASSWORD is required} sslmode=verify-full sslrootcert=/run/aimee-store-tls/server.crt"
      AIMEE_KB_API_URL: http://aimee-kb:8741
      AIMEE_SERVER_HTTP_BIND: "1"
      AIMEE_RUNTIME_WEB_ENABLED: ${AIMEE_RUNTIME_WEB_ENABLED:-1}
      # First-boot credentials are streamed into Vault before `up`; this
      # long-lived service environment is deliberately credential-free.
    ports:
      # 8740 (plaintext /v1) is loopback-only in the server; do NOT publish it.
      # Remote thin clients use the TLS /v1 on 8743 (https://, self-signed cert
      # auto-provisioned). 8443 is the webchat browser UI.
      - "8743:8743"
      - "8443:8443"
    depends_on:
      aimee-store-db:
        condition: service_healthy
      aimee-kb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL",
             "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8740/v1/health | grep -qE '^(200|401)$$'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [default, store]
    volumes:
      - aimee-server-home:/var/lib/aimee
      - aimee-store-tls:/run/aimee-store-tls:ro
      - aimee-server-workspaces:/var/lib/aimee-workspaces

volumes:
  aimee-store-db:
  aimee-store-tls:
  aimee-kb-home:
  aimee-server-home:
  aimee-server-workspaces:

networks:
  default:
  store:
    internal: true
