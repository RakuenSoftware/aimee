# GPU override for the aimee split stack. Layer on top of aimee.yaml:
#
#   docker compose -f deploy/compose/aimee.yaml -f deploy/compose/aimee.gpu.yaml up -d
#
# Runs the unified aimee-llm GPU tier (gemma synth offloaded via Vulkan/RADV) and
# passes the host AMD render path (/dev/dri) into the LLM container.
#
# The EMBEDDER IS UNCHANGED BY THIS OVERRIDE. Every tier serves
# nomic-embed-text-v2-moe at 768-dim, so the GPU tier no longer re-points the kb's
# embedding dim and switching a POPULATED kb between the CPU and GPU tier is NOT a
# re-embed — the vectors stay valid because the dimension and the model are the
# same. Only synth (and the reranker) change with the tier. This override
# deliberately sets no AIMEE_EMBEDDING_DIM: leaving it unset lets the kb derive the
# dim (pinned > recorded > probed), and pinning it would suppress that derivation.
services:
  aimee-llm:
    # Kept in sync with the base file's profile so `-f aimee.yaml -f aimee.gpu.yaml`
    # keeps aimee-llm gated on the `llm` profile.
    profiles: ["llm"]
    image: ${AIMEE_LLM_IMAGE:-ghcr.io/rakuensoftware/aimee-llm:latest}
    environment:
      AIMEE_LLM_NGL: ${AIMEE_LLM_NGL:-99}
      # GPU tier: pick the synth by AIMEE_LLM_TIER (small=12B / mid=26B-A4B SLOTS=2 /
      # large=26B-A4B SLOTS=4). small is the 16GB-safe default; the models download
      # to /models on first boot. EVERY tier — including cpu — shares the same
      # 768-dim nomic embedder, so the tier only selects synth/rerank.
      AIMEE_LLM_TIER: ${AIMEE_LLM_TIER:-small}
      # gemma-4-12b trains to 256K; the supervisor's default cap is a 16GB-safe 32K.
      # 128K is safe on the .254 card (RADV GFX1100 / 7900 XTX, 24560 MiB confirmed):
      # ~6.6GB Q4_K_M model + ~1.5GB embed/rerank + KV cache. gemma-4 uses
      # sliding-window attention (5 local layers windowed to 1024 : 1 global), so the
      # 128K KV is dominated by the few global layers (~2-3GB), not all-layers-x-128K —
      # well under 24GB. 256K would still fit with KV-cache quantization if ever needed.
      #
      # Tier picks (set AIMEE_LLM_TIER + AIMEE_LLM_SYNTH_CTX per card):
      #   small (16GB): TIER=small, CTX 131072   (1 × 128K)
      #   mid   (24GB): TIER=mid,   CTX 262144   (2 × 128K, SLOTS=2)
      #   large (32GB): TIER=large, CTX 1048576  (4 × 256K, SLOTS=4) — each of
      #     4 agents gets the full native 256K window; ~28.5GiB used, ~3.5GB headroom.
      AIMEE_LLM_SYNTH_CTX: ${AIMEE_LLM_SYNTH_CTX:-131072}
    devices:
      - "/dev/dri:/dev/dri"
