# aimee-kb — SmoothNAS compose-native plugin (split topology): the shared/vector
# KB (DB2 + pgvector) with PostgreSQL inside the KB image. The LLM is EXTERNAL —
# set AIMEE_LLM_URL to a synth endpoint
# (the kb embeds in-container). (A compose plugin has its own
# project network, so cross-plugin comms use host-published ports, not the runtime
# bridge the manifest used.) Migrated from aimee-kb.plugin.yaml.
name: aimee-kb
services:
  aimee-kb:
    restart: unless-stopped
    image: ${AIMEE_KB_IMAGE:-ghcr.io/rakuensoftware/aimee-kb:${AIMEE_IMAGE_TAG:-latest}}
    ulimits:
      stack: 67108864
    environment:
      AIMEE_HOME: /var/lib/aimee
      AIMEE_DB2_URL: ${AIMEE_DB2_URL:-}
      # Synth endpoint (OpenAI-compatible). The kb embeds in-container, so this is
      # only needed for the LLM-dependent passes.
      AIMEE_LLM_URL: ${AIMEE_LLM_URL:-}
      # Unset: the kb derives the dim (pinned > recorded > probed). Every tier
      # serves the same 768-dim embedder, so there is nothing tier-specific to pin.
      AIMEE_EMBEDDING_DIM: ${AIMEE_EMBEDDING_DIM:-}
      AIMEE_KB_HTTP_BIND: "1"
    command: ["--http-port=8741"]
    ports:
      - "8741:8741"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8741/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - aimee-kb-home:/var/lib/aimee
volumes:
  aimee-kb-home:
    x-smoothnas: { tier: aimee-data }
