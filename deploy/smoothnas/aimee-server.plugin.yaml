apiVersion: smoothnas.io/v1
kind: Plugin
metadata:
  name: aimee-server
  version: 0.2.57
  description: >-
    aimee server — the /v1 API (primary model, agent loop, memory, delegates).
    Uses the aimee-kb plugin for shared/vector features via AIMEE_KB_API_URL.
    Bundles the aimee-runtime-web browser UI (HTTPS :8443), a first-class surface
    that is ON by default; this deploy serves it on :8443. Set a login pair
    (AIMEE_WEBCHAT_USER/PASSWORD); it is sealed into Vault during first boot.
  vendor: RakuenSoftware
  homepage: https://github.com/RakuenSoftware/aimee
profiles:
  - default-limits
  - aimee-stack
  # Bind the host Docker socket so aimee-server can drive the daemon for the
  # DELEGATE SANDBOX: server-executed delegates always run their
  # build/test/verify tools in a --network none sibling container that carries
  # the project toolchain, instead of in aimee-server's toolchain-less runtime
  # image. SECURITY: this grants the plugin control of the host Docker daemon.
  - docker-socket
services:
  - name: server
    artifact:
      type: oci-image
      image: ghcr.io/rakuensoftware/aimee-server:latest
    container:
      restartPolicy: unless-stopped
    env:
      # Reach the aimee-kb plugin's host-exposed :8741 via the runtime bridge
      # gateway (stable host address from inside any plugin container).
      AIMEE_KB_API_URL: http://10.100.0.1:8741
      AIMEE_SERVER_HTTP_BIND: "1"
      # Refuse to start without a writable mount matching the kernel's
      # core_pattern. Native-plane crashes must leave evidence across restarts.
      AIMEE_REQUIRE_PERSISTENT_CORES: "1"
      # Exercise the kernel path as the server user before every start; a
      # missing mount, hostile hard rlimit, or ineffective core_pattern is fatal.
      AIMEE_CORE_SELFTEST: "1"
      # ---- Delegate sandbox (requires the docker-socket profile above) --------
      # Server-executed delegates always use a --network none Docker sandbox.
      # Map aimee-server's CONTAINER paths to the DAEMON's HOST paths so the
      # sibling sandbox bind-mounts the real worktree (docker-in-docker). These
      # are the SmoothNAS tier-bound bind sources for this plugin's `home` and
      # `workspaces` volumes; a future tierd could inject this automatically.
      AIMEE_SANDBOX_HOST_MOUNTS: "/var/lib/aimee=/mnt/media/.plugins/aimee-server/home,/var/lib/aimee-workspaces=/mnt/media/.plugins/aimee-server/workspaces"
      # The browser stays off until an operator streams the first login into the
      # server Vault with --bootstrap-vault-stdin. Plugin config is durable
      # deployment metadata and therefore may never carry a credential value.
    volumes:
      - name: home
        mode: tier-bound
        slot: HDD
        bind: /var/lib/aimee
      - name: workspaces
        mode: tier-bound
        slot: HDD
        bind: /var/lib/aimee-workspaces
      - name: cores
        mode: tier-bound
        slot: HDD
        bind: /mnt/media/cores
    ports:
      # Remote /v1 is served over native TLS on 8743 (https://). Plaintext 8740
      # is loopback-only in the server (it refuses a non-loopback plaintext bind),
      # so it is not host-exposed.
      - name: api
        port: 8743
        protocol: tcp
        expose: false
        hostExpose: true
      # webchat UI. The port is declared so the host can reach it once webchat is
      # enabled; nothing listens on it while AIMEE_RUNTIME_WEB_ENABLED=0 (a connection
      # to :8443 is simply refused until the UI is turned on).
      - name: webchat
        port: 8443
        protocol: tcp
        expose: false
        hostExpose: true
    config:
      # The server's self-signed /v1 TLS cert covers the container hostname +
      # localhost/loopback only. Thin clients that TOFU-pin (`aimee remote set`)
      # verify by exact-leaf match and do NOT need the dialed address in the
      # cert's SANs. Set the reachable address(es) here only for clients that
      # verify by name instead of pinning (e.g. generic HTTPS tooling).
      # Comma-separated; bare IPs/hosts are auto-typed (e.g. "192.168.1.254" or
      # "192.168.1.254,nas.lan"). No effect when an operator cert is supplied.
      - key: AIMEE_TLS_EXTRA_SAN
        type: string
        label: Extra TLS cert SAN(s)
        default: ""
        description: >-
          Additional Subject Alternative Names for the self-signed server cert —
          the deployment's reachable IP(s)/hostname(s) (comma-separated). Lets
          thin clients pin+verify over the LAN with no AIMEE_TLS_INSECURE.
      # Credential-shaped config fields are intentionally absent. Use the
      # documented stdin bootstrap against the installed container, then enable
      # the browser surface; the long-lived plugin metadata remains clean.
      - key: AIMEE_RUNTIME_WEB_ENABLED
        type: string
        label: Browser UI enabled
        default: "0"
        description: >-
          Keep 0 for installation. After streaming the first login into Vault,
          set to 1 and redeploy; this switch contains no credential material.
      # Optional: point the kb synthesis / curator passes at an OpenAI-compatible
      # endpoint. Blank = disabled.
      - key: SYNTHESIS_ENDPOINT
        type: string
        label: LLM endpoint (optional)
        default: ""
        description: Optional OpenAI-compatible endpoint for kb synthesis/curator.
      - key: SYNTHESIS_MODEL
        type: string
        label: LLM model (optional)
        default: ""
        description: Optional model name to request from the LLM endpoint.
