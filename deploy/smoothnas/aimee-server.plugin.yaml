apiVersion: smoothnas.io/v1
kind: Plugin
metadata:
  name: aimee-server
  version: 0.2.57
  description: >-
    aimee server — the /v1 API (primary model, agent loop, memory, delegates).
    Uses the aimee-kb plugin for shared/vector features via AIMEE_KB_API_URL.
    Bundles the aimee-webchat browser UI (HTTPS :8443), a first-class surface
    that is ON by default; this deploy serves it on :8443 — set a PAM login
    (AIMEE_WEBCHAT_USER/PASSWORD) so an operator can sign in.
  vendor: RakuenSoftware
  homepage: https://github.com/RakuenSoftware/aimee
profiles:
  - default-limits
  - aimee-stack
  # Bind the host Docker socket so aimee-server can drive the daemon for the
  # DELEGATE SANDBOX: with delegate_sandbox on (below), server-executed delegates
  # run their build/test/verify tools in a --network none sibling container that
  # carries the project toolchain, instead of in aimee-server's toolchain-less
  # runtime image. SECURITY: this grants the plugin control of the host Docker
  # daemon — remove it (and delegate_sandbox) if you do not want that.
  - docker-socket
services:
  - name: server
    artifact:
      type: oci-image
      image: ghcr.io/rakuensoftware/aimee-server:latest
    container:
      restartPolicy: unless-stopped
    env:
      # Reach the aimee-kb plugin's host-exposed :8741 via the runtime bridge
      # gateway (stable host address from inside any plugin container).
      AIMEE_KB_API_URL: http://10.100.0.1:8741
      AIMEE_SERVER_HTTP_BIND: "1"
      # ---- Delegate sandbox (needs the docker-socket profile above) -----------
      # Run server-executed delegates' tools in a --network none Docker sandbox.
      AIMEE_DELEGATE_SANDBOX: "1"
      # Map aimee-server's CONTAINER paths to the DAEMON's HOST paths so the
      # sibling sandbox bind-mounts the real worktree (docker-in-docker). These
      # are the SmoothNAS tier-bound bind sources for this plugin's `home` and
      # `workspaces` volumes; a future tierd could inject this automatically.
      AIMEE_SANDBOX_HOST_MOUNTS: "/var/lib/aimee=/mnt/media/.plugins/aimee-server/home,/var/lib/aimee-workspaces=/mnt/media/.plugins/aimee-server/workspaces"
      # ---- Browser webchat (aimee-webchat, HTTPS on :8443) --------------------
      # ON: the UI is a first-class surface and serves on :8443. Provide a PAM
      # login below so an operator can sign in — set USER + a REAL password via
      # the plugin's env override at deploy time (do NOT commit a real secret to
      # this file). Without USER/PASSWORD the login page serves but no one can
      # sign in. Set AIMEE_WEBCHAT_ENABLED=0 to opt this deploy out entirely.
      AIMEE_WEBCHAT_ENABLED: "1"
      # Webchat PAM login (USER + PASSWORD) is provided at deploy time via the
      # plugin config block below — never committed here.
    volumes:
      - name: home
        mode: tier-bound
        slot: HDD
        bind: /var/lib/aimee
      - name: workspaces
        mode: tier-bound
        slot: HDD
        bind: /var/lib/aimee-workspaces
    ports:
      # Remote /v1 is served over native TLS on 8743 (https://). Plaintext 8740
      # is loopback-only in the server (it refuses a non-loopback plaintext bind),
      # so it is not host-exposed.
      - name: api
        port: 8743
        protocol: tcp
        expose: false
        hostExpose: true
      # webchat UI. The port is declared so the host can reach it once webchat is
      # enabled; nothing listens on it while AIMEE_WEBCHAT_ENABLED=0 (a connection
      # to :8443 is simply refused until the UI is turned on).
      - name: webchat
        port: 8443
        protocol: tcp
        expose: false
        hostExpose: true
    config:
      # The server's self-signed /v1 TLS cert covers the container hostname +
      # localhost/loopback only. Thin clients that TOFU-pin (`aimee remote set`)
      # verify by exact-leaf match and do NOT need the dialed address in the
      # cert's SANs. Set the reachable address(es) here only for clients that
      # verify by name instead of pinning (e.g. generic HTTPS tooling).
      # Comma-separated; bare IPs/hosts are auto-typed (e.g. "192.168.1.254" or
      # "192.168.1.254,nas.lan"). No effect when an operator cert is supplied.
      - key: AIMEE_TLS_EXTRA_SAN
        type: string
        label: Extra TLS cert SAN(s)
        default: ""
        description: >-
          Additional Subject Alternative Names for the self-signed server cert —
          the deployment's reachable IP(s)/hostname(s) (comma-separated). Lets
          thin clients pin+verify over the LAN with no AIMEE_TLS_INSECURE.
      # Operator-set at deploy time (kept out of git). The webchat browser UI
      # authenticates via PAM against this user/password; set BOTH to enable
      # sign-in. Leave blank to serve the login page with no account.
      - key: AIMEE_WEBCHAT_USER
        type: string
        label: Webchat login user
        default: ""
        description: PAM login username for the browser UI (set with a password).
      - key: AIMEE_WEBCHAT_PASSWORD
        type: string
        label: Webchat login password
        default: ""
        secret: true
        description: PAM login password for the browser UI (set alongside the user).
      # Optional: additional persistent browser logins beyond the primary above.
      # Comma- and/or newline-separated "user:password" entries (only the first
      # ':' splits, so a password may contain ':' but not a comma/newline). Each
      # is provisioned on every start, so extra accounts survive a plugin update.
      - key: AIMEE_WEBCHAT_USERS
        type: string
        label: Additional webchat logins
        default: ""
        secret: true
        description: 'Extra PAM logins as "user:password" entries, comma-separated (e.g. admin:s3cret,laura:pw).'
      # Optional: point the kb synthesis / curator passes at an OpenAI-compatible
      # endpoint. Blank = disabled.
      - key: LLM_ENDPOINT
        type: string
        label: LLM endpoint (optional)
        default: ""
        description: Optional OpenAI-compatible endpoint for kb synthesis/curator.
      - key: LLM_MODEL
        type: string
        label: LLM model (optional)
        default: ""
        description: Optional model name to request from the LLM endpoint.
