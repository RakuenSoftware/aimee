# aimee-kb — the shared/vector knowledge base (DB2 + pgvector), standalone.
#
# This is the kb half of the split deployment: the aimee-server plugin reaches
# it over the runtime bridge at AIMEE_KB_API_URL=http://10.100.0.1:8741, and it
# in turn embeds IN-CONTAINER from weights baked into its image
# container — NOT a bundled torch embedder. The kb image already defaults to
# `--http-port=8741` (Dockerfile CMD) + EXPOSE 8741, so no command override is
# needed; AIMEE_KB_HTTP_BIND=1 makes it bind 0.0.0.0 so the published port is
# reachable across the bridge.
#
# Embedder wiring (the point of this manifest): EMBEDDER_URL points at the
# aimee-llm gateway at http://10.100.0.1:8742 (the GPU 7900 XTX tier on .254 —
# nomic-embed-text-v2-moe, 768-dim, the same embedder every tier serves). The
# gateway preserves the /embed + /embed_batch contract, so the baked
# embed-remote.py / in-process http embedder is
# untouched. The kb sends NO bearer on the embed path (memory_embed_http_post
# passes a NULL auth header), so the aimee-llm gateway MUST run with auth
# disabled (SYNTHESIS_API_KEY empty) on the internal-only bridge — which is
# the gateway's documented "deployment network is the boundary" posture
# (expose:false, bridge-only).
#
# Images:
#   ghcr.io/rakuensoftware/aimee-kb     (kb /v1 on :8741)
# PostgreSQL 18 + pgvector are bundled in the aimee-kb image and persist under
# the KB home volume; no database sibling service is required.
apiVersion: smoothnas.io/v1
kind: Plugin
metadata:
  name: aimee-kb
  version: 0.2.57
  description: >-
    aimee knowledge base — DB2 + pgvector shared/vector memory, served on /v1
    (:8741). Bundles its own pgvector Postgres; embeds against the
    embedder baked into its own image,
    not a torch embedder. The aimee-server plugin points AIMEE_KB_API_URL here.
  vendor: RakuenSoftware
  homepage: https://github.com/RakuenSoftware/aimee
profiles:
  - default-limits
  # aimee-stack = the 64 MB worker-thread stack rlimit. The kb entrypoint also
  # raises it best-effort (ulimit -s), but keep the profile as belt-and-suspenders
  # for runtimes that forbid an in-container raise.
  - aimee-stack
services:
  - name: kb
    artifact:
      type: oci-image
      image: ghcr.io/rakuensoftware/aimee-kb:latest
    container:
      restartPolicy: unless-stopped
    env:
      # Synth endpoint (the kb embeds in-container). Point it at a container that
      # embedding (/embed) AND synthesis (curator Tier-A + Tier-B, at {url}/v1).
      # The kb runs NO model itself — this is just the URL it calls. 10.100.0.1:8742
      # is the GPU aimee-llm on the runtime bridge here.
      #   - Pin only the embedder elsewhere with EMBEDDER_URL (it takes
      #     precedence over SYNTHESIS_ENDPOINT).
      #   - The gateway runs auth-off (empty SYNTHESIS_API_KEY) — the kb embed
      #     path sends no bearer.
      SYNTHESIS_ENDPOINT: http://10.100.0.1:8742
      # Embedding dim is deliberately UNSET: the kb derives it from the selected
      # 768-dim nomic embedder, so there is nothing tier-specific to pin, and an
      # empty value lets the kb derive the dim (pinned > recorded > probed). A kb
      # populated before the nomic cutover keeps its RECORDED dim and is migrated
      # deliberately with `aimee kb reembed`, not by editing this value.
      EMBEDDER_DIMS: ""
      # Bind /v1 on 0.0.0.0 so the published :8741 is reachable from the
      # aimee-server plugin across the bridge.
      AIMEE_KB_HTTP_BIND: "1"
      # The curator synth sidecar (curator-extract.py) used to need its own
      # LLM_ENDPOINT here, carrying the /v1 suffix, alongside the base URL above.
      # Both are SYNTHESIS_ENDPOINT now and it is declared ONCE, as the BASE url:
      # every consumer appends /v1 itself. Two spellings for one endpoint is what
      # let the kb and its sidecar disagree about where synthesis lives.
      SYNTHESIS_MODEL: aimee-synth
    volumes:
      - name: home
        mode: tier-bound
        slot: HDD
        bind: /var/lib/aimee
    ports:
      # kb /v1 — reached by the aimee-server plugin at http://10.100.0.1:8741.
      # Not exposed off-host.
      - name: api
        port: 8741
        protocol: tcp
        expose: false
        hostExpose: true
    health:
      test: ["CMD-SHELL", "body=$$(curl -fsS http://127.0.0.1:8741/v1/health) && printf '%s' \"$$body\" | grep -q '\"status\":\"ok\"' && printf '%s' \"$$body\" | grep -q '\"db2_ok\":true' && printf '%s' \"$$body\" | grep -q '\"db2_kb_tables_ok\":true'"]
      interval: 30s
      timeout: 5s
      retries: 3
      startPeriod: 30s
    config:
      - key: SYNTHESIS_ENDPOINT
        type: string
        label: LLM container URL (embed + synth)
        default: http://10.100.0.1:8742
        description: >-
          The endpoint the kb calls for synthesis
          and synthesis (Tier-A + Tier-B). CPU tier = Tier-A synth;
          GPU tier = Tier-A+B synth. Both serve the SAME 768-dim embedder, so the
          tier does not change the embedding dimension. Must run auth-off (the kb
          sends no bearer).
      - key: EMBEDDER_URL
        type: string
        label: Embedder URL (override)
        default: ""
        description: >-
          Optional. Pin the embedder (/embed) at a specific endpoint, overriding
          SYNTHESIS_ENDPOINT for embedding only.
      - key: EMBEDDER_DIMS
        type: string
        label: Embedding dimension
        default: ""
        description: >-
          Embedding vector dim. LEAVE BLANK — the kb then derives it (a populated
          kb uses its recorded dim; a fresh one probes the running embedder, which
          reports 768 for the default nomic embedder on every tier). Setting a
          value pins it and suppresses that derivation. Changing it against a
          populated kb forces a re-embed.
