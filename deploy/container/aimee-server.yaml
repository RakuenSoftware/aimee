# Default aimee-server container configuration (baked into the image at
# $AIMEE_HOME/aimee.yaml).
#
# Enables the server's inbound /v1 HTTP API. The listener binds only when BOTH a
# port and a bearer token are configured (src/server/server_http.c). The image
# sets AIMEE_SERVER_HTTP_BIND=1 so the TLS listener binds 0.0.0.0 (the published
# container port); the bearer below is still required on every request.
#
# Plaintext /v1 (http_port) is LOOPBACK-ONLY by design — the server refuses to
# bind it on a non-loopback interface so the bearer + credentials can never cross
# the wire in cleartext. Remote thin clients MUST use the TLS listener (tls_port);
# the server auto-provisions a self-signed cert at $AIMEE_HOME/tls/server.{crt,key}
# on first start. Mount your own cert there to override.
#
# This token is a development default — override it for any real deployment by
# mounting your own aimee.yaml over /var/lib/aimee/aimee.yaml.
aimee:
  api:
    http_port: 8740
    tls_port: 8743
    bearer_token: "aimee-local-dev"
    rate_limit_per_min: 0
    # This image binds the TLS /v1 on 0.0.0.0 so a thin client drives it remotely,
    # including delegates/roundtables/tools — which require remote_writes="full".
    # The image also forces this via AIMEE_API_REMOTE_WRITES (Dockerfile.server) so
    # it survives a fresh redeploy that reseeds this file. Trusted networks only
    # (ships a known dev bearer); for any exposed deployment set your own bearer +
    # TLS and lower this:
    #   remote_writes: data   # data writes (memory/work/rules/skill), cap-gated
    #   remote_writes: "off"  # TCP bearer is read/query/chat only
    remote_writes: "full"

    # remote_writes controls what a TCP bearer may do over the published port:
    #   off    read/query/chat only (mutations are local-UDS-only)
    #   data   + data writes (memory/work/rules/skill), capability-gated
    #   full   + delegate/tool/roundtable (CAPS_ALL)
    # Default `full` so the thin-client model works out of the box: a remote
    # `aimee` client driving this server can run delegates and the roundtable
    # without extra setup. The bearer token above is the trust boundary, so
    # OVERRIDE IT (and front with TLS) for any deployment exposed beyond a
# Delegate roundtable / MoA ensemble, on by default. The panel is the seeded
# agents.json roster; a thin client pushes the per-agent API keys per session
# (no keys are baked in), so the roundtable works once a client has connected.
ensemble:
  enabled: true
  # No reference_models pinned: the panel is built DYNAMICALLY from the enabled +
  # currently-available delegates (auto-seeded, then unkeyed/unhealthy ones are
  # dropped). Pin a list here (or via a workflow) only to override that default.

