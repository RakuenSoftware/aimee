# Default aimee-server container configuration (baked into the image at
# $AIMEE_HOME/aimee.yaml).
#
# Enables the server's inbound /v1 HTTP API. The listener binds only when BOTH a
# port and a bearer token are configured (src/server/server_http.c). The image
# sets AIMEE_SERVER_HTTP_BIND=1 so the TLS listener binds 0.0.0.0 (the published
# container port); a Vault-held bearer is still required on every request.
#
# Plaintext /v1 (http_port) is LOOPBACK-ONLY by design — the server refuses to
# bind it on a non-loopback interface so the bearer + credentials can never cross
# the wire in cleartext. Remote thin clients MUST use the TLS listener (tls_port);
# the server writes only the self-signed public cert at
# $AIMEE_HOME/tls/server.crt and seals its private key in Vault. The API primary
# is likewise minted directly into Vault unless AIMEE_API_BEARER_TOKEN supplies
# an operator-known first-boot value.
aimee:
  api:
    http_port: 8740
    tls_port: 8743
    # Request client certificates during first-run enrollment.  The durable
    # roster starts empty, so bearer setup still works; after every enrolled
    # certificate has been presented the server atomically promotes this lane
    # to required mTLS.  Starting with mTLS disabled would make the wizard's
    # certificate enrollment inert until an undocumented server restart.
    mtls: optional
    rate_limit_per_min: 0
    # Compatibility field only: it no longer authorizes any caller. The wizard
    # binds the first user's explicit full grant to mTLS; additional users use
    # authority-managed grants. Keep this off to avoid a misleading legacy
    # warning and `remote_writes.global_ignored` diagnostics.
    remote_writes: "off"
# Delegate roundtable / MoA ensemble, on by default. The onboarding wizard creates
# the initial agents.json roster; provider credentials live in the server-owned
# encrypted vault (no keys are baked into the image or sent by a thin client per
# session).
ensemble:
  enabled: true
  # No reference_models pinned: the panel is built dynamically from the enabled,
  # currently-available agents the operator configured. Pin a list here (or via a
  # workflow) only to override that default.

# The image ships one canonical preset. Naming it explicitly makes the API/UI
# mark it as the default instead of relying on the resolver's implicit fallback.
roundtable:
  default: default
