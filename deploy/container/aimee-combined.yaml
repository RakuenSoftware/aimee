# Default aimee-combined (server + kb) container configuration.
#
# In the combined image the server and the kb share AIMEE_HOME, and both read
# their config from $AIMEE_HOME/aimee.yaml (config_default_dir() == aimee_home()
# == $AIMEE_HOME). So a single merged file must carry BOTH the server's /v1
# listener settings AND the kb's sidecar-command selection — otherwise whichever
# one isn't in aimee.yaml is silently lost (the kb's embedding_command landing in
# a never-read .config/aimee/aimee.yaml is how embeddings ended up disabled).
#
# Endpoints come from the environment (AIMEE_EMBEDDER_URL / LLM_ENDPOINT). The
# entrypoint seeds this file into $AIMEE_HOME on first start, so it survives a
# bind-mounted (empty) volume — see deploy/container/combined-entrypoint.sh.

# --- server: inbound /v1 HTTP API (binds only with port + bearer set) ---
aimee:
  api:
    # Plaintext /v1 is LOOPBACK-ONLY by design: the server refuses to bind it on a
    # non-loopback interface (the bearer + credentials would cross the wire in
    # cleartext). Remote thin clients MUST use the TLS listener below.
    http_port: 8740
    # Native-TLS /v1 for remote access (0.0.0.0 when AIMEE_SERVER_HTTP_BIND=1). The
    # server auto-provisions a self-signed cert at $AIMEE_HOME/tls/server.{crt,key}
    # on first start if none exists; supply your own cert there to override. Thin
    # clients connect with `https://host:8743` (AIMEE_TLS_INSECURE=1 for the
    # self-signed cert, or pin it).
    tls_port: 8743
    bearer_token: "aimee-local-dev"
    rate_limit_per_min: 0
    # This combined all-in-one binds the TLS /v1 on 0.0.0.0 so a thin client drives
    # it remotely, including delegates/roundtables/tools — which require
    # remote_writes="full". The image also forces this via AIMEE_API_REMOTE_WRITES
    # (Dockerfile.combined) so it survives a fresh redeploy that reseeds this file.
    # Trusted networks only (this ships a known dev bearer); for any exposed
    # deployment set your own bearer + TLS and lower this:
    #   remote_writes: data   # data writes (memory/work/rules/skill), cap-gated
    #   remote_writes: "off"  # TCP bearer is read/query/chat only
    remote_writes: "full"

# Delegate roundtable / MoA ensemble, on by default with the seeded agents.json
# roster as the panel; a thin client pushes the per-agent keys per session.
ensemble:
  enabled: true
  # No reference_models pinned: the panel is built DYNAMICALLY from the enabled +
  # currently-available delegates (auto-seeded, then unkeyed/unhealthy ones are
  # dropped). Pin a list here (or via a workflow) only to override that default.

# --- kb: real semantic embeddings via the persistent embedder service ---
# No embedding_command here on purpose: when it is unset the server embeds
# in-process against $AIMEE_EMBEDDER_URL (Dockerfile.combined / compose set it to
# the embedder service), speaking http:// directly -- no fork, no python. Leaving
# it out of the seed means a config reseed can never revert embeddings to the old
# forking script. Set it explicitly only to override (e.g. "builtin" for a
# no-embedder setup, or a custom command).

learning:
  synthesize:
    enabled: false
    command: "python3 /opt/aimee/scripts/learning-synthesize.py"

kb:
  curator:
    extract_command: "python3 /opt/aimee/scripts/curator-extract.py"
