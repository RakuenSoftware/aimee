# Default aimee-kb container configuration (baked into the image at
# $AIMEE_HOME/aimee.yaml).
#
# NO EMBEDDER IS PRE-SELECTED, deliberately.
#
# The bundled model (bekko-a25m) is baked into this image but not loaded until something
# selects it: the setup wizard writes `embedding_model` for the bundled embedder, or
# `embedding_endpoint` for an external one, and `aimee config deploy-env` passes that to
# the container as EMBEDDER_MODEL / AIMEE_EMBEDDER_URL. Pre-selecting here would spend
# half a gigabyte of resident model on every container that was never told to use it,
# including one whose operator is about to choose an external GPU embedder.
#
# With nothing selected the kb uses its builtin lexical embedder — no model, no port, no
# half-configured state. Selecting one later re-embeds, which the recorded serving
# identity enforces.
#
# Synthesis resolves an external endpoint (AIMEE_LLM_URL / LLM_ENDPOINT); LLM-dependent
# passes fail closed if that is unavailable. Retrieval does not depend on it.

learning:
  synthesize:
    enabled: false
    command: "python3 /opt/aimee/scripts/learning-synthesize.py"

kb:
  curator:
    extract_command: "python3 /opt/aimee/scripts/curator-extract.py"
