# Default aimee-kb container configuration (baked into the image at
# $AIMEE_HOME/aimee.yaml).
#
# The entrypoint resolves the unified AIMEE_LLM_URL endpoint for embedding,
# reranking, and synthesis. This file selects the bundled sidecar commands.
#
# Embedding works out of the box through the `aimee-llm` gateway. LLM-dependent
# passes fail closed (their operations are marked failed) if that endpoint is
# unavailable.

# Real semantic embeddings via the unified inference gateway.
embedding_command: "python3 /opt/aimee/scripts/embed-remote.py"

learning:
  synthesize:
    enabled: false
    command: "python3 /opt/aimee/scripts/learning-synthesize.py"

kb:
  curator:
    extract_command: "python3 /opt/aimee/scripts/curator-extract.py"
