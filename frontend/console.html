<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>aimee-kb console</title>
    <!-- Same pre-paint theme application as index.html: the console is a second
         entry point with its own HTML, so it needs its own copy or an explicit
         light/dark choice made in the main app would flash the wrong palette
         here. Mirrors themePreloadScript() in @rakuensoftware/smoothgui. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('sg-theme');
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
    <style>
      html, body { background: var(--sg-bg); color: var(--sg-text); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/console/main.tsx"></script>
  </body>
</html>
