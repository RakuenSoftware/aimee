# Self-deploying aimee-server (server-orchestrated deploy).
#
# You deploy ONE container — aimee-server — and drive the rest from the browser.
# It runs with the host Docker socket mounted, so when the setup wizard finishes it
# brings up the managed sibling service (aimee-kb) itself,
# via `docker compose up -d` on deploy/container/aimee-managed.compose.yaml (baked
# into the image). No second compose command, no combined image.
#
#   docker compose -f compose.server-managed.yaml up -d
#   # then open https://localhost:8443 and run the setup wizard → "Deploy"
#
# The wizard's Deploy result contains the first user's enrollment command. It
# creates a client key locally, enrolls mTLS, and binds an explicit full grant:
#   aimee remote set https://localhost:8743 <wizard-bearer>
#
# SECURITY: mounting /var/run/docker.sock grants aimee-server control of the host
# Docker daemon (root-equivalent). Only use this on a host you trust the server on.
# The published image has AIMEE_DEPLOY_ENABLED unset — orchestration is off until
# this file turns it on together with the socket mount.

# The managed sibling compose references this stack's volumes by their canonical
# aimee_* names. Pinning the project in the manifest is essential: setting
# COMPOSE_PROJECT_NAME inside the server container does not affect the host-side
# `docker compose up` that creates this first container.
name: aimee

# Shared network the server + every managed service join, so they resolve each
# other by name (aimee-kb:8741). The managed compose
# references this as `external` — it must exist, so define it here with a fixed name.
networks:
  aimee:
    name: aimee

services:
  aimee-server:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.server
    image: ${AIMEE_SERVER_IMAGE:-ghcr.io/rakuensoftware/aimee-server:${AIMEE_IMAGE_TAG:-latest}}
    networks: [aimee]
    ulimits:
      stack: 67108864
    environment:
      AIMEE_HOME: /var/lib/aimee
      AIMEE_DB1_URL: sqlite:///var/lib/aimee/aimee.db
      AIMEE_SERVER_HTTP_BIND: "1"
      # Reachable address(es) to place in the self-signed cert's SANs, for clients
      # that verify by NAME rather than TOFU-pinning the leaf (generic HTTPS
      # tooling: curl, browsers, probes). Empty keeps the default container
      # hostname + loopback set. pki.c reads this from the process environment, so
      # without this passthrough the documented knob reaches the binary from
      # nowhere and setting it appears to do nothing.
      #
      # It also pins the cert's CN (pki_resolve_server_cn), which is what keeps a
      # self-signed cert STABLE across container recreates — so set it before first
      # start. Changing it later does not re-issue an existing cert (one is minted
      # only when absent), and forcing a re-issue breaks every TOFU-pinned client.
      AIMEE_TLS_EXTRA_SAN: ${AIMEE_TLS_EXTRA_SAN:-}
      # Browser webchat (the wizard lives here). Credentials are streamed into
      # Vault by scripts/aimee-compose-vault-bootstrap.sh before `up`; never add
      # them to this long-lived service's persistent container environment.
      AIMEE_RUNTIME_WEB_ENABLED: ${AIMEE_RUNTIME_WEB_ENABLED:-1}
      # Optional modules the operator can start (optional-modules-lib.sh). The
      # entrypoint reads these from the PROCESS environment, so a var that is not
      # forwarded here cannot be set at all — the documented knob reaches the
      # binary from nowhere and setting it appears to do nothing.
      #
      # Empty default means "keep the image default", which for both of these is
      # off, so adding them changes no existing deployment.
      AIMEE_MODULE_ECONOMIZER: ${AIMEE_MODULE_ECONOMIZER:-}
      AIMEE_MODULE_ROUNDTABLE: ${AIMEE_MODULE_ROUNDTABLE:-}
      # Reach the managed kb by name on the shared network once it is up.
      AIMEE_KB_API_URL: http://aimee-kb:8741
      # Per-user remote-write identity. These stay empty on a read-only install,
      # but MUST be passed through so a provisioned deployment can opt in without
      # editing this manifest. The trust bundle is mounted read-only below.
      AIMEE_SERVER_ID: ${AIMEE_SERVER_ID:-}
      AIMEE_SERVER_TEAM_ID: ${AIMEE_SERVER_TEAM_ID:-}
      AIMEE_SERVER_MGMT_JWKS_TRUST_BUNDLE: ${AIMEE_SERVER_MGMT_JWKS_TRUST_BUNDLE:-/run/aimee/managed-trust/jwks-trust-bundle.json}
      # An explicit server -> KB enrollment string is a one-time credential and
      # uses the disposable Vault bootstrap stream, never this environment.
      # Turn on server-orchestrated deploy: the wizard's "Deploy" runs the managed
      # compose against the socket below. COMPOSE_PROJECT_NAME pins the project so
      # `up` and `ps` (status polling) agree on it.
      AIMEE_DEPLOY_ENABLED: "1"
      AIMEE_DEPLOY_COMPOSE_FILE: /opt/aimee/deploy/aimee-managed.compose.yaml
      COMPOSE_PROJECT_NAME: aimee
      # The image channel for the WHOLE stack, in one knob: AIMEE_IMAGE_TAG=testing
      # runs a tested-but-unreleased build without hand-setting an image variable
      # per service. It is forwarded into the server's own environment because the
      # server re-runs compose for the managed services (deploy_apply.c copies
      # environ), so the tag has to survive that hop or the wizard's Deploy would
      # silently fall back to :latest for the kb while the server itself ran
      # :testing — a split-version stack, which is how a kb with no `dim` in
      # /health got paired with a server that expected one.
      AIMEE_IMAGE_TAG: ${AIMEE_IMAGE_TAG:-latest}
      # FORWARDED ONLY WHEN THE OPERATOR PINNED ONE. Resolving the default here
      # instead — as this did — quietly disabled the wizard's embedder choice.
      #
      # AIMEE_KB_VARIANT is decided INSIDE the server, by config_emit_deploy_env,
      # from the saved wizard configuration. It is unset in the shell that brings
      # THIS file up, so resolving the default here collapsed to a bare
      # `aimee-kb:<tag>` and baked that into the server's environment. deploy_apply
      # copies environ, so the explicit AIMEE_KB_IMAGE then won over the variant the
      # server had just computed, in the managed compose's own
      # ${AIMEE_KB_IMAGE:-...aimee-kb${AIMEE_KB_VARIANT:+-...}} default.
      #
      # The result was silent and total: selecting bekko-a25m deployed the
      # embedderless image, which logs "'bekko-a25m' selected but this image has no
      # bundled embedder" and serves lexical-only search. Every gate passed --
      # the deploy exits 0, the kb is healthy, `kb smoke` reports "vector store
      # ready" -- because nothing here is broken except which image was chosen.
      #
      # Empty is correct for the unpinned case: the managed compose uses `:-`, which
      # treats an empty value as absent and falls through to its own variant-aware
      # default.
      AIMEE_KB_IMAGE: ${AIMEE_KB_IMAGE:-}
      # Separate one-shot image containing the offline root provisioner and JWKS
      # publisher. These binaries never enter the ordinary KB/server images.
      AIMEE_AUTHORITY_BOOTSTRAP_IMAGE: ${AIMEE_AUTHORITY_BOOTSTRAP_IMAGE:-ghcr.io/rakuensoftware/aimee-authority-bootstrap:${AIMEE_IMAGE_TAG:-latest}}
      # A remote model credential, when needed, uses the same disposable Vault
      # bootstrap stream before this long-lived container is created.
      # "Sign in with OAuth" client IDs (public; see oauth_defaults.h). Set the
      # GitHub client ID + secret for the seamless "click → GitHub → back, logged
      # in" web flow (register the OAuth App's callback URL as
      # <this-origin>/api/git/oauth/github/callback). Omit the secret to fall back
      # to the device-code flow. AIMEE_OAUTH_REDIRECT_BASE overrides the callback
      # origin behind a reverse proxy (e.g. https://aimee.example.com).
      AIMEE_GITHUB_OAUTH_CLIENT_ID: ${AIMEE_GITHUB_OAUTH_CLIENT_ID:-}
      AIMEE_GITLAB_OAUTH_CLIENT_ID: ${AIMEE_GITLAB_OAUTH_CLIENT_ID:-}
      AIMEE_OAUTH_REDIRECT_BASE: ${AIMEE_OAUTH_REDIRECT_BASE:-}
    ports:
      - "8743:8743"
      - "8443:8443"
    volumes:
      - aimee-server-home:/var/lib/aimee
      - aimee-server-workspaces:/var/lib/aimee-workspaces
      # Public verification roots, not a private key. Files in this directory
      # must be root-owned and not group/world-writable; 0644 lets the UID 1000
      # server read them while this read-only mount prevents container writes.
      - ${AIMEE_SERVER_MANAGEMENT_DIR:-./server-management}:/run/aimee/management:ro
      # Wizard-generated public verification roots. Only the one-shot authority
      # bootstrap mounts this volume writable; the server can never replace it.
      - aimee-managed-jwks-trust:/run/aimee/managed-trust:ro
      # The host Docker socket — lets aimee-server launch the managed services.
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL",
             "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8740/v1/health | grep -qE '^(200|401)$$'"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  aimee-server-home:
  aimee-server-workspaces:
  aimee-managed-jwks-trust:
