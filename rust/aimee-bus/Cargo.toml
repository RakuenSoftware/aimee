[package]
name = "aimee-bus"
version = "0.1.0"
description = "Rust reference client and module-process runtime for the Aimee event bus"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Deliberately one dependency. The client must not link, import, or generate
# from the C or Go reference implementations: `scripts/check_bus_single_host.sh`
# rejects a build script or any further dependency.
[dependencies]
libc = "0.2"

[lints]
workspace = true

[[bin]]
name = "aimee-bus-module-helper"
path = "src/bin/aimee-bus-module-helper.rs"

[[bin]]
name = "aimee-bus-module-caller-check"
path = "src/bin/aimee-bus-module-caller-check.rs"
