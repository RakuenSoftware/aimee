        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRejectRequest"
      responses:
        "200":
          description: Document rejected
        "400":
          description: Invalid id
        "401":
          description: Unauthorized
        "404":
          description: Document not found

