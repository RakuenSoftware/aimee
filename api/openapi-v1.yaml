  /code/structure:
    get:
      operationId: getCodeStructure
      summary: Definitions for a file in the canonical code index
      parameters:
        - name: project
          in: query
          required: true
          schema:
            type: string
        - name: file_path
          in: query
          required: true
          schema:
            type: string
        - name: max_results
          in: query
          schema:
            type: integer
            default: 256
      responses:
        "200":
          description: File definitions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeStructureResponse"
        "400":
          description: Missing required parameters
        "401":
          description: Unauthorized
        "503":
          description: Canonical index unavailable

  /code/project-stats:
    get:
      operationId: getCodeProjectStats
      summary: Project-level canonical code index counts and language breakdown
      parameters:
        - name: project
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project index statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeProjectStatsResponse"
        "400":
          description: Missing required parameters
        "401":
          description: Unauthorized
        "503":
          description: Canonical index unavailable

  /code/cross-repo-deps:
    get:
      operationId: getCodeCrossRepoDeps
      summary: >-
        Cross-repo dependency edges for a project (confidence-tiered, with
        evidence + version stamp), or the AMBIGUOUS review queue when
        status=ambiguous
      parameters:
        - name: project
          in: query
          required: true
          schema:
            type: string
        - name: direction
          in: query
          required: false
          description: >-
            Dependency direction: "out" = deps OF the project (default), "in" =
            repos that depend ON the project (reverse), "both" = union. Ignored
            when status=ambiguous.
          schema:
            type: string
            enum: [out, in, both]
            default: out
        - name: min_tier
          in: query
          required: false
          description: Minimum confidence tier to emit. Ignored when status=ambiguous.
          schema:
            type: string
            enum: [high, medium, tentative]
            default: medium
        - name: status
          in: query
          required: false
          description: >-
            When "ambiguous", returns the AMBIGUOUS review queue for the project
            instead of edges (direction/min_tier are not applied in that mode).
          schema:
            type: string
            enum: [ambiguous]
        - name: dry_run
          in: query
          required: false
          description: >-
            Offline candidate inspection: emit every confidence band (down to LOW,
            overriding min_tier) plus the AMBIGUOUS candidates inline, and write
            nothing (no review-queue rows). The response carries dry_run:true and an
            additional `ambiguous` array alongside `deps`.
          schema:
            type: string
            enum: ["1", "true"]
      responses:
        "200":
          description: Cross-repo dependency edges (or ambiguous review queue)
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Missing required parameters
        "401":
          description: Unauthorized
        "413":
          description: Response too large; narrow the query
        "503":
          description: Canonical index unavailable

  /code/scan:
    post:
      operationId: postCodeScan
      summary: Request a canonical code index scan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeScanRequest"
      responses:
        "202":
          description: Scan accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeScanResponse"
        "401":
          description: Unauthorized
        "405":
          description: Method not allowed

  /code/repo-trust:
    post:
      operationId: postCodeRepoTrust
      summary: Set a registered repo's cross-repo trust (owner credential only)
      description: >-
        Transactionally sets projects.trust, bumps cross_repo_meta.trust_epoch on
        a real transition, audits the change to cross_repo_trust_audit, and (on a
        change) recomputes the blocked_symbols frequency model. A scoped token is
        rejected with 403; the project must already exist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project, trust]
              properties:
                project: { type: string }
                trust: { type: string, enum: [trusted, untrusted] }
                actor: { type: string }
                request_id: { type: string }
      responses:
        "200":
          description: Trust applied (status, project, prior_trust, new_trust, changed)
          content:
            application/json:
              schema: { type: object }
        "400":
          description: Missing project or invalid trust value
        "403":
          description: Forbidden (requires the owner credential)
        "404":
          description: No such project
        "405":
          description: Method not allowed
        "503":
          description: Knowledge service store unavailable

