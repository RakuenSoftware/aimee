      summary: Call sites for a symbol in the canonical code index
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
        - name: project
          in: query
          schema:
            type: string
        - name: max_results
          in: query
          schema:
            type: integer
