  /code/cross-repo-deps:
    get:
      operationId: getCodeCrossRepoDeps
      summary: >-
        Cross-repo dependency edges for a project (confidence-tiered, with
        evidence + version stamp), or the AMBIGUOUS review queue when
        status=ambiguous
      parameters:
        - name: project
          in: query
          required: true
          schema:
            type: string
        - name: direction
          in: query
          required: false
          description: >-
            Dependency direction: "out" = deps OF the project (default), "in" =
            repos that depend ON the project (reverse), "both" = union. Ignored
            when status=ambiguous.
          schema:
            type: string
            enum: [out, in, both]
            default: out
        - name: min_tier
          in: query
          required: false
          description: Minimum confidence tier to emit. Ignored when status=ambiguous.
          schema:
            type: string
            enum: [high, medium, tentative]
            default: medium
        - name: status
          in: query
          required: false
          description: >-
            When "ambiguous", returns the AMBIGUOUS review queue for the project
            instead of edges (direction/min_tier are not applied in that mode).
          schema:
            type: string
            enum: [ambiguous]
        - name: dry_run
          in: query
          required: false
          description: >-
            Offline candidate inspection: emit every confidence band (down to LOW,
            overriding min_tier) plus the AMBIGUOUS candidates inline, and write
            nothing (no review-queue rows). The response carries dry_run:true and an
            additional `ambiguous` array alongside `deps`.
          schema:
            type: string
            enum: ["1", "true"]
      responses:
        "200":
          description: Cross-repo dependency edges (or ambiguous review queue)
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Missing required parameters
        "401":
          description: Unauthorized
        "413":
          description: Response too large; narrow the query
        "503":
          description: Canonical index unavailable

  /code/project/detach:
    post:
      operationId: postCodeProjectDetach
      summary: Detach the current generation of a stable project
      description: >-
        Marks the project and its current generation detached so default/current queries no longer
        return it. Data is retained for audit and later re-add or explicit purge. Requires an
        authenticated unscoped owner credential.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectLifecycleRequest"
      responses:
        "200":
          description: Project generation detached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetachResponse"
        "400":
          description: Invalid request
        "403":
          description: Verified unscoped owner principal required
        "404":
          description: Project not found
        "405":
          description: Method not allowed
        "503":
          description: Canonical index unavailable

  /code/project/purge:
    post:
      operationId: postCodeProjectPurge
      summary: Dry-run or confirm exact deletion of one stable project
      description: >-
        Omit `confirm_hash` for a read-only manifest. To delete, repeat the request with that exact
        SHA-256 hash and a reason. Confirmation fails if any target row changed, and audit failure
        blocks mutation. Requires an authenticated unscoped owner credential.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectLifecycleRequest"
      responses:
        "200":
          description: Dry-run or confirmed purge manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectLifecycleManifest"
        "400":
          description: Invalid request or confirmed operation without a reason
        "403":
          description: Verified unscoped owner principal required
        "404":
          description: Project not found
        "405":
          description: Method not allowed
        "409":
          description: Target manifest changed; run the dry run again
        "503":
          description: Audit or canonical-index operation failed

  /code/project/gc:
    post:
      operationId: postCodeProjectGc
      summary: Dry-run or confirm detached-generation garbage collection
      description: >-
        Omit `confirm_hash` for a read-only manifest. To delete expired detached generations and
        aliases, repeat the request with the exact SHA-256 hash and a reason. The manifest binds the
        retention policy and UTC cutoff as well as exact physical target fingerprints. Requires an
        authenticated unscoped owner credential.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectLifecycleRequest"
      responses:
        "200":
          description: Dry-run or confirmed garbage-collection manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectLifecycleManifest"
