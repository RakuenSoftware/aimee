          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Action response
          content:
            application/json:
              schema:
                type: object
        "401":
          description: Unauthorized
        "404":
          description: Unknown action

  # ── Phase 3: Ingest API ────────────────────────────────────────────────────

  /docs:
    post:
      operationId: postDocs
      summary: Upload a document for ingest
      description: |
        Accepts multipart/form-data with a required `file` part and an optional
        `scope` field (default: global). Normalizes to markdown, stores in DB2,
        and queues an extract_doc job. Returns existing doc_id on idempotent re-upload.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                scope:
                  type: string
                  default: global
      responses:
        "201":
          description: Document ingested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocIngestResponse"
        "200":
          description: Idempotent re-upload (existing doc_id returned)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocIngestResponse"
        "400":
          description: Missing file part
        "401":
          description: Unauthorized
        "422":
          description: Normalization failed (converter error)
        "503":
          description: DB unavailable

  /docs/manifest:
    post:
      operationId: postDocsManifest
      summary: Check which uploaded document hashes are absent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocsManifestRequest"
      responses:
        "200":
          description: Manifest diff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocsManifestResponse"
        "400":
          description: Invalid manifest request
        "401":
          description: Unauthorized
        "405":
          description: Method not allowed
        "500":
          description: Serialization failed
        "503":
          description: DB unavailable

  /docs/{id}:
    get:
      operationId: getDoc
      summary: Retrieve doc metadata by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Document metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocMetadataResponse"
        "401":
          description: Unauthorized
        "404":
          description: Document not found
    delete:
      operationId: deleteDoc
      summary: Delete a staged document
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Document deleted
        "401":
          description: Unauthorized
        "404":
          description: Document not found

  /review:
    get:
      operationId: getReview
      summary: List staged documents pending review
      parameters:
        - name: cursor
          in: query
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Review queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewQueueResponse"
        "401":
          description: Unauthorized

  /review/{id}/accept:
    post:
      operationId: postReviewAccept
      summary: Accept a staged document
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewAcceptRequest"
      responses:
        "200":
          description: Document accepted
        "400":
          description: Invalid id
        "401":
          description: Unauthorized
        "404":
          description: Document not found

  /review/{id}/reject:
    post:
      operationId: postReviewReject
      summary: Reject a staged document
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRejectRequest"
      responses:
        "200":
          description: Document rejected
        "400":
          description: Invalid id
        "401":
          description: Unauthorized
        "404":
          description: Document not found

  # ── Phase 4: Corpus staging and release lifecycle ──────────────────────────

  /releases:
    post:
      operationId: postReleases
      summary: Create a new corpus release
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReleaseRequest"
      responses:
        "201":
          description: Release created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateReleaseResponse"
        "400":
          description: Missing name
        "401":
          description: Unauthorized
        "409":
          description: Name already exists

  /releases/active:
    get:
      operationId: getActiveRelease
      summary: Get the currently active corpus release
      responses:
        "200":
          description: Active release (or null if none)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveReleaseResponse"
        "401":
          description: Unauthorized

  /releases/{id}/promote:
    post:
      operationId: postPromote
      summary: Promote a release to active
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Release promoted
        "400":
          description: Invalid id
        "401":
          description: Unauthorized
        "409":
          description: Promote failed

  /releases/{id}/rollback:
    post:
      operationId: postRollback
      summary: Roll back to a prior release
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RollbackRequest"
      responses:
        "200":
          description: Rolled back
        "400":
          description: Invalid id
        "401":
          description: Unauthorized
        "409":
          description: No prior release to roll back to

  # ── Phase 5: Retrieval endpoints ───────────────────────────────────────────

  /search:
    post:
      operationId: postSearch
      summary: Hybrid knowledge search
      description: >-
        Searches the authenticated active project by default. A request without an active project
        fails with `scope_required`; deliberate cross-project retrieval requires `scope: all`.
        Send the active `project` together with `scope: all` to reserve the result head for local
        evidence while allowing labeled cross-project results in the tail.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          description: Bad request (missing query or invalid scope)
        "401":
          description: Unauthorized
        "403":
          description: Scoped credentials cannot request all projects
        "409":
          description: No active project is available (`scope_required`)

  /artifacts/{id}:
    get:
      operationId: getArtifact
      summary: Retrieve an artifact by UUID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Artifact payload and citations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactResponse"
        "401":
          description: Unauthorized
        "404":
          description: Artifact not found

  /artifacts/{id}/links:
    get:
      operationId: getArtifactLinks
      summary: Retrieve outgoing links from an artifact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Artifact links
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactLinksResponse"
        "401":
          description: Unauthorized
        "404":
          description: Artifact not found

  /code/find:
    get:
      operationId: getCodeFind
      summary: Symbol/identifier lookup across the canonical index
      parameters:
        - name: identifier
          in: query
          required: true
          schema:
            type: string
        - name: project
          in: query
          description: Stable project identity. Defaults to the authenticated active project.
          schema:
            type: string
        - name: scope
          in: query
          description: >-
            Cross-project lookup requires `all`; send `project` too to protect that active
            project's candidates before the result limit.
          schema:
            type: string
            enum: [current, all]
            default: current
        - name: generation
          in: query
          description: Optional observed current generation; stale observations fail closed.
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: max_results
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Code find results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeFindResponse"
        "400":
          description: Missing identifier parameter
