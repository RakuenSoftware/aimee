  /code/search:
    get:
      operationId: getCodeSearch
      summary: Full-text code search across indexed file contents
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
        - name: project
          in: query
          description: Stable project identity. Defaults to the authenticated active project.
          schema:
            type: string
        - name: scope
          in: query
          description: >-
            Cross-project search requires `all`; send `project` too to protect that active
            project's candidates before the result limit.
          schema:
            type: string
            enum: [current, all]
            default: current
        - name: generation
          in: query
          description: Optional observed current generation; stale observations fail closed.
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: max_results
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Code search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeSearchResponse"
        "400":
          description: Missing query parameter
        "401":
          description: Unauthorized
        "403":
          description: Scoped credentials cannot request all projects
        "404":
          description: Project is unknown or detached
        "409":
          description: Active project is required or the observed generation is stale
        "503":
          description: Canonical index unavailable

  /code/context:
    get:
      operationId: getCodeContext
      summary: Bounded task-conditioned context for the active project
      description: >-
        Reuses hybrid RRF retrieval but returns only current-generation evidence for one active
        project. Exact lexical and structural evidence leads; vector-only evidence must clear the
        quality floor. Memory is additive, locally ordered, and anchored to accepted code. A weak
        query returns HTTP 200 with status `no_answer`, empty results, and empty why rather than
        broadening to global memory.
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string }
        - name: symbol
          in: query
          schema: { type: string }
        - name: project
          in: query
          required: true
          description: Stable identity of the authenticated active project; cross-project scope is forbidden.
          schema: { type: string }
        - name: generation
          in: query
          description: Optional observed current generation; stale observations fail closed.
          schema: { type: integer, format: int64, minimum: 1 }
        - name: max_results
          in: query
          description: Accepted for client compatibility and clamped to the fixed packet maximum of four.
          schema: { type: integer, default: 4, maximum: 4 }
      responses:
        "200":
          description: Answerable bounded packet or explicit no_answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeContextResponse"
        "400":
          description: Missing or invalid query
        "401":
          description: Unauthorized
        "404":
          description: Project is unknown, detached, or has no current generation
        "409":
          description: Active project is required or the observed generation is stale
        "503":
          description: Canonical index unavailable

