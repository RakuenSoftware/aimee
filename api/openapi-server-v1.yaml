  /management/action:
    post:
      summary: Authorize a management action with mTLS identity and a management JWT
      description: >
        Validates the configured issuer, audience, capability, peer identity,
        request-body digest, and replay-protected JWT ID before dispatch.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Management action authorized and dispatched
          content:
            application/json:
              schema:
                type: object
                required: [ok, actor, jti]
                properties:
                  ok: { type: boolean, enum: [true] }
                  actor: { type: string }
                  jti: { type: string }
        "403": { description: Management action denied }
        "503": { description: Management control plane is not configured }
