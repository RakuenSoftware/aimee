              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /kb/build:
    post:
      summary: Build the knowledge base (async; poll GET /runs/{id})
      requestBody: { content: { application/json: { schema: { type: object } } } }
      responses: { "200": { description: Queued op run, content: { application/json: { schema: { type: object } } } } }
  /kb/ingest:
    post:
      summary: Ingest a corpus into the knowledge base (async; poll GET /runs/{id})
      requestBody: { content: { application/json: { schema: { type: object } } } }
      responses: { "200": { description: Queued op run, content: { application/json: { schema: { type: object } } } } }
  /kb/update:
    post:
      summary: Update the knowledge base (async; poll GET /runs/{id})
      requestBody: { content: { application/json: { schema: { type: object } } } }
      responses: { "200": { description: Queued op run, content: { application/json: { schema: { type: object } } } } }
  /kb/reembed:
    post:
      summary: Reset and re-embed the vector store after a dimension change (async; poll GET /runs/{id})
      description: >-
        Drops and recreates every derived vector table at the configured
        embedding dimension, then requeues the corpus. Gated by
        kb.reembed_on_dim_change in aimee-kb's own config; without confirm it
        returns a dry-run plan naming each table and row count.
      requestBody: { content: { application/json: { schema: { type: object } } } }
      responses: { "200": { description: Queued op run, content: { application/json: { schema: { type: object } } } } }
  /memory/embed:
    post:
      summary: (Re)generate memory embeddings (async; poll GET /runs/{id})
      description: >-
        Embeds a single memory (memory_id) or the whole corpus (all=true, which
        requires a rollover version). Needed after a dimension change, which
        drops memory vectors without requeueing them.
      requestBody: { content: { application/json: { schema: { type: object } } } }
      responses: { "200": { description: Queued op run, content: { application/json: { schema: { type: object } } } } }
  /kb/docs/push:
    post:
      summary: Push document contents into the knowledge base (async; poll GET /runs/{id})
      description: >-
        Upload document bytes from the caller's workspace into the knowledge
        base. The workspace-owning tier reads the files and streams their
        content to aimee-kb, so a stateless/remote aimee-kb that cannot see the
        caller's filesystem still ingests them (unlike the path-forwarding
        kb.build).
      requestBody: { content: { application/json: { schema: { type: object } } } }
      responses: { "200": { description: Queued op run, content: { application/json: { schema: { type: object } } } } }
  /graph/sync_code:
    post:
      summary: Sync the code graph (async; poll GET /runs/{id})
      requestBody: { content: { application/json: { schema: { type: object } } } }
      responses: { "200": { description: Queued op run, content: { application/json: { schema: { type: object } } } } }
  /index/scan:
    post:
      summary: Scan/re-index the codebase (async; poll GET /runs/{id})
      requestBody: { content: { application/json: { schema: { type: object } } } }
      responses: { "200": { description: Queued op run, content: { application/json: { schema: { type: object } } } } }
  /index/ingest:
    post:
      summary: Index client-pushed workspace files (async; poll GET /runs/{id})
      description: >-
        Index a project from file contents supplied by the caller, used by the
        thin client to ingest a workspace whose root lives on the client and is
        not visible to the server (a `detached` workspace). The server relays the
        supplied {rel_path, content} entries to aimee-kb without reading any
        local filesystem.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, root, files]
              properties:
                name: { type: string }
                root: { type: string }
                force: { type: boolean }
                files:
                  type: array
                  items:
                    type: object
                    required: [rel_path, content]
                    properties:
                      rel_path: { type: string }
                      content: { type: string }
      responses: { "200": { description: Queued op run, content: { application/json: { schema: { type: object } } } } }
  /memory/benchmark:
    post:
      summary: Run a memory retrieval benchmark
      description: >-
        Runs synchronous retrieval suites through the server-side
        memory.benchmark handler. Supported sync suites are code-graph-fusion,
        memory, corpus, memory-retrieval, and live. Dataset or judge-style
        suites such as locomo, longmemeval, locomo-qa, and
        longmemeval-qa return an async-only envelope with the CLI/delegate route
        to run them.
      requestBody: { content: { application/json: { schema: { type: object } } } }
      responses: { "200": { description: Benchmark result or async-only envelope, content: { application/json: { schema: { type: object } } } } }
  /curator/synthesize:
    post:
      summary: Run curator synthesis/extraction (async; poll GET /runs/{id})
