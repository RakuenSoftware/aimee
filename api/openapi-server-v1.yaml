  /index/deps:
    post:
      summary: Cross-repo dependency edges for a registered repo
      description: >-
        Proxies the kb cross-repo dependency query. Returns confidence-tiered
        edges with evidence + a version stamp, or the AMBIGUOUS review queue when
        status=ambiguous. direction: out = deps OF the project (default), in =
        repos that depend ON the project (--reverse), both = union.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project]
              properties:
                project: { type: string }
                direction: { type: string, enum: [out, in, both], default: out }
                min_tier: { type: string, enum: [high, medium, tentative] }
                status: { type: string, enum: [ambiguous] }
                dry_run:
                  type: boolean
                  description: >-
                    Offline candidate inspection — emit every band down to LOW plus
                    inline AMBIGUOUS candidates, writing nothing (acceptance #4).
      responses:
        "200":
          description: Cross-repo dependency edges or ambiguous review queue
          content:
            application/json:
              schema: { type: object }
        "400":
          description: Missing project or invalid body
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "502":
          description: Index backend (aimee-kb) unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /repo/trust:
    post:
      summary: Set a registered repo's cross-repo trust (admin)
      description: >-
        Proxies the audited kb trust write (CAP_INDEX_ADMIN; local/owner-only over
        TCP). Sets projects.trust, bumps trust_epoch on a real transition, audits
        the change, and recomputes the blocked_symbols frequency model. actor is
        caller-asserted (single-tenant P1).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project, trust]
              properties:
                project: { type: string }
                trust: { type: string, enum: [trusted, untrusted] }
                actor: { type: string }
                request_id: { type: string }
      responses:
        "200":
          description: Trust applied (status, project, prior_trust, new_trust, changed)
          content:
            application/json:
              schema: { type: object }
        "400":
          description: Missing project or invalid trust value
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "404":
          description: No such project
