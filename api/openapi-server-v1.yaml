  /workspace/mirror-sync:
    post:
      summary: Upload the client working-tree patch for a mirror workspace
      description: >
        The client of a remote server ships its full working-tree patch (tracked
        modifications, deletions and untracked files, as a --binary diff against
        HEAD) so the server's mirror reconstructs the tree the client actually
        has. Absent, the reconstruct is a clean checkout at head and every
        uncommitted change is silently missing from the tree agents work in. The
        target must already be registered as a `mirror` workspace. Capability:
        tool:execute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [args, diff]
              properties:
                args:
                  type: array
                  items: { type: string }
                  description: Single element - the workspace root as the client knows it
                diff:
                  type: string
                  description: The patch; empty string for a clean tree
      responses:
        "200":
          description: Patch stored for the next reconstruct
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        "400":
          description: Not a registered mirror workspace, or missing root
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /workspaces:
    get:
      summary: List registered workspaces (instance-scoped)
      description: >
        The workspaces registered on this instance, each with its provider
        (shared|detached|mirror) and the projects discovered under it. A mirror
        workspace also reports the client vcs coordinates its server-side tree is
        reconstructed from. Capability: index:read.
      responses:
        "200":
          description: Workspace registry
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspaces:
                    type: array
                    items:
                      type: object
                      properties:
                        path: { type: string }
                        provider: { type: string, enum: [shared, detached, mirror] }
                        remote: { type: string, description: "mirror only: client remote URL" }
                        head: { type: string, description: "mirror only: client HEAD commit" }
                        projects: { type: array, items: { type: string } }
    post:
      summary: Register a workspace (instance-scoped)
      description: >
        Register a working tree as an instance-scoped workspace. The optional
        provider selects co-located (shared), marshalled to the client
        (detached), or a server-side tree reconstructed from the client's git
        remote (mirror). A mirror registration requires both `remote` and `head`,
        since the server seeds its bare mirror by fetching that head from that
        remote, and is rejected without them. Capability: tool:execute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [root_hint]
              properties:
                root_hint:
                  type: string
                  description: Absolute path to the workspace root
                provider: { type: string, enum: [shared, detached, mirror] }
                remote:
                  type: string
                  description: "Required for provider=mirror: the client's git remote URL"
                head:
                  type: string
                  description: "Required for provider=mirror: the client's HEAD commit"
      responses:
        "200":
          description: Workspace registered (with discovered projects)
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: { type: string }
                  project_count: { type: integer }
                  projects: { type: array, items: { type: object } }
        "400":
          description: Missing or invalid root_hint / provider
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /workspaces/{id}:
    get:
      summary: Workspace handle manifest
      description: >
        The manifest for one workspace handle: provider, root, existence, and
        VCS state. `id` is the percent-encoded absolute workspace path.
        Capability: index:read.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Percent-encoded absolute workspace path
      responses:
        "200":
          description: Workspace manifest
          content:
            application/json:
              schema:
                type: object
                properties:
                  manifest:
                    type: object
                    properties:
                      root: { type: string }
                      provider: { type: string, enum: [shared, detached] }
                      exists: { type: boolean }
                      is_dir: { type: boolean }
                      vcs:
                        type: object
                        properties:
                          remote: { type: string }
                          head: { type: string }
                          branch: { type: string }
    delete:
      summary: Remove a workspace registration
      description: >
        Deregister a workspace. `id` is the percent-encoded absolute workspace
        path. Capability: tool:execute.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Percent-encoded absolute workspace path
      responses:
        "200":
          description: Workspace removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  removed: { type: string }
        "404":
          description: No such workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /workspaces/{id}/forge-token:
    post:
      summary: Install a short-lived brokered forge token for a workspace
      description: >
        A filesystem-rich client hands the hub a short-lived, scoped forge token
        (GitHub/GitLab App installation token, fine-grained PAT, or
        `gh auth token`) for this workspace. The hub holds it in memory only and never
        writes it to disk or logs it. The hub injects it into the git/gh exec
        environment (GH_TOKEN + a GIT_ASKPASS shim), and revokes it when the
        workspace closes. `id` is the percent-encoded absolute workspace path.
        Capability: tool:execute.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Percent-encoded absolute workspace path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, description: Short-lived forge token }
                scope: { type: string, enum: [global, workspace, project, user] }
                ttl_seconds: { type: integer, description: Lifetime in seconds (default 3600) }
      responses:
        "200":
          description: Token installed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "400":
          description: Missing/invalid token, scope, or ttl
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /workspace/clone:
    post:
      summary: Clone a git repo as a project under the calling webchat user's workspace
      description: >
        Clone `url` as a project under the authenticated `webuser:` principal's
        isolated workspace (`webusers/<name>/<project>`). The caller identity
        comes from the root-UDS-attested `X-Aimee-Webuser` assertion, NOT the
        body, so a user can only clone into their own tree. The git credential is
        resolved per host (single-user server, many providers): an optional inline
        `token` (then persisted server-side, keyed by host) > the host's stored
        token > the server identity (AIMEE_FORGE_TOKEN). It crosses only via a
        GIT_ASKPASS shim, never on disk in plaintext or on the command line. The
        project is then indexed. Capability: tool:execute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, description: Git remote URL (https or ssh) }
                name: { type: string, description: Repo name (default - the repo basename) }
                org:
                  type: string
                  description: >
                    Optional org override. Default - the URL's single-segment
                    owner path (sanitized); a multi-segment owner (GitLab
                    subgroups) clones flat unless this is given. The project
                    ref becomes "<org>/<name>".
                token:
                  type: string
                  description: >
                    Optional access token for a private repo (GitHub/Gitea/GitLab/...).
                    Authenticates the clone and is persisted in the server vault keyed
                    by the URL's host for future operations. Never echoed back.
      responses:
        "200":
          description: Cloned and indexed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  name:
                    type: string
                    description: The project ref ("<org>/<repo>" or flat "<repo>").
                  org_note:
                    type: string
                    description: >
                      Present when a multi-segment owner path bailed to a flat
                      clone; explains how to place it with an explicit org.
                  kb_indexed:
                    type: boolean
                    description: >
                      Whether the clone was also pushed to the knowledge service
                      (/v1/code/scan) for code-unit synthesis + embeddings.
                  kb_reason:
                    type: string
                    description: Why the kb scan was skipped (present when kb_indexed is false).
        "400":
          description: Invalid URL/name/org (validation failure)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "409":
          description: >-
            Identity conflict: the project already exists, the org name clashes
            with a flat project (or vice versa), or the ref is already bound to
            a different canonical remote (the other remote is never echoed).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "403":
          description: Not a webchat user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /workspace/projects:
    get:
      summary: List the calling webchat user's projects
      description: >
        The git projects (cloned repos) under the authenticated `webuser:`
        principal's scoped workspace. A user only ever sees their own.
        Capability: index:read.
      responses:
        "200":
          description: Project names
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items: { type: string }
                    description: Project refs ("<org>/<repo>" or flat "<repo>").
                  details:
                    type: array
                    description: Per-project detail rows.
                    items:
                      type: object
                      properties:
                        ref: { type: string }
                        org: { type: string, description: Empty for a flat/legacy project. }
                        name: { type: string }
                        remote:
                          type: string
                          description: >
                            Credential-free canonical remote (absent for legacy
                            clones without a sidecar).
                  root: { type: string }
        "403":
          description: Not a webchat user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /workspace/org-repos:
    get:
      summary: List the repositories under an owner/org on a git host
      description: >
        Enumerate the repos under `owner` on git `host` (provider-agnostic:
        GitHub, GitLab, Gitea/Forgejo, Bitbucket), so the wizard can bulk-clone a
        workspace. Auth is the attested `webuser:` principal; enumeration uses the
        per-host token from the sealed vault (or unauthenticated for a public org).
        Nothing is cloned. Capability: index:read.
      parameters:
        - in: query
          name: host
          required: true
          schema: { type: string }
          description: Git host (e.g. github.com, gitlab.com, gitea.example.com)
        - in: query
          name: owner
          required: true
          schema: { type: string }
          description: Owner / org / group slug
      responses:
        "200":
          description: The owner's repositories
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider: { type: string }
                  repos:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        clone_url: { type: string }
                        ssh_url: { type: string }
                        private: { type: boolean }
        "400":
          description: Missing or invalid host/owner
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "401":
          description: Not authorized upstream (add a token for this host)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "403":
          description: Not a webchat user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /workspace/clone-org:
    post:
      summary: Bulk-clone a selection of a workspace's repos
      description: >
        Clone each of `repos` (by `clone_url`) into the authenticated `webuser:`
        principal's scoped workspace, reusing the per-host credential resolution of
        /workspace/clone. Individual failures do not abort the batch; a per-repo
        result list is returned (max 100 repos per request). Capability: tool:execute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host, owner, repos]
              properties:
                host: { type: string }
                owner: { type: string }
                repos:
                  type: array
                  items:
                    type: object
                    required: [name, clone_url]
                    properties:
                      name: { type: string }
                      clone_url: { type: string }
      responses:
        "200":
          description: Per-repo clone results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        ok: { type: boolean }
                        project: { type: string, nullable: true }
                        error: { type: string, nullable: true }
                        kb_indexed:
                          type: boolean
                          description: >
                            Whether the clone was also pushed to the knowledge
                            service (/v1/code/scan) for synthesis + embeddings.
                        kb_reason:
                          type: string
                          description: Why the kb scan was skipped (present when kb_indexed is false).
        "400":
          description: Missing host/owner/repos, or too many repos (max 100)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "403":
          description: Not a webchat user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /workspace/projects/delete:
    post:
      summary: Delete a cloned project under the calling webchat user's workspace
      description: >
        Delete the project at `ref` ("<org>/<repo>" or flat "<repo>") from the
        authenticated `webuser:` principal's workspace (webchat project
        lifecycle, slice 2). Identity comes EXCLUSIVELY from the attested
        `X-Aimee-Webuser` layer; a ref outside the caller's tree is a plain
        404. Under the project lifecycle lock the last holder of the ref runs
        the fenced knowledge purge before the filesystem removal; other
        holders keep the shared knowledge (`kb_status` "retained"). When the
        knowledge service is unreachable or a store fails, the delete aborts
        with 503 and nothing is destroyed unless `force` is true, in which
        case the filesystem proceeds and the response carries the full
        per-store detail (`kb_status` "forced"). Every attempt, including an
        abort, writes structured webuser_project_delete_audit_v1 lines
        sharing the echoed `purge_id`. Capability: tool:execute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ref]
              properties:
                ref:
                  type: string
                  description: The project ref ("<org>/<repo>" or flat "<repo>").
                force:
                  type: boolean
                  description: >
                    Proceed with the filesystem removal even when the knowledge
                    purge fails or the service is unreachable. The response and
                    audit carry the per-store outcome so the purge can be
                    re-run to convergence later.
      responses:
        "200":
          description: Project deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  ref: { type: string }
                  kb_status:
                    type: string
                    enum: [purged, retained, forced]
                    description: >
                      `purged` means the last holder was removed and all knowledge
                      stores were cleared. `retained` means other holders keep the
                      shared knowledge. `forced` means the filesystem was removed
                      despite a KB failure.
                  purge_id:
                    type: string
                    description: >
                      The operation id shared by every audit line and the
                      knowledge fence for this delete.
                  kb:
                    type: object
                    additionalProperties: true
                    description: >
                      Per-store purge detail (row counts, or {"error": ...})
                      when a purge ran; absent when retained.
        "400":
          description: Missing/invalid ref
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "403":
          description: Not a webchat user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "404":
          description: The ref does not resolve under the caller's workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "503":
          description: >
            Knowledge service unavailable or a store failed (without force):
            nothing was removed; the body's `kb` member carries the detail. A
            failed purge-cancel is reported here too ("purge committed but
            unfinished"). Re-running the delete converges.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  kb:
                    type: object
                    additionalProperties: true
  /internal/forge/execute:
    post:
      summary: Mechanically execute an authenticated forge operation for Go WFE
      description: >
        Internal Unix-socket-only resource-plane seam. The Go WFE supplies an
        already-decided typed operation; C confines it to a managed WFE
        worktree and repository, retains the credential, and performs only the
        authenticated transport. This endpoint owns no workflow state or
        lifecycle decision and is unavailable over TCP/TLS.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [op, workdir]
              properties:
                op: { type: string, enum: [push, open, info, ci, merge] }
                workdir: { type: string }
                head:
                  oneOf:
                    - { type: string, maxLength: 91, pattern: '^aimee/feat/wi_[A-Za-z0-9_]+$' }
                    - { type: string, maxLength: 89, pattern: '^aimee/wi/wi_[A-Za-z0-9_]+\.s[0-9a-f]{10}\.g[0-9]+\.[0-9]+$' }
                base: { type: string }
                title: { type: string, minLength: 1, maxLength: 256 }
                body: { type: string, minLength: 1, maxLength: 60000 }
                draft:
                  type: boolean
                  description: Must be true for final feature-to-trunk handoffs and false for slice PRs.
                number: { type: integer, minimum: 1 }
              oneOf:
                - required: [head]
                  properties: { op: { enum: [push] } }
                  not:
                    anyOf: [{ required: [base] }, { required: [title] }, { required: [body] }, { required: [draft] }, { required: [number] }]
                - required: [head, base, title, body, draft]
                  properties: { op: { enum: [open] } }
                  not: { required: [number] }
                - required: [number]
                  properties: { op: { enum: [info, ci] } }
                  not:
                    anyOf: [{ required: [head] }, { required: [base] }, { required: [title] }, { required: [body] }, { required: [draft] }]
                - required: [base, number]
                  properties: { op: { enum: [merge] } }
                  not:
                    anyOf: [{ required: [head] }, { required: [title] }, { required: [body] }, { required: [draft] }]
      responses:
        "200":
          description: Mechanical forge operation completed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required: [ok]
                properties:
                  ok: { type: boolean, enum: [true] }
        "400":
          description: Invalid request or forge operation failure
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "403":
          description: Non-UDS caller or unmanaged repository/worktree
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /workspace/git:
    post:
      summary: Run a git operation on the calling webchat user's project
      description: >
        Run `op` on the authenticated `webuser:` principal's `project`. Read ops:
        status, log, diff, branch. Write/remote ops: fetch, pull, commit, push,
        checkout. The project + op are scoped + allowlisted; arguments are
        validated (no shell); remote ops inject the user's vaulted git creds.
        Capability: tool:execute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project, op]
              properties:
                project: { type: string }
                op:
                  type: string
                  enum: [status, log, diff, branch, fetch, pull, commit, push, checkout]
                message: { type: string, description: Commit message (op=commit) }
                branch: { type: string, description: Target branch (op=checkout) }
                n: { type: integer, description: Log entry count (op=log) }
                session_id:
                  type: string
                  description: >
                    Optional. Run the op in this session's isolated worktree (the
                    same tree its agent edits) rather than the shared project
                    checkout.
      responses:
        "200":
          description: Operation ran
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  output: { type: string }
        "400":
          description: Unknown project/op, invalid argument, or git failure
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "403":
          description: Not a webchat user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /workspace/session-dir:
    post:
      summary: Resolve a session's working directory for a project
      description: >
        Return the absolute directory the given session acts in for `project`:
        that session's isolated sibling worktree (off the default branch, created
        on demand) when `session_id` is non-empty, else the project checkout. Lets
        the editor open the same tree the session's agent edits. Identity is the
        authenticated `webuser:` principal. Capability: index:read.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project]
              properties:
                project: { type: string }
                session_id: { type: string }
      responses:
        "200":
          description: Resolved directory
          content:
            application/json:
              schema:
                type: object
                properties:
                  dir: { type: string }
        "400":
          description: Unknown project or invalid body
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "403":
          description: Not a webchat user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /workspace/editor:
    post:
      summary: Ensure the calling webchat user's code-server is running
      description: >
        Spawn (or reuse) a code-server for the authenticated `webuser:` principal,
        rooted at their scoped workspace and launched with their vault-backed git
        environment, and return its loopback port. The port reaches only webchat
        (the trusted reverse-proxy), never the browser. On by default (set
        AIMEE_WEBCHAT_EDITOR=0 to disable); unavailable on images built without a
        code-server binary. Capability: tool:execute.
      responses:
        "200":
          description: Editor ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  port: { type: integer }
        "403":
          description: Not a webchat user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "503":
          description: Editor feature disabled or code-server absent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /git/credentials:
    get:
      summary: List the git hosts that have a stored credential
      description: >
        The git hosts (github.com, gitea.*, ...) for which aimee-server holds an
        access token. Single-user server: credentials are keyed by host, not by
        user, and stored in the server vault. Tokens are never returned. The response
        contains only host names. Identity is the attested `webuser:` principal. Capability:
        tool:execute.
      responses:
        "200":
          description: Configured hosts
          content:
            application/json:
              schema:
                type: object
                properties:
                  hosts: { type: array, items: { type: string } }
        "403":
          description: Not a webchat user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    post:
      summary: Store (or replace) the git access token for a host
      description: >
        Persist `token` for `host` (a hostname or a full repo URL, reduced to its
        host) in the server vault. Used by clones/ops on that host. Provider-
        agnostic. Capability: tool:execute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host, token]
              properties:
                host: { type: string, description: Hostname (or a repo URL) }
                token: { type: string, description: Access token (write-only) }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                properties: { ok: { type: boolean } }
        "400":
          description: Missing host/token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "403":
          description: Not a webchat user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      summary: Remove the stored git access token for a host
      description: >
        Delete the token aimee-server holds for `host`. Capability: tool:execute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host]
              properties:
                host: { type: string }
      responses:
        "200":
          description: Removed (or absent)
          content:
            application/json:
              schema:
                type: object
                properties: { ok: { type: boolean } }
        "403":
          description: Not a webchat user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /git/sshkey:
    post:
      summary: Store (or replace) the caller's SSH private key for git over SSH
      description: >
        Persist an unencrypted OpenSSH/PEM private key in the CALLER's own
        encrypted vault under (`webuser:<name>`, `git`, `ssh_key`), dual-wrapped so
        the server can load it into the user's in-memory ssh-agent autonomously
        (it never touches disk and is never returned to the browser). Storing
        requires the caller's vault to be unlocked; a locked vault returns 423.
        Capability: tool:execute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ssh_key]
              properties:
                ssh_key:
                  type: string
                  description: Unencrypted OpenSSH/PEM private key (write-only)
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                properties: { ok: { type: boolean } }
        "400":
          description: Missing or passphrase-encrypted key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "403":
          description: Not a webchat user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "413":
          description: Key too large (> 64 KiB)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "423":
          description: Vault is locked. Unlock it, then retry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      summary: Remove the caller's stored SSH private key
      description: >
        Delete the SSH key from the caller's vault and drop any live ssh-agent
        handle holding it. Idempotent. Capability: tool:execute.
      responses:
        "200":
          description: Removed (or absent)
          content:
            application/json:
              schema:
                type: object
                properties: { ok: { type: boolean } }
        "403":
          description: Not a webchat user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /git/oauth/github/start:
    post:
      summary: Begin GitHub device-flow sign-in
      description: >
        Start the GitHub OAuth device flow to populate the github.com credential
        without a hand-made PAT. Returns a user code + verification URI to show the
        user; the opaque device_code is held server-side for the poll endpoint.
        Requires AIMEE_GITHUB_OAUTH_CLIENT_ID. Capability: tool:execute.
      responses:
        "200":
          description: Device code issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  user_code: { type: string }
                  verification_uri: { type: string }
                  interval: { type: integer }
        "403":
          description: Not a webchat user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "503":
          description: GitHub sign-in not configured
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /git/oauth/github/poll:
    post:
      summary: Poll GitHub device-flow completion
      description: >
        Poll for the user completing the device flow. On completion the access
        token is stored as the github.com credential. Capability: tool:execute.
      responses:
        "200":
          description: Poll result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [pending, done, error] }
                  error: { type: string }
        "403":
          description: Not a webchat user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /git/oauth/github/config:
    get:
      summary: Read the configured GitHub OAuth App client ID
      description: >
        Whether a GitHub OAuth App client ID is configured (set from the UI or the
        AIMEE_GITHUB_OAUTH_CLIENT_ID env), and the value (public). Capability:
        tool:execute.
      responses:
        "200":
          description: Config
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured: { type: boolean }
                  client_id: { type: string }
        "403":
          description: Not a webchat user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    post:
      summary: Set the GitHub OAuth App client ID
      description: >
        Persist the client ID server-side so the "Sign in with GitHub" button
        works without an env var. The client ID is public (device flow needs no
        secret). Capability: tool:execute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id]
              properties:
                client_id: { type: string }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                properties: { ok: { type: boolean } }
        "400":
          description: Missing client_id
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "403":
          description: Not a webchat user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /git/oauth/github/web/start:
    post:
      summary: Begin the GitHub web (authorization-code) sign-in
      description: >
        Redirect sign-in: stash a CSRF state and return the GitHub
        authorize URL for the browser to navigate to. Needs a client ID + secret
        (the secret enables this flow; without it, use the device flow). The caller
        supplies redirect_uri (its public callback origin). Capability: tool:execute.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { redirect_uri: { type: string } }
      responses:
        "200":
          description: Authorize URL issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  authorize_url: { type: string }
        "400":
          description: Not configured / missing redirect_uri
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "403":
          description: Not a webchat user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /git/oauth/github/web/callback:
    post:
      summary: Complete the GitHub web sign-in
      description: >
        Validate the state, exchange the authorization code (+ the client secret and
        the stashed redirect_uri) for an access token, and store it as the github.com
        credential. Capability: tool:execute.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string }
                state: { type: string }
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [done, error] }
                  error: { type: string }
        "403":
          description: Not a webchat user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /git/oauth/device/start:
    post:
      summary: Begin a GitLab/Gitea device-flow sign-in
      description: >
        Start the OAuth 2.0 device flow for a non-GitHub provider (GitLab or
        Gitea/Forgejo) to populate the host's credential. Returns a user code +
        verification URI; the opaque device_code is held server-side for the poll
        endpoint. Requires a client ID registered for (provider, host).
        Capability: tool:execute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider]
              properties:
                provider: { type: string, enum: [gitlab, gitea] }
                host: { type: string, description: Host (defaults to gitlab.com for GitLab; required for Gitea) }
      responses:
        "200":
          description: Device code issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  user_code: { type: string }
                  verification_uri: { type: string }
                  interval: { type: integer }
        "400":
          description: Unknown provider or missing host
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "403":
          description: Not a webchat user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /git/oauth/device/poll:
    post:
      summary: Poll GitLab/Gitea device-flow completion
      description: >
        Poll for the user completing the device flow. On completion the access
        token is stored as the host's credential. Capability: tool:execute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider]
              properties:
                provider: { type: string, enum: [gitlab, gitea] }
                host: { type: string }
      responses:
        "200":
          description: Poll result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [pending, done, error] }
                  error: { type: string }
        "400":
          description: Unknown provider
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "403":
          description: Not a webchat user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /git/oauth/device/config:
    get:
      summary: Read a GitLab/Gitea OAuth App client ID
      description: >
        Whether an OAuth App client ID is configured for (provider, host), and the
        value (public). provider + host come from the query string. Capability:
        tool:execute.
      parameters:
        - in: query
          name: provider
          required: true
          schema: { type: string, enum: [gitlab, gitea] }
        - in: query
          name: host
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Config
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured: { type: boolean }
                  client_id: { type: string }
        "400":
          description: Unknown provider
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "403":
          description: Not a webchat user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    post:
      summary: Set a GitLab/Gitea OAuth App client ID
      description: >
        Persist the OAuth App client ID for (provider, host) server-side so device
        sign-in works. The client ID is public. Capability: tool:execute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, client_id]
              properties:
                provider: { type: string, enum: [gitlab, gitea] }
                host: { type: string }
                client_id: { type: string }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                properties: { ok: { type: boolean } }
        "400":
          description: Unknown provider or missing client_id
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "403":
          description: Not a webchat user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /deploy/apply:
    post:
      summary: Bring up the managed sibling services
      description: >
        Server-orchestrated deploy: run `docker compose up -d` for the managed
        one-KB profile the current wizard config selects,
        on a background thread. Atomically claims the authenticated wizard user
        as the first remote owner and returns that user's enrollment-only bearer;
        CSR signing later binds its explicit full grant to mTLS. Requires
        AIMEE_DEPLOY_ENABLED + a mounted Docker socket. Capability: tool:execute.
      responses:
        "200":
          description: Deploy started (or already running)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  status: { type: string, enum: [started, running] }
                  enrollment:
                    type: object
                    required: [state, principal, tier, mtls, tls_port]
                    properties:
                      state: { type: string, enum: [ready, paired] }
                      principal: { type: string, example: "webuser:aimee" }
                      tier: { type: string, enum: [full] }
                      mtls: { type: boolean }
                      tls_port: { type: integer }
                      bearer_token:
                        type: string
                        description: Present only while the first user's mTLS enrollment is pending.
        "403":
          description: Not a webchat user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "503":
          description: Server-orchestrated deploy is disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /deploy/status:
    get:
      summary: Deploy progress + docker compose ps
      description: >
        The background deploy's state (running / last exit / output tail) plus
        `docker compose ps` for the managed services. Capability: tool:execute.
      responses:
        "200":
          description: Deploy status
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  running: { type: boolean }
                  last_exit: { type: integer, nullable: true }
                  output: { type: string }
                  ps: { type: string }
        "403":
          description: Not a webchat user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "503":
          description: Server-orchestrated deploy is disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /runner/poll:
    post:
      summary: Poll for the next detached-workspace op to execute (reverse channel)
      description: >
        The filesystem-authority client serving a `detached` workspace polls for
        the next op the server needs run against its working tree. Returns
        immediately with have_op:false when nothing is pending (bounded wait);
        the client re-polls. Capability: tool:execute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspace_id]
              properties:
                workspace_id: { type: string }
      responses:
        "200":
          description: An op to execute, or have_op:false
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  have_op: { type: boolean }
                  op: { type: object }
        "400":
          description: Missing workspace_id
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /runner/respond:
    post:
      summary: Post the result of a detached-workspace op (reverse channel)
      description: >
        The serving client posts the result of the op it just executed back to
        the server-side transport blocked on this workspace's queue. Capability:
        tool:execute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspace_id, response]
              properties:
                workspace_id: { type: string }
                response: { type: object }
      responses:
        "200":
          description: Result delivered
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "404":
          description: No runner registered for the workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
security:
  - bearerAuth: []
