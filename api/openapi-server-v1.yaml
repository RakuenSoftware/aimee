          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmbeddingsResponse' }
        "400":
          description: Invalid request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "502":
          description: Embedder unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /responses:
    post:
      summary: Create a model response (OpenAI Responses API; non-streaming)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResponsesRequest' }
      responses:
        "200":
          description: A response object
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResponseObject' }
        "400":
          description: Invalid request (e.g. stream not yet supported)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /messages:
    post:
      summary: Create a message (Anthropic Messages API ingress)
      description: >
        Anthropic Messages API surface so Claude Code (and any Anthropic
        Messages API client pointed here via ANTHROPIC_BASE_URL) can drive
        aimee's configured primary model. A stateless wire-format proxy: the
        request's system/messages/tools are translated to the primary
        provider's format and the reply is translated back to Anthropic shape
        — aimee's agent loop, memory, and toolset are NOT involved. With
        `stream: true` the response is the Anthropic typed-event SSE sequence
        (message_start … message_stop). Requires CAP_CHAT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                model: { type: string, description: Ignored; aimee routes to its primary agent. }
                max_tokens: { type: integer }
                system: {}
                messages: { type: array, items: { type: object } }
                tools: { type: array, items: { type: object } }
                temperature: { type: number }
                stream: { type: boolean }
      responses:
        "200":
          description: >
            An Anthropic message object (stream:false), or the typed-event
            SSE sequence (stream:true).
          content:
            application/json:
              schema: { type: object }
            text/event-stream:
              schema: { type: string }
        "400":
          description: Invalid request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "502":
          description: Primary provider call failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /messages/count_tokens:
    post:
      summary: Count input tokens for an Anthropic Messages request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                system: {}
                messages: { type: array, items: { type: object } }
      responses:
        "200":
          description: Estimated input token count
          content:
            application/json:
              schema:
                type: object
                properties:
                  input_tokens: { type: integer }
  /persona:
    get:
      summary: Current active persona
      responses:
        "200":
          description: The active persona
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Persona' }
  /personas:
    get:
      summary: List configured personas
      responses:
        "200":
          description: Persona list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonaList' }
    post:
      summary: Create a persona (name in body)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonaWrite' }
      responses:
        "200":
          description: The created persona (reloaded from config)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Persona' }
        "400":
          description: Missing or invalid persona name
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /personas/{name}:
    get:
      summary: Show a persona by name
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The named persona
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Persona' }
        "404":
          description: No such persona
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    put:
      summary: Create or edit the named persona
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonaWrite' }
      responses:
        "200":
          description: The persona after the write (reloaded from config)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Persona' }
        "400":
          description: Invalid persona name or body
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      summary: Remove the user-level persona file (reset a built-in, delete a custom)
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deletion result
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  deleted: { type: boolean }
        "404":
          description: No user-level persona file to remove
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /role_templates:
    get:
      summary: List delegate role templates
      responses:
        "200":
          description: Role template names
          content:
            application/json:
              schema:
                type: object
                properties:
                  role_templates:
                    type: array
                    items: { type: string }
  /role_templates/{name}:
    get:
      summary: Show a role template's raw body
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The role template
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleTemplate' }
        "404":
          description: No such role template
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    put:
      summary: Create or edit a role template
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
      responses:
        "200":
          description: The role template after the write
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleTemplate' }
        "400":
          description: Invalid role name or missing content
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      summary: Remove the user-level role template (reset a built-in, delete a custom)
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deletion result
          content:
            application/json:
              schema:
                type: object
                properties:
                  role: { type: string }
                  deleted: { type: boolean }
        "404":
          description: No user-level role template to remove
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /sessions:
    get:
      summary: List the owner's live presences (sessions)
      responses:
        "200":
          description: Live presences
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Presence' }
  /sessions/{id}/attach:
    post:
      summary: Attach a surface to a session (creates the presence on first attach)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttachRequest' }
      responses:
        "200":
          description: Surface attached
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttachResponse' }
        "409":
          description: Attach refused (owner mismatch or registry full)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /sessions/{id}/detach:
    post:
      summary: Detach a surface from a session
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attach_id]
              properties:
                attach_id: { type: string }
      responses:
        "200":
          description: Surface detached
          content:
            application/json:
              schema:
                type: object
                properties:
                  detached: { type: boolean }
        "404":
          description: No such attachment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /sessions/{id}/events:
    get:
      summary: Stream presence events as Server-Sent Events
      description: >
        text/event-stream of presence events
        (turn_started / turn_delta / turn_done / busy and routed async events
        such as delegate/cron/reflection completions).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: text/event-stream of presence events
        "404":
          description: No such session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /sessions/{id}/persona:
    get:
      summary: Get the persona bound to a session
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The session persona
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Persona' }
    post:
      summary: Set the persona for a session
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionPersonaRequest' }
      responses:
        "200":
          description: Persona updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Persona' }
  /workspaces:
    get:
      summary: List registered workspaces (instance-scoped)
      description: >
        The workspaces registered on this instance, each with its provider
        (shared|detached) and the projects discovered under it. Capability:
        index:read.
      responses:
        "200":
          description: Workspace registry
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspaces:
                    type: array
                    items:
                      type: object
                      properties:
                        path: { type: string }
                        provider: { type: string, enum: [shared, detached] }
                        projects: { type: array, items: { type: string } }
    post:
      summary: Register a workspace (instance-scoped)
      description: >
        Register a working tree as an instance-scoped workspace. The optional
        provider selects co-located (shared) or marshalled (detached) access.
        Capability: tool:execute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [root_hint]
              properties:
                root_hint:
                  type: string
                  description: Absolute path to the workspace root
                provider: { type: string, enum: [shared, detached] }
      responses:
        "200":
          description: Workspace registered (with discovered projects)
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: { type: string }
                  project_count: { type: integer }
                  projects: { type: array, items: { type: object } }
        "400":
          description: Missing or invalid root_hint / provider
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /workspaces/{id}:
    get:
      summary: Workspace handle manifest
      description: >
        The manifest for one workspace handle — provider, root, existence and
        VCS state. `id` is the percent-encoded absolute workspace path.
        Capability: index:read.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Percent-encoded absolute workspace path
      responses:
        "200":
          description: Workspace manifest
          content:
            application/json:
              schema:
                type: object
                properties:
                  manifest:
                    type: object
                    properties:
                      root: { type: string }
                      provider: { type: string, enum: [shared, detached] }
                      exists: { type: boolean }
                      is_dir: { type: boolean }
                      vcs:
                        type: object
                        properties:
                          remote: { type: string }
                          head: { type: string }
                          branch: { type: string }
    delete:
      summary: Remove a workspace registration
      description: >
        Deregister a workspace. `id` is the percent-encoded absolute workspace
        path. Capability: tool:execute.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Percent-encoded absolute workspace path
      responses:
        "200":
          description: Workspace removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  removed: { type: string }
        "404":
          description: No such workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /workspaces/{id}/forge-token:
    post:
      summary: Install a short-lived brokered forge token for a workspace
      description: >
        A filesystem-rich client hands the hub a short-lived, scoped forge token
        (GitHub/GitLab App installation token, fine-grained PAT, or
        `gh auth token`) for this workspace. The hub holds it in memory only —
        never written to disk or logged — injects it into the git/gh exec
        environment (GH_TOKEN + a GIT_ASKPASS shim), and revokes it when the
        workspace closes. `id` is the percent-encoded absolute workspace path.
        Capability: tool:execute.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Percent-encoded absolute workspace path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, description: Short-lived forge token }
                scope: { type: string, enum: [global, workspace, project, user] }
                ttl_seconds: { type: integer, description: Lifetime in seconds (default 3600) }
      responses:
        "200":
          description: Token installed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "400":
          description: Missing/invalid token, scope, or ttl
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /runner/poll:
    post:
      summary: Poll for the next detached-workspace op to execute (reverse channel)
      description: >
        The filesystem-authority client serving a `detached` workspace polls for
        the next op the server needs run against its working tree. Returns
        immediately with have_op:false when nothing is pending (bounded wait);
        the client re-polls. Capability: tool:execute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspace_id]
              properties:
                workspace_id: { type: string }
      responses:
        "200":
          description: An op to execute, or have_op:false
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  have_op: { type: boolean }
                  op: { type: object }
        "400":
          description: Missing workspace_id
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /runner/respond:
    post:
      summary: Post the result of a detached-workspace op (reverse channel)
      description: >
        The serving client posts the result of the op it just executed back to
        the server-side transport blocked on this workspace's queue. Capability:
        tool:execute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspace_id, response]
              properties:
                workspace_id: { type: string }
                response: { type: object }
      responses:
        "200":
          description: Result delivered
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "404":
          description: No runner registered for the workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
security:
  - bearerAuth: []
