openapi: 3.1.0
info:
  title: aimee-server API
  version: "1"
  description: >
    Native HTTP surface for aimee-server. Exposes liveness/discovery
    endpoints, an OpenAI-compatible shaping layer
    (models / chat.completions / completions / embeddings), and persona
    management. The same operations are also available over the NDJSON
    socket; this `/v1` surface is the contract-first HTTP transport.
servers:
  - url: http://127.0.0.1:{port}/v1
    variables:
      port:
        default: "8910"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Required for `/v1/*` over TCP. Unix-domain-socket access is
        authorised by filesystem permissions and needs no token.
  schemas:
    HealthResponse:
      type: object
      properties:
        status: { type: string, example: ok }
        service: { type: string, example: aimee-server }
    ReadyResponse:
      type: object
      properties:
        ready: { type: boolean, example: true }
        status:
          type: string
          description: "ok when every dependency sampled ok; degraded when one failed; unknown when not sampled yet or the sample is stale"
          enum: [ok, degraded, unknown]
        service: { type: string, example: aimee-server }
        sampled_at:
          type: integer
          nullable: true
          description: "Epoch seconds when the snapshot was taken; null before the first sample"
        age_seconds:
          type: integer
          nullable: true
          description: "Age of the snapshot in seconds; null before the first sample"
        dependencies:
          type: object
          description: "Per-dependency state; each value is ok, fail, or unknown"
          properties:
            db1: { type: string, example: ok }
            kb: { type: string, example: ok }
            retrieval: { type: string, example: ok }
            modules:
              type: string
              description: "State of the required same-container module processes on the local event bus"
              example: ok
        diagnostics:
          type: object
          properties:
            failed_boundary: { type: string }
            breaker_state: { type: string }
            retry_after_ms: { type: integer, format: int64 }
            last_success_query_ms: { type: integer, format: int64 }
            last_ingest_at: { type: string }
            missing_module:
              type: string
              description: "First required process module not attached to the local event bus; empty when all are present"
    VersionResponse:
      type: object
      properties:
        version: { type: string }
        service: { type: string, example: aimee-server }
    CapabilitiesResponse:
      type: object
      properties:
        capabilities:
          type: array
          items: { type: string }
        version: { type: string }
        service: { type: string, example: aimee-server }
    ModelsList:
      type: object
      properties:
        object: { type: string, example: list }
        data:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              object: { type: string, example: model }
              owned_by: { type: string }
    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [system, user, assistant] }
        content: { type: string }
    ChatCompletionRequest:
      type: object
      required: [messages]
      properties:
        model: { type: string, default: aimee }
        messages:
          type: array
          items: { $ref: '#/components/schemas/ChatMessage' }
        temperature: { type: number }
        max_tokens: { type: integer }
        stream: { type: boolean, default: false }
    ChatCompletionResponse:
      type: object
      properties:
        id: { type: string }
        object: { type: string, example: chat.completion }
        model: { type: string }
        choices:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              message: { $ref: '#/components/schemas/ChatMessage' }
              finish_reason: { type: string }
        usage: { $ref: '#/components/schemas/Usage' }
    CompletionRequest:
      type: object
      required: [prompt]
      properties:
        model: { type: string, default: aimee }
        prompt: { type: string }
        temperature: { type: number }
        max_tokens: { type: integer }
        stream: { type: boolean, default: false }
    CompletionResponse:
      type: object
      properties:
        id: { type: string }
        object: { type: string, example: text_completion }
        model: { type: string }
        choices:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              text: { type: string }
              finish_reason: { type: string }
        usage: { $ref: '#/components/schemas/Usage' }
    EmbeddingsRequest:
      type: object
      required: [input]
      properties:
        model: { type: string, default: aimee }
        input:
          oneOf:
            - type: string
            - type: array
              items: { type: string }
    EmbeddingsResponse:
      type: object
      properties:
        object: { type: string, example: list }
        data:
          type: array
          items:
            type: object
            properties:
              object: { type: string, example: embedding }
              index: { type: integer }
              embedding:
                type: array
                items: { type: number }
        model: { type: string }
        usage: { $ref: '#/components/schemas/Usage' }
    Usage:
      type: object
      properties:
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }
        total_tokens: { type: integer }
    ResponsesRequest:
      type: object
      required: [input]
      properties:
        model: { type: string, default: aimee }
        input:
          oneOf:
            - type: string
            - type: array
              items:
                oneOf:
                  - type: string
                  - type: object
                    properties:
                      role: { type: string }
                      content: {}
        previous_response_id: { type: string }
        temperature: { type: number }
        max_tokens: { type: integer }
        stream: { type: boolean, default: false }
    ResponseObject:
      type: object
      properties:
        id: { type: string }
        object: { type: string, example: response }
        created_at: { type: integer }
        model: { type: string }
        status: { type: string, example: completed }
        output:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              type: { type: string, example: message }
              status: { type: string }
              role: { type: string, example: assistant }
              content:
                type: array
                items:
                  type: object
                  properties:
                    type: { type: string, example: output_text }
                    text: { type: string }
                    annotations:
                      type: array
                      items: {}
        usage:
          type: object
          properties:
            input_tokens: { type: integer }
            output_tokens: { type: integer }
            total_tokens: { type: integer }
    Persona:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
    PersonaList:
      type: object
      properties:
        personas:
          type: array
          items: { $ref: '#/components/schemas/Persona' }
    PersonaWrite:
      type: object
      required: [name]
      properties:
        name: { type: string, description: "Filename-safe name (letters, digits, '.', '_', '-')" }
        description: { type: string }
        persona: { type: string, description: "Identity prose; may contain one %s for the cwd" }
        principles: { type: string }
        brief: { type: string }
        delegates: { type: string, enum: [full, readonly, none] }
        check_role: { type: string }
        check_marker: { type: string }
        roles:
          type: array
          items: { type: string }
    RoleTemplate:
      type: object
      properties:
        role: { type: string }
        content: { type: string, description: "Raw template body with {{TASK}}/{{CONTEXT}}" }
    SessionPersonaRequest:
      type: object
      required: [persona]
      properties:
        persona: { type: string }
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            message: { type: string }
            type: { type: string }
    Presence:
      type: object
      description: A live presence (a session shared across one or more attached surfaces).
      properties:
        session_id: { type: string }
        owner: { type: string }
        attachments: { type: integer }
        turn_in_flight: { type: boolean }
        turn_id: { type: string }
    AttachRequest:
      type: object
      required: [surface]
      properties:
        surface: { type: string, description: "Surface label, e.g. cli / webchat / telegram / acp" }
        owner: { type: string, description: "Owner principal the presence is scoped to (first attach fixes it)" }
        target: { type: string, description: "Optional delivery-target spec for outbound routing, e.g. telegram:-100:42" }
        subscribe_mask: { type: integer, description: "OR of presence event classes to route to this surface" }
        persistent: { type: boolean, description: "Keep delivering routed async events after the live stream detaches" }
    AttachResponse:
      type: object
      properties:
        session_id: { type: string }
        attach_id: { type: string }
        events_url: { type: string }
paths:
  /health:
    get:
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
  /ready:
    get:
      summary: Readiness probe
      description: >
        Reports whether the server can serve work right now, with per-dependency
        state. Distinct from /health, which is liveness only and always returns
        200 while the process is up. An orchestrator should restart on a
        /health failure but only drain on a /ready failure. The answer comes
        from a snapshot sampled on a background interval, so this route performs
        no dependency I/O. It fails closed: before the first sample, past the
        staleness bound, when any data dependency failed, or while a required
        same-container module process is absent from the local event bus, the
        answer is 503.
      security: []
      responses:
        "200":
          description: Every dependency sampled ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadyResponse' }
        "503":
          description: "Not ready: a dependency failed, or state is unknown because no sample has completed or the snapshot is stale"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadyResponse' }
  /management/action:
    post:
      summary: Execute an authenticated management control-plane action
      description: >
        Verifies the caller's management JWT, peer identity, capability, and
        request digest before dispatching the management action.
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Management action accepted
          content:
            application/json:
              schema: { type: object }
        "403":
          description: Management action denied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "503":
          description: Management control plane is not configured
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /management/action/challenge:
    post:
      summary: Issue a nonce for a management control-plane action
      description: >
        Requires the dedicated kb management-client mTLS certificate profile.
        The nonce is short-lived, single-use, and bound to this TLS connection,
        peer certificate, target server, and management.action.v1 purpose. The
        subsequent action request must use the same live TLS connection.
      responses:
        "200":
          description: Management action challenge issued
          content:
            application/json:
              schema:
                type: object
                required: [nonce, expires_at]
                properties:
                  nonce: { type: string, description: Canonical base64url without padding }
                  expires_at: { type: string, pattern: '^[0-9]+$' }
        "401": { description: Dedicated management-client certificate required }
        "429": { description: Outstanding challenge capacity reached }
        "503": { description: Management action verification is not configured }
  /management/read/challenge:
    post:
      summary: Issue a nonce for a bounded management read
      description: >
        Requires the dedicated kb management-client mTLS profile. The nonce is
        short-lived, single-use, same-connection bound, and purpose-separated as
        management.read.v1.
      responses:
        "200":
          description: Management-read challenge issued
          content:
            application/json:
              schema:
                type: object
                required: [nonce, purpose, expires_at]
                additionalProperties: false
                properties:
                  nonce: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
                  purpose: { type: string, enum: [management.read.v1] }
                  expires_at: { type: integer }
        "403": { description: Dedicated management-client certificate required }
        "503": { description: Management-read verification is unavailable }
  /management/read/agents:
    get:
      summary: Return the bounded management agent projection
      description: >
        Requires a nonce-bound status proof and a remote_reads JWT on the same
        pinned mTLS connection. The response contains only the frozen safe fields.
      responses:
        "200":
          description: Bounded agent projection
          content:
            application/json:
              schema:
                type: object
                required: [server_id, team, agents]
                additionalProperties: false
                properties:
                  server_id: { type: string, minLength: 1, maxLength: 127, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,126}$' }
                  team: { type: integer, format: int64, minimum: 1 }
                  agents:
                    type: array
                    maxItems: 16
                    items:
                      type: object
                      required: [name, provider, model, enabled, delegate_available, primary_only, max_parallel]
                      additionalProperties: false
                      properties:
                        name: { type: string, pattern: '^[A-Za-z0-9._-]{1,63}$' }
                        provider: { type: string, pattern: '^[A-Za-z0-9._-]{1,15}$' }
                        model: { type: string, maxLength: 127 }
                        enabled: { type: boolean }
                        delegate_available: { type: boolean }
                        primary_only: { type: boolean }
                        max_parallel: { type: integer, minimum: 0, maximum: 1024 }
        "403": { description: Management read forbidden }
        "409": { description: Nonce or JTI already consumed }
        "502": { description: Integrity verification failed }
        "503": { description: Management read unavailable }
  /management/read/config/challenge:
    post:
      summary: Issue a purpose-separated nonce for a bounded configuration read
      responses:
        "200":
          description: Configuration-read challenge issued
          content:
            application/json:
              schema:
                type: object
                required: [nonce, purpose, expires_at]
                additionalProperties: false
                properties:
                  nonce: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
                  purpose: { type: string, enum: [management.read.config.v1] }
                  expires_at: { type: integer }
        "403": { description: Dedicated management-client certificate required }
        "503": { description: Management-read verification is unavailable }
  /management/read/config:
    get:
      summary: Return the bounded five-field safe configuration projection
      responses:
        "200":
          description: Safe configuration projection
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [server_id, team, config]
                properties:
                  server_id: { type: string, minLength: 1, maxLength: 127, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,126}$' }
                  team: { type: integer, format: int64, minimum: 1 }
                  config:
                    type: object
                    additionalProperties: false
                    required: [mtls, remote_writes, client_transport, cli_session_forwarding, require_aimee_git]
                    properties:
                      mtls: { type: string, enum: [off, optional, required] }
                      remote_writes: { type: string, enum: [off, data, full] }
                      client_transport: { type: string, enum: [socket, http, auto] }
                      cli_session_forwarding: { type: boolean }
                      require_aimee_git: { type: boolean }
        "403": { description: Management read forbidden }
        "409": { description: Nonce or JTI already consumed }
        "502": { description: Integrity verification failed }
        "503": { description: Management read unavailable }
  /management/challenge:
    post:
      summary: Issue a nonce for a read-only management health check
      description: >
        Requires the dedicated kb management-client mTLS certificate profile.
        The nonce is short-lived, single-use, and bound to this TLS connection,
        peer certificate, target server, and health-check purpose.
      responses:
        "200":
          description: Management challenge issued
          content:
            application/json:
              schema:
                type: object
                required: [nonce, expires_at]
                properties:
                  nonce: { type: string, description: Canonical base64url without padding }
                  expires_at: { type: string, pattern: '^[0-9]+$' }
        "401": { description: Dedicated management-client certificate required }
        "429": { description: Outstanding challenge capacity reached }
        "503": { description: Management status verification is not configured }
  /management/health:
    get:
      summary: Verify a nonce-bound online revocation staple
      description: >
        Read-only health probe for the reverse management channel. Requires the
        same live mTLS connection used to obtain the challenge and consumes the
        nonce on every identifiable verification attempt.
      parameters:
        - in: header
          name: X-Aimee-Management-Status
          required: true
          schema: { type: string, maxLength: 4096 }
          description: Strict signed management-status JSON staple
      responses:
        "200":
          description: Peer and target status verified
          content:
            application/json:
              schema:
                type: object
                required: [status, server_id]
                properties:
                  status: { type: string, enum: [ok] }
                  server_id: { type: string }
        "401": { description: Missing or invalid peer certificate or staple }
        "403": { description: Authenticated peer, target, or purpose mismatch }
        "409": { description: Replayed, expired, conflicting, or rolled-back challenge }
        "503": { description: Management status verification is unavailable }
  /version:
    get:
      summary: Build version
      security: []
      responses:
        "200":
          description: Version info
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionResponse' }
  /capabilities:
    get:
      summary: Resources this HTTP surface serves
      security: []
      responses:
        "200":
          description: Capability list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapabilitiesResponse' }
  /openapi.json:
    get:
      summary: This OpenAPI document (JSON content type)
      security: []
      responses:
        "200":
          description: The OpenAPI spec
  /openapi.yaml:
    get:
      summary: This OpenAPI document (YAML content type)
      security: []
      responses:
        "200":
          description: The OpenAPI spec
  /models:
    get:
      summary: List available models
      responses:
        "200":
          description: OpenAI-shaped model list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelsList' }
  /embedders:
    get:
      summary: List the embedders this deployment can offer
      description: >
        Read from the embedder registry (scripts/embedders.json), not from a running
        service: the setup wizard needs this list before anything is deployed. `local`
        says whether the current KB image can run the model internally. One is bundled
        in that image. An entry it cannot run is selectable only as a remote role.
        Every other field changes the vectors, so the picker shows them: a different
        `dim` rebuilds the pgvector columns as well as re-embedding the corpus, and
        `prefixed` marks a model whose card defines query/document prefixes.
      responses:
        "200":
          description: The registry as a choosable list
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  embedders:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        dim: { type: integer }
                        context: { type: integer }
                        pooling: { type: string }
                        local: { type: boolean }
                        prefixed: { type: boolean }

  /hosts:
    get:
      summary: Enumerate hosts and their live GPU inventory
      description: >
        The local host plus every registered network host, each probed for its
        GPUs (local via a device query, remote over ssh). Backs the setup
        wizard's host + GPU pickers.
      responses:
        "200":
          description: Hosts with per-host live GPU inventory
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  hosts:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        kind: { type: string, enum: [local, remote] }
                        ip: { type: string }
                        error: { type: string }
                        gpus:
                          type: array
                          items:
                            type: object
                            properties:
                              index: { type: integer }
                              name: { type: string }
                              vendor: { type: string }
                              vram_mb: { type: integer }
  /rules:
    get:
      summary: List active collaboration rules
      responses:
        "200":
          description: Active collaboration rules ({epoch, rules[]})
          content:
            application/json:
              schema:
                type: object
                properties:
                  epoch: { type: integer }
                  rules: { type: array, items: { type: object } }
        "502":
          description: Rules backend (aimee-kb) unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "503":
          description: Rules not available on this server
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /workflow/blocks:
    get:
      summary: Composable workflow block catalog (built-ins + custom registry)
      responses:
        "200":
          description: "{blocks:[{name,produces,accepts[],custom,requires_input,executor?}]}"
          content:
            application/json:
              schema: { type: object }
  /workflow/blocks/{name}:
    put:
      summary: Create or edit a delegate custom block (blocks.yaml; command executors refused)
      requestBody: { content: { application/json: { schema: { type: object } } } }
      responses: { "200": { description: Updated block catalog, content: { application/json: { schema: { type: object } } } } }
    delete:
      summary: Delete a custom delegate block (command blocks are operator-only)
      responses: { "200": { description: Updated block catalog, content: { application/json: { schema: { type: object } } } } }
  /workflow/defs:
    get:
      summary: List saved workflow definitions
      responses:
        "200":
          description: "{defs:[{name,valid,version}]}"
          content:
            application/json:
              schema: { type: object }
  /workflow/triggers:
    get:
      summary: Configured trigger rules (aimee.yaml trigger_rules) that auto-start runs
      responses:
        "200":
          description: "{max_concurrent,triggers:[{source,event,schedule,mode,template,workspace,max_spend_usd?}]}"
          content:
            application/json:
              schema: { type: object }
  /workflow/defs/{name}:
    get:
      summary: One workflow definition (canonical form, version, node graph)
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: "{valid,name,version,canonical,def,error?}"
          content:
            application/json:
              schema: { type: object }
        "400":
          description: Invalid workflow name
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "404":
          description: Workflow not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /workflow/validate:
    post:
      summary: Validate posted workflow YAML without saving
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [yaml]
              properties:
                yaml: { type: string }
      responses:
        "200":
          description: "{valid,name,version,canonical,def,error?}"
          content:
            application/json:
              schema: { type: object }
        "400":
          description: Malformed request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /workflow/save:
    post:
      summary: Canonical-normalize + save a workflow (optimistic lock on prev_version)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, yaml]
              properties:
                name: { type: string }
                yaml: { type: string }
                prev_version: { type: string }
      responses:
        "200":
          description: "{name,version}"
          content:
            application/json:
              schema: { type: object }
        "400":
          description: Invalid definition or name
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "409":
          description: Version conflict / already exists
          content:
            application/json:
              schema: { type: object }
  /workflow/items:
    get:
      summary: List the caller's own workflow work items (submitter-scoped run-state rows)
      responses:
        "200":
          description: "{items:[{id,workflow,version,stage,state,mode,pause_reason,repo,proposal_name,pr_ref,submitter,cum_cost_usd,work_item_max_cost_usd,override_count}]}"
          content:
            application/json:
              schema: { type: object }
  /workflow/items/all:
    get:
      summary: List ALL work items regardless of submitter (operator view, CAP_WORKFLOW_ADMIN)
      responses:
        "200":
          description: All work-item run-state rows
          content:
            application/json:
              schema: { type: object }
  /workflow/repo/tree:
    get:
      summary: List directories + .md files under the server's local project checkout (composer proposal browser), path-confined
      parameters:
        - name: path
          in: query
          required: false
          schema: { type: string }
          description: Relative path under the project root ("" = root); rejects .. / symlink escape
      responses:
        "200":
          description: "{path, entries:[{name,type:dir|file}]}"
          content:
            application/json:
              schema: { type: object }
        "400":
          description: Path escapes the project root
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "404":
          description: Not a directory / not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /workflow/repo/file:
    get:
      summary: Read one .md file under the confined project root (composer proposal browser)
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
          description: Relative .md path under the project root; rejects .. / symlink escape
      responses:
        "200":
          description: "{path, content, truncated}"
          content:
            application/json:
              schema: { type: object }
        "400":
          description: Path escapes the project root or is not a .md file
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "404":
          description: File not found / not a regular file
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /workflow/items/{id}/events:
    get:
      summary: The item's lifecycle timeline (proposal history), owner-only, paginated by event id
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: after
          in: query
          required: false
          schema: { type: integer }
          description: Return events with id greater than this cursor (default 0)
        - name: limit
          in: query
          required: false
          schema: { type: integer }
          description: Max events to return, clamped to [1,200] (default 200)
      responses:
        "200":
          description: "{events:[{id,stage,kind,actor,detail,cost_usd,created_at}], next_after}"
          content:
            application/json:
              schema: { type: object }
        "403":
          description: Not the caller's work item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /workflow/items/{id}/proposal:
    get:
      summary: The source proposal markdown the run is executing (owner-only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: "{proposal_md, truncated}"
          content:
            application/json:
              schema: { type: object }
        "403":
          description: Not the caller's work item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "404":
          description: Proposal file not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /workflow/items/{id}:
    get:
      summary: One work item's run-state
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Work-item run-state
          content:
            application/json:
              schema: { type: object }
        "404":
          description: Work item not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      summary: Delete a run after auto-abandoning it, then remove its rows and proposal file (owner or operator)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: "{id, deleted:true}"
          content:
            application/json:
              schema: { type: object }
        "403":
          description: Not the caller's work item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "404":
          description: Work item not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /workflow/items/{id}/pause:
    post:
      summary: Pause an active run (operator_paused) so the scheduler stops advancing it (owner or operator)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated work-item run-state
          content:
            application/json:
              schema: { type: object }
        "409":
          description: Run already finished or already paused
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /workflow/items/{id}/resume:
    post:
      summary: Resume a paused run and wake the scheduler; refuses a run parked at a human gate (owner or operator)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated work-item run-state
          content:
            application/json:
              schema: { type: object }
        "409":
          description: Run not paused, already finished, or parked at a human gate (use Approve/Reject)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /workflow/items/{id}/stop:
    post:
      summary: Stop a run (abandon it); the scheduler reclaims its worktree (owner or operator)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated work-item run-state
          content:
            application/json:
              schema: { type: object }
        "409":
          description: Run already finished
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /workflow/items/{id}/gate:
