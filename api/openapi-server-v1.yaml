      requestBody: { content: { application/json: { schema: { type: object } } } }
      responses: { "200": { description: Issued, content: { application/json: { schema: { type: object } } } } }
  /cert/sign:
    post:
      summary: Sign a locally generated mTLS client CSR (operator-gated; private key never leaves the client)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cn, csr]
              properties:
                cn: { type: string, minLength: 1 }
                csr: { type: string, minLength: 1, description: PEM-encoded PKCS#10 CSR }
                days: { type: integer, minimum: 1, maximum: 3650, default: 90 }
      responses:
        "200":
          description: Signed client certificate
          content:
            application/json:
              schema:
                type: object
                required: [status, cn, serial, cert]
                properties:
                  status: { type: string, enum: [ok] }
                  cn: { type: string }
                  serial: { type: string }
                  cert: { type: string, description: PEM-encoded X.509 certificate }
        "400": { description: Invalid CSR or request }
        "403": { description: Operator authorization required }
  /cert/list:
    post:
      summary: List issued mTLS client certs (serial, cn, expiry, revoked)
      requestBody: { content: { application/json: { schema: { type: object } } } }
      responses: { "200": { description: Certs, content: { application/json: { schema: { type: object } } } } }
