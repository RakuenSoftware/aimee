openapi: 3.1.0
info:
  title: aimee-server API
  version: "1"
  description: >
    Native HTTP surface for aimee-server. Exposes liveness/discovery
    endpoints, an OpenAI-compatible shaping layer
    (models / chat.completions / completions / embeddings), and persona
    management. The same operations are also available over the NDJSON
    socket; this `/v1` surface is the contract-first HTTP transport.
servers:
  - url: http://127.0.0.1:{port}/v1
    variables:
      port:
        default: "8910"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Required for `/v1/*` over TCP. Unix-domain-socket access is
        authorised by filesystem permissions and needs no token.
  schemas:
    HealthResponse:
      type: object
      properties:
        status: { type: string, example: ok }
        service: { type: string, example: aimee-server }
    VersionResponse:
      type: object
      properties:
        version: { type: string }
        service: { type: string, example: aimee-server }
    CapabilitiesResponse:
      type: object
      properties:
        capabilities:
          type: array
          items: { type: string }
        version: { type: string }
        service: { type: string, example: aimee-server }
    ModelsList:
      type: object
      properties:
        object: { type: string, example: list }
        data:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              object: { type: string, example: model }
              owned_by: { type: string }
    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [system, user, assistant] }
        content: { type: string }
    ChatCompletionRequest:
      type: object
      required: [messages]
      properties:
        model: { type: string, default: aimee }
        messages:
          type: array
          items: { $ref: '#/components/schemas/ChatMessage' }
        temperature: { type: number }
        max_tokens: { type: integer }
        stream: { type: boolean, default: false }
    ChatCompletionResponse:
      type: object
      properties:
        id: { type: string }
        object: { type: string, example: chat.completion }
        model: { type: string }
        choices:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              message: { $ref: '#/components/schemas/ChatMessage' }
              finish_reason: { type: string }
        usage: { $ref: '#/components/schemas/Usage' }
    CompletionRequest:
      type: object
      required: [prompt]
      properties:
        model: { type: string, default: aimee }
        prompt: { type: string }
        temperature: { type: number }
        max_tokens: { type: integer }
        stream: { type: boolean, default: false }
    CompletionResponse:
      type: object
      properties:
        id: { type: string }
        object: { type: string, example: text_completion }
        model: { type: string }
        choices:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              text: { type: string }
              finish_reason: { type: string }
        usage: { $ref: '#/components/schemas/Usage' }
    EmbeddingsRequest:
      type: object
      required: [input]
      properties:
        model: { type: string, default: aimee }
        input:
          oneOf:
            - type: string
            - type: array
              items: { type: string }
    EmbeddingsResponse:
      type: object
      properties:
        object: { type: string, example: list }
        data:
          type: array
          items:
            type: object
            properties:
              object: { type: string, example: embedding }
              index: { type: integer }
              embedding:
                type: array
                items: { type: number }
        model: { type: string }
        usage: { $ref: '#/components/schemas/Usage' }
    Usage:
      type: object
      properties:
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }
        total_tokens: { type: integer }
    ResponsesRequest:
      type: object
      required: [input]
      properties:
        model: { type: string, default: aimee }
        input:
          oneOf:
            - type: string
            - type: array
              items:
                oneOf:
                  - type: string
                  - type: object
                    properties:
                      role: { type: string }
                      content: {}
        previous_response_id: { type: string }
        temperature: { type: number }
        max_tokens: { type: integer }
        stream: { type: boolean, default: false }
    ResponseObject:
      type: object
      properties:
        id: { type: string }
        object: { type: string, example: response }
        created_at: { type: integer }
        model: { type: string }
        status: { type: string, example: completed }
        output:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              type: { type: string, example: message }
              status: { type: string }
              role: { type: string, example: assistant }
              content:
                type: array
                items:
                  type: object
                  properties:
                    type: { type: string, example: output_text }
                    text: { type: string }
                    annotations:
                      type: array
                      items: {}
        usage:
          type: object
          properties:
            input_tokens: { type: integer }
            output_tokens: { type: integer }
            total_tokens: { type: integer }
    Persona:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
    PersonaList:
      type: object
      properties:
        personas:
          type: array
          items: { $ref: '#/components/schemas/Persona' }
    PersonaWrite:
      type: object
      required: [name]
      properties:
        name: { type: string, description: "Filename-safe name (letters, digits, '.', '_', '-')" }
        description: { type: string }
        persona: { type: string, description: "Identity prose; may contain one %s for the cwd" }
        principles: { type: string }
        brief: { type: string }
        delegates: { type: string, enum: [full, readonly, none] }
        check_role: { type: string }
        check_marker: { type: string }
        roles:
          type: array
          items: { type: string }
    RoleTemplate:
      type: object
      properties:
        role: { type: string }
        content: { type: string, description: "Raw template body with {{TASK}}/{{CONTEXT}}" }
    SessionPersonaRequest:
      type: object
      required: [persona]
      properties:
        persona: { type: string }
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            message: { type: string }
            type: { type: string }
    Presence:
      type: object
      description: A live presence (a session shared across one or more attached surfaces).
      properties:
        session_id: { type: string }
        owner: { type: string }
        attachments: { type: integer }
        turn_in_flight: { type: boolean }
        turn_id: { type: string }
    AttachRequest:
      type: object
      required: [surface]
      properties:
        surface: { type: string, description: "Surface label, e.g. cli / webchat / telegram / acp" }
        owner: { type: string, description: "Owner principal the presence is scoped to (first attach fixes it)" }
        target: { type: string, description: "Optional delivery-target spec for outbound routing, e.g. telegram:-100:42" }
        subscribe_mask: { type: integer, description: "OR of presence event classes to route to this surface" }
        persistent: { type: boolean, description: "Keep delivering routed async events after the live stream detaches" }
    AttachResponse:
      type: object
      properties:
        session_id: { type: string }
        attach_id: { type: string }
        events_url: { type: string }
paths:
  /health:
    get:
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
  /version:
    get:
      summary: Build version
      security: []
      responses:
        "200":
          description: Version info
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionResponse' }
  /capabilities:
    get:
      summary: Resources this HTTP surface serves
      security: []
      responses:
        "200":
          description: Capability list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapabilitiesResponse' }
  /openapi.json:
    get:
      summary: This OpenAPI document (JSON content type)
      security: []
      responses:
        "200":
          description: The OpenAPI spec
  /openapi.yaml:
    get:
      summary: This OpenAPI document (YAML content type)
      security: []
      responses:
        "200":
          description: The OpenAPI spec
  /models:
    get:
      summary: List available models
      responses:
        "200":
          description: OpenAI-shaped model list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelsList' }
  /rules:
    get:
      summary: List active collaboration rules
      responses:
        "200":
          description: Active collaboration rules ({epoch, rules[]})
          content:
            application/json:
              schema:
                type: object
                properties:
                  epoch: { type: integer }
                  rules: { type: array, items: { type: object } }
        "502":
          description: Rules backend (aimee-kb) unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "503":
          description: Rules not available on this server
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /workflow/blocks:
    get:
      summary: Composable workflow block catalog (built-ins + custom registry)
      responses:
        "200":
          description: "{blocks:[{name,produces,accepts[],custom,requires_input,executor?}]}"
          content:
            application/json:
              schema: { type: object }
  /workflow/blocks/{name}:
    put:
      summary: Create or edit a delegate custom block (blocks.yaml; command executors refused)
      requestBody: { content: { application/json: { schema: { type: object } } } }
      responses: { "200": { description: Updated block catalog, content: { application/json: { schema: { type: object } } } } }
    delete:
      summary: Delete a custom delegate block (command blocks are operator-only)
      responses: { "200": { description: Updated block catalog, content: { application/json: { schema: { type: object } } } } }
  /workflow/defs:
    get:
      summary: List saved workflow definitions
      responses:
        "200":
          description: "{defs:[{name,valid,version}]}"
          content:
            application/json:
              schema: { type: object }
  /workflow/defs/{name}:
    get:
      summary: One workflow definition (canonical form, version, node graph)
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: "{valid,name,version,canonical,def,error?}"
          content:
            application/json:
              schema: { type: object }
        "400":
          description: Invalid workflow name
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "404":
          description: Workflow not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /workflow/validate:
    post:
      summary: Validate posted workflow YAML without saving
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [yaml]
              properties:
                yaml: { type: string }
      responses:
        "200":
          description: "{valid,name,version,canonical,def,error?}"
          content:
            application/json:
              schema: { type: object }
        "400":
          description: Malformed request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /workflow/save:
    post:
      summary: Canonical-normalize + save a workflow (optimistic lock on prev_version)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, yaml]
              properties:
                name: { type: string }
                yaml: { type: string }
                prev_version: { type: string }
      responses:
        "200":
          description: "{name,version}"
          content:
            application/json:
              schema: { type: object }
        "400":
          description: Invalid definition or name
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "409":
          description: Version conflict / already exists
          content:
            application/json:
              schema: { type: object }
  /workflow/items:
    get:
      summary: List the caller's own workflow work items (submitter-scoped run-state rows)
      responses:
        "200":
          description: "{items:[{id,workflow,version,stage,state,mode,pause_reason,repo,proposal_name,pr_ref,submitter,cum_cost_usd,work_item_max_cost_usd,override_count}]}"
          content:
            application/json:
              schema: { type: object }
  /workflow/items/all:
    get:
      summary: List ALL work items regardless of submitter (operator view, CAP_WORKFLOW_ADMIN)
      responses:
        "200":
          description: All work-item run-state rows
          content:
            application/json:
              schema: { type: object }
  /workflow/items/{id}/events:
    get:
      summary: The item's lifecycle timeline (proposal history), owner-only, paginated by event id
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: after
          in: query
          required: false
          schema: { type: integer }
          description: Return events with id greater than this cursor (default 0)
        - name: limit
          in: query
          required: false
          schema: { type: integer }
          description: Max events to return, clamped to [1,200] (default 200)
      responses:
        "200":
          description: "{events:[{id,stage,kind,actor,detail,cost_usd,created_at}], next_after}"
          content:
            application/json:
              schema: { type: object }
        "403":
          description: Not the caller's work item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /workflow/items/{id}/proposal:
    get:
      summary: The source proposal markdown the run is executing (owner-only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: "{proposal_md, truncated}"
          content:
            application/json:
              schema: { type: object }
        "403":
          description: Not the caller's work item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "404":
          description: Proposal file not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /workflow/items/{id}:
    get:
      summary: One work item's run-state
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Work-item run-state
          content:
            application/json:
              schema: { type: object }
        "404":
          description: Work item not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /workflow/items/{id}/gate:
    post:
      summary: Approve or reject the human gate a run is parked at (operator-only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
                gate: { type: string, description: Gate name (defaults to the parked stage) }
      responses:
        "200":
          description: "{work_item_id, gate, decision}"
          content:
            application/json:
              schema: { type: object }
        "400":
          description: Bad decision
        "404":
          description: Work item not found
  /kb/search:
    post:
      summary: Search the knowledge base (proxied to aimee-kb)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string }
                project: { type: string }
                max_results: { type: integer }
                format: { type: string, enum: [json, text] }
      responses:
        "200":
          description: Knowledge search result envelope
          content:
            application/json:
              schema: { type: object }
        "400":
          description: Missing query
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "502":
          description: Knowledge backend (aimee-kb) unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "503":
          description: Knowledge search not available on this server
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /curiosity:
    get:
      summary: List open curiosity items (proxied to aimee-kb)
      responses:
        "200":
          description: Curiosity items
          content:
            application/json:
              schema: { type: object }
        "502":
          description: Curiosity backend (aimee-kb) unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "503":
          description: Curiosity not available on this server
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /roadmap:
    get:
      summary: List roadmaps (proxied to aimee-kb)
      responses:
        "200":
          description: Roadmap list
          content:
            application/json:
              schema: { type: object }
        "502":
          description: Roadmap backend (aimee-kb) unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "503":
          description: Roadmap not available on this server
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /dev/submit:
    post:
      summary: Submit a proposal for autonomous development (runs server-side via the workflow engine)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [proposal_md]
              properties:
                proposal_md: { type: string, description: The proposal to execute autonomously }
                workflow: { type: string, description: Workflow name (default "build") }
                repo: { type: string, description: Optional repo identifier }
      responses:
        "200":
          description: "{work_item_id, workflow, state}"
          content:
            application/json:
              schema: { type: object }
        "400":
          description: Missing proposal_md
        "500":
          description: Could not create the work item
  /dev/ci-event:
    post:
      summary: CI outcome webhook — record a PR's CI result for its autonomous run and resume the scheduler (HMAC-signed; no capability, fail-closed if the secret is unset)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pr_ref, head_sha, status, signature]
              properties:
                pr_ref: { type: string, description: The PR ref the run opened }
                head_sha: { type: string, description: The commit CI ran on }
                status: { type: string, enum: [passed, failed, error, pending] }
                log_url: { type: string, description: Optional CI log URL }
                signature: { type: string, description: HMAC-SHA256 hex over "pr_ref|head_sha|status" keyed by AIMEE_CI_WEBHOOK_SECRET }
      responses:
        "200":
          description: "{ok, work_item, duplicate}"
          content:
            application/json:
              schema: { type: object }
        "400":
          description: Missing/invalid fields or unknown status
        "401":
          description: Invalid signature
        "404":
          description: No work item for pr_ref
        "413":
          description: Body too large
        "503":
          description: Webhook disabled (AIMEE_CI_WEBHOOK_SECRET unset)
  /dev/sweep:
    post:
      summary: Deepening sweep (analysis-only) — propose duplication-across-call-sites seams, re-ground each against the live code index, and return a ranked report. Files nothing.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                project: { type: string, description: Indexed project name to scope the walk (default first indexed) }
      responses:
        "200":
          description: "{candidates[], areas_total, areas_run, files, strong, worth_exploring, rejected, excluded, analysis_only}"
          content:
            application/json:
              schema: { type: object }
        "400":
          description: No indexed project / no source files
  /runs:
    post:
      summary: Create and run an inference run (synchronous); retrievable by id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input]
              properties:
                model: { type: string }
                input: {}
                temperature: { type: number }
                max_tokens: { type: integer }
      responses:
        "200":
          description: Completed run object
          content:
            application/json:
              schema: { type: object }
        "400":
          description: Invalid run request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "502":
          description: Inference failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "503":
          description: Runs not available on this server
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /runs/{id}:
    get:
      summary: Retrieve a previously created run
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The run object
          content:
            application/json:
              schema: { type: object }
        "404":
          description: No such run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /runs/{id}/events:
    get:
      summary: Stream a run's output as SSE (replay for completed runs)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: text/event-stream of response.output_text.delta events + a terminal done event
        "404":
          description: No such run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /runs/{id}/stop:
    post:
      summary: Stop a run (no-op for already-completed synchronous runs)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The (already-completed) run object
          content:
            application/json:
              schema: { type: object }
        "404":
          description: No such run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /cli/session:
    post:
      summary: Create/ensure a server-hosted Claude PTY session (terminal forwarding)
      description: >
        Starts (or reuses) a detached tmux session running `claude` plus a
        forkpty child, so a thin client can drive the raw interactive terminal
        over /v1. Gated by `aimee.api.cli_session_forwarding` (404 when off).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id]
              properties:
                session_id: { type: string }
                rows: { type: integer }
                cols: { type: integer }
      responses:
        "200":
          description: Session ready
          content:
            application/json:
              schema: { type: object }
        "400":
          description: Invalid session id or body
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "404":
          description: CLI session forwarding disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      summary: Kill a server-hosted Claude PTY session
      parameters:
        - name: session_id
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Session killed (no-op for unknown id)
          content:
            application/json:
              schema: { type: object }
  /cli/session/{id}/input:
    post:
      summary: Queue raw input (base64) to a PTY session
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data: { type: string, description: base64-encoded raw input bytes }
      responses:
        "200":
          description: Input queued
          content:
            application/json:
              schema: { type: object }
        "404":
          description: Unknown session or invalid input
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /cli/session/{id}/resize:
    post:
      summary: Set the PTY window size
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
