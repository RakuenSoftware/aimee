            schema:
              type: object
              required: [name, content]
              properties:
                name: { type: string }
                content: { type: string }
      responses:
        "200":
          description: Skill mutation envelope
          content:
            application/json:
              schema: { type: object }
        "400":
          description: Missing fields, lint failure, or invalid body
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /skills/archive:
    post:
      summary: Archive a skill (local-only)
      description: Mutating route; reachable only on the local Unix-domain socket.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                absorbed_into: { type: string }
      responses:
        "200":
          description: Skill mutation envelope
          content:
            application/json:
              schema: { type: object }
        "400":
          description: Missing name or invalid body
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /skills/pin:
    post:
