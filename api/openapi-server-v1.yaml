openapi: 3.1.0
info:
  title: aimee-server API
  version: "1"
  description: >
    Native HTTP surface for aimee-server. Exposes liveness/discovery
    endpoints, an OpenAI-compatible shaping layer
    (models / chat.completions / completions / embeddings), and persona
    management. The same operations are also available over the NDJSON
    socket; this `/v1` surface is the contract-first HTTP transport.
servers:
  - url: http://127.0.0.1:{port}/v1
    variables:
      port:
        default: "8910"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Required for `/v1/*` over TCP. Unix-domain-socket access is
        authorised by filesystem permissions and needs no token.
  schemas:
    HealthResponse:
      type: object
      properties:
        status: { type: string, example: ok }
        service: { type: string, example: aimee-server }
    VersionResponse:
      type: object
      properties:
        version: { type: string }
        service: { type: string, example: aimee-server }
    CapabilitiesResponse:
      type: object
      properties:
        capabilities:
          type: array
          items: { type: string }
        version: { type: string }
        service: { type: string, example: aimee-server }
    ModelsList:
      type: object
      properties:
        object: { type: string, example: list }
        data:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              object: { type: string, example: model }
              owned_by: { type: string }
    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [system, user, assistant] }
        content: { type: string }
    ChatCompletionRequest:
      type: object
      required: [messages]
      properties:
        model: { type: string, default: aimee }
        messages:
          type: array
          items: { $ref: '#/components/schemas/ChatMessage' }
        temperature: { type: number }
        max_tokens: { type: integer }
        stream: { type: boolean, default: false }
    ChatCompletionResponse:
      type: object
      properties:
        id: { type: string }
        object: { type: string, example: chat.completion }
        model: { type: string }
        choices:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              message: { $ref: '#/components/schemas/ChatMessage' }
              finish_reason: { type: string }
        usage: { $ref: '#/components/schemas/Usage' }
    CompletionRequest:
      type: object
      required: [prompt]
      properties:
        model: { type: string, default: aimee }
        prompt: { type: string }
        temperature: { type: number }
        max_tokens: { type: integer }
        stream: { type: boolean, default: false }
    CompletionResponse:
      type: object
      properties:
        id: { type: string }
        object: { type: string, example: text_completion }
        model: { type: string }
        choices:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              text: { type: string }
              finish_reason: { type: string }
        usage: { $ref: '#/components/schemas/Usage' }
    EmbeddingsRequest:
      type: object
      required: [input]
      properties:
        model: { type: string, default: aimee }
        input:
          oneOf:
            - type: string
            - type: array
              items: { type: string }
    EmbeddingsResponse:
      type: object
      properties:
        object: { type: string, example: list }
        data:
          type: array
          items:
            type: object
            properties:
              object: { type: string, example: embedding }
              index: { type: integer }
              embedding:
                type: array
                items: { type: number }
        model: { type: string }
        usage: { $ref: '#/components/schemas/Usage' }
    Usage:
      type: object
      properties:
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }
        total_tokens: { type: integer }
    ResponsesRequest:
      type: object
      required: [input]
      properties:
        model: { type: string, default: aimee }
        input:
          oneOf:
            - type: string
            - type: array
              items:
                oneOf:
                  - type: string
                  - type: object
                    properties:
                      role: { type: string }
                      content: {}
        previous_response_id: { type: string }
        temperature: { type: number }
        max_tokens: { type: integer }
        stream: { type: boolean, default: false }
    ResponseObject:
      type: object
      properties:
        id: { type: string }
        object: { type: string, example: response }
        created_at: { type: integer }
        model: { type: string }
        status: { type: string, example: completed }
        output:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              type: { type: string, example: message }
              status: { type: string }
              role: { type: string, example: assistant }
              content:
                type: array
                items:
                  type: object
                  properties:
                    type: { type: string, example: output_text }
                    text: { type: string }
                    annotations:
                      type: array
                      items: {}
        usage:
          type: object
          properties:
            input_tokens: { type: integer }
            output_tokens: { type: integer }
            total_tokens: { type: integer }
    Persona:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
    PersonaList:
      type: object
      properties:
        personas:
          type: array
          items: { $ref: '#/components/schemas/Persona' }
    PersonaWrite:
      type: object
      required: [name]
      properties:
        name: { type: string, description: "Filename-safe name (letters, digits, '.', '_', '-')" }
        description: { type: string }
        persona: { type: string, description: "Identity prose; may contain one %s for the cwd" }
        principles: { type: string }
        brief: { type: string }
        delegates: { type: string, enum: [full, readonly, none] }
        check_role: { type: string }
        check_marker: { type: string }
        roles:
          type: array
          items: { type: string }
    RoleTemplate:
      type: object
      properties:
        role: { type: string }
        content: { type: string, description: "Raw template body with {{TASK}}/{{CONTEXT}}" }
    SessionPersonaRequest:
      type: object
      required: [persona]
      properties:
        persona: { type: string }
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            message: { type: string }
            type: { type: string }
    Presence:
      type: object
      description: A live presence (a session shared across one or more attached surfaces).
      properties:
        session_id: { type: string }
        owner: { type: string }
        attachments: { type: integer }
        turn_in_flight: { type: boolean }
        turn_id: { type: string }
    AttachRequest:
      type: object
      required: [surface]
      properties:
        surface: { type: string, description: "Surface label, e.g. cli / webchat / telegram / acp" }
        owner: { type: string, description: "Owner principal the presence is scoped to (first attach fixes it)" }
        target: { type: string, description: "Optional delivery-target spec for outbound routing, e.g. telegram:-100:42" }
        subscribe_mask: { type: integer, description: "OR of presence event classes to route to this surface" }
        persistent: { type: boolean, description: "Keep delivering routed async events after the live stream detaches" }
    AttachResponse:
      type: object
      properties:
        session_id: { type: string }
        attach_id: { type: string }
        events_url: { type: string }
paths:
  /health:
    get:
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
  /version:
    get:
      summary: Build version
      security: []
      responses:
        "200":
          description: Version info
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionResponse' }
  /capabilities:
    get:
      summary: Resources this HTTP surface serves
      security: []
      responses:
        "200":
          description: Capability list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapabilitiesResponse' }
  /openapi.json:
    get:
      summary: This OpenAPI document (JSON content type)
      security: []
      responses:
        "200":
          description: The OpenAPI spec
  /openapi.yaml:
    get:
      summary: This OpenAPI document (YAML content type)
      security: []
      responses:
        "200":
          description: The OpenAPI spec
  /models:
    get:
      summary: List available models
      responses:
        "200":
          description: OpenAI-shaped model list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelsList' }
  /rules:
    get:
      summary: List active collaboration rules
      responses:
        "200":
          description: Active collaboration rules ({epoch, rules[]})
          content:
            application/json:
              schema:
                type: object
                properties:
                  epoch: { type: integer }
                  rules: { type: array, items: { type: object } }
        "502":
          description: Rules backend (aimee-kb) unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "503":
          description: Rules not available on this server
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /kb/search:
    post:
      summary: Search the knowledge base (proxied to aimee-kb)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string }
                project: { type: string }
                max_results: { type: integer }
                format: { type: string, enum: [json, text] }
      responses:
        "200":
          description: Knowledge search result envelope
          content:
            application/json:
              schema: { type: object }
        "400":
          description: Missing query
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "502":
          description: Knowledge backend (aimee-kb) unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "503":
          description: Knowledge search not available on this server
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /curiosity:
    get:
      summary: List open curiosity items (proxied to aimee-kb)
      responses:
        "200":
          description: Curiosity items
          content:
            application/json:
              schema: { type: object }
        "502":
          description: Curiosity backend (aimee-kb) unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "503":
          description: Curiosity not available on this server
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /roadmap:
    get:
      summary: List roadmaps (proxied to aimee-kb)
      responses:
        "200":
          description: Roadmap list
          content:
            application/json:
              schema: { type: object }
        "502":
          description: Roadmap backend (aimee-kb) unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "503":
          description: Roadmap not available on this server
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /runs:
    post:
      summary: Create and run an inference run (synchronous); retrievable by id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input]
              properties:
                model: { type: string }
                input: {}
                temperature: { type: number }
                max_tokens: { type: integer }
      responses:
        "200":
          description: Completed run object
          content:
            application/json:
              schema: { type: object }
        "400":
          description: Invalid run request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "502":
          description: Inference failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "503":
          description: Runs not available on this server
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /runs/{id}:
    get:
      summary: Retrieve a previously created run
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The run object
          content:
            application/json:
              schema: { type: object }
        "404":
          description: No such run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /runs/{id}/events:
    get:
      summary: Stream a run's output as SSE (replay for completed runs)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: text/event-stream of response.output_text.delta events + a terminal done event
        "404":
          description: No such run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /runs/{id}/stop:
    post:
      summary: Stop a run (no-op for already-completed synchronous runs)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The (already-completed) run object
          content:
            application/json:
              schema: { type: object }
        "404":
          description: No such run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /agents:
    get:
      summary: List configured agents and the default agent
      responses:
        "200":
          description: Configured agents ({default, agents[]})
          content:
            application/json:
              schema:
                type: object
                properties:
                  default: { type: string }
                  agents:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        provider: { type: string }
                        model: { type: string }
                        enabled: { type: boolean }
                        roles: { type: array, items: { type: string } }
        "502":
          description: Agent configuration unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "503":
          description: Agents not available on this server
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /kb/status:
    get:
      summary: Knowledge-base / vector status (proxied to aimee-kb)
      responses:
        "200":
          description: KB / vector status
          content:
            application/json:
              schema: { type: object }
        "502":
          description: Knowledge backend (aimee-kb) unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "503":
          description: KB status not available on this server
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /memory/recall:
    post:
      summary: Recall relevant memories (proxied to aimee-kb)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_hint]
              properties:
                task_hint: { type: string }
                query: { type: string }
                limit_tokens: { type: integer }
                session_start: { type: boolean }
      responses:
        "200":
          description: Memory recall envelope ({recall:...})
          content:
            application/json:
              schema: { type: object }
        "400":
          description: Missing task_hint
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "502":
          description: Memory backend (aimee-kb) unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "503":
          description: Memory recall not available on this server
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /code/audit:
    post:
      summary: Graph-derived code-health audit (proxied to aimee-kb)
      description: >-
        Dead exports, import cycles, and body-hash clones derived from the
        code graph (entity_edges) and code_embeddings.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                project: { type: string }
                limit: { type: integer }
      responses:
        "200":
          description: Audit bundle ({dead_exports, cycles, clones})
          content:
            application/json:
              schema: { type: object }
        "502":
          description: Knowledge service (aimee-kb) unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /notes:
    get:
      summary: List notes (proxied to aimee-kb)
      responses:
        "200":
          description: Notes list
          content:
            application/json:
              schema: { type: object }
        "502":
          description: Notes backend (aimee-kb) unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "503":
          description: Notes not available on this server
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /index/find:
    post:
      summary: Find indexed code symbols by identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier]
              properties:
                identifier: { type: string }
      responses:
        "200":
          description: Index hits envelope
          content:
            application/json:
              schema: { type: object }
        "400":
          description: Missing identifier or invalid body
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "502":
          description: Index backend (aimee-kb) unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /index/list:
    post:
      summary: List indexed projects
      responses:
        "200":
          description: Indexed projects envelope
          content:
            application/json:
              schema: { type: object }
        "502":
          description: Index backend (aimee-kb) unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /index/structure:
    post:
      summary: List the definitions in an indexed file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project, file_path]
              properties:
                project: { type: string }
                file_path: { type: string }
      responses:
        "200":
          description: File structure envelope
          content:
            application/json:
              schema: { type: object }
        "400":
          description: Missing project/file_path or invalid body
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "502":
          description: Index backend (aimee-kb) unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /index/find_callers:
    post:
      summary: Find callers of an indexed symbol
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol]
              properties:
                symbol: { type: string }
                project: { type: string }
      responses:
        "200":
          description: Caller hits envelope
          content:
            application/json:
              schema: { type: object }
        "400":
          description: Missing symbol or invalid body
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "502":
          description: Index backend (aimee-kb) unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /index/blast_radius:
    post:
      summary: Dependency blast radius for an indexed file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project, file_path]
              properties:
                project: { type: string }
                file_path: { type: string }
      responses:
        "200":
          description: Blast radius envelope
          content:
            application/json:
              schema: { type: object }
        "400":
          description: Missing project/file_path or invalid body
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "502":
          description: Index backend (aimee-kb) unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /skills:
    get:
      summary: List available skills
      responses:
        "200":
          description: Skills envelope
          content:
            application/json:
              schema: { type: object }
  /skills/show:
    post:
      summary: Show a skill's definition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                file_path: { type: string }
      responses:
        "200":
          description: Skill definition envelope
          content:
            application/json:
              schema: { type: object }
        "400":
          description: Missing name or invalid body
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /work:
    get:
      summary: List work-queue items
      responses:
        "200":
          description: Work items envelope
          content:
            application/json:
              schema: { type: object }
  /work/stats:
    get:
      summary: Work-queue counts by state
      responses:
        "200":
          description: Work stats envelope
          content:
            application/json:
              schema: { type: object }
  /hud:
    get:
      summary: Session HUD status snapshot
      responses:
        "200":
          description: HUD status envelope
          content:
            application/json:
              schema: { type: object }
  /trajectory/export:
    post:
      summary: Export a session trajectory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id]
              properties:
                session_id: { type: string }
                compress: { type: boolean }
                max_result_bytes: { type: integer }
      responses:
        "200":
          description: Trajectory export envelope
          content:
            application/json:
              schema: { type: object }
        "400":
          description: Missing session_id or invalid body
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /toolsets:
    get:
      summary: List effective toolsets
      responses:
        "200":
          description: Toolsets envelope
          content:
            application/json:
              schema: { type: object }
  /toolsets/show:
    post:
      summary: Show a toolset's resolved tools
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "200":
          description: Toolset envelope
          content:
            application/json:
              schema: { type: object }
        "400":
          description: Missing name or invalid body
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /collab_rules:
    get:
      summary: List collaboration rules
      responses:
        "200":
          description: Collaboration rules envelope
          content:
            application/json:
              schema: { type: object }
  /collab_rules/active:
    get:
      summary: List active collaboration rules
      responses:
        "200":
          description: Active collaboration rules envelope
          content:
            application/json:
              schema: { type: object }
  /wm/list:
    post:
      summary: List working-memory entries for a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id]
              properties:
                session_id: { type: string }
      responses:
        "200":
          description: Working-memory envelope
          content:
            application/json:
              schema: { type: object }
        "400":
          description: Missing session_id or invalid body
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /attempts/list:
    post:
      summary: List attempt-log entries for a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id]
              properties:
                session_id: { type: string }
      responses:
        "200":
          description: Attempt-log envelope
          content:
            application/json:
              schema: { type: object }
        "400":
          description: Missing session_id or invalid body
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /aux/config:
    get:
      summary: Show auxiliary-model configuration
      responses:
        "200":
          description: Auxiliary model config envelope
          content:
