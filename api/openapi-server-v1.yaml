  /shadow/enable:
    post:
      summary: Arm shadow-traffic publishing (runtime-only; resets to off on restart)
      description: >-
        Operator-only (CAP_SHADOW_ADMIN, full-trust). Arms the shadow-traffic
        mirror so subscribers receive a copy of each completion request. In-memory
        only: never persisted, so a restart always boots disarmed.
      responses:
        "200":
          description: Armed
  /shadow/disable:
    post:
      summary: Disarm shadow-traffic publishing and forget all subscribers
      description: Operator-only (CAP_SHADOW_ADMIN, full-trust). Hard stop.
      responses:
        "200":
          description: Disarmed
  /shadow/subscribe:
    post:
      summary: Register a subscriber to receive mirrored completion traffic
      description: >-
        Operator-only (CAP_SHADOW_ADMIN, full-trust). The caller's real /v1
        ingress (`url`) receives a fire-and-forget copy of each completion request,
        tagged X-Aimee-Shadow, authenticated with the supplied `bearer`. Refused
        while publishing is disarmed. Idempotent by url.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, description: Subscriber's /v1 base URL }
                bearer: { type: string, description: Bearer presented to the subscriber }
      responses:
        "200":
          description: Subscribed
        "403":
          description: Shadow publishing is disarmed
  /shadow/unsubscribe:
    post:
      summary: Remove a shadow-traffic subscriber
      description: Operator-only (CAP_SHADOW_ADMIN, full-trust).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string }
      responses:
        "200":
          description: Unsubscribed (or absent)
  /chat/completions:
    post:
      summary: Create a chat completion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatCompletionRequest' }
      responses:
        "200":
          description: Chat completion
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatCompletionResponse' }
        "400":
          description: Invalid request (e.g. stream not yet supported)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /chat/stream:
    post:
      summary: Native streaming chat (aimee event stream)
      description: >
        Stream a chat turn as newline-delimited aimee events
        (turn_start / text / thinking / turn_end / session / usage / done /
        error), the same event shape the NDJSON socket emits. Used by the
        first-party webchat UI; distinct from the OpenAI-shaped
        /chat/completions. Requires CAP_CHAT (UDS, or an unscoped TCP bearer).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
                aimee_session_id: { type: string }
                claude_session_id: { type: string }
                cwd: { type: string }
      responses:
        "200":
          description: Newline-delimited aimee chat events (read until close)
          content:
            application/x-ndjson:
              schema: { type: string }
        "403":
          description: Caller lacks CAP_CHAT (e.g. a scoped bearer)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /chat/interrupt:
    post:
      summary: Steer an in-flight chat turn
      description: >
        Stop the in-flight turn for a session and queue a follow-up `message`
        the server auto-continues as the next, server-initiated turn (streamed
        to the session's /events presence stream). Owner-authorized like
        chat.graceful_cancel. When no turn is in flight, nothing is queued and
        `interrupted` is false. Requires CAP_CHAT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [aimee_session_id, message]
              properties:
                aimee_session_id: { type: string }
                message: { type: string }
      responses:
        "200":
          description: Interrupt accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  session_id: { type: string }
                  interrupted: { type: boolean }
        "403":
          description: Caller lacks CAP_CHAT or is not the session owner
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /chat/live:
    post:
      summary: Poll the live (in-flight) turn for a session
      description: >
        The browser's fixed-timer polling source of truth for an in-flight turn.
        The server mirrors the tmux pane scrape into a per-session db1 row
        (webchat_live) as the answer streams; clients tail it on a ~500ms timer
        instead of reconciling the per-token SSE stream. Returns the row only
        when its monotonic `rev` advanced past `since_rev` (`changed:false`
        otherwise, so an unchanged turn costs nothing). Requires CAP_SESSION_READ.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id]
              properties:
                session_id: { type: string }
                since_rev: { type: integer }
      responses:
        "200":
          description: Live turn state (when changed) or changed=false
          content:
            application/json:
              schema:
                type: object
                properties:
                  changed: { type: boolean }
                  rev: { type: integer }
                  turn_id: { type: string }
                  text: { type: string }
                  status: { type: string }
        "403":
          description: Caller lacks CAP_SESSION_READ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /completions:
    post:
      summary: Create a text completion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompletionRequest' }
      responses:
