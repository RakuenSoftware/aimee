  /insights/overview:
    get:
      summary: Insights overview
      description: >-
        Usage and cost summary over the requested window. Cost is reported with
        explicit spend semantics: the top-level estimated_cost_usd is the legacy
        all-rows figure (kept for backwards compatibility), while the spend object
        breaks cost down by usage_kind so realized provider-reported spend is
        separated from estimated, avoided (dedup-skipped), and partial (aborted)
        rows. spend.total is the billable figure and is REALIZED ONLY — estimated,
        avoided, and partial are reported individually but excluded from the total.
      responses:
        "200":
          description: Insights
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  days: { type: integer }
                  total_calls: { type: integer }
                  prompt_tokens: { type: integer }
                  completion_tokens: { type: integer }
                  cache_write_tokens: { type: integer }
                  cache_read_tokens: { type: integer }
                  estimated_cost_usd:
                    type: number
                    description: Legacy all-rows estimated cost; prefer spend.total for billable spend.
                  spend:
                    type: object
                    description: Cost broken down by usage_kind (§ ingress cost-accounting).
                    properties:
                      realized: { type: number, description: Provider-reported usage (the billable spend). }
                      estimated: { type: number, description: No provider usage; aimee-estimated. Not in total. }
                      avoided: { type: number, description: Dedup-skipped; not counted as spend. }
                      partial: { type: number, description: Aborted mid-stream; not counted as spend. }
                      total: { type: number, description: Billable total — realized only (excludes estimated/avoided/partial). }
                  models:
                    type: array
                    items:
                      type: object
                      properties:
                        model: { type: string }
                        calls: { type: integer }
                        prompt_tokens: { type: integer }
                        completion_tokens: { type: integer }
                        estimated_cost_usd: { type: number }
                  sources:
                    type: array
                    description: Per turn-origin (internal agent vs ingress surfaces).
                    items:
                      type: object
                      properties:
                        source: { type: string }
                        calls: { type: integer }
                        prompt_tokens: { type: integer }
                        completion_tokens: { type: integer }
                        estimated_cost_usd: { type: number }
