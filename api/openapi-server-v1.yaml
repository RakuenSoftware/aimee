          content:
            application/json:
              schema: { type: object }
        "502":
          description: Knowledge service (aimee-kb) unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /audit/trace:
    post:
      summary: Per-turn retrieval-evidence trace (proxied to aimee-kb)
      description: >-
        Reconstruct what a turn retrieved: given the caller-visible turn_id (the
        X-Aimee-Retrieval-Event response-header value), return the per-turn
        retrieval_event and its surfaced ids. trace_status is one of the
        exhaustive states ok / not_instrumented / not_evaluated /
        evidence_unavailable (P1 produces ok and evidence_unavailable). Requires
        aimee-kb. Gated by kb_evidence_emit_enabled at emit time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [turn_id]
              properties:
                turn_id: { type: string }
      responses:
        "200":
          description: Trace bundle ({status, trace_status, turn_id, retrieval_event_id?, event?})
          content:
            application/json:
              schema: { type: object }
        "502":
          description: Knowledge service (aimee-kb) unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /audit/provenance:
    post:
      summary: Per-turn source provenance (proxied to aimee-kb)
      description: >-
        Which sources grounded a turn's answer, at which version: given the
        caller-visible turn_id, resolve each source id recorded on the turn's
        retrieval_event to {id, kind, source, version, present, turn_version,
        drifted}. version is the source row's updated_at read live (current);
        turn_version is the point-in-time version captured at emit; drifted is true
        when a still-present source's current version differs from turn_version
        (version-change drift). present is false when the source no longer exists
        (deleted/superseded since the turn). provenance_status is one of the
        exhaustive states ok / not_instrumented / not_evaluated /
        evidence_unavailable (P2 produces ok and evidence_unavailable). Requires
        aimee-kb. Gated by kb_evidence_emit_enabled at emit time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [turn_id]
              properties:
                turn_id: { type: string }
      responses:
        "200":
          description: Provenance bundle ({status, provenance_status, turn_id, retrieval_event_id?, sources?})
          content:
            application/json:
              schema: { type: object }
        "502":
          description: Knowledge service (aimee-kb) unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /audit/fidelity:
    post:
      summary: Per-turn answer-fidelity report (proxied to aimee-kb)
      description: >-
        How faithful a turn's answer was to its own injected evidence: given the
        caller-visible turn_id, return the answer-level fidelity_report (supported
        / unsupported / abstained claim buckets) plus the per-chunk
        attribution_count. fidelity_status is one of the exhaustive states ok /
        not_instrumented / not_evaluated / evidence_unavailable. This read produces
        ok, not_evaluated (the honest default when the default-off fidelity judge
        has not run for the turn), and evidence_unavailable (lookup error);
        not_instrumented is reserved for paths that emit no evidence and is set at
        emit time. Requires aimee-kb. Gated by fidelity_check_enabled at emit time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [turn_id]
              properties:
                turn_id: { type: string }
      responses:
        "200":
          description: Fidelity bundle ({status, fidelity_status, turn_id, report?, attribution_count?})
          content:
            application/json:
              schema: { type: object }
        "502":
          description: Knowledge service (aimee-kb) unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /css/signals:
    post:
      summary: CSS migration assistant signals (proxied to aimee-kb)
      description: >-
        Query the CSS migration assistant's style graph and pipeline for a
        project. op is one of dead-rules, conflicts, duplicate-declarations,
        duplicate-selectors, unresolved, migrate-enumerate, migrate-list,
        rules-doc. Read ops return {results, count}; migrate-enumerate returns
        {units}; rules-doc returns {rules_doc}. Requires css_style_graph_enabled
        and a re-index to populate the graph; proxied to aimee-kb (DB2-side).
      requestBody:
        required: true
