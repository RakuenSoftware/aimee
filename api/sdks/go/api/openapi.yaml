openapi: 3.1.0
info:
  description: |
    Public HTTP API for the aimee knowledge-base sidecar (aimee-kb).
    Enabled by setting kb.api.http_port in aimee config.
    Optional bearer-token auth via kb.api.bearer_token.
  title: aimee-kb API
  version: "1"
servers:
- url: "http://127.0.0.1:{port}/v1"
  variables:
    port:
      default: "8090"
      description: Configured kb_api_http_port
security:
- bearerAuth: []
paths:
  /health:
    get:
      description: "Returns {\"status\":\"ok\"} when the service is running."
      operationId: getHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
          description: Service is healthy
      security: []
      summary: Service health check
    head:
      operationId: headHealth
      responses:
        "200":
          description: Service is healthy
      security: []
      summary: Service health check (HEAD)
  /version:
    get:
      operationId: getVersion
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
          description: Version information
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
      summary: Service version
  /capabilities:
    get:
      description: |
        Returns the set of capability strings this aimee-kb instance supports.
        Phase 1 always returns ["memory", "search", "index"].
      operationId: getCapabilities
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesResponse"
          description: Capability list
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
      summary: Advertised capabilities
  /intelligence/calibration/readiness:
    get:
      operationId: getIntelligenceCalibrationReadiness
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: Calibration readiness summary
        "401":
          description: Unauthorized
      summary: Calibration readiness
  /intelligence/demotion/check:
    get:
      operationId: getIntelligenceDemotionCheck
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: Demotion readiness summary
        "401":
          description: Unauthorized
      summary: Dry-run demotion readiness check
  /intelligence/bandit/export:
    get:
      operationId: getIntelligenceBanditExport
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: Bandit decisions and arm stats
        "401":
          description: Unauthorized
      summary: Export fusion bandit decision data
  /intelligence/bandit/sample:
    post:
      operationId: postIntelligenceBanditSample
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: Selected arm + decision id (or status disabled)
        "401":
          description: Unauthorized
      summary: Sample an arm for a decision point (server-side decision points)
  /intelligence/bandit/close:
    post:
      operationId: postIntelligenceBanditClose
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: Close result
        "401":
          description: Unauthorized
      summary: Close a sampled decision with its observed reward
  /intelligence/bandit/promote:
    post:
      operationId: postIntelligenceBanditPromote
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: Promotion result (rollback_arm)
        "401":
          description: Unauthorized
      summary: Persist the production-default arm for a decision point
  /actions/{action}:
    post:
      operationId: postAction
      parameters:
      - explode: false
        in: path
        name: action
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              type: object
        required: false
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: Action response
        "401":
          description: Unauthorized
        "404":
          description: Unknown action
      summary: Execute a versioned knowledge-service action
  /docs:
    post:
      description: |
        Accepts multipart/form-data with a required `file` part and an optional
        `scope` field (default: global). Normalizes to markdown, stores in DB2,
        and queues an extract_doc job. Returns existing doc_id on idempotent re-upload.
      operationId: postDocs
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/postDocs_request"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocIngestResponse"
          description: Document ingested
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocIngestResponse"
          description: Idempotent re-upload (existing doc_id returned)
        "400":
          description: Missing file part
        "401":
          description: Unauthorized
        "422":
          description: Normalization failed (converter error)
        "503":
          description: DB unavailable
      summary: Upload a document for ingest
  /docs/manifest:
    post:
      operationId: postDocsManifest
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocsManifestRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocsManifestResponse"
          description: Manifest diff
        "400":
          description: Invalid manifest request
        "401":
          description: Unauthorized
        "405":
          description: Method not allowed
        "500":
          description: Serialization failed
        "503":
          description: DB unavailable
      summary: Check which uploaded document hashes are absent
  /docs/{id}:
    delete:
      operationId: deleteDoc
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      responses:
        "200":
          description: Document deleted
        "401":
          description: Unauthorized
        "404":
          description: Document not found
      summary: Delete a staged document
    get:
      operationId: getDoc
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocMetadataResponse"
          description: Document metadata
        "401":
          description: Unauthorized
        "404":
          description: Document not found
      summary: Retrieve doc metadata by id
  /review:
    get:
      operationId: getReview
      parameters:
      - explode: true
        in: query
        name: cursor
        required: false
        schema:
          format: int64
          type: integer
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 10
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewQueueResponse"
          description: Review queue
        "401":
          description: Unauthorized
      summary: List staged documents pending review
  /review/{id}/accept:
    post:
      operationId: postReviewAccept
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewAcceptRequest"
        required: false
      responses:
        "200":
          description: Document accepted
        "400":
          description: Invalid id
        "401":
          description: Unauthorized
        "404":
          description: Document not found
      summary: Accept a staged document
  /review/{id}/reject:
    post:
      operationId: postReviewReject
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRejectRequest"
        required: true
      responses:
        "200":
          description: Document rejected
        "400":
          description: Invalid id
        "401":
          description: Unauthorized
        "404":
          description: Document not found
      summary: Reject a staged document
  /releases:
    post:
      operationId: postReleases
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReleaseRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateReleaseResponse"
          description: Release created
        "400":
          description: Missing name
        "401":
          description: Unauthorized
        "409":
          description: Name already exists
      summary: Create a new corpus release
  /releases/active:
    get:
      operationId: getActiveRelease
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveReleaseResponse"
          description: Active release (or null if none)
        "401":
          description: Unauthorized
      summary: Get the currently active corpus release
  /releases/{id}/promote:
    post:
      operationId: postPromote
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      responses:
        "200":
          description: Release promoted
        "400":
          description: Invalid id
        "401":
          description: Unauthorized
        "409":
          description: Promote failed
      summary: Promote a release to active
  /releases/{id}/rollback:
    post:
      operationId: postRollback
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RollbackRequest"
        required: false
      responses:
        "200":
          description: Rolled back
        "400":
          description: Invalid id
        "401":
          description: Unauthorized
        "409":
          description: No prior release to roll back to
      summary: Roll back to a prior release
  /search:
    post:
      operationId: postSearch
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
          description: Search results
        "400":
          description: Bad request (missing query)
        "401":
          description: Unauthorized
      summary: Hybrid knowledge search
  /artifacts/{id}:
    get:
      operationId: getArtifact
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactResponse"
          description: Artifact payload and citations
        "401":
          description: Unauthorized
        "404":
          description: Artifact not found
      summary: Retrieve an artifact by UUID
  /artifacts/{id}/links:
    get:
      operationId: getArtifactLinks
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactLinksResponse"
          description: Artifact links
        "401":
          description: Unauthorized
        "404":
          description: Artifact not found
      summary: Retrieve outgoing links from an artifact
  /code/find:
    get:
      operationId: getCodeFind
      parameters:
      - explode: true
        in: query
        name: identifier
        required: true
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: project
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: max_results
        required: false
        schema:
          default: 20
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeFindResponse"
          description: Code find results
        "400":
          description: Missing identifier parameter
        "401":
          description: Unauthorized
      summary: Symbol/identifier lookup across the canonical index
  /code/search:
    get:
      operationId: getCodeSearch
      parameters:
      - explode: true
        in: query
        name: query
        required: true
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: project
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: max_results
        required: false
        schema:
          default: 20
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeSearchResponse"
          description: Code search results
        "400":
          description: Missing query parameter
        "401":
          description: Unauthorized
        "503":
          description: Canonical index unavailable
      summary: Full-text code search across indexed file contents
  /code/callers:
    get:
      operationId: getCodeCallers
      parameters:
      - explode: true
        in: query
        name: symbol
        required: true
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: project
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: max_results
        required: false
        schema:
          default: 20
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeCallersResponse"
          description: Caller results
        "400":
          description: Missing symbol parameter
        "401":
          description: Unauthorized
        "503":
          description: Canonical index unavailable
      summary: Call sites for a symbol in the canonical code index
  /code/projects:
    get:
      operationId: getCodeProjects
      parameters:
      - explode: true
        in: query
        name: max_results
        required: false
        schema:
          default: 100
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeProjectsResponse"
          description: Indexed projects
        "401":
          description: Unauthorized
        "405":
          description: Method not allowed
        "503":
          description: Canonical index unavailable
      summary: List projects in the canonical code index
  /code/blast-radius:
    get:
      operationId: getCodeBlastRadius
      parameters:
      - explode: true
        in: query
        name: project
        required: true
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: file_path
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlastRadiusResponse"
          description: Blast radius
        "400":
          description: Missing required parameters
        "401":
          description: Unauthorized
        "404":
          description: File not found in index
      summary: Blast-radius computation for a file
  /code/structure:
    get:
      operationId: getCodeStructure
      parameters:
      - explode: true
        in: query
        name: project
        required: true
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: file_path
        required: true
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: max_results
        required: false
        schema:
          default: 256
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeStructureResponse"
          description: File definitions
        "400":
          description: Missing required parameters
        "401":
          description: Unauthorized
        "503":
          description: Canonical index unavailable
      summary: Definitions for a file in the canonical code index
  /code/project-stats:
    get:
      operationId: getCodeProjectStats
      parameters:
      - explode: true
        in: query
        name: project
        required: true
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeProjectStatsResponse"
          description: Project index statistics
        "400":
          description: Missing required parameters
        "401":
          description: Unauthorized
        "503":
          description: Canonical index unavailable
      summary: Project-level canonical code index counts and language breakdown
  /code/scan:
    post:
      operationId: postCodeScan
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeScanRequest"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeScanResponse"
          description: Scan accepted
        "401":
          description: Unauthorized
        "405":
          description: Method not allowed
      summary: Request a canonical code index scan
  /code/build:
    post:
      operationId: postCodeBuild
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeBuildRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeBuildResponse"
          description: Build complete
        "400":
          description: Missing required parameters
        "401":
          description: Unauthorized
        "503":
          description: Knowledge or vector store unavailable
      summary: Build a project knowledge index
  /code/update:
    post:
      operationId: postCodeUpdate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeUpdateRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeUpdateResponse"
          description: Update complete
        "400":
          description: Missing required parameters
        "401":
          description: Unauthorized
        "503":
          description: Knowledge store unavailable
      summary: Incrementally update a project knowledge index
  /maintenance/repair:
    post:
      operationId: postMaintenanceRepair
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintenanceRepairRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceRepairResponse"
          description: Repair complete
        "400":
          description: Missing required parameters
        "401":
          description: Unauthorized
        "503":
          description: Knowledge or vector store unavailable
      summary: Repair a project knowledge index
  /maintenance/reconcile:
    post:
      operationId: postMaintenanceReconcile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintenanceReconcileRequest"
        required: false
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceReconcileResponse"
          description: Reconcile complete
        "401":
          description: Unauthorized
        "500":
          description: Reconcile failed
      summary: Reconcile orphaned vector records
  /maintenance/clear:
    post:
      operationId: postMaintenanceClear
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintenanceClearRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceClearResponse"
          description: Project cleared
        "400":
          description: Missing project
        "401":
          description: Unauthorized
        "500":
          description: Clear failed
      summary: Clear indexed knowledge for a project
  /pipeline/status:
    get:
      operationId: getPipelineStatus
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineStatusResponse"
          description: Pipeline status
        "401":
          description: Unauthorized
        "405":
          description: Method not allowed
        "503":
          description: Queue unavailable
      summary: Report asynchronous knowledge ingest queue status
  /jobs/{job_id}:
    get:
      operationId: getJobStatus
      parameters:
      - explode: false
        in: path
        name: job_id
        required: true
        schema:
          format: int64
          minimum: 1
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatusResponse"
          description: Job status
        "401":
          description: Unauthorized
        "404":
          description: Job not found
        "405":
          description: Method not allowed
        "503":
          description: Job status unavailable
      summary: Report asynchronous knowledge ingest job status
  /ingest/status:
    get:
      operationId: getIngestStatus
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestStatusResponse"
          description: Background ingest status
        "401":
          description: Unauthorized
        "405":
          description: Method not allowed
        "503":
          description: Ingest status unavailable
      summary: Report background project ingest status
  /workers:
    get:
      operationId: getWorkers
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkersResponse"
          description: Worker status
        "401":
          description: Unauthorized
        "405":
          description: Method not allowed
        "503":
          description: Workers unavailable
      summary: Report aimee-kb worker and background task status
  /ingest:
    post:
      operationId: postIngest
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestRequest"
        required: false
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"
          description: Ingest queued
        "401":
          description: Unauthorized
        "405":
          description: Method not allowed
        "503":
          description: Knowledge store unavailable
      summary: Enqueue background project ingest
  /drain:
    post:
      operationId: postDrain
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DrainRequest"
        required: false
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DrainResponse"
          description: Queue drained
        "401":
          description: Unauthorized
        "405":
          description: Method not allowed
        "500":
          description: Queue drain failed
      summary: Drain the asynchronous knowledge ingest queue
  /entities/{id}:
    get:
      operationId: getEntityProfile
      parameters:
      - description: Entity name (slug)
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityProfileResponse"
          description: Entity profile
        "401":
          description: Unauthorized
        "404":
          description: Entity not found
      summary: Canonical entity profile
  /entities/search:
    post:
      operationId: postEntitySearch
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntitySearchRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntitySearchResponse"
          description: Entity search results
        "400":
          description: Missing query
        "401":
          description: Unauthorized
      summary: Find entities by name or context
components:
  schemas:
    HealthResponse:
      additionalProperties: true
      example:
        chunk_count: 0
        pgvec_ok: true
        pgvec_collection_ok: true
        embed_ok: true
        db2_ok: true
        db2_kb_tables_ok: true
        warnings:
        - warnings
        - warnings
        embedding_count: 6
        embed_command: embed_command
        status: status
      properties:
        status:
          description: ok when healthy; a non-ok string when degraded
          type: string
        db2_ok:
          description: DB2 (Postgres) reachable
          type: boolean
        db2_kb_tables_ok:
          description: required kb tables present
          type: boolean
        pgvec_ok:
          description: pgvector extension available
          type: boolean
        pgvec_collection_ok:
          type: boolean
        embed_ok:
          type: boolean
        embed_command:
          type: string
        chunk_count:
          type: integer
        embedding_count:
