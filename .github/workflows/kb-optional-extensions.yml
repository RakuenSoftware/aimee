# Build the aimee-kb image with its opt-in DB2 extensions enabled.
#
# WITH_PGVECTORSCALE=1 compiles pgvectorscale from source (Rust + pgrx) because it
# is packaged nowhere. The published image defaults that flag to 0, so no other
# workflow ever compiles that stage -- without this job the recipe could rot
# unnoticed until an operator set the flag and hit a broken build.
#
# Dispatch-only plus a weekly run: it is slow (a Rust toolchain and a full pgrx
# build) and pays for itself as a canary against pgrx/PostgreSQL drift, not as a
# gate on every merge.
name: kb optional extensions

on:
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * 2"

permissions:
  contents: read

jobs:
  pgvectorscale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build only, never pushed: the point is that the stage still compiles.
      - name: Build aimee-kb with pgvectorscale
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: aimee-kb:pgvectorscale-check
          build-args: |
            WITH_PGVECTORSCALE=1

      # A stage that compiles but installs nothing would still pass the build, so
      # assert the extension is actually present and loadable in the image.
      - name: Assert vectorscale is installed and loadable
        run: |
          docker run --rm --user root aimee-kb:pgvectorscale-check sh -c '
            set -e
            pg=/usr/lib/postgresql/${AIMEE_DB2_PG_MAJOR}
            ls "$pg"/lib/vectorscale*.so
            ls /usr/share/postgresql/${AIMEE_DB2_PG_MAJOR}/extension/vectorscale.control
            install -d -o aimee /tmp/pgd /tmp/pgs
            su -s /bin/sh aimee -c "
              set -e
              $pg/bin/initdb --pgdata=/tmp/pgd --auth-local=trust >/dev/null
              $pg/bin/pg_ctl --pgdata=/tmp/pgd --wait --silent \
                --options=\"-c listen_addresses='"''"'' -c unix_socket_directories=/tmp/pgs\" start
              $pg/bin/createdb --host=/tmp/pgs probe
              $pg/bin/psql --host=/tmp/pgs --dbname=probe --no-psqlrc -c \
                \"CREATE EXTENSION vector; CREATE EXTENSION vectorscale\"
              $pg/bin/psql --host=/tmp/pgs --dbname=probe --no-psqlrc -tAc \
                \"SELECT extname||chr(32)||extversion FROM pg_extension ORDER BY extname\"
            "
          '
