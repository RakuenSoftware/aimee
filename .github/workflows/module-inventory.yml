name: Module inventory

# GitHub Team cannot enforce organization required-workflow rules. These
# required checks therefore use the normal pull_request event and, like every
# classic Team-plan check, their workflow/script definitions are reviewable PR
# content. Do not present proposal-ordering as an isolated trusted executor; a
# stronger guarantee requires Enterprise required workflows or an external app.
# These filters match the BASE branch, and the only base these gates exist for
# is `main`.
#
# Everything in this workflow governs the module boundary: the canonical
# inventory, source ownership, and the frozen DB2 consumer surface. Those are
# promote-time questions, decided when work is promoted to `main`. `testing` is
# the shared integration branch, so running them there blocks ordinary feature
# work on a module-structure decision that is not being made at that point.
#
# This is the same call the refactor-surface-baseline step below already made
# for itself, and for the same reason: a branch whose job is to absorb in-flight
# work trips a freeze constantly, and the useful review is the one diff at the
# promote, not a rejection per feature PR. That step now carries a `base_ref !=
# testing` guard it no longer needs, since the workflow cannot fire on testing
# at all; it is left in place as defence in depth if these filters widen again.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: module-inventory-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  module-inventory:
    name: module-inventory
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install test-only YAML parser
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Validate canonical inventory
        run: ./scripts/check_module_inventory.sh
      - name: Validate from a non-repository working directory
        run: cd /tmp && "$GITHUB_WORKSPACE/scripts/check_module_inventory.sh"
      - name: Prove a mutated inventory fails closed
        run: |
          root=$(mktemp -d)
          cp tests/baselines/modules/canonical-inventory.yaml "$root/inventory.yaml"
          python3 - "$root/inventory.yaml" <<'PY'
          import json
          import pathlib
          import sys
          path = pathlib.Path(sys.argv[1])
          data = json.loads(path.read_text())
          data["required"].remove("git")
          data["required"].append("replacement-module")
          path.write_text(json.dumps(data))
          PY
          if output=$(./scripts/check_module_inventory.sh \
              --config-root "$root" --inventory inventory.yaml 2>&1); then
            echo "::error::mutated inventory unexpectedly passed: $output"
            exit 1
          fi
          echo "$output"
          printf '%s\n' "$output" | grep -q 'rule=required-classification'
      - name: Test inventory failure modes
        run: python3 -I scripts/tests/test_check_module_inventory.py -v
      - name: Test that a principal ref is an identity, not a position
        run: python3 -I scripts/tests/test_principal_ref_identity.py -v
      - name: Enforce background skill-curator removal
        run: python3 -I -S scripts/check_background_skill_curator_absence.py
      - name: Test background skill-curator absence failure modes
        run: python3 -I scripts/tests/test_check_background_skill_curator_absence.py -v
      - name: Enforce canonical module source ownership
        run: python3 -I -S scripts/check_module_source_ownership.py
      - name: Test module source ownership failure modes
        run: python3 -I scripts/tests/test_check_module_source_ownership.py -v
      - name: Freeze the DB2 source boundary and consumer inventory
        run: python3 -I -S scripts/check_db2_source_boundary.py
      - name: Refuse DB2 compatibility-include allowlist growth
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          python3 -I -S scripts/check_db2_source_boundary.py --previous-ref FETCH_HEAD
      - name: Test DB2 source-boundary failure modes
        run: python3 -I scripts/tests/test_check_db2_source_boundary.py -v
      - name: Enforce generated DB2 operation contract
        run: python3 -I -S scripts/gen_db2_contract.py
      - name: Test DB2 operation-contract failure modes
        run: python3 -I scripts/tests/test_gen_db2_contract.py -v
      - name: Enforce generated DB2 declaration ledger
        run: python3 -I -S scripts/gen_db2_declaration_ledger.py
      - name: Test DB2 declaration-ledger failure modes
        run: python3 -I scripts/tests/test_gen_db2_declaration_ledger.py -v
      - name: Enforce exhaustive DB3 portability decisions
        run: python3 -I -S scripts/check_vector_portability.py
      - name: Test DB3 portability-audit failure modes
        run: python3 -I scripts/tests/test_check_vector_portability.py -v
      - name: Measure DB2 C link closure
        run: python3 -I -S scripts/check_db2_link_closure.py
      - name: Refuse DB2 C link-closure debt growth
        if: github.event_name == 'pull_request'
        run: python3 -I -S scripts/check_db2_link_closure.py --no-probe --previous-ref FETCH_HEAD
      - name: Test DB2 C link-closure failure modes
        run: python3 -I scripts/tests/test_check_db2_link_closure.py -v
      - name: Refuse premature DB2 process activation
        run: python3 -I -S scripts/check_db2_activation.py
      - name: Test DB2 activation-gate failure modes
        run: python3 -I scripts/tests/test_check_db2_activation.py -v
      - name: Enforce module bus boundary
        run: python3 -I -S scripts/check_module_bus_boundary.py
      - name: Test module bus-boundary failure modes
        run: python3 -I scripts/tests/test_check_module_bus_boundary.py -v
      - name: Enforce panel contract boundary
        run: python3 -I -S scripts/check_panel_contract_boundary.py
      - name: Test panel contract boundary failure modes
        run: python3 -I scripts/tests/test_check_panel_contract_boundary.py -v
      # The surface baseline is a digest of the PUBLIC surface: 370 public
      # headers, the routes, the schemas, the CLI help. That is a release
      # question, so it gates `main` and not the integration branch.
      #
      # On `testing` it was answering a question nobody asked. A branch whose
      # job is to absorb in-flight work touches public headers constantly, so
      # every PR re-froze the digest -- a mechanical diff nobody reads -- and
      # any two concurrent PRs then collided on the same regenerated lines.
      # Nineteen rebases in one migration, none of which surfaced a single real
      # change to the surface.
      #
      # Nothing is lost by moving it. The promoting testing -> main PR runs this
      # and fails until the baseline is refrozen, and THAT diff is the useful
      # artifact: one review of everything a release changes on the public
      # surface, instead of nineteen refreezes read by nobody.
      # Integration bases, not just `testing`: agent/<topic> and aimee/feat/<id>
      # are stacked onto the same way (see ci.yml's pull_request branch list), so
      # a sub-PR based on one hit this release gate while its eventual base does
      # not. Both escapes were wrong -- re-freeze, which the refusal below then
      # blocks on the way to `testing`, or leave the PR red.
      - name: Enforce refactor surface baselines
        if: >-
          !startsWith(github.base_ref, 'agent/')
          && !startsWith(github.base_ref, 'aimee/feat/')
          && github.base_ref != 'testing'
          && github.ref != 'refs/heads/testing'
          && !startsWith(github.ref, 'refs/heads/agent/')
        run: python3 -I -S scripts/refactor_baselines.py
      # The surface baseline is a RELEASE gate, enforced on `main` by the step
      # above and deliberately not here. That makes re-freezing it on a `testing`
      # PR pure cost: it is a whole-tree digest, so any two PRs touching public
      # headers rewrite the same lines and collide. It cost a rebase on three of
      # five PRs in one migration, and the collisions were never about the
      # surface -- the digest was recomputed, the diff was mechanical, nobody
      # read it.
      #
      # So on `testing` the baseline is simply NOT MAINTAINED. It goes stale,
      # which is intended: the promoting testing -> main PR re-freezes it once,
      # and THAT diff is the useful artifact -- one review of everything a
      # release changed on the public surface.
      #
      # Adding a public header therefore does not require touching this file.
      - name: Refuse a baseline re-freeze on the integration branch
        if: >-
          github.base_ref == 'testing'
          || startsWith(github.base_ref, 'agent/')
          || startsWith(github.base_ref, 'aimee/feat/')
        run: |
          set -eu
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          if git diff --quiet FETCH_HEAD -- tests/baselines/refactor/index.json; then
            echo "surface baseline untouched: ok"
            exit 0
          fi
          cat >&2 <<'MSG'
          ::error::This PR changes tests/baselines/refactor/index.json, and it targets the
          integration branch `${{ github.base_ref }}`.

          The public-surface baseline is a release question. It gates `main`, not this
          branch, so re-freezing it here achieves nothing and collides with every other
          PR that does the same.

          Revert the file and push again:

              git checkout "origin/${{ github.base_ref }}" -- tests/baselines/refactor/index.json

          You do NOT need to re-freeze after adding or changing a public header. The
          baseline is expected to be stale on an integration branch; the promotion PR into `main`
          re-freezes it once, and that single diff is the review of what the release
          changed on the public surface.
          MSG
          exit 1
      - name: Enforce refactor cleanup accounting
        run: python3 -I -S scripts/check_cleanup_ledger.py
      - name: Test refactor baseline failure modes
        run: python3 -I scripts/tests/test_refactor_baselines.py -v
      - name: Test cleanup-ledger failure modes
        run: python3 -I scripts/tests/test_check_cleanup_ledger.py -v
        # The image build's Hugging Face retry. Cheap, no network, and it guards a
        # function that only ever runs where a failure costs a whole image build.
      - name: Test Dockerfile hub-fetch retry
        run: python3 -I scripts/tests/test_dockerfile_hub_retry.py
        # The embedder sidecar's bake: its retry, its refusal of an unknown model, and
        # the auto_map follow that stops a trust_remote_code model reaching the Hub at
        # first use. No network, and it guards code that only runs inside an image build.
      - name: Test embedder bake script
        run: python3 -I scripts/tests/test_bake_embedder.py
      - name: Enforce individual module documentation
        run: python3 -I -S scripts/check_module_docs.py
      - name: Test module-documentation failure modes
        run: python3 -I scripts/tests/test_check_module_docs.py -v
      - name: Enforce descriptor-declared module test registration
        run: python3 -I -S scripts/check_module_test_registration.py
      - name: Test module test-registration failure modes
        run: python3 -I scripts/tests/test_check_module_test_registration.py -v

  git-core-contract:
    name: git-core-contract
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validate approved Git core contract
        run: python3 -I -S scripts/check_git_core_contract.py --require-status roundtable-approved
      - name: Validate from a non-repository working directory
        run: cd /tmp && python3 -I -S "$GITHUB_WORKSPACE/scripts/check_git_core_contract.py" --require-status roundtable-approved
      - name: Test Git contract failure modes
        run: python3 -I scripts/tests/test_check_git_core_contract.py -v

  descriptor-envelope:
    name: descriptor-envelope
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # Two suites are ~99% of this job: test_gen_db1_contract and
    # test_validate_module_descriptors. Both scale with the descriptor and
    # operation catalogs, so the job grows every time a module or operation is
    # added, and every other step here is sub-second.
    #
    # At timeout-minutes: 5 it had already reached 4m56s on `testing` -- four
    # seconds of margin -- so it was not gating anything, it was waiting to fail
    # for whoever pushed next. It then did, twice, at 5m17s, and reported as
    # "Cancelled after 5m", which reads like a concurrency cancel rather than
    # the timeout it is.
    #
    # 15 gives real headroom without hiding a runaway: a genuine hang still
    # fails, it just no longer fails on catalog growth alone.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validate descriptor fixtures and generated schema
        run: |
          python3 -I -S scripts/validate_module_descriptors.py \
            --check-schema tests/fixtures/modules/positive
      - name: Validate the complete production descriptor graph
        run: |
          python3 -I -S scripts/validate_module_descriptors.py \
            --check-schema src/modules
      - name: Validate core/process carving, placement, and event contracts
        run: python3 -I -S scripts/validate_module_process_contracts.py
      - name: Enforce the DB1 operation catalog
        run: python3 -I -S scripts/gen_db1_contract.py
      - name: Test DB1 operation-catalog failure modes
        run: python3 -I scripts/tests/test_gen_db1_contract.py -v
      - name: Test descriptor failure modes and taxonomy convergence
        run: python3 -I scripts/tests/test_validate_module_descriptors.py -v
      - name: Test exhaustive standalone C-process export generation
        run: python3 -I scripts/tests/test_export_c_process_build.py -v
      - name: Test deterministic C embedded-header generation
        run: python3 -I scripts/tests/test_generate_c_embedded_header.py -v
      - name: Test exhaustive C-process runtime-bundle builds
        run: python3 -I scripts/tests/test_build_c_module_runtime_bundle.py -v
      - name: Enforce canonical module public-header layout
        run: python3 -I -S scripts/check_module_header_layout.py
      - name: Test module public-header layout failure modes
        run: python3 -I scripts/tests/test_check_module_header_layout.py -v
      - name: Enforce governance capability ownership
        run: python3 -I -S scripts/check_capability_ownership.py --config-root "$GITHUB_WORKSPACE"
      - name: Validate governance ownership from a non-repository working directory
        run: cd /tmp && python3 -I -S "$GITHUB_WORKSPACE/scripts/check_capability_ownership.py" --config-root "$GITHUB_WORKSPACE"
      - name: Test governance capability ownership failure modes
        run: python3 -I scripts/tests/test_check_capability_ownership.py -v

  module-doc-contract:
    name: module-doc-contract
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Test provider-neutral OIDC, document grammar, and SSHSIG contracts
        run: |
          command -v ssh-keygen
          command -v ssh-agent
          command -v ssh-add
          python3 -I scripts/tests/test_module_doc_contract.py -v
          python3 -I scripts/tests/test_module_doc_git_snapshot.py -v
          python3 -I scripts/tests/test_sign_module_docs.py -v

  proposal-ordering:
    name: proposal-ordering
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # scan_history walks every commit since the historical cutoff, and that
    # history keeps growing. The job used to run FOUR of those walks -- the gate
    # itself, two property checks that re-ran the whole script, and the suite's
    # real-history test -- and so approached the 20 minutes this timeout was
    # sized for. It now runs exactly one; the properties are unit-tested and the
    # suite is told the scan already happened.
    #
    # The one remaining walk is ~6 minutes here and grows with history. Most of
    # that is `--find-copies-harder`, measured at 283s of a 319s run against 8.9s
    # without it. The flag is NOT redundant -- it is what catches governed content
    # copied out of a watched path whose source was never modified, which is the
    # evasion this gate exists to see -- so it stays, and the headroom stays with
    # it. Speeding up the walk itself means changing what the gate can detect,
    # which is a contract question, not a performance one.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # This executes the reviewed PR version under the documented Team-plan
      # limitation above. Branch protection supplies enforcement, not isolation.
      - name: Enforce Git proposal ordering
        run: python3 -I -S scripts/check_proposal_ordering.py
      # `Prove event revision binding` and `Validate CWD independence` used to
      # live here, each re-running the whole gate against the real repository.
      # Both properties are settled before any history is read -- validate_event()
      # runs immediately after `rev-parse HEAD` and is pure env/string logic, and
      # the config root is resolved in main() before the scan -- so each spent
      # ~6 minutes re-scanning 4,000+ commits with rename/copy detection that
      # could not change either verdict. They are now
      # test_event_binding_requires_the_checked_out_revision,
      # test_event_binding_gates_pull_request_base and
      # test_config_root_resolution_is_cwd_independent in the failure-mode suite
      # below, where they run in milliseconds and assert BOTH directions rather
      # than only that a good context passes.
      - name: Reject a non-repository config root
        run: |
          root=$(mktemp -d)
          if output=$(python3 -I -S scripts/check_proposal_ordering.py \
              --config-root "$root" 2>&1); then
            echo "::error::non-repository config root unexpectedly passed: $output"
            exit 1
          fi
          echo "$output"
          printf '%s\n' "$output" | grep -q 'rule=config-root'
      - name: Test proposal-ordering failure modes
        # The suite's test_current_repository_passes is the same full-history
        # scan the gate step above already performed, on this same checkout.
        # Telling it so keeps the job to ONE scan; the test still runs in full
        # for anyone executing the suite outside this workflow.
        env:
          PROPOSAL_ORDERING_FULL_SCAN_DONE: "1"
        run: python3 -I scripts/tests/test_check_proposal_ordering.py -v
