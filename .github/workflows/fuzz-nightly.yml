name: Nightly Fuzz

on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC daily
  workflow_dispatch:       # Allow manual trigger

concurrency:
  group: fuzz-nightly
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          timeout 240 sudo apt-get install -y -q gcc make \
            libsqlite3-dev libcurl4-openssl-dev libpam0g-dev libssl-dev \
            libpq-dev

      - name: Build all fuzz targets
        run: |
          cd src
          make -j$(nproc) tests/fuzz_extractors tests/fuzz_json_parse \
               tests/fuzz_config_load tests/fuzz_memory_search \
               tests/fuzz_message_frame tests/fuzz_acl_parse

      - name: Seed corpus smoke test
        run: cd src && make fuzz

      - name: Extended fuzz run (30 minutes)
        run: |
          cd src
          PER_TARGET=300  # 5 minutes per target, 6 targets = 30 min

          fuzz_extended() {
            local target="$1"
            local name
            name=$(basename "$target")
            local tmpdir
            tmpdir=$(mktemp -d)
            local end=$((SECONDS + PER_TARGET))
            local iterations=0

            echo "--- $name: extended run for ${PER_TARGET}s ---"

            while [ $SECONDS -lt $end ]; do
              # Generate random inputs of varying sizes (16 bytes to 4KB)
              for sz in 16 64 256 1024 4096; do
                dd if=/dev/urandom bs="$sz" count=1 2>/dev/null > "$tmpdir/input"
                ./"$target" "$tmpdir/input" 2>/dev/null || true
                iterations=$((iterations + 1))
              done
            done

            rm -rf "$tmpdir"
            echo "--- $name: $iterations iterations completed ---"
          }

          for target in tests/fuzz_extractors tests/fuzz_json_parse \
                        tests/fuzz_config_load tests/fuzz_memory_search \
                        tests/fuzz_message_frame tests/fuzz_acl_parse; do
            fuzz_extended "$target"
          done
