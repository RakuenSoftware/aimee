name: Publish native-memory 0.3.3 artifacts
on:
  push:
    branches: [release/native-memory-0.3.3-publish]
    paths:
      - '.github/workflows/publish-native-memory-033.yml'
      - 'docs/releases/native-memory-v0.3.3/**'
permissions:
  contents: write
concurrency:
  group: native-memory-v0.3.3-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Assemble and verify the signed reviewed payload
        run: |
          assets="$RUNNER_TEMP/native-memory-v0.3.3"
          mkdir -p "$assets"
          cp docs/releases/native-memory-v0.3.3/wheels/*.whl "$assets/"
          cp docs/releases/native-memory-v0.3.3/{manifest.json,SHA256SUMS,*.sig} "$assets/"
          python3 docs/releases/native-memory-v0.3.3/verify_assets.py "$assets"
      - name: Create documentation-only release tag and publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'RakuenSoftware release'
          git config user.email 'release@users.noreply.github.com'
          export GIT_INDEX_FILE="$RUNNER_TEMP/native-memory-release-index"
          git read-tree --empty
          git add docs/releases/native-memory-v0.3.3/RELEASE_NOTES.md LICENSE
          tree="$(git write-tree)"
          commit="$(printf 'Native-memory 0.3.3 distribution documentation only\n' | git commit-tree "$tree")"
          test "$(git ls-tree -r --name-only "$commit" | wc -l)" -eq 2
          git ls-tree -r --name-only "$commit"
          git tag native-memory-v0.3.3 "$commit"
          git push origin refs/tags/native-memory-v0.3.3
          docs/releases/native-memory-v0.3.3/create_draft_release.sh "$RUNNER_TEMP/native-memory-v0.3.3" "$commit"
          gh release edit native-memory-v0.3.3 --repo RakuenSoftware/aimee --draft=false --prerelease --latest=false
