name: Delete native-memory 0.3.3 release
on:
  push:
    branches: [release/native-memory-0.3.3-publish]
    paths: ['.github/workflows/publish-native-memory-033.yml']
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete release, all attached assets and publication tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete native-memory-v0.3.3 --repo RakuenSoftware/aimee --yes --cleanup-tag
          if gh release view native-memory-v0.3.3 --repo RakuenSoftware/aimee; then
            echo 'Release still exists' >&2
            exit 1
          fi
