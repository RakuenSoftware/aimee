# Publish the aimee-llm synthesis sidecars.
#
# THIS MUST NOT REBUILD BECAUSE KB CODE CHANGED. That coupling is the whole reason
# the sidecar exists: when synthesis was baked into aimee-kb, three kb tags under
# three separate cache scopes each rebuilt the LTO C binary, postgres,
# pgvectorscale and torch on every push touching src/**, and pushed ~10 GB twice,
# for artefacts whose real inputs change on the order of never.
#
# Only a newer pinned upstream llama.cpp release authorizes an image build.
# Wrapper/weight edits wait for that release. Exact content tags permit retries;
# a runtime tag prevents publishing different images for the same runtime release.
name: Publish synthesis images (E2B and E4B)

on:
  push:
    branches: [testing]
    paths:
      - "Dockerfile.llm"
      - "deploy/container/aimee-llm-entrypoint.sh"
      - "scripts/synthesis-model-table.sh"
      - ".github/workflows/publish-llm.yml"
      - "scripts/model-image-inputs-changed.py"
      - "scripts/check-synthesis-runtime-release.sh"
  # Image builds belong to integration merges. Release calls only promote
  # or validate existing manifests; they never rebuild model containers.
  workflow_call:
    inputs:
      version:
        description: 'Approved release version; promotes the pinned build to :<version> + :latest'
        required: true
        type: string
      publish:
        description: 'Promote the pinned manifests; false validates that the exact promotion sources exist'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  changes:
    if: inputs.version == '' && github.event_name == 'push' && github.ref == 'refs/heads/testing'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.inputs.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Compare image inputs for this update
        id: inputs
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          python3 scripts/model-image-inputs-changed.py llm "$BASE_SHA" HEAD >> "$GITHUB_OUTPUT"

  # Model-specific llama.cpp runtimes; the generic LLM gateway is retired.
  build:
    needs: changes
    if: ${{ !cancelled() && (inputs.version != '' || needs.changes.outputs.changed == 'true') }}
    # A no-op update must not cancel an earlier build of changed image inputs.
    concurrency:
      group: publish-llm-${{ github.ref }}-${{ matrix.name }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: aimee-llm-e2b, model: gemma-4-E2B-it }
          - { name: aimee-llm-e4b, model: gemma-4-E4B-it }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Normalize owner to lowercase
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The immutable tag must name EVERY input that changes the artefact, or the skip
      # becomes a trap. Keyed on the model, the quant and the llama.cpp version alone,
      # a change to Dockerfile.llm or the entrypoint would find the tag already
      # published, skip the build, and leave :testing pointing at the old image while
      # the run reported success. That is precisely how the mTLS fix in this image
      # would have failed to ship.
      #
      # The content tag also protects release promotion: wrapper changes waiting
      # for an upstream release cannot silently promote an older implementation.
      - name: Has this exact build already been published?
        id: have
        run: |
          quant=$(sh scripts/synthesis-model-table.sh quant "${{ matrix.model }}")
          # Keep the runtime pin in the Dockerfile, which the input gate tracks.
          llamacpp_version=$(sed -n 's/^ARG LLAMACPP_VERSION=//p' Dockerfile.llm)
          test -n "$llamacpp_version"
          echo "llamacpp_version=$llamacpp_version" >> "$GITHUB_OUTPUT"
          rev=$(cat Dockerfile.llm deploy/container/aimee-llm-entrypoint.sh \
                scripts/synthesis-model-table.sh | sha256sum | cut -c1-12)
          pinned="ghcr.io/${OWNER}/${{ matrix.name }}:${quant}-${llamacpp_version}-${rev}"
          echo "sidecar sources hash to $rev"
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "$pinned" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$pinned already published; nothing to build"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require a new published upstream runtime release
        if: github.event_name == 'push' && github.ref == 'refs/heads/testing' && inputs.version == '' && steps.have.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/check-synthesis-runtime-release.sh "ghcr.io/${OWNER}/${{ matrix.name }}" "${{ steps.have.outputs.llamacpp_version }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      # Build only changed image inputs merged to testing.
      - name: Build ${{ matrix.name }}
        if: github.event_name == 'push' && github.ref == 'refs/heads/testing' && inputs.version == '' && steps.have.outputs.exists != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile.llm
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}-amd64
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-amd64
          build-args: |
            AIMEE_SYNTHESIS_MODEL=${{ matrix.model }}
            LLAMACPP_VERSION=${{ steps.have.outputs.llamacpp_version }}
          tags: |
            ${{ steps.have.outputs.pinned }}
            ghcr.io/${{ env.OWNER }}/${{ matrix.name }}:runtime-${{ steps.have.outputs.llamacpp_version }}
            ghcr.io/${{ env.OWNER }}/${{ matrix.name }}:testing

      - name: Test published synthesis CPU portability
        if: github.event_name == 'push' && github.ref == 'refs/heads/testing' && inputs.version == ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-user-static
          docker pull "${{ steps.have.outputs.pinned }}"
          bash scripts/test-synthesis-portability.sh "${{ steps.have.outputs.pinned }}"

      # Registry-side promotion of the pinned build. This intentionally does not
      # pull or rebuild the multi-gigabyte synthesis images during a release.
      - name: Promote to :${{ inputs.version }} and :latest
        if: ${{ inputs.version != '' && inputs.publish }}
        run: |
          set -euo pipefail
          pinned='${{ steps.have.outputs.pinned }}'
          image="ghcr.io/${OWNER}/${{ matrix.name }}"
          if ! docker manifest inspect "$pinned" >/dev/null 2>&1; then
            echo "::error::$pinned is not published; cannot promote ${{ matrix.name }} to a release"
            exit 1
          fi
          docker buildx imagetools create \
            --tag "${image}:${{ inputs.version }}" \
            --tag "${image}:latest" \
            "$pinned"

      # A promotion PR must prove the immutable source manifest exists. The
      # real release runs the adjacent promotion command against this exact
      # value; validation suppresses only the registry tag mutation.
      - name: Validate release promotion source
        if: ${{ inputs.version != '' && !inputs.publish }}
        run: |
          pinned='${{ steps.have.outputs.pinned }}'
          docker manifest inspect "$pinned" >/dev/null || {
            echo "::error::$pinned is not published; release promotion would fail"
            exit 1
          }
          echo "validated release source $pinned"

      - name: Report
        run: |
          if [ "${{ steps.have.outputs.exists }}" = "true" ]; then
            echo "skipped: ${{ steps.have.outputs.pinned }} already published"
          else
            echo "published ${{ steps.have.outputs.pinned }} and :testing"
          fi
