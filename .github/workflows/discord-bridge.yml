name: Discord bridge
on:
  pull_request:
    paths: ['integrations/discord/**', '.github/workflows/discord-bridge.yml']
  push:
    branches: [testing, main]
    paths: ['integrations/discord/**', '.github/workflows/discord-bridge.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r integrations/discord/requirements.txt
      - run: python -m unittest discover -s integrations/discord -v
