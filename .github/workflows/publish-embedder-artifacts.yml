# Convert the embedders that have no GGUF on the Hub and publish them as release
# assets, so the model-less aimee-llm image can fetch pre-converted weights at
# runtime. Everything else in the model set (nomic, synth) is a plain Hugging Face
# GGUF pull pinned by revision+sha256 in scripts/embedders.json.
#
# WHY THIS EXISTS AT ALL, given the retired publish-rerank-artifacts.yml was deleted
# as a simplification: the reranker needed this machinery to ship a component that
# measured NEGATIVE (+0.0032 NDCG@10 at best, mostly worse). bekko-a25m earns it —
# ~6x nomic's CPU throughput on our corpus at -0.0166 NDCG@10, which is the tradeoff
# a CPU-only appliance actually wants, and it needs no prefixes so its benchmark
# number carries into production unchanged. The mechanism is the same; what changed
# is that the artifact is worth having.
#
# AUTOMATED, not a manual prerequisite: the image-publish workflows call this as a
# prerequisite job, so an image is never published without the release existing. It is
# IDEMPOTENT — the conversion runs only when the release is missing an asset (or a
# dispatch sets force=true); otherwise it confirms the assets in seconds.
#
# Assets on the `embedder-artifacts-v1` release. The names come from the registry's
# `file` field, and the supervisor fetches ${AIMEE_LLM_EMBEDDER_ASSET_BASE}/<file>
# plus SHA256SUMS — the digest is NOT pinned in the registry because the artifact does
# not exist until this workflow runs:
#   embed-bekko-a25m-f16.gguf
#   SHA256SUMS
name: Publish embedder artifacts

on:
  # Called by the image-publish workflows as a prerequisite (see their `needs`).
  workflow_call: {}
  workflow_dispatch:
    inputs:
      force:
        description: "Re-convert and re-upload even if the release already has the assets"
        type: boolean
        default: false

concurrency:
  # Static group (not per-ref) + no cancel: concurrent callers serialize on the single
  # shared release instead of racing two uploads or cancelling each other.
  group: publish-embedder-artifacts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: embedder-artifacts-v1
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Check whether the release already has all assets
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          need="embed-bekko-a25m-f16.gguf SHA256SUMS"
          skip=false
          if [ "${{ github.event.inputs.force }}" != "true" ] \
             && gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > have.txt 2>/dev/null; then
            skip=true
            for a in $need; do grep -qxF "$a" have.txt || skip=false; done
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          if [ "$skip" = true ]; then
            echo "release $RELEASE_TAG already has all assets — skipping conversion"
          else
            echo "release incomplete or force set — conversion needed"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: "3.12"

      # Torch (CPU wheel) + conversion deps, in CI so neither the build nor the
      # runtime image needs torch.
      - name: Install conversion deps
        if: steps.check.outputs.skip != 'true'
        run: |
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet transformers safetensors numpy gguf sentencepiece protobuf huggingface_hub

      # convert_hf_to_gguf.py + gguf-py. ModernBERT encoders convert here — this is the
      # same path that produced the retired ettin encoder GGUFs.
      - name: Clone llama.cpp (converter)
        if: steps.check.outputs.skip != 'true'
        run: git clone --depth 1 https://github.com/ggml-org/llama.cpp /tmp/llama

      # The converter reads coordinates, width and source from scripts/embedders.json,
      # and refuses if the converted width disagrees with the declared one.
      - name: Convert release-sourced embedders
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          mkdir -p out
          python scripts/convert_embedder_gguf.py bekko-a25m out /tmp/llama
          echo "== artifacts =="; ls -l out; cat out/SHA256SUMS

      - name: Publish to the release
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" \
                 --title "aimee-llm embedder artifacts" \
                 --notes "Pre-converted embedder GGUFs fetched by aimee-llm at runtime for models the Hub publishes no GGUF for. Verified against SHA256SUMS."
          gh release upload "$RELEASE_TAG" \
            out/embed-bekko-a25m-f16.gguf out/SHA256SUMS --clobber
