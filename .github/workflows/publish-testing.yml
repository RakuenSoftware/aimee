# Publish the deployable aimee image set on relevant pushes to `testing` under a
# DELIBERATELY non-semver tag (`:testing` + `:testing-<sha>`), so the testing branch
# can be deployed/validated (e.g. on .254) WITHOUT promoting to main.  An image is
# rebuilt only when one of its declared inputs changed.  Otherwise its existing
# manifest is promoted registry-side to the new immutable `testing-<sha>` tag.
#
# The published set covers the split images, the control console, ALL THREE kb
# embedder variants, and the isolated one-shot authority bootstrap, so every committed
# Compose topology has a coherent immutable channel revision whichever embedder the
# wizard selected. Synthesis is NOT here: it is its own image on its own trigger
# (publish-llm.yml), rebuilt when the model changes rather than when kb code does.
# Versioned + `:latest` publishing of the full image set
# stays owned by main (auto-release.yml -> publish-images.yml). Keeping testing on
# a `:testing` tag — never a version number — avoids confusing a tested-but-
# unreleased build with a real release. amd64 only (the .254 deploy target); the
# release pipeline owns multi-arch.
name: Publish testing image

on:
  push:
    branches: [testing]
    # Only rebuild when something that affects the image changes.
    paths:
      - "src/**"
      # The Go WFE/API service and browser runtime are compiled into aimee-server.
      # Go-only fixes must publish a deployable testing image just like C changes.
      - "server-go/**"
      - "runtime-web/**"
      - "control-web/**"
      - "config/**"
      - "deploy/container/**"
      - "scripts/**"
      # The images bundle the webchat UI (frontend/ SPA + webchat/ Go server) —
      # see the frontend-build/webchat-build stages in Dockerfile.server.
      - "frontend/**"
      - "Dockerfile"
      - "Dockerfile.server"
      - "Dockerfile.control-web"
      - "Dockerfile.authority-bootstrap"
      - ".github/workflows/publish-testing.yml"
  workflow_dispatch:

concurrency:
  group: publish-testing-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # Compute the image set from a source-controlled input contract.  Unchanged images
  # are promoted registry-side below; they are not pulled and they are not rebuilt.
  # Unknown paths fail safe by selecting every image.  workflow_dispatch is the
  # explicit recovery/force-rebuild path.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.images.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Select images whose inputs changed
        id: images
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            matrix=$(python3 scripts/publish_testing_plan.py --all </dev/null)
          else
            if [ -z "${BEFORE_SHA:-}" ] ||
               [ "$BEFORE_SHA" = 0000000000000000000000000000000000000000 ] ||
               ! git cat-file -e "${BEFORE_SHA}^{commit}"; then
              echo "::error::cannot resolve the previous testing commit; use workflow_dispatch to force a complete rebuild"
              exit 1
            fi
            matrix=$(git diff --name-only -z "$BEFORE_SHA" "$GITHUB_SHA" |
              python3 scripts/publish_testing_plan.py --null)
          fi
          python3 -m json.tool <<< "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  publish:
    needs: [plan]
    name: ${{ matrix.image.name }} (${{ matrix.image.rebuild && 'build' || 'reuse' }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # The planner always returns the complete image set.  Each entry says whether
        # its declared inputs changed; the other entries reuse their current manifest
        # while still receiving this revision's immutable testing-<sha> tag.
        image: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # ghcr paths must be lowercase; owners may be mixed-case (e.g. "JBailes").
      - name: Normalize owner + short sha
        run: |
          echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "SHA7=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      # A missing moving tag is a real need to build, even when source inputs did not
      # change (for example when bootstrapping a new package registry).  Otherwise an
      # unchanged manifest is promoted without downloading any of its layers.
      - name: Find reusable ${{ matrix.image.name }} manifest
        id: have
        env:
          IMAGE: ghcr.io/${{ env.OWNER }}/${{ matrix.image.name }}
        run: |
          if docker manifest inspect "$IMAGE:testing" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No existing $IMAGE:testing manifest; a bootstrap build is required"
          fi

      - name: Build and push ${{ matrix.image.name }}:testing
        if: ${{ matrix.image.rebuild || steps.have.outputs.exists != 'true' }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          # Share the layer cache with the release pipeline (same scope) so testing
          # builds are fast and never start the LTO C build from scratch.
          cache-from: type=gha,scope=${{ matrix.image.name }}-amd64
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-amd64
          # WITH_RUNTIME_WEB bundles the browser UI (default for aimee-server; the
          # aimee-kb image ignores it).
          #
          # AIMEE_SYNTHESIS_MODEL is empty on the non-llm legs, which is what the
          # Dockerfile expects: it gates the whole llama.cpp copy on
          # AIMEE_WITH_LLAMACPP, and asserts the baked MODEL_ID matches this value
          # when it is set.
          build-args: |
            AIMEE_VERSION=testing-${{ env.SHA7 }}
            WITH_RUNTIME_WEB=1
            ${{ matrix.image.args }}
          tags: |
            ghcr.io/${{ env.OWNER }}/${{ matrix.image.name }}:testing
            ghcr.io/${{ env.OWNER }}/${{ matrix.image.name }}:testing-${{ env.SHA7 }}

      - name: Reuse ${{ matrix.image.name }} without rebuilding
        if: ${{ !matrix.image.rebuild && steps.have.outputs.exists == 'true' }}
        env:
          IMAGE: ghcr.io/${{ env.OWNER }}/${{ matrix.image.name }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "$IMAGE:testing-${SHA7}" \
            "$IMAGE:testing"
          old=$(docker buildx imagetools inspect "$IMAGE:testing" --raw | sha256sum | cut -d' ' -f1)
          new=$(docker buildx imagetools inspect "$IMAGE:testing-${SHA7}" --raw | sha256sum | cut -d' ' -f1)
          if [ "$old" != "$new" ]; then
            echo "::error::registry-side promotion changed the manifest digest ($old != $new)"
            exit 1
          fi
          echo "Reused $IMAGE:testing as $IMAGE:testing-${SHA7} ($new)"

  # The thin client, published on the SAME cadence as the images it talks to.
  #
  # Without this the only obtainable client is the last GitHub Release, so a
  # :testing deployment moves on every merge while its operators stay pinned to
  # a release that can be weeks behind. That gap is not hypothetical: it is how a
  # client seven days behind its server ended up rendering nothing for commands
  # whose printers existed only server-side, and it cost a day of misdiagnosis
  # before anyone compared build dates.
  #
  # ARTIFACTS, NOT A RELEASE. release-thin-client.yml is reusable-only precisely
  # so every published Release passes the protected `release` environment; adding
  # a Release here would route around that approval. Fetch with:
  #   gh run download --repo <owner>/aimee -n aimee-linux-x86_64 --dir .
  #
  # LINUX ONLY, deliberately. macOS and Windows runners cost minutes per merge and
  # this job runs on every push to testing; the release pipeline still owns those
  # two platforms. Adding a leg here is a matrix entry if that trade stops holding.
  thin-client:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: aimee-linux-x86_64
          - os: ubuntu-24.04-arm
            asset: aimee-linux-arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Deps
        run: |
          sudo apt-get update -q
          i=0; until timeout 240 sudo apt-get install -y -q gcc make libsqlite3-dev; do i=$((i+1)); [ "$i" -ge 3 ] && break; echo "apt-get install retry $i (mirror hung or failed)"; sleep $((i*5)); done

      # Stamp the version the SERVER images in this same run are stamped with, so
      # a client and the server it was published beside report the same build.
      # The Makefile derives AIMEE_GIT_COMMIT_TIME from HEAD itself; that stamp is
      # what orders a non-semver `testing-<sha>` pair, so it must not be bypassed.
      - name: Build thin client
        run: |
          cd src
          make -j"$(nproc)" GIT_VERSION="testing-${GITHUB_SHA::7}" ../aimee

      - name: Stage + smoke test
        run: |
          cp aimee "${{ matrix.asset }}"
          ./${{ matrix.asset }} version

      - name: Upload ${{ matrix.asset }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          retention-days: 30
