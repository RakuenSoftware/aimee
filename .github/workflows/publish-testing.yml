# Build the deployable aimee images on every push to `testing` and publish them
# under a DELIBERATELY non-semver tag (`:testing` + `:testing-<sha>`), so the
# testing branch can be deployed/validated (e.g. on .254) WITHOUT promoting to
# main.
#
# Builds the split images (aimee-server, aimee-kb) so a split compose stack (the
# .254 layout: postgres + aimee-llm + aimee-kb + aimee-server) can pull `:testing`.
# Versioned + `:latest` publishing of the full image set
# stays owned by main (auto-release.yml -> publish-images.yml). Keeping testing on
# a `:testing` tag — never a version number — avoids confusing a tested-but-
# unreleased build with a real release. amd64 only (the .254 deploy target); the
# release pipeline owns multi-arch.
name: Publish testing image

on:
  push:
    branches: [testing]
    # Only rebuild when something that affects the image changes.
    paths:
      - "src/**"
      - "config/**"
      - "deploy/container/**"
      - "scripts/**"
      - "Dockerfile"
      - "Dockerfile.server"
      - "Dockerfile.combined"
      - ".github/workflows/publish-testing.yml"
  workflow_dispatch:

concurrency:
  group: publish-testing-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Same image set + Dockerfiles as the release pipeline
        # (publish-images.yml), minus the embedder/llm/css legs that testing does
        # not redeploy. Cache scopes match publish-images so testing reuses the
        # release layer cache and never restarts the LTO C build from scratch.
        image:
          - { name: aimee-server,    dockerfile: Dockerfile.server }
          - { name: aimee-kb,        dockerfile: Dockerfile }
          - { name: aimee-combined,  dockerfile: Dockerfile.combined }
    steps:
      - uses: actions/checkout@v4

      # ghcr paths must be lowercase; owners may be mixed-case (e.g. "JBailes").
      - name: Normalize owner + short sha
        run: |
          echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "SHA7=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The combined appliance bundles server + kb + webchat + code-server + the
      # llama.cpp runtime — reclaim preinstalled toolchains to fit a stock runner.
      - name: Free disk space (combined leg)
        if: matrix.image.name == 'aimee-combined'
        run: |
          echo "before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/.ghcup /usr/local/share/boost \
            /usr/share/swift /usr/local/share/powershell /usr/local/lib/node_modules \
            /opt/microsoft /opt/az "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo apt-get clean || true
          echo "after:"; df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.image.name }}:testing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          # Share the layer cache with the release pipeline (same scope) so testing
          # builds are fast and never start the LTO C build from scratch.
          cache-from: type=gha,scope=${{ matrix.image.name }}-amd64
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-amd64
          # WITH_WEBCHAT bundles the browser UI (default for aimee-server; the
          # aimee-kb image ignores it). WITH_LLM=0: no LLM is bundled — the deploy
          # stack runs a separate, profile-gated aimee-llm container instead (see
          # compose.server.yaml).
          build-args: |
            AIMEE_VERSION=testing-${{ env.SHA7 }}
            WITH_WEBCHAT=1
            WITH_LLM=0
          tags: |
            ghcr.io/${{ env.OWNER }}/${{ matrix.image.name }}:testing
            ghcr.io/${{ env.OWNER }}/${{ matrix.image.name }}:testing-${{ env.SHA7 }}
