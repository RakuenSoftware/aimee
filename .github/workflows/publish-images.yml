# Build the aimee container images on GitHub runners and push them to ghcr.io.
# Covers the full image set documented in
# docs/proposals/pending/aimee-e2e-deploy-matrix.md:
#
#   aimee-server     (Dockerfile.server)      ghcr.io/<owner>/aimee-server
#   aimee-authority-bootstrap (Dockerfile.authority-bootstrap) ghcr.io/<owner>/aimee-authority-bootstrap
#   aimee-css-render (deploy/css-render/Dockerfile) ghcr.io/<owner>/aimee-css-render
#
# plus the aimee-kb matrix, all six from the SAME Dockerfile via build-args. Both
# the embedder AND the synthesis model are baked, so which models a deployment runs
# is a property of the tag it pulled — never a first-run download:
#
#   aimee-kb                  bekko-a25m (384)  no llama.cpp
#   aimee-kb-llm-e2b          bekko-a25m (384)  llama.cpp + gemma-4-E2B-it
#   aimee-kb-llm-e4b          bekko-a25m (384)  llama.cpp + gemma-4-E4B-it
#   aimee-kb-nomic            nomic-v2   (768)  no llama.cpp
#   aimee-kb-nomic-llm-e2b    nomic-v2   (768)  llama.cpp + gemma-4-E2B-it
#   aimee-kb-nomic-llm-e4b    nomic-v2   (768)  llama.cpp + gemma-4-E4B-it
#
# The external-embedder deployment shares the bekko images and overrides
# EMBEDDER_URL at runtime; there is no separate "external" image.
#
# Multi-arch (linux/amd64 + linux/arm64) via the canonical build-by-digest then
# merge-manifest pattern, on native runners (no QEMU emulation of the C build).
#
# Triggers:
#   - push of a `v*` tag  -> versioned images derived from the tag
#   - workflow_call       -> version passed in by the auto-release orchestrator
#   - workflow_dispatch   -> optional manual version input
# Versioned publishing on `main` is owned by auto-release.yml (which calls this
# workflow), so there is no bare `push: branches: [main]` trigger here.
name: Publish images

on:
  # A PULL REQUEST BUILDS BUT NEVER PUSHES. The point is to prove the Dockerfile
  # still builds — publishing is a merge-time act, so nothing unreviewed can land
  # in the registry. Path-filtered so unrelated PRs do not pay for a multi-arch
  # build of four images.
  pull_request:
    paths:
      - "Dockerfile*"
      - "deploy/**"
      - "scripts/embedders.json"
      - "src/**"
      - "frontend/**"
      - ".github/workflows/publish-images.yml"
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without leading v (e.g. 0.2.1)'
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: 'Version without leading v (e.g. 0.2.1)'
        required: true
        type: string

concurrency:
  group: publish-images-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # Resolve the version once (from the call/dispatch input or the pushed tag) so
  # the build (binary embedding) and merge (image tags) jobs agree.
  prep:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Resolve version
        id: v
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            v="${{ inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v=""
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  # Build each image for each arch on a native runner; push by digest only.
  build:
    needs: prep
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: aimee-server,    dockerfile: Dockerfile.server }
          # The aimee-kb 2x2: embedder (bekko 384 / nomic 768) x llama.cpp.
          # ONE Dockerfile, four tags, selected by build-args. The embedder axis is
          # a one-way door per install (DB2 locks the vector-column width), and the
          # llama.cpp axis decides whether synthesis can run on the same host.
          - { name: aimee-kb,                  dockerfile: Dockerfile,
              extra_args: "AIMEE_EMBEDDER=bekko-a25m\nAIMEE_WITH_LLAMACPP=0" }
          - { name: aimee-kb-llm-e2b,          dockerfile: Dockerfile,
              extra_args: "AIMEE_EMBEDDER=bekko-a25m\nAIMEE_WITH_LLAMACPP=1\nAIMEE_SYNTHESIS_MODEL=gemma-4-E2B-it" }
          - { name: aimee-kb-llm-e4b,          dockerfile: Dockerfile,
              extra_args: "AIMEE_EMBEDDER=bekko-a25m\nAIMEE_WITH_LLAMACPP=1\nAIMEE_SYNTHESIS_MODEL=gemma-4-E4B-it" }
          - { name: aimee-kb-nomic,            dockerfile: Dockerfile,
              extra_args: "AIMEE_EMBEDDER=nomic-embed-text-v2-moe\nAIMEE_WITH_LLAMACPP=0" }
          - { name: aimee-kb-nomic-llm-e2b,    dockerfile: Dockerfile,
              extra_args: "AIMEE_EMBEDDER=nomic-embed-text-v2-moe\nAIMEE_WITH_LLAMACPP=1\nAIMEE_SYNTHESIS_MODEL=gemma-4-E2B-it" }
          - { name: aimee-kb-nomic-llm-e4b,    dockerfile: Dockerfile,
              extra_args: "AIMEE_EMBEDDER=nomic-embed-text-v2-moe\nAIMEE_WITH_LLAMACPP=1\nAIMEE_SYNTHESIS_MODEL=gemma-4-E4B-it" }
          - { name: aimee-authority-bootstrap, dockerfile: Dockerfile.authority-bootstrap }
          # #4-full render backend (headless-Chromium sidecar). Self-contained
          # under deploy/css-render (its own build context); independent of the C
          # build, so a failure here never blocks the aimee images (fail-fast off).
          - { name: aimee-css-render, dockerfile: deploy/css-render/Dockerfile, context: deploy/css-render }
        platform:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v4

      # ghcr image paths must be lowercase, but GitHub owners may be mixed-case
      # (e.g. "JBailes"). Normalize once and reuse via env.OWNER.
      - name: Normalize owner to lowercase
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context || '.' }}
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/${{ matrix.platform.arch }}
          provenance: false
          # Reuse layers across releases. Without this every release rebuilt all
          # images on both arches from scratch — re-running the full LTO C build
          # each time. Scoped per image+arch so the matrix legs never clobber each
          # other. EXCLUDES aimee-css-render: its browser layers would blow the
          # 10 GB GHA cache budget and evict the (small, high-reuse) C-image
          # caches, defeating the purpose.
          cache-from: ${{ matrix.image.name != 'aimee-css-render' && format('type=gha,scope={0}-{1}', matrix.image.name, matrix.platform.arch) || '' }}
          cache-to: ${{ matrix.image.name != 'aimee-css-render' && format('type=gha,mode=max,scope={0}-{1}', matrix.image.name, matrix.platform.arch) || '' }}
          # Images bundle the browser UI (WITH_RUNTIME_WEB=1, the default). webchat's
          # frontend dependency (@rakuensoftware/smoothgui) is vendored in-repo, so
          # the build needs no npm token. The aimee-kb image ignores WITH_RUNTIME_WEB.
          build-args: |
            AIMEE_VERSION=${{ needs.prep.outputs.version }}
            WITH_RUNTIME_WEB=1
            ${{ matrix.image.extra_args }}
          # push=false on a pull_request: build only, publish nothing.
          outputs: type=image,name=ghcr.io/${{ env.OWNER }}/${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}

      # Digests only exist when something was pushed, so both steps and the whole
      # merge job below are skipped on a pull request.
      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.image.name }}-${{ matrix.platform.arch }}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          retention-days: 1

  # Merge the per-arch digests of each image into one multi-arch manifest and
  # tag it (sha, semver/version, latest).
  merge:
    needs: [prep, build]
    # Nothing to merge when nothing was pushed. A PR stops after the build.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [aimee-server, aimee-kb, aimee-kb-llm-e2b, aimee-kb-llm-e4b,
                aimee-kb-nomic, aimee-kb-nomic-llm-e2b, aimee-kb-nomic-llm-e4b,
                aimee-authority-bootstrap, aimee-css-render]
    steps:
      - name: Normalize owner to lowercase
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      # Match ONLY this image's per-arch digests. A trailing `-*` would be greedy
      # whenever one image name is a prefix of another, pulling another image's
      # digests into this manifest and breaking the push. Anchor on the exact arch
      # suffixes instead (brace expansion, no wildcard across `-`).
      - name: Download this image's digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.image }}-{amd64,arm64}
          path: /tmp/digests
          merge-multiple: true

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.OWNER }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=${{ needs.prep.outputs.version }},enable=${{ needs.prep.outputs.version != '' }}
            type=raw,value=latest,enable=${{ needs.prep.outputs.version != '' }}
            type=sha

      - name: Create + push the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          # Assemble the list of source digests for this image. Expect exactly the
          # per-arch builds (amd64 + arm64); fail loudly on a mismatch rather than
          # pushing a partial or cross-image manifest.
          srcs=""
          count=0
          for f in *; do
            [ -e "$f" ] || continue
            srcs="$srcs ghcr.io/${OWNER}/${{ matrix.image }}@$(cat "$f")"
            count=$((count + 1))
          done
          echo "Found $count digest(s) for ${{ matrix.image }}: $srcs"
          if [ "$count" -eq 0 ]; then
            echo "::error::no digests matched for ${{ matrix.image }} — check the download-artifact pattern"
            exit 1
          fi
          # Apply every tag the metadata action produced to the merged manifest.
          tags=$(jq -r '.tags[] | "-t " + .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools create $tags $srcs

      - name: Inspect published manifest
        run: docker buildx imagetools inspect ghcr.io/${OWNER}/${{ matrix.image }}:${{ needs.prep.outputs.version != '' && needs.prep.outputs.version || steps.meta.outputs.version }}
