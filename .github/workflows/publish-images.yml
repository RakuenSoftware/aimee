# Build the three aimee container images on GitHub runners and push them to
# ghcr.io. Covers the full image set documented in
# docs/proposals/pending/aimee-e2e-deploy-matrix.md:
#
#   aimee-server     (Dockerfile.server)      ghcr.io/<owner>/aimee-server
#   aimee-kb         (Dockerfile)             ghcr.io/<owner>/aimee-kb
#   aimee-server-kb  (Dockerfile.combined)    ghcr.io/<owner>/aimee-server-kb
#   aimee-embedder   (Dockerfile.embedder)    ghcr.io/<owner>/aimee-embedder (+ -4b)
#   aimee-css-render (deploy/css-render/Dockerfile) ghcr.io/<owner>/aimee-css-render
#
# Multi-arch (linux/amd64 + linux/arm64) via the canonical build-by-digest then
# merge-manifest pattern, on native runners (no QEMU emulation of the C build).
#
# Triggers:
#   - push of a `v*` tag  -> versioned images derived from the tag
#   - workflow_call       -> version passed in by the auto-release orchestrator
#   - workflow_dispatch   -> optional manual version input
# Versioned publishing on `main` is owned by auto-release.yml (which calls this
# workflow), so there is no bare `push: branches: [main]` trigger here.
name: Publish images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without leading v (e.g. 0.2.1)'
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: 'Version without leading v (e.g. 0.2.1)'
        required: true
        type: string

concurrency:
  group: publish-images-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # Resolve the version once (from the call/dispatch input or the pushed tag) so
  # the build (binary embedding) and merge (image tags) jobs agree.
  prep:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Resolve version
        id: v
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            v="${{ inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v=""
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  # Build each image for each arch on a native runner; push by digest only.
  build:
    needs: prep
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: aimee-server,    dockerfile: Dockerfile.server }
          - { name: aimee-kb,        dockerfile: Dockerfile }
          - { name: aimee-server-kb, dockerfile: Dockerfile.combined }
          - { name: aimee-embedder,  dockerfile: Dockerfile.embedder }
          # Higher-fidelity alternate tier: same Dockerfile, 4b embedder + 1b reranker
          # baked in. Pair with embedding_dim: 2560 (see docs). Default (above) is
          # the 0.6b embedder + 400m reranker.
          - { name: aimee-embedder-4b, dockerfile: Dockerfile.embedder, embedder_arg: "EMBEDDER_MODEL=perplexity-ai/pplx-embed-v1-4b", reranker_arg: "RERANKER_MODEL=cross-encoder/ettin-reranker-1b-v1" }
          # #4-full render backend (headless-Chromium sidecar). Self-contained
          # under deploy/css-render (its own build context); independent of the C
          # build, so a failure here never blocks the aimee images (fail-fast off).
          - { name: aimee-css-render, dockerfile: deploy/css-render/Dockerfile, context: deploy/css-render }
        platform:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v4

      # ghcr image paths must be lowercase, but GitHub owners may be mixed-case
      # (e.g. "JBailes"). Normalize once and reuse via env.OWNER.
      - name: Normalize owner to lowercase
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context || '.' }}
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/${{ matrix.platform.arch }}
          provenance: false
          # Reuse layers across releases. Without this every release rebuilt all
          # images on both arches from scratch — re-running the full LTO C build
          # each time. Scoped per image+arch so the matrix legs never clobber each
          # other. EXCLUDES aimee-embedder: its torch + baked multi-GB model layers
          # would blow the 10 GB GHA cache budget and evict the (small, high-reuse)
          # C-image caches, defeating the purpose. The embedder's real win is the
          # runtime model fetch (embedder-runtime-fetch-autodim proposal), not the
          # layer cache.
          cache-from: ${{ (matrix.image.name != 'aimee-embedder' && matrix.image.name != 'aimee-embedder-4b' && matrix.image.name != 'aimee-css-render') && format('type=gha,scope={0}-{1}', matrix.image.name, matrix.platform.arch) || '' }}
          cache-to: ${{ (matrix.image.name != 'aimee-embedder' && matrix.image.name != 'aimee-embedder-4b' && matrix.image.name != 'aimee-css-render') && format('type=gha,mode=max,scope={0}-{1}', matrix.image.name, matrix.platform.arch) || '' }}
          # Published images bundle the optional browser UI (WITH_WEBCHAT=1); the
          # default `docker compose up --build` an end user runs leaves it off so it
          # needs no credentials. The aimee-kb image ignores WITH_WEBCHAT.
          build-args: |
            AIMEE_VERSION=${{ needs.prep.outputs.version }}
            WITH_WEBCHAT=1
            ${{ matrix.image.embedder_arg }}
            ${{ matrix.image.reranker_arg }}
          # webchat's SPA pulls @rakuensoftware/smoothgui from GitHub Packages,
          # whose npm registry requires an authenticated token (even for public
          # reads). Prefer a repo/org NPM_TOKEN secret (a PAT with read:packages);
          # fall back to the built-in GITHUB_TOKEN, which suffices for public
          # packages. The aimee-kb image ignores it. Passed via BuildKit so the
          # token never lands in an image layer.
          secrets: |
            npm_token=${{ secrets.NPM_TOKEN || secrets.GITHUB_TOKEN }}
          outputs: type=image,name=ghcr.io/${{ env.OWNER }}/${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.image.name }}-${{ matrix.platform.arch }}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          retention-days: 1

  # Merge the per-arch digests of each image into one multi-arch manifest and
  # tag it (sha, semver/version, latest).
  merge:
    needs: [prep, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [aimee-server, aimee-kb, aimee-server-kb, aimee-embedder, aimee-embedder-4b, aimee-css-render]
    steps:
      - name: Normalize owner to lowercase
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      # Match ONLY this image's per-arch digests. A trailing `-*` would be greedy:
      # `digest-aimee-server-*` also matches `digest-aimee-server-kb-*` (one image
      # name is a prefix of another), which previously pulled the combined image's
      # digests into the aimee-server manifest and broke the push. Anchor on the
      # exact arch suffixes instead (brace expansion, no wildcard across `-`).
      - name: Download this image's digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.image }}-{amd64,arm64}
          path: /tmp/digests
          merge-multiple: true

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.OWNER }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=${{ needs.prep.outputs.version }},enable=${{ needs.prep.outputs.version != '' }}
            type=raw,value=latest,enable=${{ needs.prep.outputs.version != '' }}
            type=sha

      - name: Create + push the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          # Assemble the list of source digests for this image. Expect exactly the
          # per-arch builds (amd64 + arm64); fail loudly on a mismatch rather than
          # pushing a partial or cross-image manifest.
          srcs=""
          count=0
          for f in *; do
            [ -e "$f" ] || continue
            srcs="$srcs ghcr.io/${OWNER}/${{ matrix.image }}@$(cat "$f")"
            count=$((count + 1))
          done
          echo "Found $count digest(s) for ${{ matrix.image }}: $srcs"
          if [ "$count" -eq 0 ]; then
            echo "::error::no digests matched for ${{ matrix.image }} — check the download-artifact pattern"
            exit 1
          fi
          # Apply every tag the metadata action produced to the merged manifest.
          tags=$(jq -r '.tags[] | "-t " + .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools create $tags $srcs

      - name: Inspect published manifest
        run: docker buildx imagetools inspect ghcr.io/${OWNER}/${{ matrix.image }}:${{ needs.prep.outputs.version != '' && needs.prep.outputs.version || steps.meta.outputs.version }}
