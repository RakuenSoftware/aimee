name: CI

on:
  # Re-run the gate on each integration tip; PR checks alone only cover the
  # merge preview that existed when the PR ran.
  push:
    branches: [main, testing, feature/core-modularization]
  pull_request:
    branches: [main, testing, feature/core-modularization, 'aimee/feat/**', 'agent/**']
    # NOTE this filter matches the BASE branch, so anything missing from it does
    # not get a weaker gate — it gets NO gate, and merges with zero checks
    # recorded. That is not hypothetical: PRs based on agent/<topic> integration
    # branches ran no CI at all and merged a broken build.
    #
    # Slice sub-PRs target aimee/feat/<work-item-id>; agent/<topic> branches are
    # used the same way, as integration bases that sub-PRs stack onto before the
    # whole thing reaches testing. Both are included so every sub-PR passes the
    # same complete gate as the final feature PR.
    #
    # Adding 'agent/**' here does NOT double-run anything: a PR FROM agent/x INTO
    # testing already matched on its base. This only adds PRs whose base is an
    # agent branch, which previously matched nothing.
    #
    # `edited` re-runs the gate when a PR title/body is edited after open, so
    # attribution can't be added post-hoc without failing CI.
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Every CI job is deliberately read-only: jobs only check out, build, and
  # inspect the repository; none comments, labels, publishes, or mutates it.
  # A future write-capable job must opt in with its own minimal permissions.
  contents: read

jobs:
  # Keep the workflow itself unfiltered: GitHub leaves required checks pending
  # when an entire workflow is skipped by a path filter. Job-level skips report
  # success, so required checks remain mergeable for documentation-only PRs.
  change-scope:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      # Separate from docs_only on purpose: see the documentation step below.
      docs_changed: ${{ steps.classify.outputs.docs_changed }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Protected-branch pushes and manual runs always receive the full gate.
          if [ "$EVENT_NAME" != pull_request ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "docs_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # This allowlist is intentionally narrow. Anything executable,
          # generated from executable sources, or operational takes the full path.
          docs_only=true
          docs_changed=false
          file_count=0
          while IFS= read -r -d '' path; do
            file_count=$((file_count + 1))
            case "$path" in
              README.md|CONTRIBUTING.md|MANUAL.md|OWNERS.md|docs/*.md|docs/images/*|docs/gen/*.json)
                docs_changed=true
                ;;
              */README.md)
                case "$path" in
                  control-web/*|data/*|deploy/*|editors/*|runtime-web/*|scripts/*|server-go/*|src/*)
                    docs_changed=true
                    ;;
                  *)
                    docs_only=false
                    ;;
                esac
                ;;
              *)
                docs_only=false
                ;;
            esac
            printf '%s\n' "$path"
          done < <(git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" --)

          # An empty or unclassifiable change set must take the conservative path.
          if [ "$file_count" -eq 0 ]; then
            docs_only=false
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs_changed=$docs_changed" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only ($file_count changed file(s))"

  no-coauthor-trailers:
    # Standing directive: commits/PRs must never carry AI co-authorship trailers.
    # Scans only the PR's NEW commits (base..head), so existing history is
    # grandfathered while any newly introduced trailer fails the PR.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject AI co-authorship trailers in new commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          range="${BASE_SHA}..${HEAD_SHA}"
          # Match the actual trailer forms only (anchored), not prose that happens
          # to mention them: a "co-authored-by:" line, or the markdown-link
          # "Generated with [Claude Code]"/"[Codex ...]" attribution line.
          # Immutable commits that entered testing carrying a trailer. They are
          # grandfathered only for the testing -> main integration PR; exact SHAs
          # keep the exception from hiding descendants or any newly introduced
          # trailer.
          #
          # These are not ours to strip. The trailer is added by GITHUB, not by
          # aimee: the WFE authors its commits as aimee-wfe <wfe@aimee.local>, so
          # squash-merging a PR that mixes its commits with a human's produces a
          # Co-authored-by line for the second author. Rewriting them would rewrite
          # published history on testing to fix a message GitHub generated.
          #
          # This list grows once per promote until that is addressed at the source
          # (have the WFE author as the operator, or strip the trailer from the
          # squash message at merge time). Growth is the signal that it has not
          # been.
          hits=$(
            for commit in $(git rev-list "$range"); do
              if [ "$BASE_REF" = main ] && [ "$HEAD_REF" = testing ]; then
                case "$commit" in
                  9f327867cd62a14e50e9a41af9b871fc7792e4bd|003255217a10a8559e47bf0b6fedeb2c0faa6cce|\
                  d173e054353a1069bd07a307477ad281a3d39d59|0b694e1970eab860b503b433bb69f708fc445abc)
                    continue
                    ;;
                esac
              fi
              git show -s --format='%H%n%B' "$commit" \
                | grep -inE '^[[:space:]]*co-authored-by:|generated with \[(claude|codex)' || true
            done
          )
          if [ -n "$hits" ]; then
            echo "::error::New commit(s) in $range carry AI co-authorship trailers; remove them (standing directive)."
            echo "$hits"
            exit 1
          fi
          echo "no co-authorship trailers in $range — ok"
      - name: Reject AI attribution in the PR title/body
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          hits=$(printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" \
                 | grep -inE '^[[:space:]]*co-authored-by:|generated with \[(claude|codex)' || true)
          if [ -n "$hits" ]; then
            echo "::error::The PR title/body carries AI attribution; remove it (standing directive)."
            echo "$hits"
            exit 1
          fi
          echo "no AI attribution in PR title/body — ok"

  lint:
    needs: change-scope
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Runner diagnostics
        run: |
          echo "::group::Runner environment"
          echo "ref: $GITHUB_REF  sha: $GITHUB_SHA  runner: $RUNNER_OS $RUNNER_ARCH"
          uname -a
          gcc --version 2>/dev/null || true
          make --version 2>/dev/null | head -1 || true
          df -h / | tail -1
          echo "::endgroup::"
      - name: Install clang-format
        if: needs.change-scope.outputs.docs_only != 'true'
        run: |
          # GitHub runners preinstall third-party apt repos (e.g. packages.microsoft.com)
          # that intermittently serve invalid/unsigned metadata and fail `apt-get update`
          # hard — though none of our packages come from them. Drop them, then retry
          # update with backoff so a transient mirror hiccup doesn't fail the job.
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list 2>/dev/null || true
          i=0; until sudo apt-get update -q; do i=$((i+1)); [ "$i" -ge 5 ] && break; echo "apt-get update retry $i (transient repo failure)"; sleep $((i*4)); done
          sudo apt-get install -y -q clang-format-19 ripgrep
      - name: Check formatting
        if: needs.change-scope.outputs.docs_only != 'true'
        run: cd src && make lint
      - name: Check 3db tier dependencies
        if: needs.change-scope.outputs.docs_only != 'true'
        run: ./scripts/check_tier_deps.sh
      - name: Check managed authority packaging boundary
        if: needs.change-scope.outputs.docs_only != 'true'
        run: python3 scripts/check-managed-authority-packaging.py
      # Runs unconditionally: it costs no network and no build, and the thing it guards
      # is the gating logic itself, which is exactly the part a conditional step cannot
      # be trusted to check.
      - name: Test the CI change classifier
        run: python3 -I scripts/tests/test_ci_change_scope.py

      # docs_CHANGED, not docs_only. Gated on docs_only, this never ran for a pull
      # request that touched documentation AND anything else -- which is most of them,
      # and is how six em-dash violations reached testing in #2280: that PR edited
      # docs/SYNTHESIS_MODELS.md plus one frontend file, so it was not docs-only, this
      # step was skipped, lint reported success, and the violation then failed every
      # branch cut from testing afterwards. The next docs-only PR ran the check and
      # inherited someone else's failure, which is the worst way to find out.
      #
      # docs-gen-check and `git diff --check` stay on docs_only: the first needs a build
      # and the second is about whitespace in the diff, and both already run in the full
      # gate that a non-docs-only PR takes.
      - name: Check documentation
        if: needs.change-scope.outputs.docs_changed == 'true'
        run: python3 scripts/check-docs.py

      - name: Check generated docs and diff hygiene
        if: needs.change-scope.outputs.docs_only == 'true'
        run: |
          make -C src docs-gen-check
          git diff --check

  build:
    needs: change-scope
    if: ${{ !cancelled() && (needs.change-scope.result != 'success' || needs.change-scope.outputs.docs_only != 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Runner diagnostics
        run: |
          echo "::group::Runner environment"
          echo "ref: $GITHUB_REF  sha: $GITHUB_SHA  runner: $RUNNER_OS $RUNNER_ARCH"
          uname -a
          gcc --version 2>/dev/null || true
          make --version 2>/dev/null | head -1 || true
          df -h / | tail -1
          echo "::endgroup::"
      - name: Install dependencies
        run: |
          # GitHub runners preinstall third-party apt repos (e.g. packages.microsoft.com)
          # that intermittently serve invalid/unsigned metadata and fail `apt-get update`
          # hard — though none of our packages come from them. Drop them, then retry
          # update with backoff so a transient mirror hiccup doesn't fail the job.
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list 2>/dev/null || true
          i=0; until sudo apt-get update -q; do i=$((i+1)); [ "$i" -ge 5 ] && break; echo "apt-get update retry $i (transient repo failure)"; sleep $((i*4)); done
          sudo apt-get install -y -q gcc make \
            libsqlite3-dev libcurl4-openssl-dev libpam0g-dev libssl-dev libp11-kit-dev \
            libpq-dev
      - name: Build
        run: cd src && make -j$(nproc) all server
      - name: Skill lint
        run: |
          sock=/tmp/aimee-ci-skill-lint.sock
          rm -f "$sock"
          AIMEE_BUNDLED_SKILLS_DIR="$PWD/skills" ./aimee-server --socket="$sock" &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            [ -S "$sock" ] && break
            sleep 0.1
          done
          AIMEE_SOCK="$sock" AIMEE_BUNDLED_SKILLS_DIR="$PWD/skills" ./aimee skill lint --all
      - name: Smoke test
        run: |
          ./aimee version
          ./aimee-server --version
          ./aimee-kb --version
          test -x ./aimee-runtime-web
      # A configured remote is an exclusive transport: no local probe, no local
      # execution, no local fallback. The test is black-box (temp HOME, a local
      # HTTP stand-in, and a unix-socket sentinel that must never be contacted),
      # needs only the client this job already built, and runs in seconds. It
      # also lives in the `integration-tests` make target, which no workflow
      # invokes — without this step the guarantee is unenforced in CI.
      - name: Thin-client remote exclusivity
        run: python3 scripts/test-thin-client-remote-exclusive.py ./aimee

  build-integrity:
    needs: change-scope
    if: ${{ !cancelled() && (needs.change-scope.result != 'success' || needs.change-scope.outputs.docs_only != 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Runner diagnostics
        run: |
          echo "::group::Runner environment"
          echo "ref: $GITHUB_REF  sha: $GITHUB_SHA  runner: $RUNNER_OS $RUNNER_ARCH"
          uname -a
          gcc --version 2>/dev/null || true
          make --version 2>/dev/null | head -1 || true
          df -h / | tail -1
          echo "::endgroup::"
      - name: Install dependencies
        run: |
          # GitHub runners preinstall third-party apt repos (e.g. packages.microsoft.com)
          # that intermittently serve invalid/unsigned metadata and fail `apt-get update`
          # hard — though none of our packages come from them. Drop them, then retry
          # update with backoff so a transient mirror hiccup doesn't fail the job.
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list 2>/dev/null || true
          i=0; until sudo apt-get update -q; do i=$((i+1)); [ "$i" -ge 5 ] && break; echo "apt-get update retry $i (transient repo failure)"; sleep $((i*4)); done
          sudo apt-get install -y -q gcc make \
            libsqlite3-dev libcurl4-openssl-dev libpam0g-dev libssl-dev libp11-kit-dev \
            libpq-dev
      - name: Build integrity
        run: cd src && make -j"$(nproc)" build-integrity

      # The linker is what proves a capability is absent from what ships; a source
      # grep only proves nothing calls it. These checks caught nothing by hand
      # because they were only ever run by hand — see scripts/validate-aimee-artifacts.sh.
      - name: Build the shipping set
        run: cd src && make -j"$(nproc)" all
      - name: Artifact integrity (removed capabilities stay removed)
        run: bash scripts/validate-aimee-artifacts.sh

  unit-test-shards:
    needs: change-scope
    if: ${{ !cancelled() && (needs.change-scope.result != 'success' || needs.change-scope.outputs.docs_only != 'true') }}
    runs-on: ubuntu-latest
    name: unit-tests (${{ matrix.label }}/2)
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard_index: 0
            label: 1
          - shard_index: 1
            label: 2
    # Live Postgres sidecar so unit-test-aimee-db and unit-test-memory-postgres
    # exercise the real libpq path (placeholder rewriter, FTS5→tsvector
    # translation, ON CONFLICT targets, schema apply) instead of skipping
    # when AIMEE_TEST_PG_URL is unset. pg_trgm is required by the
    # memories_code_fts trigram index (see src/schema/postgres.sql).
    env:
      AIMEE_TEST_PG_URL: postgres://aimee:aimee@localhost:5432/aimee_test
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: unit-ccache-v1-${{ runner.os }}-${{ matrix.shard_index }}-${{ hashFiles('src/Makefile', 'src/tests/Rules.mk') }}-${{ github.run_id }}
          restore-keys: |
            unit-ccache-v1-${{ runner.os }}-${{ matrix.shard_index }}-${{ hashFiles('src/Makefile', 'src/tests/Rules.mk') }}-
            unit-ccache-v1-${{ runner.os }}-${{ matrix.shard_index }}-
      - name: Runner diagnostics
        run: |
          echo "::group::Runner environment"
          echo "ref: $GITHUB_REF  sha: $GITHUB_SHA  runner: $RUNNER_OS $RUNNER_ARCH"
          uname -a
          gcc --version 2>/dev/null || true
          make --version 2>/dev/null | head -1 || true
          df -h / | tail -1
          echo "::endgroup::"
      - name: Start Postgres (pgvector) with pull retry
        # Started manually rather than as a `services:` container: the runner pulls
        # service images with no retry, so a transient Docker Hub timeout fails the
        # whole required check (the unit-tests flake). Pull with backoff, then run.
        # pgvector/pgvector (debian, not alpine) ships pgvector >= 0.7 (halfvec —
        # the unified embedding column type) and the contrib modules incl. pg_trgm
        # (the memories_code_fts trigram index); postgres:*-alpine shipped neither.
        run: |
          img=pgvector/pgvector:pg18
          for attempt in 1 2 3 4 5; do
            docker pull "$img" && break
            echo "docker pull $img failed (attempt $attempt/5); backing off"
            sleep $((attempt * 10))
          done
          docker run -d --name aimee-pg \
            -e POSTGRES_USER=aimee -e POSTGRES_PASSWORD=aimee -e POSTGRES_DB=aimee_test \
            -p 5432:5432 \
            --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10 \
            "$img"
      - name: Install dependencies
        run: |
          # GitHub runners preinstall third-party apt repos (e.g. packages.microsoft.com)
          # that intermittently serve invalid/unsigned metadata and fail `apt-get update`
          # hard — though none of our packages come from them. Drop them, then retry
          # update with backoff so a transient mirror hiccup doesn't fail the job.
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list 2>/dev/null || true
          i=0; until sudo apt-get update -q; do i=$((i+1)); [ "$i" -ge 5 ] && break; echo "apt-get update retry $i (transient repo failure)"; sleep $((i*4)); done
          sudo apt-get install -y -q gcc make ccache \
            libsqlite3-dev libcurl4-openssl-dev libpam0g-dev libssl-dev libp11-kit-dev \
            libpq-dev postgresql-client
      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U aimee && exit 0
            sleep 2
          done
          echo "Postgres did not become ready in time"; docker logs aimee-pg || true; exit 1
      - name: Unit tests
        run: |
          # Runner image metadata is outside the repository's control. Install
          # deterministic root-owned copies so the positive path exercises the
          # production trust walk without depending on /usr/bin ownership/mode.
          sudo install -d -o root -g root -m 0755 /run/aimee-test-helpers
          for helper in cat env yes true; do
            sudo install -o root -g root -m 0755 "$(type -P "$helper")" \
              "/run/aimee-test-helpers/$helper"
          done
          sudo stat -Lc '%U:%G %a %n' /run/aimee-test-helpers \
            /run/aimee-test-helpers/cat /run/aimee-test-helpers/env \
            /run/aimee-test-helpers/yes /run/aimee-test-helpers/true
          printf '%s\n' 'deterministic root-owned test fixture' | \
            sudo tee /run/aimee-test-helpers/root-file >/dev/null
          sudo chown root:root /run/aimee-test-helpers/root-file
          sudo chmod 0644 /run/aimee-test-helpers/root-file
          sudo stat -Lc '%U:%G %a %n' /run/aimee-test-helpers/root-file
          export AIMEE_TEST_TRUSTED_CAT=/run/aimee-test-helpers/cat
          export AIMEE_TEST_TRUSTED_ENV=/run/aimee-test-helpers/env
          export AIMEE_TEST_TRUSTED_YES=/run/aimee-test-helpers/yes
          export AIMEE_TEST_TRUSTED_TRUE=/run/aimee-test-helpers/true
          export AIMEE_TEST_TRUSTED_ROOT_FILE=/run/aimee-test-helpers/root-file
          ccache --max-size=750M
          ccache --zero-stats
          cd src
          make -j"$(nproc)" CC="ccache gcc" \
            GIT_VERSION=ci GIT_COMMIT_TIME=1700000000 \
            UNIT_TEST_SHARD_COUNT=2 \
            UNIT_TEST_SHARD_INDEX=${{ matrix.shard_index }} \
            UNIT_TEST_SKIP_P1=1 \
            unit-tests
          ccache --show-stats

  # Stable protected context for the sharded suite. It remains named
  # `unit-tests`, so branch protection needs no transition window, and it also
  # makes the already-separate real-Postgres RLS gate part of that required
  # result instead of running it redundantly in every unit build.
  unit-tests:
    needs: [change-scope, unit-test-shards, p1-rls-gate]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Confirm complete unit gate
        env:
          CHANGE_SCOPE_RESULT: ${{ needs.change-scope.result }}
          DOCS_ONLY: ${{ needs.change-scope.outputs.docs_only }}
          SHARDS_RESULT: ${{ needs.unit-test-shards.result }}
          P1_RESULT: ${{ needs.p1-rls-gate.result }}
        run: |
          if [ "$CHANGE_SCOPE_RESULT" = success ] && [ "$DOCS_ONLY" = true ]; then
            echo "Documentation-only change: unit shards and P1 gate skipped."
            exit 0
          fi
          [ "$SHARDS_RESULT" = success ] || {
            echo "Unit-test shard result: $SHARDS_RESULT" >&2
            exit 1
          }
          [ "$P1_RESULT" = success ] || {
            echo "P1 RLS gate result: $P1_RESULT" >&2
            exit 1
          }
          echo "All unit-test shards and the P1 RLS gate passed."

  # The data-plane identity mint, end to end, against a live Postgres and a live
  # signed-HWM KMS helper.
  #
  # WHY THIS IS ITS OWN JOB RATHER THAN A make TARGET. The mint's one genuine
  # failure mode so far was an UNSPECIFIED ARGUMENT EVALUATION ORDER bug that no
  # unit test could ever have caught: the whole chain — envelope decrypt under
  # custody, RSA-3072 parse, sign, self-verify — succeeded, and only the result
  # mapping was wrong. Nothing short of running the real mint and looking at the
  # returned token distinguishes that from a real crypto fault.
  #
  # It is NOT wired as an opt-in make target, because that pattern has already
  # failed here: p1-rls-gate-check prints "enforced in CI" when AIMEE_TEST_PG_URL
  # is unset, and no workflow has ever invoked it. A gate that skips by default is
  # a gate that is off.
  #
  # BLOCKING. The data-plane identity mint, end to end, against a live Postgres and
  # a live signed-HWM KMS helper.
  #
  # WHY THIS JOB EXISTS. The mint's one genuine failure so far was an unspecified
  # ARGUMENT EVALUATION ORDER bug that no unit test could have caught: envelope
  # decrypt under custody, RSA-3072 parse, sign and self-verify all SUCCEEDED, and
  # only the result mapping was wrong. Nothing short of running the real mint and
  # looking at the returned token distinguishes that from a crypto fault.
  #
  # WHY THE MINT RUNS INSIDE A CONTAINER. The provisioners mlockall so signing key
  # material can never reach swap, which needs RLIMIT_MEMLOCK raised. Requiring the
  # RUNNER to allow that would make this job depend on a host capability nothing in
  # this repo controls and which changes with the runner image — a review rightly
  # objected to it. `docker run --ulimit memlock=-1` sets the limit for the container
  # regardless of the host, so the requirement is met by configuration rather than by
  # hope. It is also exactly the shape this job was verified in (ubuntu:24.04, root,
  # the pgvector container over TCP, no peer socket), so CI now runs the thing that
  # was proven rather than an untested variation on it.
  #
  # --network host so the harness reaches Postgres on 127.0.0.1:5432 the same way it
  # does locally, keeping one code path for both.
  identity-mint-e2e:
    needs: change-scope
    if: ${{ !cancelled() && (needs.change-scope.result != 'success' || needs.change-scope.outputs.docs_only != 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start Postgres (pgvector) with pull retry
        # Same image and retry rationale as unit-tests: the schema needs the vector
        # and pg_trgm extensions, which the runner's preinstalled Postgres does not
        # ship. A container has no postgres OS account and no peer socket, which is
        # why the harness takes AIMEE_TEST_PG_SUPERUSER_URL.
        run: |
          img=pgvector/pgvector:pg18
          for attempt in 1 2 3 4 5; do
            docker pull "$img" && break
            echo "docker pull $img failed (attempt $attempt/5); backing off"
            sleep $((attempt * 10))
          done
          docker run -d --name aimee-mint-pg --network host \
            -e POSTGRES_USER=aimee -e POSTGRES_PASSWORD=aimee -e POSTGRES_DB=aimee_mint_ci \
            "$img"
      - name: Wait for Postgres
        run: |
          for i in $(seq 1 40); do
            docker exec aimee-mint-pg pg_isready -U aimee >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "Postgres did not become ready in time"; docker logs aimee-mint-pg || true; exit 1
      - name: Build and mint inside a memlock-capable container
        # One step, because the build and the mint have to share the container that
        # holds the raised limit.
        #
        # pkg-config, libzstd-dev and zlib1g-dev are listed EXPLICITLY and the other
        # jobs in this file do not list them. They are not optional:
        #   - PQ_CFLAGS comes from `pkg-config --cflags libpq`, so without pkg-config
        #     there is no -I/usr/include/postgresql and db2/db_postgres.c fails with
        #     "libpq-fe.h: No such file or directory" despite libpq-dev being present.
        #   - L_CORE/L_KB link -lzstd -lz, so without those the provisioners fail at
        #     link with "cannot find -lzstd".
        # The other jobs survive without them only because GitHub's runner images
        # happen to preinstall them — an undeclared dependency that holds until the
        # image changes. Both failures are immediate in a clean container, which is how
        # they were found.
        run: |
          cat > /tmp/mint-job.sh <<'JOB'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive LC_ALL=C
          echo "memlock soft=$(ulimit -l) hard=$(ulimit -H -l)"
          apt-get update -q
          apt-get install -y -q gcc make pkg-config \
            libsqlite3-dev libcurl4-openssl-dev libpam0g-dev libssl-dev libp11-kit-dev \
            libpq-dev postgresql-client libzstd-dev zlib1g-dev python3
          cd /src/src
          # The provisioner targets are ../-prefixed PATHS, not bare names; building by
          # bare name fails with "No rule to make target". identity-mint-live has a
          # convenience alias because it is out of `all` on purpose — a driver, not a
          # shipped binary.
          make -j"$(nproc)" ../aimee-kb-token-roots-provision ../aimee-kb-jwks-publish \
                            identity-mint-live
          cd /src
          exec scripts/run-identity-mint-e2e.sh
          JOB
          docker run --rm --network host --ulimit memlock=-1 \
            -e AIMEE_TEST_PG_SUPERUSER_URL=postgres://aimee:aimee@127.0.0.1:5432/aimee_mint_ci \
            -v "$PWD:/src" -v /tmp/mint-job.sh:/tmp/mint-job.sh:ro \
            ubuntu:24.04 bash /tmp/mint-job.sh

  # BLOCKING. The OIDC relying-party login against a REAL identity provider.
  #
  # WHY A SEPARATE JOB FROM THE UNIT SUITE. Every unit test stubs the token-endpoint
  # POST. That is right for them — a socket in a unit test is a flake — but it left a
  # class of defect entirely uncovered, and one was found the first time this ran for
  # real: kb's HTTP client discarded every non-2xx body, so the token exchange's DENIED
  # result was UNREACHABLE and every identity-provider refusal surfaced as
  # "unparseable response". A unit test cannot see that, because a stub returns
  # whatever it is told to.
  #
  # It is also the ONLY thing covering `.deliver_error_body = 1` in the exchange:
  # removing that line passes the entire unit suite, and is caught here.
  #
  # What this exercises that nothing else does: a real TLS handshake trusted via the
  # system CA bundle only, the IdP echoing kb's state, a real client-secret-basic form
  # POST, a real RS256 id_token verified by KID against a live JWKS that also carries
  # an encryption key, the audience override, the nonce arriving inside a signed
  # payload, and the IdP refusing both a replayed code and a wrong PKCE verifier.
  oidc-login-live:
    needs: change-scope
    if: ${{ !cancelled() && (needs.change-scope.result != 'success' || needs.change-scope.outputs.docs_only != 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        # pkg-config, libzstd-dev and zlib1g-dev for the same reasons as the mint job:
        # PQ_CFLAGS comes from pkg-config, and L_KB links -lzstd -lz.
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list 2>/dev/null || true
          i=0; until sudo apt-get update -q; do i=$((i+1)); [ "$i" -ge 5 ] && break; echo "apt-get update retry $i"; sleep $((i*4)); done
          sudo apt-get install -y -q gcc make pkg-config \
            libsqlite3-dev libcurl4-openssl-dev libpam0g-dev libssl-dev libp11-kit-dev \
            libpq-dev libzstd-dev zlib1g-dev python3 curl ca-certificates
      - name: Start the identity provider
        id: idp
        run: |
          out=$(sudo bash scripts/oidc-live-idp-up.sh /tmp/aimee-oidc-idp)
          echo "$out"
          echo "$out" | grep '^CA_FILE=' >> "$GITHUB_OUTPUT"
      - name: Trust the IdP's CA, and resolve its name
        # kb's egress client anchors trust ONLY in the system bundle (it ignores
        # SSL_CERT_FILE on purpose), so the CA goes into the bundle rather than an env
        # var. /etc/hosts because the certificate names idp.aimee.test and the client
        # verifies against that name.
        run: |
          sudo cp "${{ steps.idp.outputs.CA_FILE }}" /usr/local/share/ca-certificates/aimee-test-idp-ca.crt
          sudo update-ca-certificates
          echo "127.0.0.1 idp.aimee.test" | sudo tee -a /etc/hosts
      - name: Build the live driver
        # Out of `all` on purpose: a driver, not a shipped binary. It links the real
        # token-exchange POST, which is why that call lives in its own translation unit
        # — everything else links the codec without dragging in TLS.
        run: cd src && make -j$(nproc) oidc-login-live
      - name: The login, end to end, against the real IdP
        run: sudo -E bash scripts/run-oidc-login-live.sh 127.0.0.1
      - name: IdP logs on failure
        if: failure()
        run: docker logs aimee-oidc-idp 2>&1 | tail -60

  # BLOCKING. Does a minted identity token's TIER actually gate a real write?
  #
  # WHY IT IS HERE. This is the sentence acceptance §11 opens with, and until this
  # job nothing in CI asked it. identity-mint-e2e mints a token and checks its
  # STRUCTURE, then discards it — it never presents one to a server. The unit tests
  # verify tokens with the JWKS handed to them directly. The grant rigs drive the
  # admin routes over UDS, which is structurally EXEMPT from the gate. So every
  # green build so far proved grant ADMINISTRATION and left ENFORCEMENT — the point
  # of the feature — untested.
  #
  # It is blocking because the failure it catches is silent: a gate that stops
  # refusing still returns 200, and every other job stays green.
  #
  # Needs a real Postgres (kb will not boot without one) and root: the JWKS trust
  # bundle must be a root-owned 0600 single-link file or the server refuses to load
  # it, which is a property worth keeping rather than relaxing for CI.
  write-tier-enforce-live:
    needs: change-scope
    if: ${{ !cancelled() && (needs.change-scope.result != 'success' || needs.change-scope.outputs.docs_only != 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start Postgres (pgvector) with pull retry
        run: |
          img=pgvector/pgvector:pg18
          for attempt in 1 2 3 4 5; do
            docker pull "$img" && break
            echo "docker pull $img failed (attempt $attempt/5); backing off"
            sleep $((attempt * 10))
          done
          docker run -d --name aimee-enforce-pg --network host \
            -e POSTGRES_USER=aimee -e POSTGRES_PASSWORD=aimee -e POSTGRES_DB=aimee_enforce_ci \
            "$img"
      - name: Install dependencies
        # pkg-config, libzstd-dev and zlib1g-dev for the same reasons as the mint job:
        # PQ_CFLAGS comes from pkg-config, and L_KB/L_SERVER link -lzstd -lz.
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list 2>/dev/null || true
          i=0; until sudo apt-get update -q; do i=$((i+1)); [ "$i" -ge 5 ] && break; echo "apt-get update retry $i"; sleep $((i*4)); done
          sudo apt-get install -y -q gcc make pkg-config \
            libsqlite3-dev libcurl4-openssl-dev libpam0g-dev libssl-dev libp11-kit-dev \
            libpq-dev postgresql-client libzstd-dev zlib1g-dev python3 curl ca-certificates
      - name: Wait for Postgres
        run: |
          for i in $(seq 1 40); do
            docker exec aimee-enforce-pg pg_isready -U aimee >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "Postgres did not become ready in time"; docker logs aimee-enforce-pg || true; exit 1
      - name: Build the stack and the enforcement driver
        # aimee-kb FORKS aimee-kb-resolver from beside its own executable, so `all` is
        # required rather than just the three obvious binaries — that omission is what
        # broke oidc-login-live on its first real runner while passing locally.
        # The driver target is a ../-prefixed PATH with a convenience alias; it is out
        # of `all` on purpose, being a rig and not a shipped binary.
        run: cd src && make -j"$(nproc)" all && make -j"$(nproc)" write-tier-enforce-live
      - name: The tier gate, end to end
        # Root for the trust bundle; -E so the build's environment survives sudo. The
        # connecting role must be a superuser (the pgvector image's POSTGRES_USER is
        # one) because the rig provisions its own throwaway database and extensions.
        run: sudo -E bash scripts/run-write-tier-enforce-live.sh postgres://aimee:aimee@127.0.0.1:5432/aimee_enforce_ci
      - name: Postgres logs on failure
        if: failure()
        run: docker logs aimee-enforce-pg 2>&1 | tail -60

  # BLOCKING. The PAM half of acceptance §11, against a real PAM stack.
  #
  # WHY IT IS HERE. §11 requires the happy path on BOTH identity paths. OIDC has a
  # live rig and a blocking job; PAM had neither. Its only coverage is
  # test_kb_http_identity_login.c, which cannot call PAM at all — so "does this
  # authenticate a real OS user on a real host?" was never asked. §10 phase 5
  # flagged precisely this ("a working pam_unix-backed service file and two known
  # test users") and it was never closed.
  #
  # The failure modes are ones no unit test can see: wrong PAM service name, missing
  # service file, or kb unable to read /etc/shadow. Each returns "authentication
  # failed" for EVERY user — deliberately indistinguishable from a wrong password,
  # which is exactly what makes it easy to ship broken and hard to notice.
  #
  # It needs no vault chain: post_login_pam checks the password BEFORE filing a mint
  # intent, so a 401 (credential rejected) separates cleanly from a 403 (accepted,
  # then refused for want of a grant). Runner-created throwaway accounts and a
  # Postgres for kb to boot against are the whole fixture.
  pam-login-live:
    needs: change-scope
    if: ${{ !cancelled() && (needs.change-scope.result != 'success' || needs.change-scope.outputs.docs_only != 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start Postgres (pgvector) with pull retry
        run: |
          img=pgvector/pgvector:pg18
          for attempt in 1 2 3 4 5; do
            docker pull "$img" && break
            echo "docker pull $img failed (attempt $attempt/5); backing off"
            sleep $((attempt * 10))
          done
          docker run -d --name aimee-pam-pg --network host \
            -e POSTGRES_USER=aimee -e POSTGRES_PASSWORD=aimee -e POSTGRES_DB=aimee_pam_ci \
            "$img"
      - name: Install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list 2>/dev/null || true
          i=0; until sudo apt-get update -q; do i=$((i+1)); [ "$i" -ge 5 ] && break; echo "apt-get update retry $i"; sleep $((i*4)); done
          sudo apt-get install -y -q gcc make pkg-config \
            libsqlite3-dev libcurl4-openssl-dev libpam0g-dev libssl-dev libp11-kit-dev \
            libpq-dev postgresql-client libzstd-dev zlib1g-dev python3 curl ca-certificates \
            libpam-modules passwd
      - name: Wait for Postgres
        run: |
          for i in $(seq 1 40); do
            docker exec aimee-pam-pg pg_isready -U aimee >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "Postgres did not become ready in time"; docker logs aimee-pam-pg || true; exit 1
      - name: Build the stack
        # `all` rather than aimee-kb alone: kb forks aimee-kb-resolver from beside its
        # own executable.
        run: cd src && make -j"$(nproc)" all
      - name: PAM login, end to end, against real host accounts
        # Root because pam_unix reads /etc/shadow and the rig creates and deletes
        # throwaway accounts. It restores every piece of host state it touches.
        run: sudo -E bash scripts/run-pam-login-live.sh postgres://aimee:aimee@127.0.0.1:5432/aimee_pam_ci
      - name: Postgres logs on failure
        if: failure()
        run: docker logs aimee-pam-pg 2>&1 | tail -60

  # BLOCKING. The three §11 criteria that were nearly shipped as "reviewer decides".
  #
  # WHY IT IS HERE. Revocation lag, CSRF on the PAM login, and the startup warning
  # for a retired remote_writes were all filed as "not proven" and left to a
  # reviewer. That was wrong: every one of them is measurable with the same
  # environment the other live rigs stand up, and none needs the vault/KMS chain.
  # Two of the three turned out to be MET all along — the startup warning existed
  # and I had grepped the wrong file, because aimee-server logs to
  # $AIMEE_HOME/server.log and not to stdout.
  #
  # It uses scripts/lib/aimee-live-env.sh, the shared environment, rather than a
  # fourth private copy of the boot recipe.
  authz-residual-live:
    needs: change-scope
    if: ${{ !cancelled() && (needs.change-scope.result != 'success' || needs.change-scope.outputs.docs_only != 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start Postgres (pgvector) with pull retry
        run: |
          img=pgvector/pgvector:pg18
          for attempt in 1 2 3 4 5; do
            docker pull "$img" && break
            echo "docker pull $img failed (attempt $attempt/5); backing off"
            sleep $((attempt * 10))
          done
          docker run -d --name aimee-resid-pg --network host \
            -e POSTGRES_USER=aimee -e POSTGRES_PASSWORD=aimee -e POSTGRES_DB=aimee_resid_ci \
            "$img"
      - name: Install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list 2>/dev/null || true
          i=0; until sudo apt-get update -q; do i=$((i+1)); [ "$i" -ge 5 ] && break; echo "apt-get update retry $i"; sleep $((i*4)); done
          sudo apt-get install -y -q gcc make pkg-config \
            libsqlite3-dev libcurl4-openssl-dev libpam0g-dev libssl-dev libp11-kit-dev \
            libpq-dev postgresql-client libzstd-dev zlib1g-dev python3 curl ca-certificates
      - name: Wait for Postgres
        run: |
          for i in $(seq 1 40); do
            docker exec aimee-resid-pg pg_isready -U aimee >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "Postgres did not become ready in time"; docker logs aimee-resid-pg || true; exit 1
      - name: Build the stack
        run: cd src && make -j"$(nproc)" all
      - name: Revocation, CSRF and the startup warning, measured
        run: sudo -E bash scripts/run-authz-residual-live.sh postgres://aimee:aimee@127.0.0.1:5432/aimee_resid_ci

      # The kb route tests call kb_http_route_ex() directly, which bypasses the
      # socket, the HTTP parse and kb_verifier_authenticate(). They prove route
      # logic and cannot prove the chain. This drives four separately-configured
      # aimee-kb instances over HTTP with real bearers — owner, project-scoped,
      # service and console-admin — and is the only check that would notice an
      # authorization regression between the verifier and a route.
      - name: Live scope confinement over the wire
        env:
          AIMEE_DB2_URL: postgresql://aimee:aimee@127.0.0.1:5432/aimee_resid_ci
        run: bash scripts/validate-kb-authz-live.sh
      # The check above drives BEARER tokens. Production does not use one:
      # aimee-server presents a client certificate and the mTLS seam synthesises
      # a credential from its CN, which nothing else exercises. This enrols for
      # real (mint -> CSR -> /v1/enroll/redeem) and then makes genuine mTLS
      # requests, asserting both that the scoped service CN is refused on owner
      # routes and that the old colon-free CN would have been allowed.
      - name: Live mTLS certificate scope
        env:
          AIMEE_DB2_URL: postgresql://aimee:aimee@127.0.0.1:5432/aimee_resid_ci
        run: bash scripts/validate-kb-mtls-scope-live.sh
      - name: Postgres logs on failure
        if: failure()
        run: docker logs aimee-resid-pg 2>&1 | tail -60

  # BLOCKING. The P1 DB-layer tenancy-isolation gate.
  #
  # WHY IT IS HERE NOW. scripts/run-p1-rls-gate.sh has existed and passed for a long
  # time, and NO WORKFLOW HAS EVER INVOKED IT — its make target printed
  # "enforced in CI" while nothing enforced it. I corrected that message earlier in this
  # branch and left the gate unwired as out of scope.
  #
  # Then it caught a real authorization regression: a new SQL function declared with
  # DROP FUNCTION IF EXISTS and the same signature as a shipped one silently replaced
  # it and swapped its authorization from admin-or-team-lead to owner-only. The build,
  # the full unit suite and make lint all passed. Only this gate failed, with
  # "per-user-write-tier-rls-test.sql:199: ERROR: grant administration denied".
  #
  # A gate that catches an authorization regression nothing else can see does not belong
  # behind somebody remembering to run it.
  #
  # It needs a real Postgres with pgvector and pg_trgm — RLS cannot be enforced by the
  # SQLite shim — and a superuser, because it creates a throwaway database, extensions
  # and the three-role split.
  p1-rls-gate:
    needs: change-scope
    if: ${{ !cancelled() && (needs.change-scope.result != 'success' || needs.change-scope.outputs.docs_only != 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start Postgres (pgvector) with pull retry
        run: |
          img=pgvector/pgvector:pg18
          for attempt in 1 2 3 4 5; do
            docker pull "$img" && break
            echo "docker pull $img failed (attempt $attempt/5); backing off"
            sleep $((attempt * 10))
          done
          docker run -d --name aimee-rls-pg --network host \
            -e POSTGRES_USER=aimee -e POSTGRES_PASSWORD=aimee -e POSTGRES_DB=aimee_rls_ci \
            "$img"
      - name: Install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list 2>/dev/null || true
          i=0; until sudo apt-get update -q; do i=$((i+1)); [ "$i" -ge 5 ] && break; echo "apt-get update retry $i"; sleep $((i*4)); done
          sudo apt-get install -y -q postgresql-client python3
      - name: Wait for Postgres
        run: |
          for i in $(seq 1 40); do
            docker exec aimee-rls-pg pg_isready -U aimee >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "Postgres did not become ready in time"; docker logs aimee-rls-pg || true; exit 1
      - name: P1 RLS isolation gate
        # The connecting role must be a superuser; the pgvector image's POSTGRES_USER is
        # one. The script provisions its own throwaway database, so nothing here needs
        # cleaning up between runs.
        run: bash scripts/run-p1-rls-gate.sh postgres://aimee:aimee@127.0.0.1:5432/aimee_rls_ci

  init-migrate-service-test:
    needs: change-scope
    if: ${{ !cancelled() && (needs.change-scope.result != 'success' || needs.change-scope.outputs.docs_only != 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Runner diagnostics
        run: |
          echo "::group::Runner environment"
          echo "ref: $GITHUB_REF  sha: $GITHUB_SHA  runner: $RUNNER_OS $RUNNER_ARCH"
          uname -a
          gcc --version 2>/dev/null || true
          make --version 2>/dev/null | head -1 || true
          df -h / | tail -1
          echo "::endgroup::"
      - name: Install dependencies
        run: |
          # GitHub runners preinstall third-party apt repos (e.g. packages.microsoft.com)
          # that intermittently serve invalid/unsigned metadata and fail `apt-get update`
          # hard — though none of our packages come from them. Drop them, then retry
          # update with backoff so a transient mirror hiccup doesn't fail the job.
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list 2>/dev/null || true
          i=0; until sudo apt-get update -q; do i=$((i+1)); [ "$i" -ge 5 ] && break; echo "apt-get update retry $i (transient repo failure)"; sleep $((i*4)); done
          sudo apt-get install -y -q gcc make \
            libsqlite3-dev libcurl4-openssl-dev libpam0g-dev libssl-dev libp11-kit-dev \
            libpq-dev
      - name: Init/migrate service routing smoke test
        run: cd src && make -j$(nproc) init-migrate-service-test

      # Cheap and image-free: the gate that decides whether a kb may start without an
      # embedder. Getting it wrong in either direction ships a broken deploy — too
      # loose and an unconfigured kb serves nothing usable, too tight and the
      # server-identity one-shot cannot run.
      - name: KB entrypoint embedder gate
        run: cd src && make kb-entrypoint-test

      # The managed deployment's identity must be reconstructible from config, not
      # only from the running container's env. An unset AIMEE_KB_VARIANT resolves the
      # kb image to the EMBEDDERLESS aimee-kb with no error anywhere, so a recreate
      # (which every image upgrade performs) could silently drop a deployment's
      # embedder. This asserts the .env is derived at start.
      - name: Managed compose env derived from config
        run: cd src && make deploy-compose-env-test

      # `workflow list` prints names that `workflow show` must accept. Two
      # commands in the same family disagreeing about what a name means is the
      # kind of thing people work around silently rather than report.
      - name: Workflow name resolution
        run: cd src && make workflow-name-resolution-test

  windows-cmake:
    needs: change-scope
    if: ${{ !cancelled() && (needs.change-scope.result != 'success' || needs.change-scope.outputs.docs_only != 'true') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MinGW-w64
        shell: pwsh
        run: |
          # Reliable MinGW setup. Two failure modes this avoids:
          #  (1) bare `choco install mingw` flakes ~50% on the Chocolatey CDN;
          #  (2) the choco package's gcc path changes between versions (v15.2.0
          #      moved it), so a hardcoded `...\mingw64\bin` breaks.
          # Prefer a complete pre-installed MSYS2 toolchain (no network). Runner
          # images have moved between mingw64 and ucrt64, so probe both. If neither
          # is complete, use MSYS2's own package manager before falling back to
          # Chocolatey; a Chocolatey outage must not be the only installation path.
          function Find-MingwBin {
            foreach ($candidate in @("C:\msys64\ucrt64\bin", "C:\msys64\mingw64\bin")) {
              if ((Test-Path "$candidate\gcc.exe") -and
                  (Test-Path "$candidate\mingw32-make.exe")) { return $candidate }
            }
            $g = Get-ChildItem -Path "C:\ProgramData\chocolatey\lib\mingw","C:\ProgramData\mingw64" `
                   -Recurse -Filter gcc.exe -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -match 'mingw64' } | Select-Object -First 1
            if ($g) {
              $candidate = Split-Path $g.FullName
              if (Test-Path "$candidate\mingw32-make.exe") { return $candidate }
            }
            return $null
          }
          $bin = Find-MingwBin
          $pacman = "C:\msys64\usr\bin\pacman.exe"
          if (-not $bin -and (Test-Path $pacman)) {
            for ($i = 0; $i -lt 3 -and -not $bin; $i++) {
              & $pacman -Sy --noconfirm --needed `
                mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-make
              if ($LASTEXITCODE -ne 0) { Start-Sleep (15 * ($i + 1)) }
              $bin = Find-MingwBin
            }
          }
          if (-not $bin) {
            for ($i = 0; $i -lt 3 -and -not $bin; $i++) {
              choco install mingw -y --no-progress
              if ($LASTEXITCODE -ne 0) { Start-Sleep (15 * ($i + 1)) }
              $bin = Find-MingwBin
            }
          }
          if (-not $bin) { Write-Error "MinGW gcc.exe not found after install"; exit 1 }
          Write-Host "Using MinGW at $bin"
          & "$bin\gcc.exe" --version
          echo "$bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Download SQLite amalgamation
        shell: powershell
        run: |
          $url = "https://www.sqlite.org/2024/sqlite-amalgamation-3470200.zip"
          Invoke-WebRequest -Uri $url -OutFile sqlite.zip
          Expand-Archive sqlite.zip -DestinationPath sqlite-tmp
          New-Item -ItemType Directory -Force -Path src\vendor\sqlite3
          Copy-Item sqlite-tmp\sqlite-amalgamation-3470200\sqlite3.c src\vendor\sqlite3\
          Copy-Item sqlite-tmp\sqlite-amalgamation-3470200\sqlite3.h src\vendor\sqlite3\

      - name: Configure with CMake
        run: cmake -B build -G "MinGW Makefiles" -DAIMEE_THIN_CLIENT=ON -DWITH_PAM=OFF -DWITH_LIBSECRET=OFF

      # Windows ships only the thin client (aimee.exe). aimee-server, aimee-kb,
      # aimee-gateway, and aimee-runtime-web are Linux/Docker components and are not
      # built here, so the MinGW runner needs no libpq/zstd/OpenSSL.
      - name: Build the thin client
        run: cmake --build build --parallel 2 --target aimee

      - name: Smoke test the client
        shell: powershell
        run: |
          .\build\aimee.exe version
          # The new remote transport must parse on Windows (Winsock path).
          .\build\aimee.exe --server http://127.0.0.1:9 version

      - name: Thin-client smoke (selfcheck, Winsock transport)
        shell: bash
        run: |
          # Beyond `version`: drive a real subcommand with the HTTP transport env
          # set, so the Windows client exercises its Winsock connect path (a
          # connection error is the expected selfcheck outcome; a usage/parse
          # error is not). Mirrors the macOS/Linux thin-client smoke.
          AIMEE_BIN='./build/aimee.exe' FORCE_MODE=selfcheck \
            bash scripts/aimee-thin-client-smoke.sh

  windows-build:
    needs: change-scope
    if: ${{ !cancelled() && (needs.change-scope.result != 'success' || needs.change-scope.outputs.docs_only != 'true') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up MinGW-w64
        shell: pwsh
        run: |
          function Find-MingwBin {
            foreach ($candidate in @("C:\msys64\ucrt64\bin", "C:\msys64\mingw64\bin")) {
              if ((Test-Path "$candidate\gcc.exe") -and
                  (Test-Path "$candidate\mingw32-make.exe")) { return $candidate }
            }
            $g = Get-ChildItem -Path "C:\ProgramData\chocolatey\lib\mingw","C:\ProgramData\mingw64" `
                   -Recurse -Filter gcc.exe -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -match 'mingw64' } | Select-Object -First 1
            if ($g) {
              $candidate = Split-Path $g.FullName
              if (Test-Path "$candidate\mingw32-make.exe") { return $candidate }
            }
            return $null
          }
          $bin = Find-MingwBin
          $pacman = "C:\msys64\usr\bin\pacman.exe"
          if (-not $bin -and (Test-Path $pacman)) {
            for ($i = 0; $i -lt 3 -and -not $bin; $i++) {
              & $pacman -Sy --noconfirm --needed `
                mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-make
              if ($LASTEXITCODE -ne 0) { Start-Sleep (15 * ($i + 1)) }
              $bin = Find-MingwBin
            }
          }
          if (-not $bin) {
            for ($i = 0; $i -lt 3 -and -not $bin; $i++) {
              choco install mingw -y --no-progress
              if ($LASTEXITCODE -ne 0) { Start-Sleep (15 * ($i + 1)) }
              $bin = Find-MingwBin
            }
          }
          if (-not $bin) { Write-Error "MinGW gcc.exe and mingw32-make.exe not found"; exit 1 }
          Write-Host "Using MinGW at $bin"
          & "$bin\gcc.exe" --version
          echo "$bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Download SQLite amalgamation
        shell: powershell
        run: |
          $url = "https://www.sqlite.org/2024/sqlite-amalgamation-3470200.zip"
          Invoke-WebRequest -Uri $url -OutFile sqlite.zip
          Expand-Archive sqlite.zip -DestinationPath sqlite-tmp
          New-Item -ItemType Directory -Force -Path src\vendor\sqlite3
          Copy-Item sqlite-tmp\sqlite-amalgamation-3470200\sqlite3.c src\vendor\sqlite3\
          Copy-Item sqlite-tmp\sqlite-amalgamation-3470200\sqlite3.h src\vendor\sqlite3\
      - name: Configure with CMake
        run: cmake -B build -G "MinGW Makefiles" -DAIMEE_THIN_CLIENT=ON -DWITH_PAM=OFF -DWITH_LIBSECRET=OFF -DWITH_UI=OFF
      # Windows ships only the thin client (aimee.exe); server/kb/gateway/webchat
      # are Linux/Docker components and are not built here.
      - name: Build the thin client
        run: cmake --build build --parallel 2 --target aimee
      - name: Smoke test the client
        shell: powershell
        run: |
          .\build\aimee.exe version
          # The new remote transport must parse on Windows (Winsock path).
          .\build\aimee.exe --server http://127.0.0.1:9 version

      - name: Thin-client smoke (selfcheck, Winsock transport)
        shell: bash
        run: |
          # Beyond `version`: drive a real subcommand with the HTTP transport env
          # set, so the Windows client exercises its Winsock connect path (a
          # connection error is the expected selfcheck outcome; a usage/parse
          # error is not). Mirrors the macOS/Linux thin-client smoke.
          AIMEE_BIN='./build/aimee.exe' FORCE_MODE=selfcheck \
            bash scripts/aimee-thin-client-smoke.sh

  macos-build:
    needs: change-scope
    if: ${{ !cancelled() && (needs.change-scope.result != 'success' || needs.change-scope.outputs.docs_only != 'true') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # macOS ships ONE universal (arm64 + x86_64) thin client, matching the
      # release build. TLS uses Secure Transport (system frameworks, already
      # universal), so the fat build needs no arch-specific brew libraries.
      - name: Configure with CMake (universal arm64+x86_64)
        run: cmake -B build -DAIMEE_THIN_CLIENT=ON -DWITH_PAM=OFF -DWITH_LIBSECRET=OFF -DWITH_UI=OFF -DWITH_TLS=ON -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build the thin client
        run: |
          cmake --build build --parallel 3 --target aimee
          # Fail unless the artifact is a true fat binary.
          echo "archs: $(lipo -archs build/aimee)"
          lipo -archs build/aimee | grep -q arm64
          lipo -archs build/aimee | grep -q x86_64
      - name: Smoke test the client
        run: |
          ./build/aimee version
          # --server must parse and select a remote TCP target on macOS.
          ./build/aimee --server http://127.0.0.1:9 version

      - name: mTLS client-cert presentation (Secure Transport, loopback)
        run: |
          set -uo pipefail
          D="$(mktemp -d)"; H="$D/home"; mkdir -p "$H/tls"
          # Test PKI: CA, server cert, and an EC P-256 client cert whose key is
          # PKCS#8 (matching what aimee-server issues), bundled into client.p12.
          openssl ecparam -name prime256v1 -genkey -noout -out "$D/ca.key"
          openssl req -x509 -new -key "$D/ca.key" -days 1 -subj "/CN=aimee-ci-ca" -out "$D/ca.crt"
          openssl ecparam -name prime256v1 -genkey -noout -out "$D/srv.key"
          openssl req -new -key "$D/srv.key" -subj "/CN=localhost" -out "$D/srv.csr"
          openssl x509 -req -in "$D/srv.csr" -CA "$D/ca.crt" -CAkey "$D/ca.key" \
            -CAcreateserial -days 1 -out "$D/srv.crt"
          openssl ecparam -name prime256v1 -genkey -noout -out "$D/c.sec1"
          openssl pkcs8 -topk8 -nocrypt -in "$D/c.sec1" -out "$H/tls/client.key"
          openssl req -new -key "$H/tls/client.key" -subj "/CN=ci-macos-client" -out "$D/c.csr"
          openssl x509 -req -in "$D/c.csr" -CA "$D/ca.crt" -CAkey "$D/ca.key" \
            -CAcreateserial -days 1 -out "$H/tls/client.crt"
          # macOS SecPKCS12Import REQUIRES a non-empty passphrase (an empty one
          # fails errSecAuthFailed -25293), so the .p12 is passphrase-protected
          # and aimee reads it from AIMEE_TLS_CLIENT_P12_PASS.
          P12PASS='aimee-ci-p12'
          openssl pkcs12 -export -inkey "$H/tls/client.key" -in "$H/tls/client.crt" \
            -out "$H/tls/client.p12" -passout "pass:$P12PASS"
          # s_server REQUIRES a client cert (-Verify) and serves a status page.
          openssl s_server -accept 14443 -cert "$D/srv.crt" -key "$D/srv.key" \
            -CAfile "$D/ca.crt" -Verify 1 -www -naccept 3 > "$D/s_server.log" 2>&1 &
          SRV=$!
          for i in $(seq 1 50); do nc -z 127.0.0.1 14443 && break; sleep 0.2; done
          # Present the client identity (INSECURE skips server-cert trust; the
          # client cert is still presented). A non-/v1 reply is fine — the TLS
          # handshake is what we are validating.
          AIMEE_HOME="$H" AIMEE_TLS_INSECURE=1 AIMEE_TLS_CLIENT_P12_PASS="$P12PASS" \
            ./build/aimee --server https://127.0.0.1:14443 config show 2>&1 || true
          sleep 1; kill "$SRV" 2>/dev/null || true; wait "$SRV" 2>/dev/null || true
          echo "::group::s_server.log"; cat "$D/s_server.log"; echo "::endgroup::"
          # Proof: the server logged + verified our client cert. (OpenSSL prints
          # "CN = x" on 1.1.x and "CN=x" on 3.x, so match both.)
          grep -qE "CN ?= ?ci-macos-client" "$D/s_server.log" || { echo "FAIL: client cert not presented"; exit 1; }
          if grep -q "peer did not return a certificate" "$D/s_server.log"; then
            echo "FAIL: a connection presented no cert"; exit 1; fi
          # The transient keychain must not be left behind.
          if ls "${TMPDIR:-/tmp}"/aimee-mtls-*.keychain >/dev/null 2>&1; then
            echo "FAIL: transient keychain leaked"; exit 1; fi
          echo "PASS: Secure Transport presented client cert; server verified CN=ci-macos-client; no keychain leak"

  memory-retrieval-eval:
    needs: change-scope
    if: ${{ !cancelled() && (needs.change-scope.result != 'success' || needs.change-scope.outputs.docs_only != 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Runner diagnostics
        run: |
          echo "::group::Runner environment"
          echo "ref: $GITHUB_REF  sha: $GITHUB_SHA  runner: $RUNNER_OS $RUNNER_ARCH"
          uname -a
          gcc --version 2>/dev/null || true
          make --version 2>/dev/null | head -1 || true
          df -h / | tail -1
          echo "::endgroup::"
      - name: Install dependencies
        run: |
          # GitHub runners preinstall third-party apt repos (e.g. packages.microsoft.com)
          # that intermittently serve invalid/unsigned metadata and fail `apt-get update`
          # hard — though none of our packages come from them. Drop them, then retry
          # update with backoff so a transient mirror hiccup doesn't fail the job.
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list 2>/dev/null || true
          i=0; until sudo apt-get update -q; do i=$((i+1)); [ "$i" -ge 5 ] && break; echo "apt-get update retry $i (transient repo failure)"; sleep $((i*4)); done
          sudo apt-get install -y -q gcc make \
            libsqlite3-dev libcurl4-openssl-dev libpam0g-dev libssl-dev libp11-kit-dev \
            libpq-dev
      - name: Memory retrieval eval (corpus + regression check)
        run: cd src && make -j$(nproc) memory-retrieval-eval-check

  # End-to-end deploy matrix: build the images and prove every Docker topology
  # (kb-only, server+kb split, server standalone) boots and serves a usable /v1
  # surface. See
  # docs/proposals/pending/aimee-e2e-deploy-matrix.md. GitHub's ubuntu runners
  # ship Docker + compose, so no port offset is needed (8740/8741 are free).
  e2e-docker:
    needs: change-scope
    if: ${{ !cancelled() && (needs.change-scope.result != 'success' || needs.change-scope.outputs.docs_only != 'true') }}
    # One runner per topology so the deploy matrix runs in PARALLEL instead of
    # serially on one runner (T1+T2+T3 back-to-back was the long pole of CI).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Bake targets built by each compose file. The cache scope is keyed by
          # IMAGE, not by topology: T1 and T2 build aimee-kb from the same
          # Dockerfile, and T2 and T3 build aimee-server from the same
          # Dockerfile.server. Per-topology scopes stored those identical layers
          # twice and denied each shard the other's work.
          - topology: T1
            compose_file: compose.yaml
            images: aimee-kb aimee-control-web
          - topology: T2
            compose_file: compose.server.yaml
            images: aimee-kb aimee-server
          - topology: T3
            compose_file: compose.server-standalone.yaml
            images: aimee-server
    name: e2e-docker (${{ matrix.topology }})
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Runner diagnostics
        run: |
          docker version --format '{{.Server.Version}}'
          docker compose version
          docker buildx version
          df -h / | tail -1
      # A GitHub Actions cache is readable only by the ref that wrote it and by
      # that ref's base branch. Cache written from a PR run therefore lands under
      # refs/pull/N/merge, where NO other run can ever read it — while still
      # counting against the repo's 10 GB quota and evicting the shared
      # refs/heads/testing entries by LRU. That is what happened here: 9.5 GB of
      # unreadable PR blobs pushed the repo to 14 GB, every e2e image build
      # missed cache completely, and each shard rebuilt postgres, rust, the
      # python venv and the C tree from scratch (12-18 min a shard).
      #
      # So: every run READS the shared per-image scope, only pushes to the
      # default branch WRITE it. That also drops the mode=max export (~7 min a
      # shard) from the PR path entirely.
      - name: Resolve bake cache flags
        id: cache_flags
        env:
          IMAGES: ${{ matrix.images }}
          WRITE_CACHE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/testing' }}
        run: |
          {
            echo 'set<<CACHE_FLAGS_EOF'
            for img in $IMAGES; do
              echo "${img}.cache-from=type=gha,scope=e2e-${img}"
              if [ "$WRITE_CACHE" = "true" ]; then
                echo "${img}.cache-to=type=gha,scope=e2e-${img},mode=max"
              fi
            done
            echo CACHE_FLAGS_EOF
          } >> "$GITHUB_OUTPUT"
      - name: Build topology images with persistent cache
        uses: docker/bake-action@v7
        with:
          source: .
          files: ${{ matrix.compose_file }}
          load: true
          set: ${{ steps.cache_flags.outputs.set }}
      - name: Run Docker deploy topology ${{ matrix.topology }}
        # The aimee-server image builds webchat's SPA from its vendored
        # @rakuensoftware/smoothgui dependency — no npm token needed.
        env:
          # The Bake step loaded exactly the images named by the compose file.
          # Keep the smoke scripts' local default intact while avoiding a second
          # uncached `docker compose build` in CI.
          AIMEE_E2E_SKIP_BUILD: "1"
        run: scripts/e2e-matrix.sh --only ${{ matrix.topology }}
      - name: Stack logs on failure
        if: failure()
        run: |
          for f in compose.yaml compose.server.yaml compose.server-standalone.yaml; do
            echo "::group::$f"; docker compose -f "$f" logs --tail=80 2>/dev/null || true; echo "::endgroup::"
          done

  e2e-adoption:
    needs: change-scope
    if: ${{ !cancelled() && (needs.change-scope.result != 'success' || needs.change-scope.outputs.docs_only != 'true') }}
    # Thin-client ADOPTION (TOFU enrollment) as its own parallel E2E flow: a
    # fresh `aimee` client against a native aimee-server holding the default
    # bootstrap bearer must pin the cert, auto-rotate to a strong bearer, and
    # persist it on both sides; the consumed bootstrap must be dead afterwards.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          # Same apt hygiene as the build jobs: drop flaky third-party repos,
          # retry update with backoff.
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list 2>/dev/null || true
          i=0; until sudo apt-get update -q; do i=$((i+1)); [ "$i" -ge 5 ] && break; echo "apt-get update retry $i (transient repo failure)"; sleep $((i*4)); done
          sudo apt-get install -y -q gcc make \
            libsqlite3-dev libcurl4-openssl-dev libpam0g-dev libssl-dev libp11-kit-dev \
            libpq-dev
      - name: Thin-client adoption E2E
        run: scripts/aimee-thinclient-adoption-e2e.sh
      - name: Server log on failure
        if: failure()
        run: tail -60 /tmp/*/server.log 2>/dev/null || true

  # §2 tree-sitter extraction front-end (opt-in). The default build compiles
  # code_treesitter.c to a stub, so the other jobs never exercise the grammar
  # path or unit-test-code-treesitter. This job builds AIMEE_TREESITTER=1 — which
  # fetches the vendored grammars (scripts/fetch-treesitter.sh) and compiles them
  # — and runs the opt-in test that parses real source in every supported language
  # (definitions, nested members, and call edges).
  treesitter:
    needs: change-scope
    if: ${{ !cancelled() && (needs.change-scope.result != 'success' || needs.change-scope.outputs.docs_only != 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Runner diagnostics
        run: |
          gcc --version 2>/dev/null | head -1 || true
          git --version || true
          df -h / | tail -1
      - name: Install dependencies
        run: |
          # GitHub runners preinstall third-party apt repos (e.g. packages.microsoft.com)
          # that intermittently serve invalid/unsigned metadata and fail `apt-get update`
          # hard — though none of our packages come from them. Drop them, then retry
          # update with backoff so a transient mirror hiccup doesn't fail the job.
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list 2>/dev/null || true
          i=0; until sudo apt-get update -q; do i=$((i+1)); [ "$i" -ge 5 ] && break; echo "apt-get update retry $i (transient repo failure)"; sleep $((i*4)); done
          sudo apt-get install -y -q gcc make git \
            libsqlite3-dev libcurl4-openssl-dev libpam0g-dev libssl-dev libpq-dev libp11-kit-dev
      - name: Build + run the opt-in tree-sitter test
        run: |
          cd src
          make AIMEE_TREESITTER=1 build/obj/tests/unit-test-code-treesitter
          ./build/obj/tests/unit-test-code-treesitter

  vault-pkcs11-token:
    needs: change-scope
    if: ${{ !cancelled() && (needs.change-scope.result != 'success' || needs.change-scope.outputs.docs_only != 'true') }}
    name: vault-pkcs11-token
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list 2>/dev/null || true
          i=0; until sudo apt-get update -q; do i=$((i+1)); [ "$i" -ge 5 ] && break; echo "apt-get update retry $i (transient repo failure)"; sleep $((i*4)); done
          sudo apt-get install -y -q gcc make \
            libsqlite3-dev libcurl4-openssl-dev libpam0g-dev libssl-dev libp11-kit-dev \
            libpq-dev softhsm2 opensc
      - name: Run the SoftHSM2 PKCS#11 custody gate (must not skip)
        env:
          AIMEE_PKCS11_GATE_REQUIRE: "1"
        run: bash scripts/p7_pkcs11_softhsm_test.sh
