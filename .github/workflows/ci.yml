  windows-cmake:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MinGW-w64
        shell: pwsh
        run: |
          # Reliable MinGW setup. Two failure modes this avoids:
          #  (1) bare `choco install mingw` flakes ~50% on the Chocolatey CDN;
          #  (2) the choco package's gcc path changes between versions (v15.2.0
          #      moved it), so a hardcoded `...\mingw64\bin` breaks.
          # Prefer the MSYS2 mingw64 toolchain pre-installed on the runner image
          # (no network); otherwise choco-install with retries and *discover* the
          # gcc.exe location instead of hardcoding it.
          function Find-MingwBin {
            if (Test-Path "C:\msys64\mingw64\bin\gcc.exe") { return "C:\msys64\mingw64\bin" }
            $g = Get-ChildItem -Path "C:\ProgramData\chocolatey\lib\mingw","C:\ProgramData\mingw64" `
                   -Recurse -Filter gcc.exe -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -match 'mingw64' } | Select-Object -First 1
            if ($g) { return (Split-Path $g.FullName) }
            return $null
          }
          $bin = Find-MingwBin
          if (-not $bin) {
            for ($i = 0; $i -lt 3 -and -not $bin; $i++) {
              choco install mingw -y --no-progress
              if ($LASTEXITCODE -ne 0) { Start-Sleep 15 }
              $bin = Find-MingwBin
            }
          }
          if (-not $bin) { Write-Error "MinGW gcc.exe not found after install"; exit 1 }
          Write-Host "Using MinGW at $bin"
          & "$bin\gcc.exe" --version
          echo "$bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Download SQLite amalgamation
        shell: powershell
        run: |
          $url = "https://www.sqlite.org/2024/sqlite-amalgamation-3470200.zip"
          Invoke-WebRequest -Uri $url -OutFile sqlite.zip
          Expand-Archive sqlite.zip -DestinationPath sqlite-tmp
          New-Item -ItemType Directory -Force -Path src\vendor\sqlite3
          Copy-Item sqlite-tmp\sqlite-amalgamation-3470200\sqlite3.c src\vendor\sqlite3\
          Copy-Item sqlite-tmp\sqlite-amalgamation-3470200\sqlite3.h src\vendor\sqlite3\

      - name: Configure with CMake
        run: cmake -B build -G "MinGW Makefiles" -DAIMEE_THIN_CLIENT=ON -DWITH_PAM=OFF -DWITH_LIBSECRET=OFF

      # Windows ships only the thin client (aimee.exe). aimee-server, aimee-kb,
      # aimee-gateway, and aimee-runtime-web are Linux/Docker components and are not
      # built here, so the MinGW runner needs no libpq/zstd/OpenSSL.
      - name: Build the thin client
        run: cmake --build build --parallel 2 --target aimee

      - name: Smoke test the client
        shell: powershell
        run: |
          .\build\aimee.exe version
          # The new remote transport must parse on Windows (Winsock path).
          .\build\aimee.exe --server http://127.0.0.1:9 version

      - name: Thin-client smoke (selfcheck, Winsock transport)
        shell: bash
        run: |
          # Beyond `version`: drive a real subcommand with the HTTP transport env
          # set, so the Windows client exercises its Winsock connect path (a
          # connection error is the expected selfcheck outcome; a usage/parse
          # error is not). Mirrors the macOS/Linux thin-client smoke.
          AIMEE_BIN='./build/aimee.exe' FORCE_MODE=selfcheck \
            bash scripts/aimee-thin-client-smoke.sh

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: choco install mingw
      - name: Add MinGW to PATH
        shell: powershell
        run: echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Download SQLite amalgamation
        shell: powershell
        run: |
          $url = "https://www.sqlite.org/2024/sqlite-amalgamation-3470200.zip"
          Invoke-WebRequest -Uri $url -OutFile sqlite.zip
          Expand-Archive sqlite.zip -DestinationPath sqlite-tmp
          New-Item -ItemType Directory -Force -Path src\vendor\sqlite3
          Copy-Item sqlite-tmp\sqlite-amalgamation-3470200\sqlite3.c src\vendor\sqlite3\
          Copy-Item sqlite-tmp\sqlite-amalgamation-3470200\sqlite3.h src\vendor\sqlite3\
      - name: Configure with CMake
        run: cmake -B build -G "MinGW Makefiles" -DAIMEE_THIN_CLIENT=ON -DWITH_PAM=OFF -DWITH_LIBSECRET=OFF -DWITH_UI=OFF
      # Windows ships only the thin client (aimee.exe); server/kb/gateway/webchat
      # are Linux/Docker components and are not built here.
      - name: Build the thin client
        run: cmake --build build --parallel 2 --target aimee
      - name: Smoke test the client
        shell: powershell
        run: |
          .\build\aimee.exe version
          # The new remote transport must parse on Windows (Winsock path).
          .\build\aimee.exe --server http://127.0.0.1:9 version

      - name: Thin-client smoke (selfcheck, Winsock transport)
        shell: bash
        run: |
          # Beyond `version`: drive a real subcommand with the HTTP transport env
          # set, so the Windows client exercises its Winsock connect path (a
          # connection error is the expected selfcheck outcome; a usage/parse
          # error is not). Mirrors the macOS/Linux thin-client smoke.
          AIMEE_BIN='./build/aimee.exe' FORCE_MODE=selfcheck \
            bash scripts/aimee-thin-client-smoke.sh

  macos-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # macOS ships ONE universal (arm64 + x86_64) thin client, matching the
      # release build. TLS uses Secure Transport (system frameworks, already
      # universal), so the fat build needs no arch-specific brew libraries.
      - name: Configure with CMake (universal arm64+x86_64)
        run: cmake -B build -DAIMEE_THIN_CLIENT=ON -DWITH_PAM=OFF -DWITH_LIBSECRET=OFF -DWITH_UI=OFF -DWITH_TLS=ON -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build the thin client
        run: |
          cmake --build build --parallel 3 --target aimee
          # Fail unless the artifact is a true fat binary.
          echo "archs: $(lipo -archs build/aimee)"
          lipo -archs build/aimee | grep -q arm64
          lipo -archs build/aimee | grep -q x86_64
      - name: Smoke test the client
        run: |
          ./build/aimee version
          # --server must parse and select a remote TCP target on macOS.
          ./build/aimee --server http://127.0.0.1:9 version

      - name: mTLS client-cert presentation (Secure Transport, loopback)
        run: |
          set -uo pipefail
          D="$(mktemp -d)"; H="$D/home"; mkdir -p "$H/tls"
          # Test PKI: CA, server cert, and an EC P-256 client cert whose key is
          # PKCS#8 (matching what aimee-server issues), bundled into client.p12.
          openssl ecparam -name prime256v1 -genkey -noout -out "$D/ca.key"
          openssl req -x509 -new -key "$D/ca.key" -days 1 -subj "/CN=aimee-ci-ca" -out "$D/ca.crt"
          openssl ecparam -name prime256v1 -genkey -noout -out "$D/srv.key"
          openssl req -new -key "$D/srv.key" -subj "/CN=localhost" -out "$D/srv.csr"
          openssl x509 -req -in "$D/srv.csr" -CA "$D/ca.crt" -CAkey "$D/ca.key" \
            -CAcreateserial -days 1 -out "$D/srv.crt"
          openssl ecparam -name prime256v1 -genkey -noout -out "$D/c.sec1"
          openssl pkcs8 -topk8 -nocrypt -in "$D/c.sec1" -out "$H/tls/client.key"
          openssl req -new -key "$H/tls/client.key" -subj "/CN=ci-macos-client" -out "$D/c.csr"
          openssl x509 -req -in "$D/c.csr" -CA "$D/ca.crt" -CAkey "$D/ca.key" \
            -CAcreateserial -days 1 -out "$H/tls/client.crt"
          # macOS SecPKCS12Import REQUIRES a non-empty passphrase (an empty one
          # fails errSecAuthFailed -25293), so the .p12 is passphrase-protected
          # and aimee reads it from AIMEE_TLS_CLIENT_P12_PASS.
          P12PASS='aimee-ci-p12'
          openssl pkcs12 -export -inkey "$H/tls/client.key" -in "$H/tls/client.crt" \
            -out "$H/tls/client.p12" -passout "pass:$P12PASS"
          # s_server REQUIRES a client cert (-Verify) and serves a status page.
          openssl s_server -accept 14443 -cert "$D/srv.crt" -key "$D/srv.key" \
            -CAfile "$D/ca.crt" -Verify 1 -www -naccept 3 > "$D/s_server.log" 2>&1 &
          SRV=$!
          for i in $(seq 1 50); do nc -z 127.0.0.1 14443 && break; sleep 0.2; done
          # Present the client identity (INSECURE skips server-cert trust; the
          # client cert is still presented). A non-/v1 reply is fine — the TLS
          # handshake is what we are validating.
          AIMEE_HOME="$H" AIMEE_TLS_INSECURE=1 AIMEE_TLS_CLIENT_P12_PASS="$P12PASS" \
            ./build/aimee --server https://127.0.0.1:14443 config show 2>&1 || true
          sleep 1; kill "$SRV" 2>/dev/null || true; wait "$SRV" 2>/dev/null || true
          echo "::group::s_server.log"; cat "$D/s_server.log"; echo "::endgroup::"
          # Proof: the server logged + verified our client cert. (OpenSSL prints
          # "CN = x" on 1.1.x and "CN=x" on 3.x, so match both.)
          grep -qE "CN ?= ?ci-macos-client" "$D/s_server.log" || { echo "FAIL: client cert not presented"; exit 1; }
          if grep -q "peer did not return a certificate" "$D/s_server.log"; then
            echo "FAIL: a connection presented no cert"; exit 1; fi
          # The transient keychain must not be left behind.
          if ls "${TMPDIR:-/tmp}"/aimee-mtls-*.keychain >/dev/null 2>&1; then
            echo "FAIL: transient keychain leaked"; exit 1; fi
          echo "PASS: Secure Transport presented client cert; server verified CN=ci-macos-client; no keychain leak"

