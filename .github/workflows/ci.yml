name: CI

on:
  pull_request:
    branches: [main, testing]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-coauthor-trailers:
    # Standing directive: commits/PRs must never carry AI co-authorship trailers.
    # Scans only the PR's NEW commits (base..head), so existing history is
    # grandfathered while any newly introduced trailer fails the PR.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject AI co-authorship trailers in new commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          range="${BASE_SHA}..${HEAD_SHA}"
          # Match the actual trailer forms only (anchored), not prose that happens
          # to mention them: a "co-authored-by:" line, or the markdown-link
          # "Generated with [Claude Code]"/"[Codex ...]" attribution line.
          hits=$(git log "$range" --format='%H%n%B' \
                 | grep -inE '^[[:space:]]*co-authored-by:|generated with \[(claude|codex)' || true)
          if [ -n "$hits" ]; then
            echo "::error::New commit(s) in $range carry AI co-authorship trailers; remove them (standing directive)."
            echo "$hits"
            exit 1
          fi
          echo "no co-authorship trailers in $range — ok"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Runner diagnostics
        run: |
          echo "::group::Runner environment"
          echo "ref: $GITHUB_REF  sha: $GITHUB_SHA  runner: $RUNNER_OS $RUNNER_ARCH"
          uname -a
          gcc --version 2>/dev/null || true
          make --version 2>/dev/null | head -1 || true
          df -h / | tail -1
          echo "::endgroup::"
      - name: Install clang-format
        run: |
          # GitHub runners preinstall third-party apt repos (e.g. packages.microsoft.com)
          # that intermittently serve invalid/unsigned metadata and fail `apt-get update`
          # hard — though none of our packages come from them. Drop them, then retry
          # update with backoff so a transient mirror hiccup doesn't fail the job.
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list 2>/dev/null || true
          i=0; until sudo apt-get update -q; do i=$((i+1)); [ "$i" -ge 5 ] && break; echo "apt-get update retry $i (transient repo failure)"; sleep $((i*4)); done
          sudo apt-get install -y -q clang-format-19
      - name: Check formatting
        run: cd src && make lint
      - name: Check 3db tier dependencies
        run: ./scripts/check_tier_deps.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Runner diagnostics
        run: |
          echo "::group::Runner environment"
          echo "ref: $GITHUB_REF  sha: $GITHUB_SHA  runner: $RUNNER_OS $RUNNER_ARCH"
          uname -a
          gcc --version 2>/dev/null || true
          make --version 2>/dev/null | head -1 || true
          df -h / | tail -1
          echo "::endgroup::"
      - name: Install dependencies
        run: |
          # GitHub runners preinstall third-party apt repos (e.g. packages.microsoft.com)
          # that intermittently serve invalid/unsigned metadata and fail `apt-get update`
          # hard — though none of our packages come from them. Drop them, then retry
          # update with backoff so a transient mirror hiccup doesn't fail the job.
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list 2>/dev/null || true
          i=0; until sudo apt-get update -q; do i=$((i+1)); [ "$i" -ge 5 ] && break; echo "apt-get update retry $i (transient repo failure)"; sleep $((i*4)); done
          sudo apt-get install -y -q gcc make \
            libsqlite3-dev libcurl4-openssl-dev libpam0g-dev libssl-dev \
            libpq-dev
      - name: Build
        run: cd src && make -j$(nproc) all server
      - name: Skill lint
        run: |
          sock=/tmp/aimee-ci-skill-lint.sock
          rm -f "$sock"
          AIMEE_BUNDLED_SKILLS_DIR="$PWD/skills" ./aimee-server --socket="$sock" &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            [ -S "$sock" ] && break
            sleep 0.1
          done
          AIMEE_SOCK="$sock" AIMEE_BUNDLED_SKILLS_DIR="$PWD/skills" ./aimee skill lint --all
      - name: Smoke test
        run: |
          ./aimee version
          ./aimee-server --version
          ./aimee-kb --version
          test -x ./aimee-webchat

  build-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Runner diagnostics
        run: |
          echo "::group::Runner environment"
          echo "ref: $GITHUB_REF  sha: $GITHUB_SHA  runner: $RUNNER_OS $RUNNER_ARCH"
          uname -a
          gcc --version 2>/dev/null || true
          make --version 2>/dev/null | head -1 || true
          df -h / | tail -1
          echo "::endgroup::"
      - name: Install dependencies
        run: |
          # GitHub runners preinstall third-party apt repos (e.g. packages.microsoft.com)
          # that intermittently serve invalid/unsigned metadata and fail `apt-get update`
          # hard — though none of our packages come from them. Drop them, then retry
          # update with backoff so a transient mirror hiccup doesn't fail the job.
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list 2>/dev/null || true
          i=0; until sudo apt-get update -q; do i=$((i+1)); [ "$i" -ge 5 ] && break; echo "apt-get update retry $i (transient repo failure)"; sleep $((i*4)); done
          sudo apt-get install -y -q gcc make \
            libsqlite3-dev libcurl4-openssl-dev libpam0g-dev libssl-dev \
            libpq-dev
      - name: Build integrity
        run: cd src && make build-integrity

  unit-tests:
    runs-on: ubuntu-latest
    # Live Postgres sidecar so unit-test-aimee-db and unit-test-memory-postgres
    # exercise the real libpq path (placeholder rewriter, FTS5→tsvector
    # translation, ON CONFLICT targets, schema apply) instead of skipping
    # when AIMEE_TEST_PG_URL is unset. pg_trgm is required by the
    # memories_code_fts trigram index (see src/schema/postgres.sql).
    env:
      AIMEE_TEST_PG_URL: postgres://aimee:aimee@localhost:5432/aimee_test
    steps:
      - uses: actions/checkout@v4
      - name: Runner diagnostics
        run: |
          echo "::group::Runner environment"
          echo "ref: $GITHUB_REF  sha: $GITHUB_SHA  runner: $RUNNER_OS $RUNNER_ARCH"
          uname -a
          gcc --version 2>/dev/null || true
          make --version 2>/dev/null | head -1 || true
          df -h / | tail -1
          echo "::endgroup::"
      - name: Start Postgres (pgvector) with pull retry
        # Started manually rather than as a `services:` container: the runner pulls
        # service images with no retry, so a transient Docker Hub timeout fails the
        # whole required check (the unit-tests flake). Pull with backoff, then run.
        # pgvector/pgvector (debian, not alpine) ships pgvector >= 0.7 (halfvec —
        # the unified embedding column type) and the contrib modules incl. pg_trgm
        # (the memories_code_fts trigram index); postgres:*-alpine shipped neither.
        run: |
          img=pgvector/pgvector:pg18
          for attempt in 1 2 3 4 5; do
            docker pull "$img" && break
            echo "docker pull $img failed (attempt $attempt/5); backing off"
            sleep $((attempt * 10))
          done
          docker run -d --name aimee-pg \
            -e POSTGRES_USER=aimee -e POSTGRES_PASSWORD=aimee -e POSTGRES_DB=aimee_test \
            -p 5432:5432 \
            --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10 \
            "$img"
      - name: Install dependencies
        run: |
          # GitHub runners preinstall third-party apt repos (e.g. packages.microsoft.com)
          # that intermittently serve invalid/unsigned metadata and fail `apt-get update`
          # hard — though none of our packages come from them. Drop them, then retry
          # update with backoff so a transient mirror hiccup doesn't fail the job.
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list 2>/dev/null || true
          i=0; until sudo apt-get update -q; do i=$((i+1)); [ "$i" -ge 5 ] && break; echo "apt-get update retry $i (transient repo failure)"; sleep $((i*4)); done
          sudo apt-get install -y -q gcc make \
            libsqlite3-dev libcurl4-openssl-dev libpam0g-dev libssl-dev \
            libpq-dev postgresql-client
      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U aimee && exit 0
            sleep 2
          done
          echo "Postgres did not become ready in time"; docker logs aimee-pg || true; exit 1
      - name: Unit tests
        run: cd src && make -j$(nproc) unit-tests

  init-migrate-service-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Runner diagnostics
        run: |
          echo "::group::Runner environment"
          echo "ref: $GITHUB_REF  sha: $GITHUB_SHA  runner: $RUNNER_OS $RUNNER_ARCH"
          uname -a
          gcc --version 2>/dev/null || true
          make --version 2>/dev/null | head -1 || true
          df -h / | tail -1
          echo "::endgroup::"
      - name: Install dependencies
        run: |
          # GitHub runners preinstall third-party apt repos (e.g. packages.microsoft.com)
          # that intermittently serve invalid/unsigned metadata and fail `apt-get update`
          # hard — though none of our packages come from them. Drop them, then retry
          # update with backoff so a transient mirror hiccup doesn't fail the job.
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list 2>/dev/null || true
          i=0; until sudo apt-get update -q; do i=$((i+1)); [ "$i" -ge 5 ] && break; echo "apt-get update retry $i (transient repo failure)"; sleep $((i*4)); done
          sudo apt-get install -y -q gcc make \
            libsqlite3-dev libcurl4-openssl-dev libpam0g-dev libssl-dev \
            libpq-dev
      - name: Init/migrate service routing smoke test
        run: cd src && make -j$(nproc) init-migrate-service-test

  windows-cmake:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MinGW-w64
        shell: pwsh
        run: |
          # Reliable MinGW setup. Two failure modes this avoids:
          #  (1) bare `choco install mingw` flakes ~50% on the Chocolatey CDN;
          #  (2) the choco package's gcc path changes between versions (v15.2.0
          #      moved it), so a hardcoded `...\mingw64\bin` breaks.
          # Prefer the MSYS2 mingw64 toolchain pre-installed on the runner image
          # (no network); otherwise choco-install with retries and *discover* the
          # gcc.exe location instead of hardcoding it.
          function Find-MingwBin {
            if (Test-Path "C:\msys64\mingw64\bin\gcc.exe") { return "C:\msys64\mingw64\bin" }
            $g = Get-ChildItem -Path "C:\ProgramData\chocolatey\lib\mingw","C:\ProgramData\mingw64" `
                   -Recurse -Filter gcc.exe -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -match 'mingw64' } | Select-Object -First 1
            if ($g) { return (Split-Path $g.FullName) }
            return $null
          }
          $bin = Find-MingwBin
          if (-not $bin) {
            for ($i = 0; $i -lt 3 -and -not $bin; $i++) {
              choco install mingw -y --no-progress
              if ($LASTEXITCODE -ne 0) { Start-Sleep 15 }
              $bin = Find-MingwBin
            }
          }
          if (-not $bin) { Write-Error "MinGW gcc.exe not found after install"; exit 1 }
          Write-Host "Using MinGW at $bin"
          & "$bin\gcc.exe" --version
          echo "$bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Download SQLite amalgamation
        shell: powershell
        run: |
          $url = "https://www.sqlite.org/2024/sqlite-amalgamation-3470200.zip"
          Invoke-WebRequest -Uri $url -OutFile sqlite.zip
          Expand-Archive sqlite.zip -DestinationPath sqlite-tmp
          New-Item -ItemType Directory -Force -Path src\vendor\sqlite3
          Copy-Item sqlite-tmp\sqlite-amalgamation-3470200\sqlite3.c src\vendor\sqlite3\
          Copy-Item sqlite-tmp\sqlite-amalgamation-3470200\sqlite3.h src\vendor\sqlite3\

      - name: Configure with CMake
        run: cmake -B build -G "MinGW Makefiles" -DAIMEE_THIN_CLIENT=ON -DWITH_PAM=OFF -DWITH_LIBSECRET=OFF

      # Windows ships only the thin client (aimee.exe). aimee-server, aimee-kb,
      # aimee-gateway, and aimee-webchat are Linux/Docker components and are not
      # built here, so the MinGW runner needs no libpq/zstd/OpenSSL.
      - name: Build the thin client
        run: cmake --build build --parallel 2 --target aimee

      - name: Smoke test the client
        shell: powershell
        run: |
          .\build\aimee.exe version
          # The new remote transport must parse on Windows (Winsock path).
          .\build\aimee.exe --server http://127.0.0.1:9 version

      - name: Thin-client smoke (selfcheck, Winsock transport)
        shell: bash
        run: |
          # Beyond `version`: drive a real subcommand with the HTTP transport env
          # set, so the Windows client exercises its Winsock connect path (a
          # connection error is the expected selfcheck outcome; a usage/parse
          # error is not). Mirrors the macOS/Linux thin-client smoke.
          AIMEE_BIN='./build/aimee.exe' FORCE_MODE=selfcheck \
            bash scripts/aimee-thin-client-smoke.sh

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: choco install mingw
      - name: Add MinGW to PATH
        shell: powershell
        run: echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Download SQLite amalgamation
        shell: powershell
        run: |
          $url = "https://www.sqlite.org/2024/sqlite-amalgamation-3470200.zip"
          Invoke-WebRequest -Uri $url -OutFile sqlite.zip
          Expand-Archive sqlite.zip -DestinationPath sqlite-tmp
          New-Item -ItemType Directory -Force -Path src\vendor\sqlite3
          Copy-Item sqlite-tmp\sqlite-amalgamation-3470200\sqlite3.c src\vendor\sqlite3\
          Copy-Item sqlite-tmp\sqlite-amalgamation-3470200\sqlite3.h src\vendor\sqlite3\
      - name: Configure with CMake
        run: cmake -B build -G "MinGW Makefiles" -DAIMEE_THIN_CLIENT=ON -DWITH_PAM=OFF -DWITH_LIBSECRET=OFF -DWITH_UI=OFF
      # Windows ships only the thin client (aimee.exe); server/kb/gateway/webchat
      # are Linux/Docker components and are not built here.
      - name: Build the thin client
        run: cmake --build build --parallel 2 --target aimee
      - name: Smoke test the client
        shell: powershell
        run: |
          .\build\aimee.exe version
          # The new remote transport must parse on Windows (Winsock path).
          .\build\aimee.exe --server http://127.0.0.1:9 version

      - name: Thin-client smoke (selfcheck, Winsock transport)
        shell: bash
        run: |
          # Beyond `version`: drive a real subcommand with the HTTP transport env
          # set, so the Windows client exercises its Winsock connect path (a
          # connection error is the expected selfcheck outcome; a usage/parse
          # error is not). Mirrors the macOS/Linux thin-client smoke.
          AIMEE_BIN='./build/aimee.exe' FORCE_MODE=selfcheck \
            bash scripts/aimee-thin-client-smoke.sh

  macos-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # macOS ships ONE universal (arm64 + x86_64) thin client, matching the
      # release build. TLS uses Secure Transport (system frameworks, already
      # universal), so the fat build needs no arch-specific brew libraries.
      - name: Configure with CMake (universal arm64+x86_64)
        run: cmake -B build -DAIMEE_THIN_CLIENT=ON -DWITH_PAM=OFF -DWITH_LIBSECRET=OFF -DWITH_UI=OFF -DWITH_TLS=ON -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build the thin client
        run: |
          cmake --build build --parallel 3 --target aimee
          # Fail unless the artifact is a true fat binary.
          echo "archs: $(lipo -archs build/aimee)"
          lipo -archs build/aimee | grep -q arm64
          lipo -archs build/aimee | grep -q x86_64
      - name: Smoke test the client
        run: |
          ./build/aimee version
          # --server must parse and select a remote TCP target on macOS.
          ./build/aimee --server http://127.0.0.1:9 version

      - name: mTLS client-cert presentation (Secure Transport, loopback)
        run: |
          set -uo pipefail
          D="$(mktemp -d)"; H="$D/home"; mkdir -p "$H/tls"
          # Test PKI: CA, server cert, and an EC P-256 client cert whose key is
          # PKCS#8 (matching what aimee-server issues), bundled into client.p12.
          openssl ecparam -name prime256v1 -genkey -noout -out "$D/ca.key"
          openssl req -x509 -new -key "$D/ca.key" -days 1 -subj "/CN=aimee-ci-ca" -out "$D/ca.crt"
          openssl ecparam -name prime256v1 -genkey -noout -out "$D/srv.key"
          openssl req -new -key "$D/srv.key" -subj "/CN=localhost" -out "$D/srv.csr"
          openssl x509 -req -in "$D/srv.csr" -CA "$D/ca.crt" -CAkey "$D/ca.key" \
            -CAcreateserial -days 1 -out "$D/srv.crt"
          openssl ecparam -name prime256v1 -genkey -noout -out "$D/c.sec1"
          openssl pkcs8 -topk8 -nocrypt -in "$D/c.sec1" -out "$H/tls/client.key"
          openssl req -new -key "$H/tls/client.key" -subj "/CN=ci-macos-client" -out "$D/c.csr"
          openssl x509 -req -in "$D/c.csr" -CA "$D/ca.crt" -CAkey "$D/ca.key" \
            -CAcreateserial -days 1 -out "$H/tls/client.crt"
          # macOS SecPKCS12Import REQUIRES a non-empty passphrase (an empty one
          # fails errSecAuthFailed -25293), so the .p12 is passphrase-protected
          # and aimee reads it from AIMEE_TLS_CLIENT_P12_PASS.
          P12PASS='aimee-ci-p12'
          openssl pkcs12 -export -inkey "$H/tls/client.key" -in "$H/tls/client.crt" \
            -out "$H/tls/client.p12" -passout "pass:$P12PASS"
          # s_server REQUIRES a client cert (-Verify) and serves a status page.
          openssl s_server -accept 14443 -cert "$D/srv.crt" -key "$D/srv.key" \
            -CAfile "$D/ca.crt" -Verify 1 -www -naccept 3 > "$D/s_server.log" 2>&1 &
          SRV=$!
          for i in $(seq 1 50); do nc -z 127.0.0.1 14443 && break; sleep 0.2; done
          # Present the client identity (INSECURE skips server-cert trust; the
          # client cert is still presented). A non-/v1 reply is fine — the TLS
          # handshake is what we are validating.
          AIMEE_HOME="$H" AIMEE_TLS_INSECURE=1 AIMEE_TLS_CLIENT_P12_PASS="$P12PASS" \
            ./build/aimee --server https://127.0.0.1:14443 config show 2>&1 || true
          sleep 1; kill "$SRV" 2>/dev/null || true; wait "$SRV" 2>/dev/null || true
          echo "::group::s_server.log"; cat "$D/s_server.log"; echo "::endgroup::"
          # Proof: the server logged + verified our client cert. (OpenSSL prints
          # "CN = x" on 1.1.x and "CN=x" on 3.x, so match both.)
          grep -qE "CN ?= ?ci-macos-client" "$D/s_server.log" || { echo "FAIL: client cert not presented"; exit 1; }
          if grep -q "peer did not return a certificate" "$D/s_server.log"; then
            echo "FAIL: a connection presented no cert"; exit 1; fi
          # The transient keychain must not be left behind.
          if ls "${TMPDIR:-/tmp}"/aimee-mtls-*.keychain >/dev/null 2>&1; then
            echo "FAIL: transient keychain leaked"; exit 1; fi
          echo "PASS: Secure Transport presented client cert; server verified CN=ci-macos-client; no keychain leak"

  memory-retrieval-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Runner diagnostics
        run: |
          echo "::group::Runner environment"
          echo "ref: $GITHUB_REF  sha: $GITHUB_SHA  runner: $RUNNER_OS $RUNNER_ARCH"
          uname -a
          gcc --version 2>/dev/null || true
          make --version 2>/dev/null | head -1 || true
          df -h / | tail -1
          echo "::endgroup::"
      - name: Install dependencies
        run: |
          # GitHub runners preinstall third-party apt repos (e.g. packages.microsoft.com)
          # that intermittently serve invalid/unsigned metadata and fail `apt-get update`
          # hard — though none of our packages come from them. Drop them, then retry
          # update with backoff so a transient mirror hiccup doesn't fail the job.
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list 2>/dev/null || true
          i=0; until sudo apt-get update -q; do i=$((i+1)); [ "$i" -ge 5 ] && break; echo "apt-get update retry $i (transient repo failure)"; sleep $((i*4)); done
          sudo apt-get install -y -q gcc make \
            libsqlite3-dev libcurl4-openssl-dev libpam0g-dev libssl-dev \
            libpq-dev
      - name: Memory retrieval eval (corpus + regression check)
        run: cd src && make -j$(nproc) memory-retrieval-eval-check

  bench-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Runner diagnostics
        run: |
          echo "::group::Runner environment"
          echo "ref: $GITHUB_REF  sha: $GITHUB_SHA  runner: $RUNNER_OS $RUNNER_ARCH"
          uname -a
          gcc --version 2>/dev/null || true
          make --version 2>/dev/null | head -1 || true
          df -h / | tail -1
          echo "::endgroup::"
      - name: Install dependencies
        run: |
          # GitHub runners preinstall third-party apt repos (e.g. packages.microsoft.com)
          # that intermittently serve invalid/unsigned metadata and fail `apt-get update`
          # hard — though none of our packages come from them. Drop them, then retry
          # update with backoff so a transient mirror hiccup doesn't fail the job.
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list 2>/dev/null || true
          i=0; until sudo apt-get update -q; do i=$((i+1)); [ "$i" -ge 5 ] && break; echo "apt-get update retry $i (transient repo failure)"; sleep $((i*4)); done
          sudo apt-get install -y -q gcc make \
            libsqlite3-dev libcurl4-openssl-dev libpam0g-dev libssl-dev \
            libpq-dev
      - name: Build PR benchmark binary
        run: |
          if cd src && make -j$(nproc) tests/bench-perf; then
            cp tests/bench-perf /tmp/bench-pr
          else
            echo "::warning::PR benchmark binary failed to build; benchmarks are informational."
            touch /tmp/bench-skip
          fi
      - name: Build testing baseline binary
        run: |
          if [ -f /tmp/bench-skip ]; then
            echo "Skipping baseline benchmark build because PR benchmark did not build."
            exit 0
          fi
          BASE_REF="${{ github.base_ref }}"
          if [ -z "$BASE_REF" ]; then
            BASE_REF="origin/testing"
          else
            BASE_REF="origin/$BASE_REF"
          fi
          git worktree add /tmp/bench-baseline-wt "$BASE_REF"
          cd /tmp/bench-baseline-wt/src
          if make -j$(nproc) tests/bench-perf; then
            cp tests/bench-perf /tmp/bench-baseline
            echo "binary" > /tmp/bench-baseline-mode
          else
            echo "::warning::Base benchmark binary failed to build; using committed benchmark baseline."
            cp "$GITHUB_WORKSPACE/benchmarks/baseline.json" /tmp/baseline.json
            echo "static" > /tmp/bench-baseline-mode
          fi
          git -C /home/runner/work/aimee/aimee worktree remove /tmp/bench-baseline-wt --force
      - name: Run same-machine regression report
        run: |
          if [ -f /tmp/bench-skip ]; then
            echo "Skipping benchmark report because PR benchmark did not build."
            exit 0
          fi
          if [ "$(cat /tmp/bench-baseline-mode)" = "binary" ]; then
            if /tmp/bench-baseline --save /tmp/baseline.json; then
              echo "Baseline measured from base branch on same machine. Running PR check..."
            else
              echo "::warning::Base benchmark binary failed at runtime; using committed benchmark baseline."
              cp benchmarks/baseline.json /tmp/baseline.json
            fi
          else
            echo "Using committed benchmark baseline because the base branch benchmark does not build."
          fi
          /tmp/bench-pr --check /tmp/baseline.json || \
            echo "::warning::Benchmark regression detected; benchmarks are informational and do not gate PRs."

  # End-to-end deploy matrix: build the three images and prove every Docker
  # topology (kb-only, server+kb split, server standalone, combined server+kb)
  # boots and serves a usable /v1 surface. See
  # docs/proposals/pending/aimee-e2e-deploy-matrix.md. GitHub's ubuntu runners
  # ship Docker + compose, so no port offset is needed (8740/8741 are free).
  e2e-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Runner diagnostics
        run: |
          docker version --format '{{.Server.Version}}'
          docker compose version
          df -h / | tail -1
      - name: Run Docker deploy matrix (T1-T4)
        # The server/combined images build webchat's SPA from its vendored
        # @rakuensoftware/smoothgui dependency — no npm token needed.
        run: scripts/e2e-matrix.sh --only T1,T2,T3,T4
      - name: Stack logs on failure
        if: failure()
        run: |
          for f in compose.yaml compose.server.yaml compose.server-standalone.yaml compose.combined.yaml; do
            echo "::group::$f"; docker compose -f "$f" logs --tail=80 2>/dev/null || true; echo "::endgroup::"
          done

  # §2 tree-sitter extraction front-end (opt-in). The default build compiles
  # code_treesitter.c to a stub, so the other jobs never exercise the grammar
  # path or unit-test-code-treesitter. This job builds AIMEE_TREESITTER=1 — which
  # fetches the vendored grammars (scripts/fetch-treesitter.sh) and compiles them
  # — and runs the opt-in test that parses real source in every supported language
  # (definitions, nested members, and call edges).
  treesitter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Runner diagnostics
        run: |
          gcc --version 2>/dev/null | head -1 || true
          git --version || true
          df -h / | tail -1
      - name: Install dependencies
        run: |
          # GitHub runners preinstall third-party apt repos (e.g. packages.microsoft.com)
          # that intermittently serve invalid/unsigned metadata and fail `apt-get update`
          # hard — though none of our packages come from them. Drop them, then retry
          # update with backoff so a transient mirror hiccup doesn't fail the job.
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list 2>/dev/null || true
          i=0; until sudo apt-get update -q; do i=$((i+1)); [ "$i" -ge 5 ] && break; echo "apt-get update retry $i (transient repo failure)"; sleep $((i*4)); done
          sudo apt-get install -y -q gcc make git \
            libsqlite3-dev libcurl4-openssl-dev libpam0g-dev libssl-dev libpq-dev
      - name: Build + run the opt-in tree-sitter test
        run: |
          cd src
          make AIMEE_TREESITTER=1 build/obj/tests/unit-test-code-treesitter
          ./build/obj/tests/unit-test-code-treesitter
