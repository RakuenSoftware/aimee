# Release pipeline for the aimee thin client (the `aimee` CLI).
#
# Produces a size-lean `aimee` binary for Linux, macOS, and Windows and attaches
# them to a GitHub release. Only the thin client is shipped; aimee-server /
# aimee-kb / aimee-gateway are Linux/Docker components released separately. The
# client reaches a server over the local Unix socket (POSIX) or a remote TCP
# endpoint (AIMEE_SERVER_URL / --server); see the thin-client cross-platform
# proposal.
#
# This workflow is deliberately reusable-only. auto-release.yml calls it with
# publish=true after release approval; main-merge-approval.yml calls the same
# build and payload assembly with publish=false before main approval. Do not add
# tag-push or workflow-dispatch triggers here: either would create a release path
# that bypasses the human approval.
name: release-thin-client

on:
  workflow_call:
    inputs:
      version:
        description: 'Version without leading v (e.g. 0.2.1)'
        required: true
        type: string
      publish:
        description: 'Publish/sign the GitHub Release; false builds and assembles the exact payload only'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: authoritative make build. x86_64 + arm64 native runners.
          - os: ubuntu-latest
            kind: linux
            asset: aimee-linux-x86_64
          - os: ubuntu-24.04-arm
            kind: linux
            asset: aimee-linux-arm64
          # macOS: one universal (arm64 + x86_64) binary, built on macos-latest.
          # Avoids the scarce/deprecating Intel runner. Secure Transport is
          # universal, and artifact verification uses the pinned universal
          # libcrypto built below.
          - os: macos-latest
            kind: macos
            asset: aimee-macos-universal
          # Windows: CMake thin client via MinGW (x86_64).
          - os: windows-latest
            kind: windows
            asset: aimee-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          fetch-tags: true

      # Resolve the version string to embed (without leading v). A real release
      # also requires the gated tag. Promotion validation deliberately has no
      # tag yet, but compiles the exact same versioned artifact matrix.
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          v="${{ inputs.version }}"
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::approved release version must be MAJOR.MINOR.PATCH; got '${v:-<empty>}'"
            exit 1
          fi
          if [ "${{ inputs.publish }}" = "true" ]; then
            git rev-parse -q --verify "refs/tags/v$v" >/dev/null || {
              echo "::error::approved release tag v$v does not exist"
              exit 1
            }
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # --- Linux: authoritative make build of the lean thin client ---
      - name: Linux deps
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get update -q
          i=0; until timeout 240 sudo apt-get install -y -q gcc make libsqlite3-dev; do i=$((i+1)); [ "$i" -ge 3 ] && break; echo "apt-get install retry $i (mirror hung or failed)"; sleep $((i*5)); done
      - name: Build (Linux, make)
        if: matrix.kind == 'linux'
        run: |
          cd src
          if [ -n "${{ steps.ver.outputs.version }}" ]; then
            make -j"$(nproc)" GIT_VERSION="v${{ steps.ver.outputs.version }}" ../aimee
          else
            make -j"$(nproc)" ../aimee
          fi
      - name: Stage artifact (Linux)
        if: matrix.kind == 'linux'
        run: cp aimee "${{ matrix.asset }}"

      # --- macOS: CMake thin-client target, lean profile ---
      # artifact_trust uses libcrypto. Homebrew on the arm64 runner provides
      # only an arm64 bottle, so build the same pinned universal archive that
      # the green macos-build CI job uses.
      - name: Build universal OpenSSL crypto (macOS)
        if: matrix.kind == 'macos'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/openssl-3.6.3.tar.gz"
          curl --fail --location --retry 3 \
            --output "$archive" \
            https://github.com/openssl/openssl/releases/download/openssl-3.6.3/openssl-3.6.3.tar.gz
          echo "243a86649cf6f23eeb6a2ff2456e09e5d77dd9018a54d3d96b0c6bdd6ba6c7f1  $archive" \
            | shasum -a 256 --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          source_dir="$RUNNER_TEMP/openssl-3.6.3"
          for arch in arm64 x86_64; do
            build_dir="$RUNNER_TEMP/openssl-$arch"
            prefix="$RUNNER_TEMP/openssl-$arch-install"
            cp -R "$source_dir" "$build_dir"
            cd "$build_dir"
            if [ "$arch" = arm64 ]; then
              target=darwin64-arm64-cc
            else
              target=darwin64-x86_64-cc
            fi
            ./Configure "$target" no-shared no-tests --prefix="$prefix"
            make --jobs 3 build_libs
            make install_dev
          done
          universal="$RUNNER_TEMP/openssl-universal"
          mkdir -p "$universal/lib"
          cp -R "$RUNNER_TEMP/openssl-arm64-install/include" "$universal/include"
          lipo -create \
            "$RUNNER_TEMP/openssl-arm64-install/lib/libcrypto.a" \
            "$RUNNER_TEMP/openssl-x86_64-install/lib/libcrypto.a" \
            -output "$universal/lib/libcrypto.a"
          echo "OPENSSL_ROOT_DIR=$universal" >> "$GITHUB_ENV"

      - name: Build (macOS, CMake -- universal arm64+x86_64)
        if: matrix.kind == 'macos'
        run: |
          cmake -B build -DAIMEE_THIN_CLIENT=ON -DAIMEE_LEAN=ON -DWITH_PAM=OFF -DWITH_LIBSECRET=OFF -DWITH_UI=OFF -DWITH_TLS=ON -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR" -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DAIMEE_VERSION_STR="${{ steps.ver.outputs.version != '' && format('v{0}', steps.ver.outputs.version) || '' }}"
          cmake --build build --parallel 3 --target aimee
          # Fail the build unless the artifact is a true fat binary.
          echo "archs: $(lipo -archs build/aimee)"
          lipo -archs build/aimee | grep -q arm64
          lipo -archs build/aimee | grep -q x86_64
      - name: Stage artifact (macOS)
        if: matrix.kind == 'macos'
        run: cp build/aimee "${{ matrix.asset }}"

      # --- Windows: CMake thin-client target via MinGW, lean profile ---
      - name: Set up MinGW-w64 (Windows)
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          # Match the green Windows CI setup: require a complete compiler/make
          # pair, prefer the runner's MSYS2 toolchain, and install the matching
          # OpenSSL package before falling back to Chocolatey.
          function Find-MingwBin {
            foreach ($candidate in @("C:\msys64\ucrt64\bin", "C:\msys64\mingw64\bin")) {
              if ((Test-Path "$candidate\gcc.exe") -and
                  (Test-Path "$candidate\mingw32-make.exe")) { return $candidate }
            }
            $g = Get-ChildItem -Path "C:\ProgramData\chocolatey\lib\mingw","C:\ProgramData\mingw64" `
                   -Recurse -Filter gcc.exe -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -match 'mingw64' } | Select-Object -First 1
            if ($g) {
              $candidate = Split-Path $g.FullName
              if (Test-Path "$candidate\mingw32-make.exe") { return $candidate }
            }
            return $null
          }
          $bin = Find-MingwBin
          $pacman = "C:\msys64\usr\bin\pacman.exe"
          if (-not $bin -and (Test-Path $pacman)) {
            for ($i = 0; $i -lt 3 -and -not $bin; $i++) {
              & $pacman -Sy --noconfirm --needed `
                mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-make `
                mingw-w64-ucrt-x86_64-openssl
              if ($LASTEXITCODE -ne 0) { Start-Sleep (15 * ($i + 1)) }
              $bin = Find-MingwBin
            }
          }
          if (-not $bin) {
            for ($i = 0; $i -lt 3 -and -not $bin; $i++) {
              choco install mingw -y --no-progress
              if ($LASTEXITCODE -ne 0) { Start-Sleep (15 * ($i + 1)) }
              $bin = Find-MingwBin
            }
          }
          if (-not $bin) { Write-Error "MinGW gcc.exe and mingw32-make.exe not found"; exit 1 }
          $prefix = Split-Path $bin
          if (-not (Test-Path "$prefix\include\openssl\evp.h") -and (Test-Path $pacman)) {
            $opensslPackage = if ($bin -like "*\ucrt64\*") {
              "mingw-w64-ucrt-x86_64-openssl"
            } else {
              "mingw-w64-x86_64-openssl"
            }
            & $pacman -Sy --noconfirm --needed $opensslPackage
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Test-Path "$prefix\include\openssl\evp.h")) {
            Write-Error "MinGW OpenSSL headers not found after install"; exit 1
          }
          Write-Host "Using MinGW at $bin"
          & "$bin\gcc.exe" --version
          echo "$bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "OPENSSL_ROOT_DIR=$($prefix -replace '\\','/')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Download SQLite amalgamation (Windows)
        if: matrix.kind == 'windows'
        shell: powershell
        run: |
          $url = "https://www.sqlite.org/2024/sqlite-amalgamation-3470200.zip"
          $want = "aa73d8748095808471deaa8e6f34aa700e37f2f787f4425744f53fdd15a89c40"
          Invoke-WebRequest -Uri $url -OutFile sqlite.zip
          $got = (Get-FileHash -Algorithm SHA256 sqlite.zip).Hash.ToLowerInvariant()
          if ($got -ne $want) { throw "SQLite archive digest mismatch: $got" }
          Expand-Archive sqlite.zip -DestinationPath sqlite-tmp
          New-Item -ItemType Directory -Force -Path src\vendor\sqlite3
          Copy-Item sqlite-tmp\sqlite-amalgamation-3470200\sqlite3.c src\vendor\sqlite3\
          Copy-Item sqlite-tmp\sqlite-amalgamation-3470200\sqlite3.h src\vendor\sqlite3\
      - name: Build (Windows, CMake)
        if: matrix.kind == 'windows'
        run: |
          cmake -B build -G "MinGW Makefiles" -DAIMEE_THIN_CLIENT=ON -DAIMEE_LEAN=ON -DWITH_PAM=OFF -DWITH_LIBSECRET=OFF -DWITH_UI=OFF -DWITH_TLS=ON -DAIMEE_VERSION_STR="${{ steps.ver.outputs.version != '' && format('v{0}', steps.ver.outputs.version) || '' }}"
          cmake --build build --parallel 2 --target aimee
      - name: Stage artifact (Windows)
        if: matrix.kind == 'windows'
        shell: powershell
        run: Copy-Item build\aimee.exe "${{ matrix.asset }}"

      - name: Smoke test artifact (POSIX)
        if: matrix.kind != 'windows'
        run: ./${{ matrix.asset }} version
      - name: Smoke test artifact (Windows)
        if: matrix.kind == 'windows'
        shell: powershell
        run: .\${{ matrix.asset }} version

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Scope to the thin-client binaries only. When invoked via auto-release
      # (workflow_call), the publish-images workflow shares this run and uploads
      # digest-* artifacts too; an unscoped download would pull those into dist/
      # (and onto the Release) and widen the flaky-download surface.
      - name: Download thin-client artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: aimee-*
          path: dist
          merge-multiple: true

      # This is part of both validation and publication. It proves the reusable
      # matrix produced the complete payload that the release action will see,
      # including the Windows filename and both Linux architectures.
      - name: Validate payload and create checksums
        working-directory: dist
        run: |
          for asset in \
            aimee-linux-x86_64 \
            aimee-linux-arm64 \
            aimee-macos-universal \
            aimee-windows-x86_64.exe; do
            test -f "$asset" || { echo "::error::release payload is missing $asset"; exit 1; }
          done
          test "$(find . -maxdepth 1 -type f -name 'aimee-*' | wc -l)" -eq 4 || {
            echo "::error::release payload contains an unexpected thin-client asset set"
            find . -maxdepth 1 -type f -print
            exit 1
          }
          sha256sum aimee-* > SHA256SUMS

      - name: Install Cosign
        if: inputs.publish
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
      - name: Create keyless signature bundles
        if: inputs.publish
        working-directory: dist
        run: |
          for asset in aimee-* SHA256SUMS; do
            cosign sign-blob --yes --bundle "${asset}.sigstore.json" "$asset"
          done
      - name: Publish release
        if: inputs.publish
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          # Empty tag_name -> action falls back to the pushed tag (github.ref).
          tag_name: ${{ inputs.version != '' && format('v{0}', inputs.version) || '' }}
          files: dist/*
          generate_release_notes: true
