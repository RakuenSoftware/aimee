# Release pipeline for the aimee thin client (the `aimee` CLI).
#
# Produces a size-lean `aimee` binary for Linux, macOS, and Windows and attaches
# them to a GitHub release. Only the thin client is shipped; aimee-server /
# aimee-kb / aimee-gateway are Linux/Docker components released separately. The
# client reaches a server over the local Unix socket (POSIX) or a remote TCP
# endpoint (AIMEE_SERVER_URL / --server); see the thin-client cross-platform
# proposal.
#
# Triggers:
#   - push of a `v*` tag      -> version derived from the tag (manual release)
#   - workflow_call           -> version passed in by the auto-release orchestrator
#   - workflow_dispatch       -> optional manual version input
# When a version is supplied (call/dispatch) the matching `v<version>` tag must
# already exist on the remote so the GitHub Release can attach to it.
name: release-thin-client

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without leading v (e.g. 0.2.1); blank = no release'
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: 'Version without leading v (e.g. 0.2.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: authoritative make build. x86_64 + arm64 native runners.
          - os: ubuntu-latest
            kind: linux
            asset: aimee-linux-x86_64
          - os: ubuntu-24.04-arm
            kind: linux
            asset: aimee-linux-arm64
          # macOS: one universal (arm64 + x86_64) binary, built on macos-latest.
          # Avoids the scarce/deprecating Intel runner; TLS uses Secure Transport
          # (system frameworks, already universal), so a fat build still needs no
          # arch-specific brew libraries.
          - os: macos-latest
            kind: macos
            asset: aimee-macos-universal
          # Windows: CMake thin client via MinGW (x86_64).
          - os: windows-latest
            kind: windows
            asset: aimee-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # Resolve the version string to embed (without leading v). From the
      # workflow input when called/dispatched, otherwise from the pushed tag.
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            v="${{ inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v=""
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # --- Linux: authoritative make build of the lean thin client ---
      - name: Linux deps
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc make libsqlite3-dev
      - name: Build (Linux, make)
        if: matrix.kind == 'linux'
        run: |
          cd src
          if [ -n "${{ steps.ver.outputs.version }}" ]; then
            make -j"$(nproc)" GIT_VERSION="v${{ steps.ver.outputs.version }}" ../aimee
          else
            make -j"$(nproc)" ../aimee
          fi
      - name: Stage artifact (Linux)
        if: matrix.kind == 'linux'
        run: cp aimee "${{ matrix.asset }}"

      # --- macOS: CMake thin-client target, lean profile ---
      - name: Build (macOS, CMake -- universal arm64+x86_64)
        if: matrix.kind == 'macos'
        run: |
          cmake -B build -DAIMEE_THIN_CLIENT=ON -DAIMEE_LEAN=ON -DWITH_PAM=OFF -DWITH_LIBSECRET=OFF -DWITH_UI=OFF -DWITH_TLS=ON -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DAIMEE_VERSION_STR="${{ steps.ver.outputs.version != '' && format('v{0}', steps.ver.outputs.version) || '' }}"
          cmake --build build --parallel 3 --target aimee
          # Fail the build unless the artifact is a true fat binary.
          echo "archs: $(lipo -archs build/aimee)"
          lipo -archs build/aimee | grep -q arm64
          lipo -archs build/aimee | grep -q x86_64
      - name: Stage artifact (macOS)
        if: matrix.kind == 'macos'
        run: cp build/aimee "${{ matrix.asset }}"

      # --- Windows: CMake thin-client target via MinGW, lean profile ---
      - name: Set up MinGW-w64 (Windows)
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          # Reliable MinGW setup — avoids the Chocolatey CDN flake AND the choco
          # package's changing gcc path (v15.2.0 moved it). Prefer the MSYS2
          # mingw64 toolchain pre-installed on the runner; else choco-install with
          # retries and discover gcc.exe rather than hardcoding its directory.
          function Find-MingwBin {
            if (Test-Path "C:\msys64\mingw64\bin\gcc.exe") { return "C:\msys64\mingw64\bin" }
            $g = Get-ChildItem -Path "C:\ProgramData\chocolatey\lib\mingw","C:\ProgramData\mingw64" `
                   -Recurse -Filter gcc.exe -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -match 'mingw64' } | Select-Object -First 1
            if ($g) { return (Split-Path $g.FullName) }
            return $null
          }
          $bin = Find-MingwBin
          if (-not $bin) {
            for ($i = 0; $i -lt 3 -and -not $bin; $i++) {
              choco install mingw -y --no-progress
              if ($LASTEXITCODE -ne 0) { Start-Sleep 15 }
              $bin = Find-MingwBin
            }
          }
          if (-not $bin) { Write-Error "MinGW gcc.exe not found after install"; exit 1 }
          Write-Host "Using MinGW at $bin"
          & "$bin\gcc.exe" --version
          echo "$bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Download SQLite amalgamation (Windows)
        if: matrix.kind == 'windows'
        shell: powershell
        run: |
          $url = "https://www.sqlite.org/2024/sqlite-amalgamation-3470200.zip"
          Invoke-WebRequest -Uri $url -OutFile sqlite.zip
          Expand-Archive sqlite.zip -DestinationPath sqlite-tmp
          New-Item -ItemType Directory -Force -Path src\vendor\sqlite3
          Copy-Item sqlite-tmp\sqlite-amalgamation-3470200\sqlite3.c src\vendor\sqlite3\
          Copy-Item sqlite-tmp\sqlite-amalgamation-3470200\sqlite3.h src\vendor\sqlite3\
      - name: Build (Windows, CMake)
        if: matrix.kind == 'windows'
        run: |
          cmake -B build -G "MinGW Makefiles" -DAIMEE_THIN_CLIENT=ON -DAIMEE_LEAN=ON -DWITH_PAM=OFF -DWITH_LIBSECRET=OFF -DWITH_UI=OFF -DWITH_TLS=ON -DAIMEE_VERSION_STR="${{ steps.ver.outputs.version != '' && format('v{0}', steps.ver.outputs.version) || '' }}"
          cmake --build build --parallel 2 --target aimee
      - name: Stage artifact (Windows)
        if: matrix.kind == 'windows'
        shell: powershell
        run: Copy-Item build\aimee.exe "${{ matrix.asset }}"

      - name: Smoke test artifact (POSIX)
        if: matrix.kind != 'windows'
        run: ./${{ matrix.asset }} version
      - name: Smoke test artifact (Windows)
        if: matrix.kind == 'windows'
        shell: powershell
        run: .\${{ matrix.asset }} version

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    # Publish a GitHub Release when triggered by a tag push, or when a version
    # was supplied via call/dispatch (the orchestrator created the tag first).
    if: ${{ inputs.version != '' || startsWith(github.ref, 'refs/tags/') }}
    steps:
      # Scope to the thin-client binaries only. When invoked via auto-release
      # (workflow_call), the publish-images workflow shares this run and uploads
      # digest-* artifacts too; an unscoped download would pull those into dist/
      # (and onto the Release) and widen the flaky-download surface.
      - name: Download thin-client artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: aimee-*
          path: dist
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          # Empty tag_name -> action falls back to the pushed tag (github.ref).
          tag_name: ${{ inputs.version != '' && format('v{0}', inputs.version) || '' }}
          files: dist/*
          generate_release_notes: true
